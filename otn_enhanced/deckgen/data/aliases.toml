# Cards deliberately excluded from the deck-building pool.  Turbo Duel (Speed
# World) support cards cannot be played in a normal duel, and Tokens are not
# deck cards at all.  Every "Speed Spell - X" is excluded automatically by
# prefix, but these carry no such marker.
[exclude]
"Slip Stream" = "turbo duel only"
"Acceleration Zone" = "turbo duel only"
"Des Accelerator" = "turbo duel only"
"Full Throttle" = "turbo duel only"
"Slowdown Trap" = "turbo duel only"
"Speed World" = "turbo duel only"
"Speed World 2" = "turbo duel only"
"Speed Booster" = "turbo duel only"
"Speed Edge" = "turbo duel only"
"Grain Corn Token" = "token, not a deck card"

# Unresolved: present in the ROM, no confident ygoprodeck match found.  These
# stay in the pool with no effect text (economy falls back to the vanilla
# stat/power model) and are listed in the build report so they can be resolved
# later.  Do not guess — a wrong alias silently mis-scores a card.
[unresolved]
"Null and Void" = "normal trap, no confident match"
"Pigeonholing Books of Spell" = "quick-play spell, no confident match"
"Crystal Counter" = "normal trap, Crystal Beast support, no confident match"
"Means of Infestation" = "normal trap, Steelswarm support, no confident match"
