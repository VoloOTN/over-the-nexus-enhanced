# ROM card name -> ygoprodeck card name, for cards the automatic resolver cannot
# reach.  The resolver already handles, in order: exact normalized name, the
# konami_id TSV's alternate spelling, this table, then an exact ROM-stat match
# (ATK/DEF/level/attribute/race) which resolves every *monster*.  So this file
# only ever needs Spell/Trap entries — they carry no stats to match on.
#
# Over the Nexus shipped pre-TCG-release translations of OCG cards, which is why
# so many names drifted.  Each entry below was resolved by matching card class +
# spell/trap subtype and confirming the effect text describes the same card.

[alias]
"Eternal Draught" = "Eternal Drought"
"Hidden Book of Spell" = "Hidden Spellbook"
"Judgment of Pharaoh" = "Judgment of the Pharaoh"
"Coat of Justice" = "Court of Justice"
"Roar of the Earthbound" = "Roar of the Earthbound Immortal"
"Earthbound Revival" = "Earthbound Immortal Revival"
"Forbidden Graveyard" = "Silent Graveyard"
"Dark Trap Hole" = "Deep Dark Trap Hole"
"Gishki Ceremonial Mirror" = "Gishki Aquamirror"
"Ceremonial Mirror Meditation" = "Aquamirror Meditation"
"Metaphysical Regeneration" = "Supernatural Regeneration"

# ---------------------------------------------------------------------------
# Resolved ONCE by exact ROM-stat match (ATK/DEF/level/attribute/race) against
# ygoprodeck, then recorded here.  Doing that lookup at build time made name
# resolution depend on the very properties a randomiser rewrites: shuffle the
# stats and these 35 cards silently lose their effect text.  Baked in, the
# resolver never needs stats and the pool is identical on a randomised ROM.
# Regenerate with tools/deckgen: see the note in namematch.Resolver._by_stats.
"Armityle the Chaos Phantom" = "Armityle the Chaos Phantasm"
"Big Core" = "B.E.S. Big Core"
