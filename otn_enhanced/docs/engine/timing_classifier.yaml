- id: "timing.class1_and_class2_differ_only_at_the_gy_offer"
  subsystem: "timing_classifier"
  confidence: "VERIFIED"
  claim: "*** ANSWERS timing.class_semantics' OPEN QUESTION FOR CLASS 1 vs CLASS 2, STRUCTURALLY AND OFFLINE: THEY ARE BEHAVIOURALLY IDENTICAL EVERYWHERE EXCEPT THE GY-ACTION OFFER. 0x0224AF7C has exactly FIVE BL call sites in ov3, and the instruction immediately after each one is the whole of how its class is consumed: 0x021D3A0A `cmp r0,#0 ; beq`, 0x021D3FF6 `cmp r0,#0 ; bne`, 0x021D40A0 `cmp r0,#0 ; bne` and 0x021F053E `cmp r0,#0 ; beq` are all BOOLEAN -- they ask only 'is this a classified trigger at all' -- while 0x021EDC76 `cmp r0,#2 ; beq` is the ONLY site in the game that can tell 1 from 2. That site is inside the GY-action offer arm of 0x021EDA14, reached only for a descriptor with desc[+5] == 2 (dispatch.gy_offer_consults_slot3_and_the_timing_class_can_bypass_it), where class 2 short-circuits to `movs r0,#1` = offer unconditionally. *** THE CONSEQUENCE, WHICH IS A TRAP THIS PROJECT HAS ALREADY PAID FOR TWICE: SWAPPING A NON-GY TRIGGER'S +0x10 BETWEEN THE WHEN TAG 0x021E51E5 AND ANY CLASS-1 TAG (0x021E50DD et al) IS A PROVABLE NO-OP. There is no code that can observe the difference. So 'convert this WHEN effect into an IF effect by changing the tag' CANNOT WORK for anything but a GY ignition, and the miss-timing rule is applied somewhere else entirely -- still unlocated. vylon_element (2026-06-10) is built entirely on the opposite belief: its docstring tabulates '+10 == 0 -> never misses timing', which timing.class_semantics had already measured false on 2026-08-17, and its own notes record that the IF tag 'was NOT enough' without drawing the conclusion. Setting +0x10 = 0 is NOT a no-op -- it flips all four booleans -- but it flips them toward LESS classification, not toward never-missing, which is why that build activates and then resolves nothing."
  address: 0x0224AF7C
  oracle: "ov3"
  sources: [notes/vylon-element-findings.md, scratch/vylon_classifier_consumers.py]
  proof: |
    import struct
    img, base = env.image('ov3'), env.base('ov3')
    sites = []
    for off in range(0, len(img) - 4, 2):
        hw1, hw2 = struct.unpack_from('<HH', img, off)
        if (hw1 & 0xF800) != 0xF000 or (hw2 & 0xF800) not in (0xF800, 0xE800):
            continue
        o = ((hw1 & 0x7FF) << 12) | ((hw2 & 0x7FF) << 1)
        if o & (1 << 22):
            o -= (1 << 23)
        if (base + off + 4 + o) & 0xFFFFFFFF == 0x0224AF7C:
            sites.append(base + off)
    assert sites == [0x021D3A0A, 0x021D3FF6, 0x021D40A0, 0x021EDC72, 0x021F053E], \
        f'the classifier call-site set changed: {[hex(s) for s in sites]}'
    assert h.u16(0x021EDC76, 'ov3') == 0x2802, 'the GY-offer site no longer cmp r0,#2'
    for s in (0x021D3A0A, 0x021D3FF6, 0x021D40A0, 0x021F053E):
        assert h.u16(s + 4, 'ov3') == 0x2800, f'{s:#x} no longer cmp r0,#0'

