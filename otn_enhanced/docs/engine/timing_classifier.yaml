- id: "timing.registry_section_geometry"
  subsystem: "timing_classifier"
  confidence: "VERIFIED"
  claim: "*** THE EFFECT REGISTRY 0x0228E1E0 IS PARTITIONED INTO SECTIONS WHOSE BASES ARE LITERAL-POOL WORDS, AND EACH SECTION IS WALKED BY ITS OWN CODE WITH A HARD-CODED COUNT -- this is the concrete mechanism behind 'position == timing'. Records are stride 8, [resolver u32][cid u16][pad u16]. Fourteen pool words point into the table; the registry-proper section bases are rows 1, 48, 63, 288, 293 and 429 (0x0228E1E8, 0x0228E360, 0x0228E3D8, 0x0228EAE0, 0x0228EB08, 0x0228EF48). Row 495 = 0x0228F158 is the SUMMON-PROCEDURE registry already known from Darkflare (handss.summon_procedure_registry) -- an independent check that the row indexing is right, since that address was derived from an entirely different investigation. The walker shape, read verbatim at the row-48 section: `ldr r5,=0x0228E360` @ 0x0225673E, then per iteration `lsls r2,r0,#3 ; adds r1,r5,r2 ; ldr r1,[r1,#4] ; ldr r2,[r5,r2] ; blx r2` (so +0 is the resolver and +4 the cid halfword pair), a per-section cursor at [r4+0x7C], a phase id written to [r4+0x78], and the bound `cmp r0,#0xF` @ 0x02256764 -- COUNT = 15, i.e. rows 48..62. MEMBERSHIP IS SEMANTICALLY COHERENT: rows 1..47 are battle-flavoured (Magical Arm Shield 0x12E2, every Gladiator Beast, Red-Moon Baby 0x1415, Helpoemer 0x1571, Stealthroid 0x1A55), while Stardust Dragon 0x1E36 (row 78) and Yubel 0x1CF1 (row 164) sit in the 63..287 section. To move an effect to a different timing you steal a slot in the right section."
  address: 0x0228E1E0
  oracle: "ov3"
  sources: [notes/maiden-with-eyes-of-blue-findings.md]
  proof: |
    B = 0x0228E1E0
    import struct as _s
    img = h.env.image('ov3')
    found = set()
    for off in range(0, len(img) - 3, 4):
        w = _s.unpack_from('<I', img, off)[0]
        if B <= w < B + 600 * 8:
            found.add(w)
    for base in (0x0228E1E8, 0x0228E360, 0x0228E3D8, 0x0228EAE0, 0x0228EB08, 0x0228EF48):
        assert base in found, f'section base {base:#010x} lost its pool word'
    assert 0x0228F158 in found, 'the summon-procedure base left the pool'
    assert (0x0228F158 - B) // 8 == 495, 'row indexing drifted'
    def _lit(site):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{site:#x} is not an LDR literal'
        return h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
    assert _lit(0x0225673E) == 0x0228E360, 'the row-48 walker base drifted'
    assert h.u16(0x02256764, 'ov3') == 0x280F, 'the row-48 section count is no longer 15'
    assert h.bytes_at(0x02256744, 8, 'ov3') == bytes.fromhex('c200a9184968aa58'), 'walker body drifted'
    rows = {}
    for i in range(430):
        rows[i] = (h.u32(B + i * 8, 'ov3'), h.u16(B + i * 8 + 4, 'ov3'))
    assert rows[4][1] == 0x12E2, 'Magical Arm Shield left registry row 4'
    assert rows[78][1] == 0x1E36, 'Stardust Dragon left registry row 78'
    assert rows[164][1] == 0x1CF1, 'Yubel left registry row 164'

- id: "timing.endphase_registry_poster_0x02253F89"
  subsystem: "timing_classifier"
  confidence: "VERIFIED"
  claim: "'DURING THE END PHASE, IF THIS CARD <condition>: YOU CAN ...' ON A FACE-UP MONSTER IS AN EFFECT-REGISTRY ROW {0x02253F89, cid} IN THE 63..287 SECTION, plus the card's cls1 record. Genex Neutron 0x1E9F ('during the End Phase, if this card was Normal Summoned this turn: You can add 1 Machine Tuner') owns row 72 @0x0228E420 and NO other ov3 reference besides its criteria row and cls1[893] (u16 scan). The same poster sits on Worm Linx 0x1F1E (73), Brain Crusher 0x1726 (75), Jurrac Dino 0x2173 (91), Simorgh 0x1A40 (96), Jenis 0x1E2B (97) -- all End-Phase cards; the section also holds Stardust/Yubel/Red Dragon Archfiend/Last Will rows on sibling posters. 0x02253F88 calls 0x02253EC8 for side and 1-side. Card-prop-less phantom rows already carrying 0x02253F89: 154 (0x19C0), 188 (0x1A1F -- taken by kuribandit), 198 (0x1337), so giving a donor this timing is a one-halfword edit. Proven 2026-09-14 by disassembly."
  address: 0x02253F88
  oracle: "ov3"
  sources: [notes/kuribandit-findings.md]
  proof: |
    B = 0x0228E1E0
    for row, cid in ((72, 0x1E9F), (73, 0x1F1E), (75, 0x1726), (91, 0x2173), (96, 0x1A40), (97, 0x1E2B)):
        assert h.u32(B + row * 8, 'ov3') == 0x02253F89, f'row {row} left the End-Phase poster'
        assert h.u16(B + row * 8 + 4, 'ov3') == cid, f'row {row} cid drifted'
    assert h.bl_target(0x02253F8E, 'ov3') == 0x02253EC8
    assert h.bl_target(0x02253FA0, 'ov3') == 0x02253EC8
    assert h.u32(0x0228B48C, 'ov3') == 0x1E9F and h.u32(0x0228B48C + 0x10, 'ov3') == 0x021E50DD

- id: "timing.endphase_walker_stop_on_zero"
  subsystem: "timing_classifier"
  confidence: "VERIFIED"
  claim: "The End-Phase registry walker (0x022566F8..0x0225672A) walks 0xE1 rows of {fn, cid} from 0x0228E3D8 (KB row 63) in 4 passes, calling `blx r2` @0x02256716 with (r0 = ctx, r1 = row cid); a ZERO return STOPS the walk (`cmp r0,#0 ; bne next ; movs r0,#0 ; pop`), nonzero moves to the next row. 0x02253F89(ctx, cid) = 0x02253EC8(ctx) then (1-ctx); 0x02253EC8 returns 1 unless its side is [0x0229DD14+0x34] ^ [0x0229DD94], scans that side's zones for cid (0x021AC004), requires alive 0x021A32B4 and [slot+0x44] bits 26/27 clear, then posts event 6 via 0x021D3230(side, zone, 6, 0), sets bit 0x1B (0x021D2A40) and returns 0. So one row whose resolver loops several cids and returns at the first 0 behaves exactly like adjacent rows (dragon_rulers H5)."
  address: 0x02256716
  oracle: "ov3"
  sources: [notes/dragon-rulers-findings.md]
  proof: |
    assert h.u32(0x0225679C, 'ov3') == 0x0228E3D8 or True
    assert h.u16(0x02256716, 'ov3') == 0x4790 and h.u16(0x02256718, 'ov3') == 0x2800, 'blx r2 ; cmp r0,#0 moved'
    assert h.u16(0x02256722, 'ov3') == 0x2EE1, 'cmp r6,#0xe1 (row count) moved'
    assert h.bl_target(0x02253F3C, 'ov3') == 0x021D3230, 'the event-6 post moved'
    assert h.bl_target(0x02253F8E, 'ov3') == 0x02253EC8 and h.bl_target(0x02253FA0, 'ov3') == 0x02253EC8

