- id: "timing.class_is_the_slot4_literal"
  subsystem: "timing_classifier"
  confidence: "VERIFIED"
  claim: "*** THE WHEN-vs-IF TIMING CLASS IS DECIDED BY THE cls RECORD +0x10 LITERAL, AND THE CLASSIFIER NEVER CALLS THE SLOT. 0x0224AF7C(desc) returns 0 at once for descriptor selectors 0 and 3; otherwise it calls find_event_handler, does `ldr r0,[rec,#0x10]` @0x0224AF96 and compares that RAW POINTER against a chain of known tags: +0x10 == 0 -> CLASS 0 (Sangan 0x0FD6 shape); 0x021E51E5 -> class 2 (Botanical Girl / Colossal Fighter, the 'You can' tag); 0x021E50DD, 0x021E5201, 0x021E780D, 0x021E88F5, 0x021E91DD, 0x021E9A21, 0x021E986D, 0x021EAD71, 0x021E7969, 0x021E9215 and more -> class 1. *** WHAT THE CLASSES MEAN -- SETTLED IN-GAME 2026-08-17, and it is NOT what the obvious reading suggests. An UNRECOGNISED +0x10 (e.g. a donor whose slot holds a real cost function because a second clause needs one) puts the card in NO CLASS AT ALL, and the engine then says NOTHING when the trigger is lost -- the effect silently evaporates. Forcing the classifier to see 0 puts it in CLASS 0, and the game then correctly reports MISSED THE TIMING. So class 0 does NOT mean 'cannot miss the timing'; it means PROPERLY CLASSIFIED TRIGGER, after which the engine applies the miss-timing rule to it correctly. ⚠️ The opposite reading was inferred from gravekeepers_recruiter's prose and cost lightpulsar a withdraw-and-restore cycle: the hook was dropped as a 'fidelity regression' when it was in fact REQUIRED for correct behaviour. *** CONSEQUENCE FOR A DONOR SHARING ONE RECORD BETWEEN TWO CLAUSES: it cannot choose its timing class with a dispatcher stub, because the classifier reads the literal and never executes it. lightpulsar hit this -- clause 2 needs a real cost function at +0x10, so clause 3 was filed under an unrecognised tag and the game reported MISSED THE TIMING when the card was used as Synchro Material. The fix (PART T) displaces the classifier own `ldr r0,[r0,#0x10] ; cmp r0,#0` and substitutes 0 for that cid on a leave event, replaying both instructions verbatim for every other card."
  address: 0x0224AF96
  oracle: "ov3"
  sources: [notes/lightpulsar-findings.md, gravekeepers_recruiter]
  proof: |
    assert h.bytes_at(0x0224AF7C, 8, 'ov3') == bytes.fromhex('10b5041c61790029')
    assert h.bytes_at(0x0224AF96, 4, 'ov3') == bytes.fromhex('00690028')
    assert h.u16(0x0224AF9C, 'ov3') == 0x2000, 'class 0 arm drifted'
    assert h.u16(0x0224AFA6, 'ov3') == 0x2002, 'class 2 arm drifted'
    def _lit(site):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, 'not an LDR literal'
        return h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
    assert _lit(0x0224AFA0) == 0x021E51E5, 'the class-2 tag drifted'
    assert _lit(0x0224AFAA) == 0x021E50DD, 'the first class-1 tag drifted'
    i = next(i for i in range(0x2B9) if h.u32(0x02275C04 + i * 24, 'ov3') == 0x0FD6)
    assert h.u32(0x02275C04 + i * 24 + 0x10, 'ov3') == 0, 'Sangan +10 is not 0'

