- id: "leave.cleanup_destination_switch"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "*** WHERE THE ATTACHED MONSTER GOES WHEN THE CARD LEAVES -- DESTROY vs BANISH -- IS A PER-CID SWITCH INSIDE THE CLEANUP BODY, AND IT IS NEITHER THE MEMBERSHIP LIST NOR THE RIDER KIND BYTE. *** This closes an open question that three separate rounds recorded as 'the distinction lives elsewhere, UNPROVEN': leave.attached_card_destroy_list's 40-entry list only decides WHETHER a card cleans up, and kind 0x17 is passed identically by Ninjitsu Art of Transformation (destroy) and Escape from the Dark Dimension (banish), so neither can encode it. The choice is made here: 0x021CB488 presets a reason code [sp+0xAC] = 0 and 0x021CB48C presets *** [sp+0xA8] = 0x0E, A DESTINATION ZONE CODE, DEFAULTING TO THE GRAVEYARD ***; a compare tree over the leaving cid at 0x021CB490..0x021CB4DA then diverts five cids to an 0x0F (BANISHED) arm -- 0x1D2F Escape from the Dark Dimension via 0x021CB50A, and 0x1625 / 0x1880 / 0x1881 / 0x1E30 via 0x021CB510 -- with one further arm at 0x021CB504 writing 0x0D. Everything else falls through 0x021CB514 (`movs r0,#2 ; str r0,[sp,#0xAC]`) keeping destination 0x0E, and 0x021CB53C passes [sp+0xA8] as r2 to 0x021CC290. *** IN-GAME CONFIRMED 2026-08-31 by construction: card.ninjitsu_art_super_transformation's donor 0x1255 matches no arm and therefore took 0x0E; a 20 B ov3 stub that replaces ONLY the default preset and writes 0x0F for that one cid made the user report 'C4 is a banish'. Note the donor also picks up [sp+0xAC] = 2 from the shared tail, i.e. the identical destination AND reason code as Escape. *** ALL FIVE 0x0F CIDS ARE LIVE LIST MEMBERS, so there is no dead compare to repoint for free -- a new banisher needs a hook, and 0x021CB48C is the cheap one because only r0 and r4 are live across 0x021CB47C..0x021CB4DC. ⚠️ PUT THAT HOOK IN OV3 DEAD CODE, NOT THE OV5 CAVE: 0x021CB48C is shared by all 40 members and a puzzle loads overlay 41 over overlay 5."
  address: 0x021CB48C
  oracle: "ov3"
  sources: [notes/ninjitsu-art-super-transformation-findings.md]
  proof: |
    # the default destination and the reason preset
    assert h.bytes_at(0x021CB488, 4, 'ov3') == bytes.fromhex('00202b90'), \
        'the [sp,#0xAC] reason preset drifted'
    assert h.bytes_at(0x021CB48C, 4, 'ov3') in (
        bytes.fromhex('0e202a90'), bytes.fromhex('93f00cff')), \
        'the default destination 0x0E preset moved (and is not a known hook)'
    # the two banish arms and the 0x0D arm
    assert h.u16(0x021CB50A, 'ov3') == 0x200F and h.u16(0x021CB50C, 'ov3') == 0x902A, \
        "Escape's banish arm moved"
    assert h.u16(0x021CB510, 'ov3') == 0x200F, 'the second banish arm moved'
    assert h.u16(0x021CB504, 'ov3') == 0x200D, 'the 0x0D arm moved'
    # the shared tail keeps the destination and sets reason 2
    assert h.u16(0x021CB514, 'ov3') == 0x2002 and h.u16(0x021CB516, 'ov3') == 0x902B, \
        'the shared tail drifted'
    # and the destination is what reaches 0x021CC290 as r2
    assert h.u16(0x021CB536, 'ov3') == 0x9A2A, 'the destination read moved'
    assert h.bl_target(0x021CB53C, 'ov3') == 0x021CC290, 'the relocation call moved'
    # every 0x0F cid really is a live member of the 40-entry list
    lst = h.u16_table(0x0226E940, 40, 'ov3')
    for cid in (0x1625, 0x1880, 0x1881, 0x1D2F, 0x1E30):
        assert cid in lst, f'0x{cid:04X} is no longer in the leave-cleanup list'

- id: "leave.descriptor_slots"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "*** THE LEAVE DISPATCHER'S STACK SLOTS, UNPACKED FROM r0 (the packed leave word, [sp+0x200]) AT 0x021C7FD6..0x021C8052, AND MEASURED LIVE. Static: r6 = (w>>9)&1 side; [sp+0xA0] = (w>>10)&0xF zone; [sp+0x30] = side fields differ; [sp+0x2C] = bit 23 CLEAR (left the field); dest = (w>>19)&0xF; [sp+0x144] = dest==0x0E (GY); [sp+0x28] = dest==0x0D (DECK -- zone codes per ram.container_for_zone_code, 0x0F = banished); [sp+0x90] = bit 15 DESTROYED; [sp+0x44] = bit 16 BATTLE. [sp+8] = r2, [sp+0xC] = r3 (leave.tributed_reason_bit).
*** MEASURED 2026-09-14 by a one-shot GDB probe at the bystander-chain head 0x021C93D0 (scratch/gdb_assault_leave_probe.py, log scratch/gdb_assault_leave_probe.txt; hit-to-step mapping confirmed by the user), normal duel:
  Tribute Summon (Stardust Dragon): reason 0x11000, [sp+8]=0, dest 0xE, code [sp+0x1C]=0x1D.
  Ritual Tribute (Contract with the Abyss 0x1698): reason 0x11000, [sp+8]=0x1698, dest 0xE.
  Synchro Material (Shadow Ghoul, Junk Synchron): reason 0x10000 -- Tribute bit CLEAR.
  Banished from the field by Dark Core 0x15E9: dest 0xF, [sp+0x144]=0, [sp+0x28]=0, [sp+8]=0x15E9 -- so a FIELD BANISH DOES pass through this dispatcher, and it is dest 0xF, NOT 0xD (an older note's 'banish = [sp+0x28]' was wrong).
  Battle destruction: reason 0x7, code 0x17, [sp+0x44]=1, [sp+0x90]=1, phase u32[0x0229DD14+0x48] = 3 (the phase alone does NOT isolate the Damage Step).
  Effect destruction by Offerings to the Doomed 0x145E: [sp+0x90]=1, reason 0x10010002, [sp+8]=0x145E.
CONSEQUENCE: [sp+8] is the CAUSING CARD'S CID (0 if none), not a boolean -- the mask bit 0x0200 'by a card effect' is a nonzero test of it. [sp+0x9C] equals the leave word's low 9 bits (the leaving card's ref), e.g. 0x18 for word 0xE0720C18."
