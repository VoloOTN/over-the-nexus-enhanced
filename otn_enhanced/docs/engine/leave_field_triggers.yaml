  oracle: "ov3"
  sources: [notes/darksoul-normal-donor-findings.md]
  proof: |
    assert h.bytes_at(0x021C9F1C, 4, 'ov3') == bytes.fromhex('27488442'), \
        'tree 2 root bytes drifted'
    assert h.u32(0x021C9FBC, 'ov3') == 0x00001A64, 'tree 2 root literal drifted'
    assert h.u16(0x021C7FD2, 'ov3') & 0xFF00 == 0xB500, 'leave fn prologue drifted'
    assert h.u16(0x021C9F20, 'ov3') & 0xFF00 == 0xDD00, \
        '0x021C9F20 is no longer the BLE that consumes the replayed flags'
