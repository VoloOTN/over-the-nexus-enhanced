- id: "leave.banish_primitive"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "0x021C7098(r0 = event ctx, r1 = ptr to the target's packed card word, r2 = flags) is THE BANISH ('remove from play') PRIMITIVE, returning nonzero on success. It is a thin wrapper: it extracts the target's side from the card word (bit 14, via `ldr r0,[r1] / lsls #0x11 / lsrs #0x1f`), calls the worker 0x021C7118, and then runs a tail gated on the target belonging to the OTHER player. It is called ONCE PER BANISHED CARD, which makes it the hook site for any 'each time a card is banished' trigger. IDENTIFICATION: of its 31 BL call sites, mapping each to the cls-slot function that contains it and joining the owning cid to its real card text, 25 owning cards' printed text explicitly says banish / remove from play (Karma Cut, System Down, Iron Chain Dragon, Blackwing Vayu, Stardust Shimmer, Big Burn, Inferno Tempest, Dimension Jar, Soul Release, Book of Life, Arcana Call, Memory Crush King, Gladiator Beast Lanista, Volcanic Counter, Tongue Twister, Phantom of Chaos, ...); the 6 others are 2 holes plus Trishula and Speed Spell - Deceased Synchron, which also banish but failed the text join. Nothing contradicts it. The decisive case is D.D. Crow 0x1B44 (cls2[244], resolver 0x02208D18), whose whole effect is 'banish 1 card in a GY': it REQUIRES the target's zone to be 0x0E (the GY, cf. ram.container_for_zone_code) and then calls this function — so it cannot be a send-to-GY, which would be a no-op there. ⚠️ OPEN: the worker 0x021C7118 inserts the constant 0xE at bits 10..13 of the locator it builds (0x021C7156: movs r0,#0xe / lsls r0,#0xa / orrs r1,r0). That field is NOT the destination zone (banished is 0x0F) and is unexplained; do not read it as a zone."
  address: 0x021C7098
  oracle: "ov3"
  sources: [notes/zeta-reticulant-findings.md]
  proof: |
    # the wrapper's side extraction and its call to the worker
    assert h.u16(0x021C709C, 'ov3') == 0x6808, 'ldr r0,[r1] (card word) drifted'
    assert h.u16(0x021C70A0, 'ov3') == 0x0440, 'lsls r0,r0,#0x11 (side bit 14) drifted'
    assert h.u16(0x021C70A2, 'ov3') == 0x0FC5, 'lsrs r5,r0,#0x1f (side) drifted'
    # it really does BL the worker 0x021C7118
    w1 = h.u16(0x021C70BE, 'ov3'); w2 = h.u16(0x021C70C0, 'ov3')
    assert w1 & 0xF800 == 0xF000 and w2 & 0xF800 == 0xF800, '0x021C70BE is not a BL'
    off = ((w1 & 0x7FF) << 12) | ((w2 & 0x7FF) << 1)
    if off & 0x400000: off -= 0x800000
    assert 0x021C70BE + 4 + off == 0x021C7118, 'banish worker retargeted'
    # D.D. Crow's resolver gates on GY zone 0x0E and then calls the primitive
    assert h.u16(0x02208D44, 'ov3') == 0x280E, "D.D. Crow's GY zone gate (cmp r0,#0xE) drifted"
    v1 = h.u16(0x02208D8E, 'ov3'); v2 = h.u16(0x02208D90, 'ov3')
    voff = ((v1 & 0x7FF) << 12) | ((v2 & 0x7FF) << 1)
    if voff & 0x400000: voff -= 0x800000
    assert 0x02208D8E + 4 + voff == 0x021C7098, "D.D. Crow no longer calls the banish primitive"

