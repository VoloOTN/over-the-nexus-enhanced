- id: "leave.two_trees_one_function_pick_by_timing"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "*** THE WHOLE PER-CID LEAVE DISPATCH IS ONE FUNCTION WITH TWO cid TREES, AND WHICH TREE YOU ARM FROM DECIDES WHICH DEPARTURES YOU SEE. Entry 0x021C7FD0 (`push {r3-r7,lr} ; sub sp,#0x1e8`) has exactly ONE caller in the whole ROM, the guarded `BL` @0x021CD2AC (guard: `[sp+0x4c]==0 AND ([sp+0x14]!=0 OR r4>0xA)`, 0x021CD28A..0x021CD29A). Inside it are BOTH cid compare trees -- TREE 1 root 0x021C8216 and TREE 2 root 0x021C9F1C -- and the arming gate 0x021CA640, so all three share ONE stack frame and every descriptor slot is live at any of them. TREE 1's root is STRAIGHT-LINE FALL-THROUGH from the prologue: every branch in 0x021C7FD0..0x021C8214 lands ON 0x021C8216 (predecessors 0x021C81F6 / 0x021C8206 / 0x021C8210). TREE 2's root has one predecessor, the `beq` @0x021C9F18, plus fall-through from 0x021C9F1A. *** THE DESCRIPTOR UNPACK (arg 5 at [sp+0x200], 0x021C7FD0..0x021C8054): [sp+0x144] = 1 iff the destination zone field == 0x0E (to GY); [sp+0x28] = dest == 0x0D; [sp+0x90] = descriptor bit 15 (DESTROYED); [sp+0x44] = bit 16 (BATTLE); [sp+0x2c] = 1 iff bit 23 is CLEAR; [sp+0x30] = the two side fields differ. *** THE GATE 0x021CA640 REQUIRES ONLY THREE THINGS to reach its trigger-build `bl 0x021D2584` @0x021CA686: [sp+0x2c] != 0, r6 == [sp+0x98] (controller), and [sp+0x144] != 0 (destination is the GY). It does NOT test DESTROYED or BATTLE -- that arm is the OTHER one at 0x021CA654. So the gate itself is an ANY-LEAVE-TO-GY gate. *** CONSEQUENCE, AND THE BUG IT EXPLAINS (card.darksoul_rehome, measured in-game 2026-09-08): the shared T.G. trampoline at TREE 1 (tg_table._shared_arm_trampoline) adds its OWN `[sp+0x90]` DESTROYED test before jumping to the gate -- required for T.G. Striker / Warwolf / Rush Rhino and Quasar, all printed 'destroyed', and its comment records that without it 'Tribute Summon fodder and Synchro Material also armed the search'. Registering an ANY-LEAVE card there therefore arms on battle destruction and SILENTLY NOT on Synchro Material / Tribute. An any-leave card must hook its own trampoline that reaches 0x021CA640 WITHOUT that test; darksoul does it at TREE 2's root 0x021C9F1C (native `LDR R0,[PC,#0x9C] ; CMP R4,R0`, 4827 4284, literal 0x00001A64 @0x021C9FBC), which is the position the pre-2026-09-08 Deep Diver build armed from and which the user confirms worked on Synchro Material. ⚠️ REPLAY ORDER IS LOAD-BEARING at that site: the replayed `CMP R4,R0` must be the LAST instruction before `BX LR`, because 0x021C9F20 is a `BLE` that consumes those flags. *** IN-GAME CONFIRMED BY USER 2026-09-08: with the arming moved to the tree-2 trampoline the card fires on Synchro Material AND on battle destruction, with no regression to the four cards still on the DESTROYED-filtered tree-1 trampoline."
