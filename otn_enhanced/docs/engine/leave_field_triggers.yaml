        assert rows.get(cid) == mask, f'{who} no longer carries mask {mask:#06x}'

- id: "leave.per_cid_arm_is_arming_only"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "*** A DEDICATED ARM IN THE LEAVE SWITCH IS A FOURTH WAY TO ARM [sp+0x18] -- AND IT IS ONLY THAT. Minefieldriller 0x2085 ('When this face-up card you control leaves the field and is still in your possession: ... add 1 Field Spell from your GY') owns one, body at 0x021C8CC4. It tests exactly [sp+0x98]==r6, [sp+0x54], [sp+0x94], [sp+0x2C] and ![sp+0x28] -- i.e. mask 0x001D under leave.mask_bit_semantics -- then `adds r0,#1` at 0x021C8D58 and branches to 0x021C93CE, which is the `str r0,[sp,#0x18]` immediately above the GENERIC TAIL 0x021C93D0. So the arm posts nothing itself; it computes the same flag the lists and the mask table compute and rejoins the identical path Sangan takes. *** THE ONE THING IT ADDS THAT A MASK ROW CANNOT: the value is 1 + ([sp+0xC] & 0xC0 ? 1 : 0), and the consumer switches on it at 0x021CA980 (`cmp r0,#1 / #2 / #3`), variant 2 rebuilding the packed word with the side field set to (r6 != [sp+0x98]). Matched against the card's printed text, THAT IS THE 'and is still in your possession' clause. A mask row always yields variant 1, so a card with no possession clause loses nothing by using one. CONSEQUENCE FOR A DONOR: the per-cid arms are NOT a resource to steal -- each one belongs to a real card -- and they are not needed, because the mask table expresses the same predicates as data."
  address: 0x021C8CC4
  oracle: "ov3"
  sources: [notes/reborn-tengu-normal-donor-findings.md]
  proof: |
    # the arm tests exactly the five slots that spell mask 0x001D
    for site, word in ((0x021C8CC4, 0x9826), (0x021C8CCA, 0x9815), (0x021C8CD0, 0x9825),
                       (0x021C8CD6, 0x980B), (0x021C8CDC, 0x980A)):
        assert h.u16(site, 'ov3') == word, f'the 0x2085 arm changed at {site:#x}'
    # ... then the possession refinement, +1, and the join into the generic tail
    assert h.u16(0x021C8CE2, 'ov3') == 0x9803, 'the [sp+0xC] possession load drifted'
    assert h.u16(0x021C8CE4, 'ov3') == 0x21C0, 'the 0xC0 possession mask drifted'
    assert h.u16(0x021C8D58, 'ov3') == 0x1C40, '`adds r0,r0,#1` drifted'
    assert h.u16(0x021C93CE, 'ov3') == 0x9006, 'the str r0,[sp,#0x18] join drifted'
    # and the consumer really switches on 1 / 2 / 3
    assert h.u16(0x021CA980, 'ov3') == 0x9806, 'the [sp+0x18] consumer load drifted'
    for site, word in ((0x021CA982, 0x2801), (0x021CA986, 0x2802), (0x021CA98A, 0x2803)):
        assert h.u16(site, 'ov3') == word, 'the [sp+0x18] variant switch drifted'

