- id: "leave.mask_bit_semantics"
  subsystem: "leave_field_triggers"
  confidence: "VERIFIED"
  claim: "*** THE LEAVE-MASK VALUE IS A BITMASK OF PRECONDITIONS AND EVERY BIT IS NOW DECODED, producer and witness. Read straight off 0x021C8116..0x021C81F0: the row's mask is loaded as `ldrsh r0,[row,#2]`, r5 starts at 1 unless [sp+0x28] (destination zone == 0x0D), and each set bit adds ONE precondition that can clear r5; r5 != 0 then sets [sp+0x18] = 1. bit 0x0001 -> [sp+0x98] == r6 ('you control it', witness Pinch Hopper 0x12A4 = 0x0805 'this card you control is sent to your GY'); 0x0002 -> 0x021A0DF8(r6,[sp+0xA0]) != 0xFFFF (the slot still resolves); 0x0004 -> [sp+0x2C] LEFT THE FIELD; 0x0008 -> [sp+0x94] != 0 was FACE-UP; 0x0010 -> [sp+0x54], which 0x021C8080..0x021C809A builds as 'face-up AND NOT the card that was attacked face-down and destroyed by battle' -- literally Poison Draw Frog 0x191A's parenthetical, and its mask is 0x0814; 0x0020 -> [sp+0x94] == 0 was FACE-DOWN (witness Statue of the Wicked 0x1543 = 0x0C20, 'when this FACE-DOWN card is destroyed'); 0x0040 -> you control it AND [sp+0x30], i.e. the OPPONENT did it (Shark Cruiser 0x207F = 0x064C, 'destroyed by your opponent's card effect'); 0x0080 / 0x0100 -> [sp+0x44] != / == 0, by battle / not by battle (T.A.D.P.O.L.E. 0x1919 = 0x0881); 0x0200 -> [sp+0x8], by a CARD EFFECT (Seed of Flame 0x1F8E = 0x0E05); 0x0400 -> [sp+0x90] DESTROYED; 0x0800 -> [sp+0x144] destination is the GY. *** CONSEQUENCE: a donor's trigger wording is chosen by picking bits, not by finding a card that already has it. 'If this face-up card leaves the field' is 0x000C -- and that is exactly the mask Konami's own 3DS build gives its shipped Reborn Tengu (cid 0x25E3, 3DS mask table at VA 0x6A18FC, 243 rows). ⚠️ notes/eclipse-wyvern-findings.md gives that 3DS table as 0x007A18FC, which is off by +0x100000; the row indices it lists (Dandylion at 44, Eclipse Wyvern at 174) match the table at 0x6A18FC exactly, so it is the same table with a mis-stated address."
  address: 0x021C8116
  oracle: "ov3"
  sources: [notes/reborn-tengu-normal-donor-findings.md, reborn_tengu.py]
  proof: |
    # the mask load and each bit's predicate load, in order
    assert h.u16(0x021C8124, 'ov3') == 0x5E40, 'ldrsh r0,[row,#2] (the mask) drifted'
    for site, word, label in ((0x021C8126, 0x2101, 'bit 0x0001'),
                              (0x021C8150, 0x2104, 'bit 0x0004'),
                              (0x021C815E, 0x2108, 'bit 0x0008'),
                              (0x021C816C, 0x2110, 'bit 0x0010'),
                              (0x021C817A, 0x2120, 'bit 0x0020'),
                              (0x021C819C, 0x2180, 'bit 0x0080')):
        assert h.u16(site, 'ov3') == word, f'{label} selector drifted'
    for site, word, label in ((0x021C812C, 0x9926, '0x0001 -> [sp+0x98]'),
                              (0x021C8156, 0x990B, '0x0004 -> [sp+0x2C]'),
                              (0x021C8164, 0x9925, '0x0008 -> [sp+0x94]'),
                              (0x021C8172, 0x9915, '0x0010 -> [sp+0x54]'),
                              (0x021C8180, 0x9925, '0x0020 -> [sp+0x94]'),
                              (0x021C81A2, 0x9911, '0x0080 -> [sp+0x44]'),
                              (0x021C81D2, 0x9924, '0x0400 -> [sp+0x90]'),
