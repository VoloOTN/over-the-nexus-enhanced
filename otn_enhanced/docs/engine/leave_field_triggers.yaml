    assert h.bytes_at(0x021CA640, 4, 'ov3') == bytes.fromhex('0b980028'), 'gate term 1'
    assert h.u16(0x021CA64C, 'ov3') == 0x9851, 'gate term 3 is not ldr r0,[sp,#0x144]'
    assert h.bytes_at(0x021CA686, 2, 'ov3') != b'\x00\x00', 'gate trigger-build call gone'

