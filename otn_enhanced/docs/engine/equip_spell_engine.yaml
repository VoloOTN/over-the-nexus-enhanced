    assert h.bytes_at(0x021D7F38, 12, 'ov3') == bytes.fromhex('04982105084200d100247ce5'), 'Molting arm drifted'
    assert h.bytes_at(0x021D78A8, 2, 'ov3') == bytes.fromhex('46e3'), 'b 0x021D7F38 source drifted'
    assert h.bytes_at(0x021D739C, 12, 'ov3') == bytes.fromhex('cbf7c0ff0099aa4f0a88051c'), 'r5 = candidate cid drifted'
    assert h.bytes_at(0x021D817A, 4, 'ov3') == bytes.fromhex('07b0f0bd'), 'shared return drifted'
