- id: "equip.percid_hook_table"
  subsystem: "equip_spell_engine"
  confidence: "VERIFIED"
  claim: "0x0226F628 is a generic per-cid hook table: 97 rows x 12 bytes, key = i16 cid at +0, +4 = predicate (blx; r0 != 0 ACCEPTS), +8 = applier. It is binary-searched by 0x021E5200, which passes count=0x61 and stride=0xC as immediates and is an FSM/chain-step handler (it drives a counter at [0x0229AAFC+0x7C]) -- NOT a target enumerator."
  address: 0x0226F628
  oracle: "ov3"
  sources: [wonder-wand-findings]
  proof: |
    # the consumer's immediates and table literal pin the geometry
    assert h.u16(0x021E520A, 'ov3') == 0x2261, 'count immediate is no longer movs r2,#0x61'
    assert h.u16(0x021E520C, 'ov3') == 0x230C, 'stride immediate is no longer movs r3,#0xC'
    assert h.u32(0x021E5274, 'ov3') == 0x0226F628, 'table literal drifted'
    assert h.u32(0x021E5278, 'ov3') == 0x0229AAFC, 'FSM-state literal drifted'
    # rows stay sorted by the i16 key or the binary search breaks
    keys = [h.u16(0x0226F628 + i * 12, 'ov3') for i in range(0x61)]
    assert all(keys[i] < keys[i+1] for i in range(len(keys)-1)), 'hook table unsorted'
    # and no race-locked equip has a row here
    for cid in (0x10E9, 0x1467, 0x19D8):
        assert cid not in keys, f'0x{cid:04X} unexpectedly has a hook row'

- id: "equip.race_code_accessor"
  subsystem: "equip_spell_engine"
  confidence: "VERIFIED"
  claim: "0x0202ABB8 is a card_prop accessor taking a CID in r0 and returning a small race/card-type enum (it calls the record lookup 0x0202A084 then extracts a 5-bit field from the u32 at record+4). **CODE 23 (0x17) == SPELL** -- three independent ARM-mode call sites do `blx 0x202abb8` immediately followed by `cmp r0,#0x17` (0x0214ACE8/0x0214ACEC, 0x0214C810/0x0214C814, and 0x0217323C), and card_prop decodes every Spell as race 'Unknown(23)'. Code 13 (0xD) is also compared 8x. ⚠️ GDB-MEASURED 2026-08-03: this accessor is NOT the equip-target race gate -- during a live Book of Secret Arts activation, the legal Spellcaster (White Magician Pikeru 0x1757) and an illegal non-Spellcaster (7 Colored Fish 0x115E) went through the SAME callers with the same treatment. Of 101 call sites in ov3+arm9, NONE compares the result against 18 -- so 'Spellcaster == 18' (asserted by the old wonder_wand RACE_SPELLCASTER) is unsupported; do not build a gate on it."
  address: 0x0202ABB8
  oracle: "arm9"
  sources: [wonder-wand-findings]
  proof: |
    # accessor prologue: push {r3,lr} ... ldr r0,[r0,#4]
    assert h.u16(0x0202ABB8, 'arm9') == 0xB508, 'accessor is no longer push {r3,lr}'
    assert h.u16(0x0202ABBE, 'arm9') == 0x6840, 'accessor no longer reads record+4'
    # two ARM call sites compare the result against 23 == Spell (ARM cmp r0,#0x17)
    assert h.u32(0x0214ACEC, 'ov3') == 0xE3500017, 'site1 is no longer cmp r0,#0x17'
    assert h.u32(0x0214C814, 'ov3') == 0xE3500017, 'site2 is no longer cmp r0,#0x17'

- id: "equip.grant_table"
  subsystem: "equip_spell_engine"
  confidence: "VERIFIED"
  claim: "Equip ATK/DEF grant table @0x0226DFB0: 94 records x 6 bytes, [cid u16][atk i16][def i16], sorted by cid, spanning 0x0226DFB0..0x0226E1E4. This is where a simple equip's stat bonus lives -- including for cards with NO cls record at all (e.g. Book of Secret Arts 0x10E9). A second run of the same shape (Speed Spell equips, cids 0x0Dxx) begins at 0x0226E1E4. Editing an ATK/DEF field in place is count-neutral and needs no re-sort. *** IN-GAME CONFIRMED 2026-08-03 (normal duel, rom_wonder_wand.nds): patching Trial of the Princesses 0x19D8 @0x0226E13C from +800 to +500 changed the ATK the engine actually applies to the equipped monster. So this table is the LIVE source of the bonus, not a data mirror -- a '+N ATK' equip clause is a 2-byte data edit with NO shim, NO ov5 cave slot and NO cls record. Do not build a custom grant stub (cf. the Black Pendant main-shim approach) for a plain stat bonus. ***"
  address: 0x0226DFB0
  oracle: "ov3"
  sources: [wonder-wand-findings]
  proof: |
    # (a) the CONSUMER's own immediates pin base/count/stride and the field offsets:
    #     0x021B7088 ldr r1,[pc,#0xE4] -> 0x0226DFB0 ; movs r2,#0x5E ; movs r3,#6
    #     bl 0x02022E44 ; ldrsh r1,[r2,#2] -> +ATK acc ; ldrsh r1,[r2,#4] -> +DEF acc
    assert h.u32(0x021B7170, 'ov3') == 0x0226DFB0, 'grant-table literal drifted'
    assert h.u16(0x021B708C, 'ov3') == 0x225E, 'count immediate is no longer movs r2,#0x5E'
    assert h.u16(0x021B708E, 'ov3') == 0x2306, 'stride immediate is no longer movs r3,#6'
    assert h.u16(0x021B709A, 'ov3') == 0x5E11, 'ATK read is no longer ldrsh r1,[r2,r0=2]'
    assert h.u16(0x021B70A4, 'ov3') == 0x5E11, 'DEF read is no longer ldrsh r1,[r2,r0=4]'
    # (b) closed structural proof: every record must match its printed card text
    want = {0x10D3: (300, 300),   # Legendary Sword
            0x10D4: (400, -200),  # Sword of Dark Destruction
            0x10D6: (1000, 0),    # Axe of Despair
            0x10DD: (500, 0),     # Black Pendant
            0x10DF: (0, 800),     # Horn of Light
            0x10E0: (700, 700),   # Horn of the Unicorn
            0x10E9: (300, 300),   # Book of Secret Arts
            0x1467: (700, 0)}     # Magic Formula
    rows = {}
    for i in range(94):
        a = 0x0226DFB0 + i * 6
        cid = h.u16(a, 'ov3')
        atk = h.u16(a + 2, 'ov3'); dfn = h.u16(a + 4, 'ov3')
        atk -= 0x10000 if atk > 0x7FFF else 0
        dfn -= 0x10000 if dfn > 0x7FFF else 0
        rows[cid] = (atk, dfn)
    keys = list(rows)
    assert len(keys) == 94, 'duplicate cid in the grant table'
    for cid, exp in want.items():
        assert rows.get(cid) == exp, \
            f'grant row 0x{cid:04X} = {rows.get(cid)}, expected {exp}'
    srt = sorted(keys)
    assert keys == srt, 'grant table unsorted -- binary search would break'

