- id: "thumb.blx_needs_thumb_bit"
  subsystem: "thumb_encoding_rules"
  confidence: "VERIFIED"
  claim: "*** `BLX Rm` TAKES THE INSTRUCTION SET FROM BIT 0 OF Rm. *** An injected stub that does `LDR R3,=<native function> ; BLX R3` with the RAW (even) address switches the core to ARM and executes garbage -- an instant freeze. Native callers reach these functions with a Thumb `BL`, so the addresses in your notes are even. Always OR in bit 0 for a BLX target. Diagnosed 2026-08-13 after a run of freezes wrongly blamed on gates and candidate counters: a black-box recorder showed the stub entering its capture block and dying on the very next BLX. The only call that ever worked was 0x0221CD29, because a cls-record slot already carries the bit. Addresses bitten: 0x021BABE8, 0x02243FA8, 0x021D269C, 0x0219A818, 0x0219C510. ⚠️ effect_verify.assert_thumb1_only does NOT catch this -- it rejects Thumb-2, not wrong-mode branches. *** IT RECURRED 2026-09-04 ON card.jet_warrior, WITH THIS FACT ALREADY IN THE KB, AND COST AN IN-GAME TEST. *** Four constants were written straight from their (even) disassembly addresses: TURNLOG_QUERY 0x021A14E8, TURNLOG_POST 0x021D2584, the zone predicate 0x021D6E40 and the Level getter 0x021B807C. The user's report was 'I hit a freeze when jet warrior is summoned ... before I believe it worked so this is a regression', and the culprit was the FIRST of them, inside the cls1 +0C condition stub -- a slot the engine evaluates while ENUMERATING the summon trigger, so the freeze landed exactly on 'the moment of summoning'. *** THE LESSON IS THAT PROSE DID NOT PREVENT IT AND A MECHANICAL CHECK DOES. Two now exist: (a) a module-level `assert v & 1` over every constant that will be a BLX target, in jet_warrior; and (b) a whole-cave sweep -- disassemble each occupied ov5_cave slot, track `ldr rX,[pc,#imm]` -> literal, and flag any `blx rX` whose tracked literal is even. The sweep reports 14/14 occupied slots clean as of 2026-09-04. RUN IT AFTER WRITING ANY STUB: neither a passing verify() nor a capstone listing of the stub can show you this, because the literal's VALUE never appears in the disassembly -- only `ldr rX,[pc,#imm]` does."
  address: 0x0221CD28
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
    raw = h.bytes_at(0x0221CD28, 2, 'ov3')
    assert raw == bytes.fromhex('38b5'), 'Gold Sarcophagus resolver moved'
    assert 0x0221CD29 & 1, 'cls-record entry points carry the Thumb bit'

- id: "thumb.thumb1_only"
  subsystem: "thumb_encoding_rules"
  confidence: "VERIFIED"
  claim: "The NDS ARM9 is ARMv5TE / Thumb-1 only: a 32-bit Thumb-2 op (e.g. movw) is undefined and freezes the console; assert_thumb1_only accepts legal Thumb-1 and rejects movw."
  sources: [thumb-add-sub-imm3-footgun, CLAUDE.md]
  proof: |
    import otn_enhanced.asm.effect_verify as ev
    h.assert_thumb1(bytes.fromhex('7047'))          # BX LR — legal Thumb-1
    try:
        ev.assert_thumb1_only(bytes.fromhex('40f20000'))   # movw r0,#0 — Thumb-2
        raise AssertionError('movw (Thumb-2) was not rejected')
    except ev.Thumb2Error:
        pass

- id: "thumb.cloned_pool_literal_may_be_a_pointer"
  subsystem: "thumb_encoding_rules"
  confidence: "VERIFIED"
  claim: "*** WHEN CLONING A NATIVE HANDLER, ASK OF EVERY `LDR Rd,[PC,#imm]` WHETHER THE LITERAL IS A VALUE OR A POINTER — and if it is a pointer to a table the clone must carry itself, the clone needs a POINTER WORD OF ITS OWN, not the table dropped into the literal slot. *** Worked case, and it cost eleven rounds on card.ninjitsu_art_super_transformation: Ninjitsu Art of Transformation's criteria handler 0x0223E768 begins `ldr r4,[pc,#0x48] ; ldm r4!,{r0,r1} ; add r3,sp,#8 ; stm r3!,{r0,r1} ; ldm r4!,{r0,r1} ; stm r3!,{r0,r1}` — it copies a FOUR-WORD RACE WHITELIST onto its own stack, and the literal is the ADDRESS 0x02271304 where that list lives in ov3 ({11, 16, 10, 0} = Beast, Winged Beast, Insect). The ov5 clone needed a different list ({1, 9, 5, 0}), no such list exists in ov3, so it appended the four words to its own literal pool — AND POINTED THE `LDR` AT THEM. r4 therefore loaded 1, the first race code, and `ldm r4!` read from address 0x00000001. *** WHY IT SURVIVED SO LONG: the handler is only reached when the engine actually runs the criteria search, and eight earlier rounds had a resolver that intercepted the phase where that happens. The first three builds that let the search run all failed at this instruction, and all three failures were attributed to the resolver architecture instead — a hypothesis those tests never actually exercised. *** THE GENERAL RULE: `ldr rD,=X` in an injected stub means 'rD gets the 32-bit value X'. If the native original's X was an address, the clone's pool must hold an address too. An `LDM`/`LDR [rD]` on a register fed by a pool literal is the tell."
  address: 0x0223E76C
  oracle: "ov3"
  sources: [notes/ninjitsu-art-super-transformation-findings.md]
  proof: |
    # the original's literal is a POINTER, and the list really lives at it
    hw = h.u16(0x0223E76C, 'ov3')
    assert (hw & 0xF800) == 0x4800 and ((hw >> 8) & 7) == 4, \
        '0x0223E76C is no longer `ldr r4,[pc,#imm]`'
    lit = ((0x0223E76C + 4) & ~3) + (hw & 0xFF) * 4
    assert h.u32(lit, 'ov3') == 0x02271304, \
        'the race-list POINTER literal moved'
    assert [h.u32(0x02271304 + 4 * k, 'ov3') for k in range(4)] == [11, 16, 10, 0], \
        'the race list it points at is not {Beast, Winged Beast, Insect, 0}'
    # and the very next instruction dereferences it
    assert h.u16(0x0223E772, 'ov3') == 0xCC03, '`ldm r4!,{r0,r1}` moved'

