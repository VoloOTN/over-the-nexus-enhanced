- id: "cost.lp_activation_table"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "LP ACTIVATION-COST table @0x0226F1A8: 97 records x 4 bytes, [cid u16][lp_cost u16], sorted by cid, binary-searched via 0x02022E44 from 0x021E4934. Maps 'this card costs N LP to activate/use'. GDB-OBSERVED 2026-08-03: the equip-activation path queries it with the activated card's cid at the moment of activation (Book of Secret Arts 0x10E9 -> miss -> no cost). Distinct from the LP-CHANGE/effect table 0x02270A78. A card absent from this table has no LP cost."
  address: 0x0226F1A8
  oracle: "ov3"
  sources: [wonder-wand-findings]
  proof: |
    # content proof: the values must match the printed LP costs
    want = {0x114A: 5000,  # Cyber-Stein
            0x11A0: 3000,  # Gale Dogra
            0x1366: 800,   # Premature Burial
            0x12C3: 800,   # Brain Control
            0x2330: 2000,  # Solemn Warning
            0x1E24: 800,   # Krebons
            0x162B: 1500,  # My Body as a Shield
            0x1712: 2000}  # Dimension Fusion
    rows = {}
    for i in range(97):
        a = 0x0226F1A8 + i * 4
        rows[h.u16(a, 'ov3')] = h.u16(a + 2, 'ov3')
    assert len(rows) == 97, 'duplicate cid in the LP-cost table'
    for cid, lp in want.items():
        assert rows.get(cid) == lp, f'LP cost 0x{cid:04X} = {rows.get(cid)}, want {lp}'
    ks = list(rows)
    assert ks == sorted(ks), 'LP-cost table unsorted -- binary search would break'
    # the equip donors are absent -> they have no activation cost
    for cid in (0x10E9, 0x19D8):
        assert cid not in rows, f'0x{cid:04X} unexpectedly has an LP cost'

- id: "lp.change_table"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "LP-change table @0x02270798: 120 stride-8 records [cid u16][k u16][amt s16][code u16], strictly ascending by cid. amt == 0xFFFF is the DYNAMIC sentinel (the amount is computed by `code` at resolution instead of being a literal)."
  address: 0x02270798
  oracle: "ov3"
  sources: [otn-lp-change-table-burn]
  proof: |
    import struct
    raw = h.bytes_at(0x02270798, 120 * 8, 'ov3')
    recs = [struct.unpack_from('<4H', raw, i * 8) for i in range(120)]
    cids = [r[0] for r in recs]
    assert h.is_sorted_unique(cids), 'LP-change table is not sorted-unique by cid'
    assert all(r[3] <= 0x11 for r in recs), 'a code exceeds the 0x11 switch bound'
    # the dynamic sentinel really is in use (Armory Arm et al.)
    assert any(r[2] == 0xFFFF for r in recs), 'no dynamic-amount rows found'

