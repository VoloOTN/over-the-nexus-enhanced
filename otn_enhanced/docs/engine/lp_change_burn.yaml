- id: "lp.fixed_amount_table_0x02270260"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "Fixed LP-amount table @0x02270260: {u16 cid, s16 amount} rows (e.g. Sparks 0x10FD -200 @0x022702B0, Hinotama 0x10FE -500, Dian Keto 0x10FC +1000). Its ONLY literal reader in ov3 is 0x02204D38, inside the LP-change resolver 0x02204D08 -- so a donor whose cls0 +04 no longer reaches that resolver leaves its row inert. Proven 2026-10-01 by a full ov3 literal scan (That Grass Looks Greener donor sweep)."
  address: 0x02270260
  oracle: "ov3"
  sources: [notes/that-grass-looks-greener-findings.md]
  proof: |
    import struct
    img, b = env.image('ov3'), env.base('ov3')
    assert h.u16(0x022702B0, 'ov3') == 0x10FD and struct.unpack('<h', h.bytes_at(0x022702B2, 2, 'ov3'))[0] == -200
    refs = [b + i for i in range(0, len(img) - 3, 4) if struct.unpack_from('<I', img, i)[0] == 0x02270260]
    assert refs == [0x02205038], f'table readers changed: {[hex(r) for r in refs]}'
    assert ((0x02204D38 + 4) & ~3) + (h.u16(0x02204D38, 'ov3') & 0xFF) * 4 == 0x02205038, 'reader moved'

- id: "cost.lp_cost_table_0x0226F1A8"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "LP-COST TABLE @0x0226F1A8: 97 sorted {u16 cid, s16 LP} rows (e.g. Abyssal Designator 0x17F4 -> 1000 @0x0226F254, Overdrive Teleporter 0x1F90 -> 2000). Its getter 0x021E48D4(desc) binary-searches it (`ldr r1,=0x0226F1A8; movs r2,#0x61; movs r3,#4; bl 0x02022E44`) and on a hit returns ldrsh [hit+2]; on a miss it falls into a cid switch. The getter has 10 BL callers; 0x021E780C is the generic 'pay LP cost' COST fn (reached only through a record's COST slot / the COST list @0x0224B030), but 0x021EDA14 is reached from generic code (0x0224B644, 0x0224B8B0, 0x022398C8 chains), so a donor that keeps its row can leak an LP cost into an affordability check -- zero the row in place instead. Proven 2026-10-01 by disassembly and a full ov3 literal scan (Obedience Schooled donor sweep)."
  address: 0x0226F1A8
  oracle: "ov3"
  sources: [notes/obedience-schooled-findings.md]
  proof: |
    import struct
    img, b = env.image('ov3'), env.base('ov3')
    refs = [b + i for i in range(0, len(img) - 3, 4) if struct.unpack_from('<I', img, i)[0] == 0x0226F1A8]
    assert refs == [0x021E4B50], f'table readers changed: {[hex(r) for r in refs]}'
    assert ((0x021E492A + 4) & ~3) + (h.u16(0x021E492A, 'ov3') & 0xFF) * 4 == 0x021E4B50, 'ldr moved'
    assert h.u16(0x021E492C, 'ov3') == 0x2261 and h.u16(0x021E492E, 'ov3') == 0x2304, 'count/stride moved'
    assert h.bl_target(0x021E4930, 'ov3') == 0x02022E44, 'search call moved'
    assert h.u16(0x0226F254, 'ov3') == 0x17F4 and struct.unpack('<h', h.bytes_at(0x0226F256, 2, 'ov3'))[0] == 1000
    keys = [h.u16(0x0226F1A8 + 4 * i, 'ov3') for i in range(0x61)]
    assert keys == sorted(keys), 'table not sorted'
