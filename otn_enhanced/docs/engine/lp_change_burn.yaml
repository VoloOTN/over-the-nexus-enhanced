- id: "lp.resolver"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "LP-change resolver @0x02204D08 computes both players' LP deltas into a caller buffer. It keeps the SOURCE card struct in R7 for its whole body (`adds r7,r0,#0` at 0x02204D0C), so [R7] (u16) is the source cid and [R7+0x20] a packed ref to the destroyed monster."
  address: 0x02204D08
  oracle: "ov3"
  sources: [otn-lp-change-table-burn]
  proof: |
    sig = h.bytes_at(0x02204D08, 6, 'ov3')
    # push {r3-r7,lr} ; sub sp,#0x58 ; adds r7,r0,#0
    assert sig == bytes.fromhex('f8b596b0071c'), f'0x02204D08 prologue drifted: {sig.hex()}'

- id: "lp.code_jumptable"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "The resolver's `code` switch reads a signed-halfword jump table at 0x02204DD2 (18 entries, codes 0x00-0x11), target = 0x02204DD4 + entry. code=0x0C dispatches to 0x02204E42."
  address: 0x02204DD2
  oracle: "ov3"
  sources: [otn-lp-change-table-burn]
  proof: |
    import struct
    raw = h.bytes_at(0x02204DD2, 18 * 2, 'ov3')
    tgt = [0x02204DD4 + struct.unpack_from('<h', raw, c * 2)[0] for c in range(18)]
    assert tgt[0x0C] == 0x02204E42, f'code=0x0C target drifted: 0x{tgt[0x0C]:08X}'
    assert all(0x02204DD4 <= t <= 0x02204FA6 for t in tgt), 'a jump target escapes the function'

- id: "lp.code0c_gy_gate"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "code=0x0C branch @0x02204E42 gates the burn on the destroyed monster being CURRENTLY in the Graveyard: it packs [R7+0x20] to a card-ref, calls the zone-scan 0x021A220C, extracts the located ZONE byte and does `cmp r0,#0xE ; bne 0x02204E8A` (0xE == in GY) -- the bne fizzles with amount 0. Past the gate the ATK is read BY CID from the zone-independent per-card instance array, so only the gate depends on GY presence."
  address: 0x02204E42
  oracle: "ov3"
  sources: [otn-lp-change-table-burn]
  proof: |
    blk = h.bytes_at(0x02204E42, 10, 'ov3')
    assert blk == bytes.fromhex('386a0024c005c70d381c'), f'code=0x0C prologue drifted: {blk.hex()}'
    assert h.bl_target(0x02204E4C, 'ov3') == 0x021A220C, 'the zone-scan call target drifted'
    import struct
    cmp_, bne = struct.unpack('<2H', h.bytes_at(0x02204E5A, 4, 'ov3'))
    assert cmp_ == 0x280E, f'expected `cmp r0,#0xE`, got 0x{cmp_:04X}'
    assert (bne >> 8) == 0xD1, f'expected a BNE, got 0x{bne:04X}'
    # BNE is 8-bit signed, in halfwords, from pc = addr+4
    off = bne & 0xFF
    off -= 0x100 if off & 0x80 else 0
    assert 0x02204E5C + 4 + off * 2 == 0x02204E8A, 'the fizzle target drifted'

- id: "lp.burn_invocation_chain"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "A battle-destruction burn reaches the LP resolver as: cls1[cid] +04 resolver -> a gate -> 0x02206138 (computes the deltas via 0x02204D08, then applies them: 0x021CFBC8 damage / 0x021D0888 heal). For Armory Arm the cls1 record @0x0228B8C4 is cid 0x1F33 -> 0x022215DD, whose body calls gate 0x021D2C1C then 0x02206138."
  address: 0x02206138
  oracle: "ov3"
  sources: [otn-lp-change-table-burn]
  proof: |
    import struct
    rec = struct.unpack('<6I', h.bytes_at(0x0228B8C4, 24, 'ov3'))
    assert (rec[0] & 0xFFFF) == 0x1F33, f'cls1 record cid drifted: 0x{rec[0] & 0xFFFF:04X}'
    assert rec[1] == 0x022215DD, f'cls1 +04 resolver drifted: 0x{rec[1]:08X}'
    # inside 0x022215DC: gate then the LP applier
    assert h.bl_target(0x022215E2, 'ov3') == 0x021D2C1C, 'the gate call drifted'
    assert h.bl_target(0x022215EE, 'ov3') == 0x02206138, 'the LP-applier call drifted'
    # inside 0x02206138: the delta computation
    assert h.bl_target(0x02206140, 'ov3') == 0x02204D08, 'the LP-resolver call drifted'

- id: "lp.damage_wrapper_outside_resolvers"
  subsystem: "lp_change_burn"
  confidence: "VERIFIED"
  claim: "'TAKE N DAMAGE' OUTSIDE A RESOLVER = 0x021CFB8C(r0 = target side, r1 = amount, r2 = flag, r3 = source cid). It zeroes a 0x24 B stack descriptor (0x0209A080), writes desc[+0] = cid, desc[+2] = side ^ flag, desc[+3] = 5 when 0x02029E60(cid) == 0, then calls the resolver-side damage primitive 0x021CFBC8(desc, side, amount). flag 1 = the source is the OTHER player (burn), flag 0 = self-damage. Native non-resolver callers include Magical Thorn 0x1306 @0x02244CDC (flag 1) and leave-dispatcher arms 0x021C9E4E / 0x021CA2EC / 0x021CA80E. All 90 BL callers of 0x021CFBC8 were scanned 2026-09-14; the direct primitive wants a resolver descriptor in r0, so use the wrapper from hooks. Used by ss_commit_hook for Assault Synchron's 700 from the SS-commit site -- in-game confirmed by user 2026-09-14 (rom_assault_synchron.nds sha256 fbbf1701...fdf67bf)."
  address: 0x021CFB8C
  oracle: "ov3"
  sources: [notes/assault-synchron-findings.md]
  proof: |
    assert h.bytes_at(0x021CFB8C, 6, 'ov3') == bytes.fromhex('f0b589b0041c'), 'wrapper prologue drifted'
    assert h.bl_target(0x021CFB9C, 'ov3') == 0x0209A080, 'descriptor zeroing call moved'
    assert h.u16(0x021CFBA6, 'ov3') == 0x70A8, 'desc[+2] = side ^ flag store moved'
    assert h.u16(0x021CFBAA, 'ov3') == 0x802F, 'desc[+0] = cid store moved'
    assert h.bl_target(0x021CFBBE, 'ov3') == 0x021CFBC8, 'the wrapper no longer calls the primitive'
    assert h.bl_target(0x02244CDC, 'ov3') == 0x021CFB8C, 'Magical Thorn call site moved'
    assert h.u32(0x02244D04, 'ov3') == 0x1306, "Magical Thorn's source-cid literal moved"

