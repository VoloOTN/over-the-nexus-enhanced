  claim: "The NON-TUNER material gate hooks the `bl 0x0224829C` at 0x02248AAC -- the call the THIRD predicate makes into the inner one (synchro.third_pred_is_the_nontuner_caller). On entry the registers ARE the inner predicate's four arguments: r0 = the SYNCHRO's cid, r1/r2/r3 = arg1 (side/context) / arg2 (zone selector) / arg3 (index), and LR = 0x02248AB1. Deliberately NOT 0x022482B6: that site is already taken twice (boggart_knight owns 0x022482B2, shooting_quasar owns 0x022482B6, and the two chain into 0x022482BC), and a gate there runs for EVERY material of EVERY Synchro. A stub here must (a) call 0x0224829C itself and return its verdict UNCHANGED for every other Synchro, and (b) re-establish r1/r2/r3 on exit -- the inner predicate restores them from its own `push {r1-r7,lr}` and the third predicate may rely on that. REACHABILITY IS MEASURED, not assumed: Quasar's GDB trace of a material-selection sweep recorded 'verdict of 0x02248A88 = 0 x364 hits, while its INNER call returns 1' -- that inner call is this instruction."
