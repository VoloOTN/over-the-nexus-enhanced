- id: "synchro.no_percid_arm_without_a_nearby_literal"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** HOW TO CLOSE 'DOES THIS DONOR HAVE A PER-CID SYNCHRO-MATERIAL RULE?' WITHOUT A DUEL OR A SAVESTATE. *** A per-cid arm of the material predicates gets its key one of exactly two ways: a PC-relative pool literal EQUAL to the cid (which donor_scan.occurrences finds), or `base +/- imm8` off a pool literal (thumb.stack_based_switch, which stores no cid anywhere and so leaves donor_scan clean). Thumb-1's widest ADD/SUB immediate is 8 bits, so the second form can only reach a cid from a literal within 0xFF of it. ENUMERATING EVERY WORD-ALIGNED u32 IN THE PREDICATE SPAN 0x02248280-0x02249600 (INNER 0x0224829C, OUTER 0x022485B4, THIRD 0x02248A88 and their leaves) AND FINDING NONE WITHIN 0xFF THEREFORE CLOSES THE QUESTION for that cid -- it reaches the generic leaves. Measured 2026-09-22 (scratch/cid_reach_probe.py): Twin-Headed Thunder Dragon 0x120B -> 0 and Meteor B. Dragon 0x126F -> 0, and 0x126F's generic '1 Tuner + 1+ non-Tuner' rule is in-game confirmed (accel_synchro_stardust_dragon, 2026-09-14). Daigusto Sphreeze 0x24B3 -> 6, which is why junk_speeder's Sphreeze build needed a PART H to open its donor-exclusive 'Gusto' non-Tuner leaf 0x02249360. A vanilla Fusion donor scoring 0 needs NO material edit at all; absence from synchro.list_a and the min-3 list 0x02275AD8 is the whole rule. *** THE INFERENCE IS BACKED BY PLAY, NOT ONLY BY THE SCAN: *** 0x120B scored 0, junk_speeder therefore shipped with NO material edit on the non-Tuner side, and the user confirmed in-game 2026-09-22 that Junk Speeder Synchro Summons on a 'Synchron' Tuner plus ANY non-Tuner."
  address: 0x02248280
  oracle: "ov3"
  sources: [junk-speeder-redonor-findings, accel-synchro-stardust-dragon-findings]
  proof: |
    near = lambda c: [a for a in range(0x02248280, 0x02249600, 4)
                      if abs(h.u32(a, 'ov3') - c) <= 0xFF]
    assert near(0x120B) == [], f'0x120B gained a nearby literal: {near(0x120B)}'
    assert near(0x126F) == [], f'0x126F gained a nearby literal: {near(0x126F)}'
    assert len(near(0x24B3)) == 6, f'Sphreeze no longer scores 6: {near(0x24B3)}'
    assert h.u16(0x0224829C, 'ov3') and h.u16(0x022485B4, 'ov3'), 'INNER/OUTER moved'

