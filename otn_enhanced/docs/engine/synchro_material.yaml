- id: "synchro.material_embargo_deny_keys"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** \"CANNOT BE USED AS A SYNCHRO MATERIAL MONSTER\" IS A FIVE-KEY DENY LIST AT THE TAIL OF THE INNER PREDICATE, AND THE KEYS ARE CHAINED IN PAIRS -- WHICH IS WHAT CONSTRAINS WHICH DONOR CAN CLAIM ONE. *** The restriction is not an imperative call: it is a filter result. When a card negates the monster it summons, the engine attaches an effect node {key = the NEGATING card's cid, kind = 3} to the summoned monster's field slot, and the tail of INNER 0x0224829C (0x02248508..0x022485AE) walks five keys against that slot with the family-1 walker 0x021A1430 (attached_effect.two_walker_families), denying the candidate on a hit. Negate node and embargo rider are THE SAME OBJECT, so retargeting one key at a donor cid is the whole embargo -- pure DATA, no code hook, puzzle-safe. THE FIVE KEYS, disassembled 2026-09-10: key1 = pool word 0x02248560 = 0x225E Cherry Inmato (LDR @0x02248508); key2 = `ADD R5,#0x15` @0x0224851C = 0x2273 Chaos Goddess; key3 = pool word 0x02248564 = 0x237A Necro Linker (LDR @0x02248530); key4 = `SUB R5,#0x5B` @0x0224857A = 0x231F Wiseman's Chalice, checked with the OTHER walker 0x021A14E8 and r3=3; key5 = pool word 0x022485B0 = 0x24B5 Vylon Element (LDR @0x02248590), whose hit is CONDITIONAL -- it calls 0x02023ED4 (has_set_code pointer-table slot 0x56, list 0x0209CAD6 x 19 = \"Vylon\") and denies only when that returns 0, which is exactly Vylon Element's printed \"except for the Synchro Summon of a 'Vylon' monster\". Each of the three pool words has EXACTLY ONE referencing LDR in all of overlay 3. *** THE TRAP, AND THE REUSABLE RULE: ONLY THREE OF THE FIVE KEYS ARE POOL WORDS. Keys 2 and 4 are DERIVED from keys 1 and 3 by an 8-bit immediate, so retargeting key1 or key3 silently moves its PARTNER too, and the partner can only be repaired if the new donor cid is within an imm8 of the partner's cid. tour_guide's pre-2026-09-10 build could take key1 only because |0x2273 - 0x229E| = 0x2B fit `SUB R5,#0x2B`; a records-free Normal-Monster donor (0x0FC2) is 0x12B1 away from key2 and 0x135D from key4, and the pool 0x02248550..0x022485B0 is dense with every word referenced, so there is no spare slot to convert the derived instruction into a load. *** CONSEQUENCE: KEY 5 IS THE ONLY DONOR-INDEPENDENT SLOT, because it is the only key with no arithmetic successor. Claiming it costs one 4-byte pool retarget plus a 2-byte `BNE 0x022485AC` (0xD101) -> NOP (0x46C0) at 0x022485A6, which drops the Vylon set-code exception along with its owner and makes the deny unconditional. tour_guide claims key 5 as of 2026-09-10; keys 1-4 stay native and that module's verify() pins all four, so a second patch reaching for this predicate trips. *** THE WRITE SIDE IS REAL BUT IS NOT DONOR-PORTABLE -- MEASURED 2026-09-10, AND THE MOST EXPENSIVE THING THIS FACT RECORDS. The whole mechanism above is IN-GAME CONFIRMED BY THE USER on Tour Guide's original donor Synchron Explorer 0x229E (negate AND embargo both working). Re-homing that same patch onto the records-free Normal Monster Rock Ogre Grotto #1 0x0FC2 -- with a byte-identical cls1 record, a byte-identical criteria row and code-7 membership, differing ONLY in the cid -- SUMMONED CORRECTLY BUT ATTACHED NO NODE AT ALL: savestate forensics (scratch/tour_guide_state.py over rom_tour_guide.ml3) found the pool 0x0229D33C carrying one unrelated record and NO node keyed 0x0FC2, and the summoned monster was usable as Synchro Material in the duel. So SOMETHING ON THE WRITE PATH IS CID-GATED and a records-free donor does not satisfy it. *** DO NOT CONCLUDE FROM THAT FAILURE THAT THE MECHANISM IS WRONG -- I did, and wrote the retraction into this fact before the user corrected me; a failed port falsifies the PORT, not the mechanism it was ported from. *** ROOT CAUSE, FOUND THE SAME DAY AND FULLY MEASURED -- THE RIDER IS GATED BY TWO MEMBERSHIP LISTS, ONE PER SIDE OF THE MECHANISM. `donor_scan 0x229E` names three structures the port replicated (cls1 record[1189], criteria row[1183], code-7 summon list[81]) and THREE UNCLASSIFIED binding occurrences it did not; two of them ARE the gates. (1) THE WRITE SIDE is 0x0228F750, a sorted 0x2E-entry u16 list binary-searched at 0x0226806E inside the Special-Summon commit: `LDRH R0,[R4,#0x12]` (the SUMMONING card's cid); `LDR R1,=0x0228F750`; `MOV R2,#0x2E`; `BL 0x02022E14`; `BEQ` past everything on a miss; on a HIT `LDRH R2,[R4,#0x12]` (key = that same cid, read GENERICALLY -- no cid literal), `MOV R3,#3` (kind), `BL 0x021C479C` attaches the node. So the KEY is generic but WHETHER ANY NODE EXISTS is pure list membership, and a records-free donor is in no list -- which is why the savestate showed an empty pool. Its sibling 0x0228F708 x 0x24 at 0x0226808A attaches KIND 2 identically (Cherry Inmato 0x225E and Necro Linker 0x237A live there; Vylon Element 0x24B5 in the kind-3 list; Wiseman's Chalice 0x231F in BOTH, matching its two printed riders). (2) THE READ SIDE FOR THE NEGATE is 0x0226FAB4, a sorted 0x23-entry u16 list: 0x021EE402 walks the node pool 0x0229D33C, masks the kind to its low nibble, `CMP R1,#6 / BCS` (the family-1 range), then `LDRH R0,[R0,#0]` (the node's KEY), `LDR R1,=0x0226FAB4`, `MOV R2,#0x23`, `BL 0x02022E14`, and returns 1 -- 'this monster's effects are negated' -- only on a hit. THE READER HONOURS A HARDCODED KEY SET, exactly the shape of dispatch.level_rider_key_is_a_selector, except that here the set is a plain sorted list a donor can JOIN rather than a stack-based switch. (3) The third unclassified occurrence, 0x0226DBBC x 0x82 (single consumer 0x021AABC8 via 0x021EFE88), is the REVIVAL list -- Rekindling, Miracle's Wake, Damage Gate, Regretful Rebirth, Descending Lost Star. Synchron Explorer is in it because he Special Summons FROM THE GRAVEYARD; a hand/Deck summoner must stay OUT of it. *** SO THE PORT NEEDED TWO MORE COUNT-NEUTRAL DATA INSERTS AND NO CODE: the donor joins 0x0228F750 (its only phantom 0x0E4B) so a node is written, and joins 0x0226FAB4 (its only phantom 0x0E57) so the negate is