- id: "synchro.is_tuner_predicate"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "0x02023110(cid) = 'is this cid a TUNER' (ARM9, so resident in every duel mode). Body: t = 0x0202ABF8(cid) (card_type >> 1, dispatch.card_type_reader); t -= 15; t > 5 -> return 0; else a BYTE jump table at 0x02023128 (04 04 08 08 04 04) over pc = 0x0202312A, so card_type>>1 in {15,16,19,20} -> 0x0202312E `movs r0,#1` (Normal Tuner / Tuner / Synchro Tuner) and {17,18} -> 0x02023132 `movs r0,#0` (plain Synchro). The RUNTIME wrapper is 0x021A1C7C(side, idx): it reads the material's cid from 0x0229AC94 + 0xB3C*(side&1) + 0x14*idx + 0x34, tries 0x02023110, then falls back to the kind<6 attached-node walker 0x021A1430(side, idx, 0x1E40) -- i.e. 'is a Tuner statically OR by an attached rider'. There is NO 'treated as a non-Tuner' path, which is why a Normal Tuner can never arrive on the non-Tuner material path."
  address: 0x02023110
  oracle: "arm9"
  sources: [azure-eyes-silver-dragon-findings]
  proof: |
    assert h.bytes_at(0x02023110, 10, 'arm9') == bytes.fromhex('08b507f071fd0f380528'), \
        'is-Tuner predicate drifted'
    assert h.bytes_at(0x02023128, 6, 'arm9') == bytes.fromhex('040408080404'), \
        'is-Tuner jump table drifted'
    # decode the table the way the code does: target = 0x0202312A + s8-extended byte
    tgt = {t: 0x0202312A + h.u8(0x02023128 + t, 'arm9') for t in range(6)}
    assert [t for t in range(6) if tgt[t] == 0x0202312E] == [0, 1, 4, 5], \
        'the set of Tuner card-type codes changed'
    assert h.bl_target(0x021A1CA0, 'ov3') == 0x02023110, 'wrapper no longer calls it'

- id: "synchro.material_cid_lookup_is_pure"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "0x0219CAE4(arg1, arg2, arg3) -> the MATERIAL's cid, and it is PURE, so a hook may call it a second time to recover the cid the inner predicate derived. It is what the inner predicate itself calls at 0x022482AC to produce r4. Shape: r1 - 0xB <= 4 picks a 5-arm jump table, else the default arm at 0x0219CB82; EVERY arm is one masked table read -- 0x0229AC94 + 0xB3C*(arg1&1) + <zone off> + arg3*4 (zone offsets 0x124, 0x304, 0x4E4 = the Extra Deck, 0x55C, 0x7B4) or + 0x14*idx + 0x34 -- followed by `lsls #0x12 / lsrs #0x12` (mask to 18 bits) and `pop {r4,pc}`. PURITY IS THE POINT: there is not one store instruction in the whole function."
  address: 0x0219CAE4
  oracle: "ov3"
  sources: [azure-eyes-silver-dragon-findings]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    assert h.bytes_at(0x0219CAE4, 8, 'ov3') == bytes.fromhex('10b50c1c0b3c2e4b'), \
        'material-cid lookup prologue drifted'
    # no STORE anywhere in 0x0219CAE4..0x0219CBA4: Thumb-1 stores are STR/STRH/STRB
    # imm5 (0x6000/0x8000/0x7000 groups, bit 11 clear), STR reg (0x5000-0x5600) and
    # STR Rd,[SP,#imm] (0x9000-0x97FF).
    stores = []
    for a in range(0x0219CAE4, 0x0219CBA4, 2):
        w = struct.unpack_from('<H', img, a - base)[0]
        top = w & 0xF800
        if top in (0x6000, 0x7000, 0x8000) or (w & 0xFE00) in (0x5000, 0x5200, 0x5400):
            stores.append(a)
        elif top == 0x9000:
            stores.append(a)
    assert not stores, f'0x0219CAE4 is no longer pure: stores at {[hex(x) for x in stores]}'
    assert h.bl_target(0x022482AC, 'ov3') == 0x0219CAE4, \
        'the inner predicate no longer derives the material cid from it'

