- id: "synchro.named_material_table"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** A SYNCHRO'S NAMED MATERIAL ('\"Junk Synchron\" + 1 or more non-Tuner monsters') IS ONE 4-BYTE DATA ROW, NOT CODE. *** 0x02275B04 is a table of 23 rows x 4 B, {u16 synchro_cid, u16 named_material_cid}, STRICTLY ASCENDING and BINARY-SEARCHED. OUTER 0x022485B4 reads it: `ldr r1,=0x02275B04` @0x02248608, `movs r2,#0x17` (count 23) @0x0224860C, `movs r3,#4` (stride) @0x0224860E, `bl 0x02022E44` @0x02248610; `beq 0x02248660` @0x02248618 sends a MISS to the generic per-Synchro cid switch. On a HIT the leaf accepts iff the material's cid equals [row+2] (`ldrsh r0,[row,#2] ; cmp r4,r0` @0x0224864E), with ONE substitution arm @0x02248636: if the material is QUICKDRAW SYNCHRON 0x20F7 it is accepted whenever the NAMED cid is itself a 'Synchron' (has_set_code 0x4C via 0x02023E1C) -- which is the correct real-world ruling and comes free. Junk Warrior 0x1E10 is row 1 = {0x1E10, 0x1E07} and that row is its ENTIRE material rule: it is absent from LIST_A, from the min-3 list and from the 2-leading-Tuner pair, and has no arm in the OUTER switch. THE TABLE SHIPS WITH EXACTLY ONE PHANTOM, row 22 = {0x2524, 0x1E07} (0x2524 = Junk Berserker's real Konami id, no card_prop record here), so a donor can claim a named material with a count-neutral SORTED insert -- sortedness is mandatory, the search is binary. *** THIS ALSO CORRECTS junk_speeder.py:236-243, which calls Quickdraw Synchron's restriction 'a NINE-CID WHITELIST inside INNER 0x0224829C'. There is no whitelist: INNER's arm @0x022483CC binary-searches THIS SAME TABLE and then requires the named cid to be a Synchron. The nine cids that session measured are exactly the rows whose named cid is a Synchron -- the measurement was right, the mechanism description was not. *** IN-GAME CONFIRMED as the mechanism by card.jet_warrior_clauses_0_and_1, whose negative control (a different Level 1 Tuner is REFUSED) is what proves the row is actually read."
  address: 0x02275B04
  oracle: "ov3"
  sources: [jet-warrior-findings, otn-synchro-material-machinery]
  proof: |
    import struct
    img, b = env.image('ov3'), env.base('ov3')
    rows = [struct.unpack_from('<2H', img, 0x02275B04 - b + i * 4) for i in range(23)]
    keys = [r[0] for r in rows]
    assert all(keys[i] < keys[i + 1] for i in range(22)), \
        'named-material table is not strictly ascending -- the binary search would break'
    assert rows[1] == (0x1E10, 0x1E07), f'Junk Warrior row 1 drifted: {rows[1]}'
    assert rows[22] == (0x2524, 0x1E07), f'the lone phantom row 22 drifted: {rows[22]}'
    assert sum(1 for k in keys if k == 0x2524) == 1, 'phantom 0x2524 is not unique'
    enc = h.u16(0x02248608, 'ov3')
    assert enc >> 11 == 0b01001, f'0x02248608 is not an LDR literal: {enc:#06x}'
    pool = ((0x02248608 + 4) & ~3) + (enc & 0xFF) * 4
    assert h.u32(pool, 'ov3') == 0x02275B04, 'OUTER no longer loads the table base'
    assert h.u16(0x0224860C, 'ov3') == 0x2217, 'count immediate (movs r2,#0x17) drifted'
    assert h.u16(0x0224860E, 'ov3') == 0x2304, 'stride immediate (movs r3,#4) drifted'
    assert h.bl_target(0x02248610, 'ov3') == 0x02022E44, 'not the binary search'
    assert h.bl_target(0x022483D4, 'ov3') == 0x02022E44, \
        'INNER 0x022483CC no longer binary-searches the same table'
    # the three exception lists are adjacent and must not be confused with this one
    assert 0x02275AB8 + 16 * 2 == 0x02275AD8, 'LIST_A no longer abuts the min-3 list'
    assert 0x02275AD8 + 21 * 2 == 0x02275B02, 'min-3 list no longer abuts the pad'
    assert h.u16(0x02275B02, 'ov3') == 0, 'the 2-byte pad before the table is not zero'

- id: "synchro.no_cid_whitelist"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** THERE IS NO LIST OF 'CIDS THAT MAY BE SYNCHRO SUMMONED'. A NEW SYNCHRO NEEDS NO INSERT ANYWHERE -- AND ADDING IT TO THE WRONG LIST BREAKS ITS PRINTED TEXT. *** Every per-cid structure on the Synchro path is an OPT-IN EXCEPTION LIST, and the generic arms accept: (1) the per-Synchro switch 0x02249D1C names only 0x208E / 0x211B / 0x21CB / 0x239D / 0x239F, and every other cid falls to the DEFAULT arm 0x02249D66, which is an ACCEPT path -- it rejects only a Tuner sitting in a non-Tuner slot (`bl 0x02023110 ; cmp r0,#0 ; beq <accept>`); (2) the material-rule switch 0x02248A88 contains 20 BLs to the ACCEPT leaf 0x022494C4 (`movs r0,#1 ; add sp,#0x10 ; pop {r3-r7,pc}`) against exactly ONE to the reject leaf 0x0224948C, i.e. every unlisted cid falls through to accept; (3) 0x02275AD8 is a 21-entry u16 list meaning 'this Synchro needs >= 3 materials' (0x02248248 returns 3 on a hit, 2 on a miss); (4) LIST_A 0x02275AB8 is the 16-entry 'EXACT, extras forbidden' list, which ENDS exactly where 0x02275AD8 begins; (5) 0x02248280 demands 2 leading Tuners for 0x239F and 0x24B2 only. *** SO A CID IN NONE OF THEM GETS: minimum 2 materials, 1 Tuner, generic material rules == the printed '1 Tuner + 1+ non-Tuner monsters', for free. *** AND THE TRAP: membership of LIST_A is what turns '1+' into 'exactly 1' (synchro.list_a), so adding a new generic Synchro there ACTIVELY BREAKS its text. The correct action for a new Synchro donor is to add it to NOTHING and assert the absences instead -- which is what accel_synchron.verify does."
  address: 0x02249D1C
  oracle: "ov3"
  sources: [notes/accel-synchron-findings.md, otn_enhanced/cards/accel_synchron.py]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    # (1) the default arm of the per-Synchro switch is an ACCEPT path
    assert h.bl_target(0x02249D74, 'ov3') == 0x02023110, \
        'the default arm no longer calls is_tuner'
    assert h.u16(0x02249D78, 'ov3') == 0x2800, 'default arm: no cmp r0,#0'
    assert h.u16(0x02249D7A, 'ov3') == 0xD007, 'default arm: no beq to the accept path'
    # (2) count the accept/reject BLs inside the material-rule switch
    def bl_at(a):
        hw, lw = struct.unpack_from('<HH', img, a - base)
        if (hw & 0xF800) != 0xF000 or (lw & 0xF800) != 0xF800: return None
        imm = ((hw & 0x7FF) << 12) | ((lw & 0x7FF) << 1)
        if imm & (1 << 22): imm -= (1 << 23)
        return a + 4 + imm
    acc = sum(1 for a in range(0x02248A88, 0x0224948C, 2) if bl_at(a) == 0x022494C4)
    rej = sum(1 for a in range(0x02248A88, 0x0224948C, 2) if bl_at(a) == 0x0224948C)
    assert (acc, rej) == (20, 1), f'accept/reject balance changed: {acc}/{rej}'
    assert h.u16(0x022494C4, 'ov3') == 0x2001, '0x022494C4 is not movs r0,#1 (accept)'
    assert h.u16(0x0224948C, 'ov3') == 0x2000, '0x0224948C is not movs r0,#0 (reject)'
    # (3)+(4) the two adjacent lists, and their exact stock contents
    LIST_A = tuple(h.u16_table(0x02275AB8, 16, 'ov3'))
    MIN3 = tuple(h.u16_table(0x02275AD8, 21, 'ov3'))
    assert 0x02275AB8 + 16 * 2 == 0x02275AD8, 'LIST_A no longer abuts the min-3 list'
    assert LIST_A == (0x0E6C, 0x2004, 0x208B, 0x211B, 0x219B, 0x219D, 0x21CB,
                      0x22A3, 0x239D, 0x239E, 0x239F, 0x2400, 0x2401, 0x24B2,
                      0x2525, 0x2526), 'LIST_A contents drifted'
    assert MIN3 == (0x1D7D, 0x1DFF, 0x1F25, 0x208C, 0x20E1, 0x211B, 0x211C,
                    0x2181, 0x21CB, 0x221C, 0x2273, 0x239F, 0x241F, 0x2420,
                    0x2471, 0x2472, 0x2473, 0x2476, 0x24B2, 0x252A, 0x252B), \
        'the min-3-materials list drifted'
    # (5) only two cids need two leading Tuners
    assert (h.u32(0x02248294, 'ov3'), h.u32(0x02248298, 'ov3')) == (0x239F, 0x24B2), \
        'the 2-leading-Tuner cids changed'
    # the first Fusion-donor Synchro is absent from all of them, by construction
    assert 0x11A3 not in LIST_A and 0x11A3 not in MIN3, \
        'the accel_synchron donor is no longer absent from the exception lists'

