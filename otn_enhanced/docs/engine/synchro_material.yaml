- id: "synchro.third_pred_is_the_nontuner_caller"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** THE THIRD material predicate 0x02248A88 IS THE NON-TUNER CALLER, AND THAT IS HOW YOU RESTRICT ONLY THE NON-TUNER MATERIALS OF A SYNCHRO. *** The subsystem is CLOSED over one driver: a BL-scan of the whole ov3 image shows the INNER predicate 0x0224829C has EXACTLY TWO callers -- 0x022485D8 (inside the OUTER predicate 0x022485B4) and 0x02248AAC (inside the THIRD predicate 0x02248A88) -- while OUTER is called only from 0x02249CC8/0x02249D12 and THIRD only from 0x02249C98/0x02249D96, all four inside the driver 0x02249C60..0x02249DA0. The driver sends the TUNER to OUTER and every NON-TUNER to THIRD. Branch FALSE (0x02249CD4, the live path for every ordinary Synchro): N = 0x02248280(synchro); material index < N must satisfy 0x021A1C7C != 0 (IS a Tuner) -> OUTER; index >= N goes to the per-Synchro switch 0x02249D1C whose GENERIC arm 0x02249D66 requires 0x021A1C7C == 0 / 0x02023110 == 0 (NOT a Tuner) -> THIRD. Branch TRUE (0x02249C78): index 0 requires 0x021A1C7C == 0 -> THIRD, index 1 requires 0x02023138 != 0 -> OUTER, any other index is rejected. So in BOTH branches THIRD is entered only after the engine has already PROVED the material is not a Tuner; the only edges into `bl 0x02248A88` that skip the Tuner check are four hardcoded per-Synchro shortcuts (cids 0x208E, 0x21CB, 0x239D, 0x239F and 0x211B). A gate inside THIRD is therefore non-Tuner-only BY CONSTRUCTION -- no GDB, no LR sniffing at 0x022482B6, and no need for the 'accept Tuner OR Normal' over-approximation. This is what carries 'N non-Tuner <TYPE> Monsters' clauses; see card.azure_eyes_silver_dragon PART F."
  address: 0x02248A88
  oracle: "ov3"
  sources: [azure-eyes-silver-dragon-findings, otn-synchro-material-machinery]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    def bl_callers(target):
        out = []
        for a in range(base, base + len(img) - 4, 2):
            o = a - base
            hw, lw = struct.unpack_from('<HH', img, o)
            if (hw & 0xF800) == 0xF000 and (lw & 0xF800) == 0xF800:
                imm = ((hw & 0x7FF) << 12) | ((lw & 0x7FF) << 1)
                if imm & (1 << 22): imm -= (1 << 23)
                if a + 4 + imm == target: out.append(a)
        return out
    assert bl_callers(0x0224829C) == [0x022485D8, 0x02248AAC], 'inner predicate callers moved'
    assert bl_callers(0x022485B4) == [0x02249CC8, 0x02249D12], 'outer predicate callers moved'
    assert bl_callers(0x02248A88) == [0x02249C98, 0x02249D96], 'third predicate callers moved'
    # the two driver Tuner-gates: `bl 0x021A1C7C` immediately before each THIRD call
    assert h.bl_target(0x02249C84, 'ov3') == 0x021A1C7C, 'branch-TRUE Tuner gate moved'
    assert h.bl_target(0x02249D82, 'ov3') == 0x021A1C7C, 'generic-rule Tuner gate moved'
    # and the third predicate itself still has its known prologue
    assert h.bytes_at(0x02248A88, 8, 'ov3') == bytes.fromhex('f8b584b0051c101c'), \
        'third predicate prologue drifted'

