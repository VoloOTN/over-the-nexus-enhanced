- id: "synchro.hand_branch_has_no_duplicate_check"
  subsystem: "synchro_material"
  confidence: "VERIFIED"
  claim: "*** THE VALIDATOR'S HAND BRANCH NEVER CHECKS WHETHER THE HAND CARD IS ALREADY A PICK. *** The field path rejects a slot whose ref is already in the pick list (loop 0x02249BC2-0x02249BDC over 0x0229AA58), but the hand branch (0x02249BE0 .. accept 0x02249DA0) never branches into that loop -- harmless natively because Eccentric Boy / Parallel Gear allow exactly ONE hand pick (`cmp r0,#1` @0x02249BF0). Any hand mode with 2+ hand picks must add its own ref check (mara compares the hand ref with pick 1). The ref space matches: the field loop compares the list u16 with ((w>>23 & 0xFF)<<1) + (w>>14 & 1), the same decode the hand branch applies to player+0x124[idx]."
  address: 0x02249BE0
  oracle: "ov3"
  sources: [notes/mara-findings.md]
  proof: |
    import capstone
    img = h.bytes_at(0x02249BE0, 0x02249DA2 - 0x02249BE0, 'ov3')
    md = capstone.Cs(capstone.CS_ARCH_ARM, capstone.CS_MODE_THUMB)
    tg = [int(i.op_str[1:], 16) for i in md.disasm(img, 0x02249BE0)
          if i.mnemonic.startswith('b') and i.op_str.startswith('#')]
    assert tg, 'no branches decoded in the hand branch'
    assert not [t for t in tg if 0x02249BB6 <= t <= 0x02249BDE], 'hand branch now reaches the dup loop'
    assert h.u16(0x02249BD2, 'ov3') == 0x429A, 'field dup loop: cmp r2,r3 drifted'
    assert h.u16(0x02249BF0, 'ov3') == 0x2801, 'hand branch: cmp count,#1 drifted'

