- id: "handss.banish_cost_leaf"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "The 'Special Summon this card from your hand by banishing monster(s) from your GY' family lives in the hand-SS cid tree as a contiguous cluster at 0x0225E88x-0x0225E8DE with the compare base held in R7 = 0x16C6 (Fenrir), and it splits into exactly TWO leaves: 0x0225FA36 (single attribute) reached by Inferno 0x16C5 / Fenrir 0x16C6 / Gigantes 0x16C7 / Silpheed 0x16C8, and 0x0225FA46 (LIGHT + DARK, i.e. TWO different demanded cards) reached by Chaos Sorcerer 0x16C9, Black Luster Soldier - Envoy of the Beginning 0x16CB and Chaos Emperor Dragon - Envoy of the End 0x16E4. 0x0225FA46 is generic in the cid: it takes NO cid-specific constant, and instead runs two identical passes — `strh 0,[g+0x28]` then 0x02243FE0(side, cid, 0), and `strh 1,[g+0x28]` then 0x02243FE0(side, cid, 1) — each comparing the criteria-registry hit count against the required count from 0x0225CF28(cid), clearing the r7 result flag on a shortfall. The per-card data therefore lives ENTIRELY in the criteria rows (see dispatch.multi_attribute_summon_cost_is_multiple_rows) plus the count from 0x0225CF28. CONSEQUENCE: reaching 0x0225FA46 with a donor cid + two criteria rows is the whole of a 'banish 1 LIGHT and 1 DARK from GY' summon condition. NOTE 0x0225CF28 is itself a per-cid switch (code, not a table); whether it has a usable fall-through default for an unnamed cid is NOT established — see handss.banish_cost_count_default."
  address: 0x0225FA46
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # the cluster's compare base really is Fenrir, and the two leaves are where claimed
    assert h.u16(0x0225E8B0, 'ov3') == 0x1CF8, 'add r0,r7,#3 (Chaos Sorcerer) drifted'
    assert h.u16(0x0225E8CE, 'ov3') == 0x1D78, 'add r0,r7,#5 (BLS-Envoy) drifted'
    assert h.u16(0x0225E8DA, 'ov3') == 0x371E, 'add r7,#0x1e (CED) drifted'
    assert h.bl_target(0x0225E8E0, 'ov3') == 0x0225FA46, 'LIGHT+DARK leaf retargeted'
    assert h.bl_target(0x0225E98E, 'ov3') == 0x0225FA36, 'single-attribute leaf retargeted'
    # 0x0225FA46 runs pass 0 then pass 1 through the criteria registry, no cid constant
    assert h.bl_target(0x0225FA74, 'ov3') == 0x02243FE0, 'pass-0 enumerator retargeted'
    assert h.bl_target(0x0225FA94, 'ov3') == 0x02243FE0, 'pass-1 enumerator retargeted'
    assert h.u16(0x0225FA6A, 'ov3') == 0x2100, 'pass index 0 store drifted'
    assert h.u16(0x0225FA8A, 'ov3') == 0x2101, 'pass index 1 store drifted'
    assert h.bl_target(0x0225FA7C, 'ov3') == 0x0225CF28 and \
           h.bl_target(0x0225FA9C, 'ov3') == 0x0225CF28, 'required-count call retargeted'

- id: "handss.banish_cost_count_default"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "RESOLVED 2026-08-13 (was UNVERIFIED): 0x0225CF28(cid) returns the NUMBER of cards a banish-cost summon demands PER CRITERIA ROW, and THE UNNAMED-CID FALL-THROUGH IS 0 — leaf 0x0225D09C = `movs r0,#0 ; bx lr`, reached by an UNCONDITIONAL `b` at 0x0225CF5E and shared by 6110 of the 6144 cids in 0x0E00..0x2600. Simulating the whole tree validates itself against the printed cards: Fenrir 0x16C6 -> 2 ('banishing 2 WATER monsters'), the Chaos family 0x16C9/0x16CB/0x16E4 -> 1, Inferno/Gigantes/Silpheed -> 1, Dark Necrofear 0x1466 -> 3, Rainbow Dark Dragon 0x1CEE -> 7. CONSEQUENCE — A COUNT OF 0 IS NOT HARMLESS: leaf 0x0225FA46 tests `found >= need` once per pass, so with need = 0 BOTH passes succeed vacuously and a donor could Special Summon itself from hand banishing NOTHING, even from an empty Graveyard. A banish-cost donor therefore needs this value fixed. EVERY cid with a legitimately nonzero count is >= 0x1466 (the lowest is Dark Necrofear itself), and no cid < 0x1483 reaches a banish-cost leaf (0x0225FA36/0x0225FA46), so retargeting 0x0225CF5E at the return-1 leaf 0x0225D06A changes the OBSERVABLE count for no existing card — the route lightpulsar takes. The other callers (0x0225D0D8, 0x0225F678, 0x0226295A, 0x02264814) all read the cid out of the live summon record (`ldrh r0,[r4,#0xe]`), i.e. only run for a card actually performing this summon. NOTE this was derived by a register-only simulation, which is sound HERE because the path to the fall-through touches no stack slot and ends in an unconditional branch (thumb.stack_switch's footgun applies to the jump-table arm at 0x0225CF60, which this path never enters)."
  address: 0x0225CF28
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # the fall-through leaf really is `movs r0,#0 ; bx lr`, and the branch to it
    assert h.u16(0x0225D09C, 'ov3') == 0x2000, 'return-0 leaf is not movs r0,#0'
    assert h.u16(0x0225D09E, 'ov3') == 0x4770, 'return-0 leaf does not bx lr'
    assert h.u16(0x0225D06A, 'ov3') == 0x2001, 'return-1 leaf is not movs r0,#1'
    assert h.u16(0x0225D06C, 'ov3') == 0x4770, 'return-1 leaf does not bx lr'
    # the unmatched arm reaches it by an unconditional B (0xE0xx), not a conditional
    br = h.u16(0x0225CF5E, 'ov3')
    assert (br & 0xF800) == 0xE000, f'0x0225CF5E is no longer an unconditional B: {br:#06x}'
    assert 0x0225CF5E + 4 + (((br & 0x7FF) ^ 0x400) - 0x400) * 2 == 0x0225D09C, \
        'the fall-through no longer lands on the return-0 leaf'
    # and the node that routes an unnamed low cid there is the 0x1466 compare
    assert h.u32(0x0225D0A8, 'ov3') == 0x1466, 'the Dark Necrofear literal moved'

- id: "handss.summon_procedure_registry"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "THE TABLE THAT DECIDES WHETHER A SPECIAL SUMMON COSTS ANYTHING — and the single biggest trap in giving a donor an alternative summon procedure. THE HAND-SS TREE DOES NOT SELECT A COST: its success leaf 0x0225F216 is literally `movs r0,#4 ; orrs r5,r0`, i.e. it only sets BIT 2 OF A BITMASK meaning 'this card can be Special Summoned from the hand'. WHICH cost to pay comes from a separate per-cid registry at 0x0228F158 — {u32 cid, u32 handler}, stride 8, 133 rows, STRICTLY sorted, binary-searched by the generic 0x02022E44 from BOTH 0x02264DAE and 0x022651C0, with the row count a hard-coded imm8 (`movs r2,#0x85`) in BOTH searchers. On a miss the caller takes `beq 0x02264DC2` and the card is summoned by the GENERIC path — i.e. FOR FREE. The whole banish-cost family (Inferno 0x16C5, Fenrir 0x16C6, Gigantes 0x16C7, Silpheed 0x16C8, Chaos Sorcerer 0x16C9, BLS-Envoy 0x16CB, CED 0x16E4, plus Dark Necrofear 0x1466 and the four Spirits 0x1483-0x1487) maps to handler 0x0226292D, the payment state machine of handss.banish_cost_payment_dispatches. 0x02261F8D is the registry's 'no special procedure' handler — the second searcher tests for it explicitly at 0x022651D4 — and is what all 16 phantom rows carry, so those rows are the count-neutral drop candidates. PROVEN THE HARD WAY: a donor given the hand-SS route, criteria rows, membership entry and required count but NO REGISTRY ROW offers the Special Summon correctly (gated on the GY contents) and then performs it WITHOUT PAYING — confirmed in-game twice, and pinned by savestate: the summon record 0x02298A28 had +0x0E == the donor cid while +0x28 (pass index) stayed 0 and +0x24 ended at 0x17, i.e. the payment machine (states 0..4) never ran. ⚠️ The region holds TWO adjacent sorted {cid,handler} tables — 0x0228EFE8..0x0228F158 (44 rows) and this one — with exactly one descent between them at 0x0228F158; do not treat them as a single array."
  address: 0x0228F158
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    BASE, CNT, STRIDE = 0x0228F158, 0x85, 8
    rows = [(h.u32(BASE + i * STRIDE, 'ov3'), h.u32(BASE + i * STRIDE + 4, 'ov3'))
            for i in range(CNT)]
    cids = [c for c, _ in rows]
    assert all(cids[i] < cids[i + 1] for i in range(CNT - 1)), \
        'the summon-procedure registry lost its strict sort (binary search precondition)'
    # both searchers still agree on the row count (a bare imm8 `movs r2,#0x85`)
    for lit in (0x02264DB0, 0x022651C2):
        assert h.u16(lit, 'ov3') == (0x2200 | CNT), \
            f'row-count immediate at {lit:#x} changed'
    assert h.u32(0x02265090, 'ov3') == BASE, 'searcher-1 base literal moved'
    assert h.u32(0x022653D8, 'ov3') == BASE, 'searcher-2 base literal moved'
    assert h.bl_target(0x02264DB4, 'ov3') == 0x02022E44, 'the binary search retargeted'
    # the banish-cost family still maps to the payment state machine
    m = dict(rows)
    for cid in (0x16C5, 0x16C6, 0x16C7, 0x16C8, 0x16C9, 0x16CB, 0x16E4, 0x1466):
        assert m.get(cid) == 0x0226292D, \
            f'{cid:#06x} no longer maps to the banish-cost payment handler'
    # and the hand-SS success leaf really is just a bitmask OR, not a cost selector
    assert h.u16(0x0225F216, 'ov3') == 0x2004 and h.u16(0x0225F218, 'ov3') == 0x4305, \
        '0x0225F216 is no longer `movs r0,#4 ; orrs r5,r0`'

- id: "handss.banish_cost_payment_dispatches"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "A BANISH-COST SUMMON IS NOT ONE DISPATCH BUT THREE, AND LEGALITY IS SEPARATE FROM PAYMENT. Learned the hard way 2026-08-13: a donor given the legality half only (hand-SS route + criteria rows + required count) Special Summons itself IN-GAME WITHOUT BANISHING ANYTHING. The payment is a state machine on [rec+0x24] where rec = the summon record 0x02298A28 and [rec+0x28] is the PASS INDEX — the same value the legality leaf 0x0225FA46 mirrors into the criteria-row `param`. Its two per-cid dispatches are:
  (1) ROOT 0x02262962 — selects r5 = HOW MANY CARDS TO SELECT this pass. Family arm 0x02262A5A = `movs r5,#2` (or 1 while [rec+0x28] == 0). Reached by exactly 5 cids, ALL REAL CARDS: 0x16C9 0x16CB 0x16E4 0x1BC8 0x1BC9. Everything else (6378 cids, incl. any donor) falls to the default 0x02262AAE, which sets up NO selection.
  (2) ROOT 0x02262C24 — THE TWO-PASS DRIVER. Family arm 0x02262C8C does `[rec+0x28] += 1` and, if the OLD index was 0, `[rec+0x24] = 4` i.e. GO ROUND AGAIN. THIS IS THE ONLY THING THAT MAKES THE SECOND (DARK) PASS HAPPEN. A donor routed to the default 0x02262CA4 finishes after one pass.
The other two 0x0225CF28 callers need NOTHING — they are cid-generic: 0x0225F678 is a single-pass count check and 0x02264814 is the 'how many must you banish' prompt, which merely consumes 0x0225CF28's return. Bounded by scanning ov3 for every literal holding a family cid and every PC-relative load of one: 28 sites total, only 0x02262974 and 0x02262C26/0x02262C2E in the payment region. ⚠️ HOOK THE ROOTS, NOT THE ARMS: 0x02262C8C's 'both passes done' path branches to 0x02262CA4, so a cid test placed at 0x02262CA4 sends the donor back to 0x02262C8C FOREVER. ⚠️ Only r2 is safe to clobber (a scratch compare register in both, never an argument) — except on dispatch 2's `bgt` path, where 0x02262C5E does `adds r1,r2,#0` and requires r2 == 0x1BC8, so a stub there must replay the displaced ldr/cmp and return via `push {r2}` / `pop {pc}` to preserve both the flags and r2."
  address: 0x02262962
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # dispatch 1: the family's two-card arm and the default
    assert h.u16(0x02262A5A, 'ov3') == 0x8D20, 'pay-1 family arm head changed'
    assert h.u16(0x02262A5C, 'ov3') == 0x2502, 'pay-1 family arm no longer movs r5,#2'
    # dispatch 2: the pass-index increment and the go-round-again store
    assert h.u16(0x02262C8C, 'ov3') == 0x8D21, 'pay-2 family arm head changed'
    assert h.u16(0x02262C8E, 'ov3') == 0x1C48, 'pay-2 no longer increments the pass index'
    assert h.u16(0x02262C96, 'ov3') == 0x2004 and h.u16(0x02262C98, 'ov3') == 0x84A0, \
        'pay-2 no longer writes state 4 (the second pass would never run)'
    # the shared completion arm both the family and the default reach (the loop trap)
    assert h.u16(0x02262C94, 'ov3') == 0xD106, 'pay-2 completion branch changed'
    # dispatch 2's bgt path really does consume r2
    assert h.u16(0x02262C5E, 'ov3') == 0x1C11, '0x02262C5E no longer reads r2'
    # the family literals that anchor both dispatches
    assert h.u32(0x02262BC4, 'ov3') == 0x16CB, 'pay-1 family literal moved'
    assert h.u32(0x02262CB4, 'ov3') == 0x1BC8, 'pay-2 base literal moved'
    assert h.u32(0x02262CB8, 'ov3') == 0x16E4, 'pay-2 CED literal moved'

- id: "handss.dispatch_dead_arms"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "THE HAND-SS DISPATCH IS A CID-ORDERED BST ROOTED AT 0x0225E622 (entry 0x0225E51C, r6 = side, r4 = cid taken from the packed word's low 14 bits), and FOUR OF ITS ARMS ARE DEAD — every cid that reaches them is a PHANTOM (absent from the ROM's 4305-cid name map, so it has no card_prop and can never be in a deck, hand, field or GY):
    BL site     leaf         reaching cids
    0x0225E67C  0x0225F33A   0x0E18, 0x0EA5
    0x0225E692  0x0225F26E   0x0E3F
    0x0225E6E6  0x0225F7EC   0x0E1F, 0x0ECA   <- taken by lightpulsar
    0x0225E88E  0x0225F240   0x164C
CONSEQUENCE: a donor can be routed to ANY leaf for THREE BYTES and NO CODE CAVE, by repointing a dead arm's compare immediate and its BL. Because it is pure in-place overlay-3, an effect built this way ALSO WORKS IN PUZZLES — where ov5 is evicted by ov41 and a BL into the cave would freeze (mem.ov5_ov41_share_base). The node shape is `adds r0,#imm8 ; cmp r4,r0 ; bne <reject> ; bl <leaf>`, so THE COMPARE IS base + imm8 AND THE DONOR CID MUST LIE WITHIN 0xFF OF THAT BASE — for 0x0225E6E0 the base is 0x0EB3, giving the window 0x0EB4..0x0FB2 (this is what disqualified the recon's Armored Lizard 0x0FD9 and selected Sword Arm of Dragon 0x0FB1). ⚠️ The LEAVES are not dead, only the ARMS into them: 0x0225F7EC is still reached from 0x0225EBE2 and 0x0225EE22 by real cards 0x1B71/0x1CA7/0x1F44 — never overwrite the leaf body. ⚠️ CORRECTED 2026-08-17: this entry used to end 'Three arms remain unclaimed; Darkflare Dragon is meant to take one', which reads as though the three were interchangeable. THEY ARE NOT — see handss.dead_arm_donor_windows. Two of them can only ever be aimed at Speed Spells, so 0x0225E88E was the LAST arm a monster could use and Darkflare took it."
  address: 0x0225E6E0
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # each dead arm still has the shape `adds r0,#imm8 / cmp r4,r0 / bne / bl <leaf>`
    assert h.u16(0x0225E6E0, 'ov3') == 0x30FE or h.u16(0x0225E6E0, 'ov3') == 0x3017, \
        'the 0x0225E6E0 arm is neither the native +0x17 nor the Lightpulsar +0xFE'
    assert h.u16(0x0225E6E2, 'ov3') == 0x4284, 'the arm no longer compares r4,r0'
    # the other three dead arms, as they stand in the COMMITTED CLEAN ov3 image
    # (0x0225E88E is Darkflare's in a built ROM; the oracle here is the base image)
    assert h.bl_target(0x0225E67C, 'ov3') == 0x0225F33A, 'dead arm 0x0225E67C moved'
    assert h.bl_target(0x0225E692, 'ov3') == 0x0225F26E, 'dead arm 0x0225E692 moved'
    assert h.bl_target(0x0225E88E, 'ov3') == 0x0225F240, 'dead arm 0x0225E88E moved'
    # the leaf 0x0225F7EC is NOT dead -- other, live arms reach it
    assert h.bl_target(0x0225EBE2, 'ov3') == 0x0225F7EC, 'live arm into 0x0225F7EC moved'
    assert h.bl_target(0x0225EE22, 'ov3') == 0x0225F7EC, 'live arm into 0x0225F7EC moved'
    # and the BST root is where claimed
    assert h.u32(0x0225E7F8, 'ov3') == 0x1CE0, 'the BST root literal moved'

- id: "handss.dead_arm_donor_windows"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "A DEAD HAND-SS ARM IS ONLY USABLE BY A DONOR THAT *REACHES ITS GUARD*, WHICH IS A FAR TIGHTER CONSTRAINT THAN `base +/- imm8`, AND MEASURING IT IS WHAT DECIDES THE DONOR. Each arm's node is `<adds|subs> r0,#imm8 ; cmp r4,r0 ; bne <reject> ; bl <leaf>`, so a donor must satisfy BOTH (a) the enclosing BST comparisons actually route its cid to that compare, and (b) its cid is expressible as base +/- imm8. Simulating the whole tree over every cid (a Thumb interpreter that models the stack AND the compiled jump tables — thumb.stack_switch — and reproduces the Chaos family -> 0x0225FA46 and Fenrir -> 0x0225FA36 splits) gives:
    arm (BL)     guard                       reaches         window         clean donors
    0x0225E67C   subs r0,#0x8d @0x0225E676   0x0001..0x0E1E  0x0DA6..0x0E1E   0
    0x0225E692   subs r0,#0x66 @0x0225E68C   0x0E20..0x0E3F  0x0E20..0x0E3F   0
    0x0225E6E6   adds r0,#0x17 @0x0225E6E0   0x0EB4..0x0FDD  0x0EB4..0x0FB2  30  (Lightpulsar)
    0x0225E88E   subs r0,#0x7a @0x0225E888   0x1579..0x164C  0x15C7..0x164C   6  (Darkflare)
THE TWO LOW ARMS ARE USELESS FOR A MONSTER: their windows are entirely Speed Spells and phantoms, so no records-free Normal Monster exists in either. That is why 'three dead arms remain, take one' was misleading guidance — 0x0225E88E was the LAST one a monster could use. A FIFTH banish-cost card cannot be routed this way at all and needs a different mechanism. ⚠️ The 0x0225E88E node compares TWICE: 0x0225E880 is the RANGE split and 0x0225E888 the EQUALITY test; only the second may be re-aimed, because moving the first re-routes every real cid in (donor, 0x164C]. ⚠️ Both low arms' guards are `subs` from the SAME base literal 0x0EA5 (0x0225E808), and 0x0225E88E's is `subs` from r7 = 0x16C6 (literal 0x0225E818) — the base is what fixes the window, so verify() must pin it."
  address: 0x0225E888
  oracle: "ov3"
  sources: [darkflare-dragon-findings, lightpulsar-findings]
  proof: |
    import struct
    # arm 0x0225E67C: `subs r0,#0x8d` from the literal 0x0EA5 -> compares 0x0E18
    assert h.u16(0x0225E676, 'ov3') == 0x388D, 'the 0x0225E67C guard is not subs #0x8d'
    assert h.u16(0x0225E678, 'ov3') == 0x4284, 'the 0x0225E67C guard no longer cmp r4,r0'
    # arm 0x0225E692: `subs r1,#0x66` / `subs r0,#0x66` from the same base -> 0x0E3F
    assert h.u16(0x0225E68C, 'ov3') == 0x3866, 'the 0x0225E692 guard is not subs #0x66'
    # both derive from the literal 0x0EA5 loaded at 0x0225E65E (pc-relative, +0x1a8)
    lit = (((0x0225E65E + 4) & ~3) + 0x1A8)
    assert h.u32(lit, 'ov3') == 0x0EA5, f'the low arms base literal moved ({lit:#x})'
    assert 0x0EA5 - 0x8D == 0x0E18 and 0x0EA5 - 0x66 == 0x0E3F, 'window arithmetic'
    # arm 0x0225E88E: TWO `subs r0,#0x7a` off r7 = 0x16C6 -> 0x164C
    assert h.u16(0x0225E880, 'ov3') == 0x387A, 'the RANGE split above 0x0225E88E moved'
    assert h.u16(0x0225E888, 'ov3') == 0x387A, 'the EQUALITY guard of 0x0225E88E moved'
    assert h.u32(0x0225E818, 'ov3') == 0x16C6, 'the r7 base literal (Fenrir) moved'
    assert 0x16C6 - 0x7A == 0x164C, 'window arithmetic'
    # the two low arms really do sit in Speed-Spell territory: every cid in their
    # windows that owns a card_prop row is a Speed Spell, so no monster is available.
    # (structural stand-in: the windows lie wholly below the first Normal Monster the
    #  0x0225E6E6 arm can reach, 0x0EB4, which is why they were unusable)
    assert 0x0EA5 - 0xFF < 0x0EB4 and 0x0E3F < 0x0EB4, 'window ordering changed'

- id: "handss.self_ss_from_gy_resolver"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "Self-Special-Summon FROM THE GRAVEYARD ('You can Special Summon this card from your GY by <cost>') is a SINGLE SHARED cls2 slot1 resolver, 0x0220731D, used by 69 cls2 records — Treeborn Frog 0x19CB, Plaguespreader Zombie 0x1EA9, Spore 0x225B, Quillbolt Hedgehog 0x1E15, Wulf 0x1DAC, Fabled Lurrie 0x1F9C, Ronintoadin 0x2269, Stardust Dragon 0x1E36, Vampire Lord 0x1522, and the Aesir lords 0x2471/0x2472/0x2473 among them. The resolver is cid-switched only to pick a MODE in r4 (initialised `movs r4,#0` at 0x02207324) and every unmatched compare branches to the COMMON BODY at 0x022073E8, so an unnamed donor cid runs the default (mode 0) path rather than falling off. The per-card COST and CONDITION are not in this resolver at all — they are the record's slot4/slot3: Plaguespreader (+0C 0x021FF06D, +10 0x021E9039), Treeborn Frog (+0C 0x021FA585, +10 0x021E7969), Spore (+0C 0x021F0BDD, +10 0x021E5319). CONSEQUENCE: a GY self-SS clause reuses 0x0220731D wholesale and only needs its own slot3/slot4."
  address: 0x0220731C
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    S1 = {}
    for i in range(0x2B9):
        if h.u32(0x02275C04 + i * 24 + 4, 'ov3') == 0x0220731D:
            S1[h.u32(0x02275C04 + i * 24, 'ov3')] = i
    assert len(S1) >= 60, f'self-SS-from-GY family shrank to {len(S1)}'
    for cid in (0x19CB, 0x1EA9, 0x225B, 0x1E15, 0x1DAC, 0x2269):
        assert cid in S1, f'{cid:#x} left the 0x0220731D self-SS-from-GY family'
    # mode defaults to 0 and the unmatched arm is the common body
    assert h.u16(0x02207324, 'ov3') == 0x2400, 'self-SS resolver default mode != 0'
    assert h.bl_target(0x022073EC, 'ov3') == 0x021B9EC0, 'common body retargeted'
    # the three anchors keep DISTINCT cost/condition slots (per-card, not shared)
    def slots(cid):
        for i in range(0x2B9):
            if h.u32(0x02275C04 + i * 24, 'ov3') == cid:
                return (h.u32(0x02275C04 + i * 24 + 0xC, 'ov3'),
                        h.u32(0x02275C04 + i * 24 + 0x10, 'ov3'))
    assert slots(0x1EA9) == (0x021FF06D, 0x021E9039), 'Plaguespreader slots drifted'
    assert slots(0x19CB) == (0x021FA585, 0x021E7969), 'Treeborn Frog slots drifted'
    assert slots(0x225B) == (0x021F0BDD, 0x021E5319), 'Spore slots drifted'

- id: "handss.archetype_control_leaf"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "*** THE ENGINE'S OWN TEMPLATE FOR 'IF YOU CONTROL A <ARCHETYPE> MONSTER, YOU CAN SPECIAL SUMMON THIS CARD (FROM YOUR HAND)' -- CLONE THIS LEAF, DO NOT INVENT ONE. *** 0x0225F7A0 is the Six Samurai hand-SS gate (the Grandmaster / Kizan wording), eight instructions long: `adds r0,r6,#0 ; bl 0x021AD870` (canSS(side), r6 = side) -> reject on 0; then `ldr r1,[pc,#0xc4]` = [0x0225F870] = 0x02023A19, the has_set_code[0x1E] thunk; `adds r0,r6,#0 ; adds r2,r7,#0 ; movs r3,#1 ; bl 0x021ACFE8` -> reject on 0; `b 0x0225F216`, the shared success leaf `movs r0,#4 ; orrs r5,r0` (handss.summon_procedure_registry). It has exactly ONE inbound edge, an unconditional `b` at 0x0225F152, and NO BL callers. *** THE PRIMITIVE IT LEANS ON: 0x021ACFE8(r0 = side, r1 = set_code_thunk, r2 = exclude, r3 = faceup_only) -> COUNT. Its loop is `r4 = 0..4` (`cmp r4,#4 ; ble 0x021AD018`) -- MONSTER ZONES ONLY -- taking each zone's cid from 0x021A3320(side, zone), skipping 0, rejecting on two flag bits of [rec+0x44] (bit 1 and bit 0x15), demanding [rec+0x3C] != 0 when faceup_only is nonzero, and finally `blx r1` with r0 = cid. ⚠️ r2 IS OVERLOADED: 0 <= r2 <= 0xA is an exclude-ZONE (stashed to [sp+0xC]) and ANY OTHER VALUE is an exclude-CID, so r2 = -1 means 'exclude nothing'. CONSEQUENCES: (a) because it never reads a Spell/Trap zone, an archetype list containing Spells (Junk Barrage, Junk Box) needs NO is-monster gate; (b) 0x021B18E0 is the GY sibling and 0x021B1950 the banished one (stat.gy_setcode_counter). card.junk_servant_clause1 clones this leaf into ov5 with the thunk swapped to Junk 0x02023E5D and r2 = -1, because no dead dispatch arm a monster can reach remains (handss.dead_arm_donor_windows) -- the routing is the shared trampoline at handss.hook_site instead."
  address: 0x0225F7A0
  oracle: "ov3"
  sources: [notes/junk-servant-findings.md, otn_enhanced/cards/junk_servant.py]
  proof: |
    # the leaf shape, instruction by instruction
    assert h.bl_target(0x0225F7A2, 'ov3') == 0x021AD870, 'the canSS call moved'
    assert h.u16(0x0225F7AA, 'ov3') == 0x4931, 'the thunk load is not ldr r1,[pc,#0xc4]'
    assert h.u32(0x0225F870, 'ov3') == 0x02023A19, 'the Six Samurai thunk pool word moved'
    assert h.u16(0x0225F7B0, 'ov3') == 0x2301, 'the leaf no longer passes faceup_only = 1'
    assert h.bl_target(0x0225F7B2, 'ov3') == 0x021ACFE8, 'the on-field counter call moved'
    # 0x02023A19 really is has_set_code[0x1E]
    assert h.u32(0x0209D0D8 + 0x1E * 4, 'arm9') == 0x02023A19, 'set code 0x1E moved'
    # exactly one inbound edge, an unconditional b, and no BL caller
    ins = []
    for a in range(0x0225E000, 0x02260200, 2):
        w = h.u16(a, 'ov3')
        if (w & 0xF800) == 0xE000:
            off = ((w & 0x7FF) ^ 0x400) - 0x400
            if a + 4 + off * 2 == 0x0225F7A0:
                ins.append(('b', a))
        if (w >> 11) == 0b11110 and (h.u16(a + 2, 'ov3') >> 11) == 0b11111:
            if h.bl_target(a, 'ov3') == 0x0225F7A0:
                ins.append(('bl', a))
    assert ins == [('b', 0x0225F152)], f'inbound edges to the leaf changed: {ins}'
    # the primitive: monster zones 0..4 only, and the blx that calls the thunk
    assert h.u16(0x021AD064, 'ov3') == 0x2C04, '0x021ACFE8 no longer bounds the loop at 4'
    assert h.u16(0x021AD066, 'ov3') == 0xDDD7, 'the loop-back branch moved'
    assert h.u16(0x021AD05A, 'ov3') == 0x4788, 'blx r1 (the thunk call) moved'
    assert h.bl_target(0x021AD01C, 'ov3') == 0x021A3320, 'the zone->cid read moved'
    # r2 overloading: the [0,0xA] range test that turns it into a zone exclusion
    assert h.u16(0x021ACFFE, 'ov3') == 0x2D0A, 'the r2 <= 0xA test moved'
    assert h.u16(0x021ACFFA, 'ov3') == 0x2D00, 'the r2 >= 0 test moved'
    # the success leaf the gate branches to is still the bitmask OR
    ok216 = h.u16(0x0225F216, 'ov3') == 0x2004 and h.u16(0x0225F218, 'ov3') == 0x4305
    assert ok216, '0x0225F216 is no longer `movs r0,#4 ; orrs r5,r0`'

- id: "handss.procedure_registry_handler_is_per_cid"
  subsystem: "handss_dispatch"
  confidence: "VERIFIED"
  claim: "A SUMMON-PROCEDURE REGISTRY ROW MAY POINT AT A PRIVATE (ov5) HANDLER, and that handler is reached by its cid ALONE. The registry 0x0228F158 (handss.summon_procedure_registry) is consumed at 0x02264DBC by `ldr r0,[r0,#4] ; blx r0` -- no arguments; the handler reads the summon record 0x02298A28 itself and returns 0 = call again / nonzero = done. The second searcher 0x022651C0 special-cases only handlers 0x02261F8D and 0x0226448D and otherwise falls into its cid BST, exactly as for a 0x0226292D row. Scanned 2026-09-29: all 32 occurrences of 0x0226292D in ov3 are registry rows (none in arm9), so nothing else dispatches on the handler value. CONSEQUENCE: a donor whose summon cost differs from 'banish from GY' can WRAP 0x0226292D in ov5 (replace some states, defer the rest) with no shared hook and no ov3 bytes -- overtex_qoatlus's CAVE_OQ_PAY does this."
  address: 0x02264DBC
  oracle: "ov3"
  sources: [overtex-qoatlus-findings]
  proof: |
    assert h.u16(0x02264DBC, 'ov3') == 0x6840, 'registry call is no longer ldr r0,[r0,#4]'
    assert h.u16(0x02264DBE, 'ov3') == 0x4780, 'registry call is no longer blx r0'
    assert h.bl_target(0x02264DB4, 'ov3') == 0x02022E44, 'registry search retargeted'

