- id: "mover.relocation_core_0x021C6B00_is_hand_source_only"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "The 'general relocation core' 0x021C6B00 hard-codes SOURCE zone 0xB (hand): its body does `movs r1,#0xb` before every location lookup and all 8 of its BL callers are hand wrappers or dest-only wrappers (dest r3 = 0xE GY / 0xF banish / 0xC-0xD Deck-Extra). Used with an opponent-GY word pointer (r1) and r3 = 0xD it moved a card out of the opponent's HAND instead (GDB 2026-11-12). For a card in any other zone use 0x021C6A0C (return to Deck) or the zone-specific movers (0x021C7038 GY->hand, 0x021C7118 GY->banished)."
  address: 0x021C6B00
  oracle: "ov3"
  sources: [ehther-erebus-findings]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    callers = []
    for off in range(0, len(img) - 4, 2):
        h1, h2 = struct.unpack_from('<HH', img, off)
        if (h1 & 0xF800) == 0xF000 and (h2 & 0xF800) == 0xF800:
            o = ((h1 & 0x7FF) << 12) | ((h2 & 0x7FF) << 1)
            if o & 0x400000: o -= 0x800000
            if base + off + 4 + o == 0x021C6B00: callers.append(base + off)
    assert len(callers) == 8, [hex(c) for c in callers]
    body = img[0x021C6B00 - base:0x021C6D00 - base]
    assert bytes.fromhex('0b21') in body, 'movs r1,#0xb vanished'

