  confidence: "VERIFIED"
  claim: "Continuous cards that 'select 1 monster on YOUR side of the field' share the cls0 +08 sub-handler 0x021E0680: its prologue calls the zone predicate 0x021D6E40 with mask 0x0C15 (the own-side/face-up filter) and only THEN switches on cid to a per-card extra-condition leaf. Sharers: Machine Duplication 0x157A, Staunch Defender 0x1669, Battle-Scarred 0x16A2, Ninjitsu Art of Decoy 0x17FF, 0x18DF, The League of Uniform Nomenclature 0x1978, Next to be Lost 0x19DC, Battle Waltz 0x2416 (most also share the activation tail 0x02234D8D). So an archetype/type restriction (Archfiend, Ninja, Machine) is a SEPARABLE switch leaf: neutralising the leaf yields 'any face-up monster you control'. Battle-Scarred's arm is 0x021E06F2 -> leaf 0x021E08C2. WARNING the compared cid is a switch operand (base+-imm), so patch the LEAF, never the literal."
  address: 0x021E0680
  oracle: "ov3"
  sources: [safe-zone-findings]
  proof: |
    # the shared prologue: zone predicate first, mask 0x0C15 stashed at [sp,#4]
    assert h.bl_target(0x021E068E, 'ov3') == 0x021D6E40, 'zone predicate call retargeted'
    assert h.u32(0x021E0918, 'ov3') == 0x00000C15, 'own-side zone mask drifted'
    # the switch arms we rely on
    assert h.u32(0x021E091C, 'ov3') == 0x000017FF, 'Ninjitsu Art of Decoy arm drifted'
    assert h.u32(0x021E092C, 'ov3') == 0x000016A2, 'Battle-Scarred arm drifted'
    # and they really are cls0 +08 co-sharers of this handler
    CLS0, STRIDE = 0x0227E64C, 0x18
    shared = [h.u16(CLS0 + i*STRIDE, 'ov3') for i in range(0x51A)
              if h.u32(CLS0 + i*STRIDE + 8, 'ov3') == 0x021E0681]
    for cid in (0x16A2, 0x17FF, 0x157A, 0x1978):
        assert cid in shared, f'{cid:#06x} no longer shares the own-side selector'

- id: "rider.no_direct_attack_gate"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "'This monster cannot attack the opponent DIRECTLY' is decided by 0x021A6680: its tail is a flat chain of 0x021A1430 (FAMILY 1) rider queries for the cards that APPLY the restriction -- Magical Scientist 0x1619, 0x18E5, Genex Ally Axel 0x223B, Sorciere de Fleur 0x24E6, 0x2536, 0x195B. Any hit branches to 0x021A6A0E ('movs r0,#0'); falling through every link reaches 0x021A6A0A ('movs r0,#1'). Its caller 0x021A6ABC does `bl 0x021A6680 ; cmp r0,#0 ; bne .. ; b 0x021A72A4`, so returning 0 means CANNOT attack directly and 1 means may. Live registers across the chain: r5 = side, r4 = slot. NOTE 0x021A6ABC itself is the direct-attack GRANT query (the Opti-Camouflage Armor / Gear Golem chain plus the cid list 0x0226D730) -- it is NOT the prohibition; conflating the two makes a patch a silent no-op. IN-GAME CONFIRMED 2026-07-21: safe_zone PART E added a link here for donor 0x16A2 and the protected monster could no longer declare a direct attack. Found by INTERSECTING several cards that share the mechanic; the usual 'pick a card whose only mechanic is X' trick fails here because Zombyra the Dark 0x147D has two mechanics and all five of its overlay-3 sites belong to the other one (the ATK-delta table 0x0226E4BC = -200, the flags table 0x0226EA7C bit 3 = 'has a when-this-destroys-a-monster-by-battle trigger', the 159-entry continuous list 0x0226E7C4, and its cls1 row)."
  address: 0x021A6680
  oracle: "ov3"
  sources: [safe-zone-findings]
  proof: |
    # the chain links all call the family-1 query
    for site in (0x021A69AA, 0x021A69BC, 0x021A69CC, 0x021A69DC, 0x021A69F0, 0x021A6A02):
        assert h.bl_target(site, 'ov3') == 0x021A1430, f'chain link {site:#010x} retargeted'
    # the granting-card literals
    assert h.u32(0x021A69A0, 'ov3') == 0x00001619, 'Magical Scientist literal drifted'
    assert h.u32(0x021A6A18, 'ov3') == 0x0000223B, 'Genex Ally Axel literal drifted'
    assert h.u32(0x021A6A1C, 'ov3') == 0x000024E6, 'Sorciere de Fleur literal drifted'
    # the two exits: hit -> movs r0,#0 ; fall-through -> movs r0,#1
    assert h.bytes_at(0x021A6A0E, 2, 'ov3') == bytes.fromhex('0020'), 'deny exit moved'
    assert h.bytes_at(0x021A6A0A, 2, 'ov3') == bytes.fromhex('0120'), 'allow exit moved'
    # and the caller treats 0 as 'cannot attack directly'
    assert h.bl_target(0x021A6AD0, 'ov3') == 0x021A6680, 'caller no longer calls the gate'

