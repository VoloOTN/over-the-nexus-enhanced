- id: "rider.family1_has_a_kind_exact_lens"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** FAMILY 1 HAS TWO LENSES ON THE SAME LIST, AND THAT IS HOW ONE KEY CARRIES TWO STATES. *** rider.two_walker_families documents 0x021A1430 -> 0x021A1238 as 'the' family-1 query; there is a SECOND one, and missing it makes a two-state grant impossible to build:
  0x021A1430(side, slot, key)       -> walker 0x021A1238: kind@+2 & 0xF < 6, key@+0 == key.  ** KIND-AGNOSTIC **
  0x021A14E8(side, slot, key, kind) -> walker 0x021A1268: the BYTE-IDENTICAL walk plus one extra compare, `cmp r7,r2 ; bne next` @0x021A1288, where r7 is that same kind nibble.  ** KIND-EXACT **
Both wrappers resolve the head the same way (0x0229ACD2 + side*0xB3C + slot*0x14) and walk the same pool 0x0229D33C at stride 0xA. So ONE key can hold two independent booleans, distinguished only by the kind nibble the poster wrote (see rider.node_writer_and_kind_byte: the kind BYTE's low nibble is the kind, the high nibble is a turn countdown).
*** THE NATIVE USER IS DOUBLE SUMMON, inside the Normal-Summon counter 0x021B9514: `node(side, 0xB, 0x1C33)` via 0x021A1430 asks DOES THE GRANT EXIST, and `0x021A14E8(side, 0xB, 0x1C33, 2)` asks IS IT ALREADY SPENT -- same slot, same key, kind 1 vs kind 2. That is the idiom for any 'you may do X one more time this turn' grant that must OUTLIVE its granter (no field presence is consulted anywhere).
⚠️ THE TRAP, and it is why this fact exists: ninishi's granter arms use the KIND-AGNOSTIC 0x021A1430 as their SPENT test, because for Dverg/Ninishi the grant itself is 'the granter is on the field' and the only node on that key IS the spent mark. Any new granter that posts its grant AS A NODE on the same key must switch its spent test to 0x021A14E8(...,2), or the kind-agnostic query sees the card's own freshly-posted grant node and reports the grant spent the instant it is made -- a card that silently never works. scrap_raptor C1b is the first such card."
