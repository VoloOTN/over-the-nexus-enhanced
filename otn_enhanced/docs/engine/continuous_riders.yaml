- id: "rider.shadow_spell_observed"
  subsystem: "continuous_riders"
  confidence: "ANCHORED"
  claim: "OBSERVED in a live duel savestate (rom_all_patches.ml3, Shadow Spell face-up and active on the opponent's monster): the targeted monster's zone chain holds exactly one node with kind = 0x17 (nibble 7 -> family 2), word @+0 = 0x0700 (a source LOCATOR: side 0, slot 7 = a Spell/Trap zone) and @+4 = 0x1243 = Shadow Spell's cid cached. So the donor attaches its rider for free, and it must be read back with 0x021A0950(side, slot, 0x1243) - 0x021A1430 would never see it. NOTE kind 0x17 is the SAME number the 3DS engine uses for its Safe Zone continuous-effect category, and both engines gate on (kind & 0xF) vs 6. IN-GAME CONFIRMED 2026-07-21 for the sibling donor Battle-Scarred 0x16A2: a 0x021A0950 query for it grants battle protection in a live duel, which only works if its rider is family 2. Also observed: flipping the target face-down CLEARS the rider (savestate rom_safe_zone.ml4)."
  address: 0x0229D33C
  oracle: "savestate"
  sources: [safe-zone-findings]
  proof: |
    PB, STRIDE, POOL = 0x0229AC94, 0xB3C, 0x0229D33C
    found = None
    for side in (0, 1):
        for slot in range(5):
            head = h.ram_u16(PB + side*STRIDE + 0x3E + slot*0x14)
            i, n = head, 0
            while i and n < 8:
