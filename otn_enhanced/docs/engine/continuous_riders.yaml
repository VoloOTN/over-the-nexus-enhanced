- id: "negate.card_negated_gate_two_callers"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "0x021EE3DC(r0 = side, r1 = zone) is the native per-card 'effects negated' gate (rider chain keys in list 0x0226FAB4, zone word bit 22, node 0x1B98, locators 0x2142/0xEAD/0x1D14/0x1FEE/0x200D). It has exactly TWO BL callers: 0x021D3AE6 inside 0x021D3AA0(desc) (the resolution negate; its only caller 0x021D442A writes desc+0xA = 2) and 0x021EE4F6 inside 0x021EE4E4(side, zone, r2) (the continuous monster-negate check, zone <= 4). Fronting both BLs gives a card native 'negate the effects of' semantics; The Monarchs Erupt does this (CPU trace 2026-11-11: Lyla/Jain/Ehren resolved negated, Tribute Summoned Zaborg untouched; NOT in-game confirmed)."
  address: 0x021EE3DC
  oracle: "ov3"
  sources: [erupt-findings]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    def bl_callers(target):
        out = []
        for a in range(base, base + len(img) - 4, 2):
            hw, lw = struct.unpack_from('<HH', img, a - base)
            if (hw & 0xF800) == 0xF000 and (lw & 0xF800) == 0xF800:
                imm = ((hw & 0x7FF) << 12) | ((lw & 0x7FF) << 1)
                if imm & (1 << 22): imm -= (1 << 23)
                if a + 4 + imm == target: out.append(a)
        return out
    assert bl_callers(0x021EE3DC) == [0x021D3AE6, 0x021EE4F6], 'negate gate callers moved'
    assert bl_callers(0x021D3AA0) == [0x021D442A], 'resolution-negate caller moved'
    assert h.bytes_at(0x021EE3DC, 2, 'ov3') == bytes.fromhex('f8b5'), 'gate prologue drifted'

