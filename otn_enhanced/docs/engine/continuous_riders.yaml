- id: "rider.affect_predicate_zone_split"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** 0x021B021C SPLITS BY ZONE AT 0x021B059C, AND HALF THE KNOWN HOOK SITES ARE MONSTER-ZONE-ONLY. *** `cmp r5,#4 ; ble 0x021B05A2 ; b 0x021B07EA`: slots 0..4 (MONSTER zones) take the long body, slots 5..0x0A (SPELL/TRAP zones 5-9 and the FIELD zone 0x0A) take a short tail at 0x021B07EA. Consequences, and they are the point of this fact: (a) safe_zone's link 0x021B05CC (`bl 0x021A0950`, Heart of Clear Water) and Dreadmaster's 0x021B05FA are AFTER the split on the monster side, so NEITHER is ever reached for a Spell/Trap target -- do not try to protect a Spell/Trap there; (b) azure_eyes' link 0x021B0592 (`bl 0x021A1430`) sits BEFORE the split, so it IS reached for Spell/Trap slots too; (c) a Spell/Trap protection belongs in the tail, where rider.st_tail_protection_links documents the two family-1 links. The slot map 0-4 monster / 5-9 Spell+Trap / 0x0A Field is corroborated by 0x021AD234, which loops r4 = 5 while r4 < 0x0A, and by rider.shadow_spell_observed ('side 0, slot 7 = a Spell/Trap zone')."
  address: 0x021B059C
  oracle: "ov3"
  sources: [notes/white-dragon-ninja-findings.md, notes/safe-zone-findings.md]
  proof: |
    assert h.u16(0x021B059C, 'ov3') == 0x2D04, '0x021B059C is not `cmp r5,#4`'
    assert h.u16(0x021B059E, 'ov3') & 0xFF00 == 0xDD00, '0x021B059E is not `ble`'
    w = h.u16(0x021B05A0, 'ov3')
    assert w & 0xF800 == 0xE000, '0x021B05A0 is not an unconditional branch'
    off = w & 0x7FF
    off = off - 0x800 if off & 0x400 else off
    assert 0x021B05A0 + 4 + off * 2 == 0x021B07EA, 'the S/T tail target moved'
    # the two monster-side links that a Spell/Trap can therefore never reach
    assert h.bl_target(0x021B05CC, 'ov3') == 0x021A0950, "Safe Zone's link retargeted"
    assert h.bl_target(0x021B05FE, 'ov3') == 0x021AC5A8, "Dreadmaster's leaf retargeted"
    assert 0x021B059C < 0x021B05CC and 0x021B059C < 0x021B05FE, \
        'the monster-side links are no longer after the split'
    # and the one that is before it
    assert h.bl_target(0x021B0592, 'ov3') == 0x021A1430, "Azure-Eyes' link retargeted"
    assert 0x021B0592 < 0x021B059C, 'the VCZ link is no longer before the split'

- id: "rider.st_tail_protection_links"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "WHERE TO GRANT 'SPELLS/TRAPS YOU CONTROL CANNOT BE DESTROYED BY CARD EFFECTS'. The Spell/Trap + Field tail of 0x021B021C (reached only for slots 5..0x0A, see rider.affect_predicate_zone_split) is 0x34 bytes and holds TWO family-1 rider links, both `bl 0x021A1430` on pseudo-slot 0x0B: (1) 0x021B07F4 with key 0x0D6C (literal @0x021B0824), set up by `ldr r5,[pc,#0x38] ; adds r0,r6,#0 ; movs r1,#0x0B ; adds r2,r5,#0 ; movs r4,#0x0B` -- NO controller test, so a grant here covers BOTH players' effects; (2) 0x021B0814 with key 0x0D6E (r5+2), reached only after `ldrb r1,[r7,#2] ; movs r0,#1 ; subs r0,r0,r1 ; cmp r6,r0 ; bne` -- i.e. ONLY when the target's controller is the opponent of the acting card's controller, so a grant there is 'your OPPONENT's card effects' only. *** r6 IS THE TARGET SPELL/TRAP'S CONTROLLER *** -- proven by that very compare against `1 - actingSide` -- so a 'you control X' side test is free at either link via dispatch.side_scoped_face_up_count. Both links feed `cmp r0,#0 ; beq ; b 0x021B0296`, so a NON-ZERO return is the PROTECTED exit and a chained stub needs no frame surgery. ⚠️ r4 (0x0B) and r5 (the key) are LIVE after link 1 -- they are reused at 0x021B0810/0x021B0812 -- so a stub hooked at 0x021B07F4 must write only r0..r3. Reachability is inherited from shipped in-game behaviour: Imperial Custom 0x20A5 and Field Barrier 0x1BD7 are working cards whose ONLY implementation is a leaf in this same function."
  address: 0x021B07F4
  oracle: "ov3"
  sources: [notes/white-dragon-ninja-findings.md]
  proof: |
    # the tail's setup, which a chained stub must be able to replay verbatim
    w = h.u16(0x021B07EA, 'ov3')
    assert w & 0xF800 == 0x4800, '0x021B07EA is not an LDR literal'
    assert ((0x021B07EA + 4) & ~3) + (w & 0xFF) * 4 == 0x021B0824, 'the key slot moved'
    assert h.u32(0x021B0824, 'ov3') == 0x00000D6C, 'the first link key is no longer 0x0D6C'
    assert h.u16(0x021B07EC, 'ov3') == 0x1C30, '0x021B07EC is not `adds r0,r6,#0`'
    assert h.u16(0x021B07EE, 'ov3') == 0x210B, '0x021B07EE is not `movs r1,#0x0B`'
    assert h.u16(0x021B07F0, 'ov3') == 0x1C2A, '0x021B07F0 is not `adds r2,r5,#0`'
    assert h.u16(0x021B07F2, 'ov3') == 0x240B, '0x021B07F2 is not `movs r4,#0x0B`'
    # link 1, and the caller turning a non-zero return into the protected exit
    assert h.bl_target(0x021B07F4, 'ov3') == 0x021A1430, 'link 1 is not the family-1 query'
    assert h.u16(0x021B07F8, 'ov3') == 0x2800, 'link 1 no longer tested with `cmp r0,#0`'
    assert h.u16(0x021B07FA, 'ov3') == 0xD000, 'link 1 is no longer followed by `beq`'
    # link 2, behind the opponent-side gate
    assert h.u16(0x021B0804, 'ov3') == 0x78B9, "0x021B0804 is not `ldrb r1,[r7,#2]`"
    assert h.u16(0x021B0806, 'ov3') == 0x2001, '0x021B0806 is not `movs r0,#1`'
    assert h.u16(0x021B0808, 'ov3') == 0x1A40, '0x021B0808 is not `subs r0,r0,r1`'
    assert h.u16(0x021B080A, 'ov3') == 0x4286, '0x021B080A is not `cmp r6,r0`'
    assert h.u16(0x021B0812, 'ov3') == 0x1CAA, '0x021B0812 is not `adds r2,r5,#2`'
    assert h.bl_target(0x021B0814, 'ov3') == 0x021A1430, 'link 2 is not the family-1 query'
    # the two exits
    assert h.u16(0x021B0296, 'ov3') == 0x9816, 'the protected exit no longer loads [sp,#0x58]'
    assert h.u16(0x021B081E, 'ov3') == 0x2001, 'the affectable exit is not `movs r0,#1`'
    # the shipped native cards that prove the predicate is on the live S/T path
    for site, cid in ((0x021B0280, 0x1BD7), (0x021B02E4, 0x20A5)):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, f'0x{site:08X} is not an LDR literal'
        assert h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3') == cid, \
            f'the 0x{cid:04X} protection literal moved'

- id: "rider.banish_marker_attach_site"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** WHERE THE 0x1E15 BANISH RIDER IS ATTACHED, AND WHY A DONOR CANNOT GET IT FROM DATA -- the missing half of rider.banish_when_it_leaves_marker, which named 'the per-cid compare chain at 0x02268238' but not its root, its input or its arm. *** THE HOST is the SUMMON-EVENT HANDLER 0x02267A6C, whose r4 is the GLOBAL event record 0x02298A28 (not an argument) and which dispatches on the opcode [r4+0x24] through a jump table at 0x02267AA4. The rider lives under OPCODE 0x14 (0x02267AAC: `cmp r0,#0x14 ; bne ; b 0x02268028`). *** THE PER-CID SWITCH'S ROOT IS 0x022680A8 and its input is `ldrh r2,[r4,#0x12]` -- the summoned card's cid. Its DEFAULT leaf is 0x02268666, the fall-through immediately after the shared attach `0x02268660: movs r3,#3 ; 0x02268662: bl 0x021C479C`. *** THE ARM THAT GRANTS THE RIDER IS 0x02268542 AND IT IS UNGATED: `movs r0,#0 ; str r0,[sp]` (param 0), `ldrh r0,[r4,#0x2]` (side), `ldrh r1,[r4,#0x4]` (slot), `ldr r2,=0x1E15` (the marker key, as an EXPLICIT literal -- which is why Plaguespreader's node carries it too), `b 0x0226846E -> 0x02268660` (kind 3). *** SIMULATED with scratch/summon_event_sim.py (scratch/leave_dispatcher_sim.walk, seeded at r2 rather than r4): Plaguespreader 0x1EA9 AND Quillbolt 0x1E15 BOTH reach 0x02268542 -- the two cards whose measured savestate nodes carry key 0x1E15 -- while Changer Synchron 0x224C, Sword Arm of Dragon 0x0FB1, the records-free Normal Monsters 0x1463 / 0x1F18 and, decisively, TREEBORN FROG 0x19CB (a GY self-Special-Summon that prints NO rider) all take the DEFAULT. The simulator was not told the savestate result; that agreement is the corroboration, the role Deep Diver plays for the leave trees. *** TWO DATA-ONLY ROUTES ARE RULED OUT. The opcode-0x14 prologue runs two membership lists before the switch -- 0x0228F750 (0x2E entries) -> 0x021C479C(side, slot, CID, kind 3, 0) at 0x02268086, and 0x0228F708 (0x24 entries) -> the same with kind 2 at 0x022680A4 -- and BOTH pass the card's own cid as the key. Joining either list gives key 0x224C, while the consumer 0x021B09CC compares against 0x1E15. So the rider needs a CODE hook. *** THE HOOK SITE IS 0x02268666, 4 bytes (`ldrh r0,[r4,#0xe]` 88e0 + `ldr r6,[pc,#0x54]` 4e15, literal 0x022686C0 = 0x000014FC), replaced by a BL that gates on the cid, attaches, REPLAYS BOTH displaced instructions and returns to 0x0226866A (whose `cmp r0,r6` consumes them). r4 must survive; r0 and r6 are both redefined by the replay so they are free; r5/r7 may be live and must be saved; and ⚠️ r6 must NOT appear in the POP list or the pop would undo the replayed literal. *** ⚠️ FIDELITY CAVEAT, UNRESOLVED: opcode 0x14 is a general 'a card arrived on the field' event (five posters: 0x02261542 0x022618E6 0x02265078 0x02265602 0x022656A4, several from sub-type switches) and arm 0x02268542 has no gate, so on the face of it the engine grants Plaguespreader its banish rider on ANY summon, a Normal Summon included. A new card whose printed rider belongs to ONE of its summons should gate the attach on a one-shot byte set by that clause -- CLEARED BY THE STUB, not by the resolver, because the commit 0x0226925C can finish after the resolver returns (the timing window that killed card.upstart_golden_ninja's first STAGE latch)."
  address: 0x02268666
  oracle: "ov3"
  sources: [notes/jet-synchron-findings.md, scratch/summon_event_sim.py]
  proof: |
    # the opcode-0x14 door and the switch root's cid load
    assert h.bytes_at(0x02267AAC, 4, 'ov3') == bytes.fromhex('142800d1'),                  'the opcode 0x14 test drifted'
    assert h.u16(0x022680A8, 'ov3') == 0x8A62,                  '0x022680A8 is not `ldrh r2,[r4,#0x12]` (the switch input)'
    # the shared attach and the default leaf that follows it
    assert h.bytes_at(0x02268660, 4, 'ov3')[:2] == bytes.fromhex('0323'),                  '0x02268660 is not `movs r3,#3`'
    assert h.bl_target(0x02268662, 'ov3') == 0x021C479C, 'the shared attach call moved'
    assert h.bytes_at(0x02268666, 4, 'ov3') == bytes.fromhex('e089154e'),                  'the default leaf 0x02268666 is not the 4 bytes the hook displaces'
    def _lit(site):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{site:#010x} is not an LDR literal'
        return h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
    assert _lit(0x02268668) == 0x14FC, 'the replayed r6 literal drifted'
    # the rider arm: param 0, then the explicit marker key
    assert h.bytes_at(0x02268542, 4, 'ov3') == bytes.fromhex('00200090'),                  'the rider arm no longer starts `movs r0,#0 ; str r0,[sp]`'
    assert _lit(0x0226854A) == 0x1E15, 'the rider arm lost its explicit marker key'
    # the two prologue lists really pass the CID as the key, not a marker
    for site, kind in ((0x02268086, 3), (0x022680A4, 2)):
        assert h.bl_target(site, 'ov3') == 0x021C479C, f'{site:#010x} is not an attach'
    assert h.u16(0x02268082, 'ov3') == 0x8A62 and h.u16(0x022680A0, 'ov3') == 0x8A62,                  'a prologue list attach no longer passes ldrh r2,[r4,#0x12] (the cid) as the key'
    assert h.bl_target(0x02268074, 'ov3') == 0x02022E14, 'list 0x0228F750 search moved'
    assert h.bl_target(0x02268090, 'ov3') == 0x02022E14, 'list 0x0228F708 search moved'

- id: "rider.banish_marker_is_cid_blind_to_the_destination"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** THE 0x1E15 RIDER NODE ALONE MAKES ANY cid BANISH ITSELF ON LEAVING -- the 'WHAT IS NOT YET PROVEN' tail of rider.banish_when_it_leaves_marker, closed STRUCTURALLY 2026-09-03 by reading the consumer chain to its end instead of stopping at the walker query. *** THE PREDICATE IS 0x021B0950(r0 = side, r1 = slot) -> 1 = banish / 0 = graveyard. Disassembled 0x021B0950..0x021B0A1C in full: it queries the family-1 walker 0x021A1430 for marker key 0x20DC, then (after an existence test on the card and a flag test at [0x0229ACD8 + ...] >> 0x15) for 0x1E15 @0x021B09CC, 0x1F5B @0x021B09DE, 0x1F70 @0x021B09F2 and 0x2184 @0x021B0A06, returning 1 on the first hit and 0 at 0x021B0A18 when none is present. *** THE ONLY TWO cid COMPARES IN THE WHOLE FUNCTION ARE EARLY-EXIT ARMS: 0x16F8 and 0x1CE0 @0x021B099A/0x021B09A0, and when they do not match control FALLS THROUGH to exactly the same rider tests. So the four marker keys are tested with NO cid in scope and a donor of any cid reaches them. *** AND THE CALLER TURNS THE 1 INTO THE BANISH. 0x021B0950 has SIX bl callers (0x021B0AFA 0x021CCBDA 0x021CF4B8 0x0222E4A0 0x0222E7DA 0x022621C6; none in arm9). At 0x021CCBDA the register r4 is the DESTINATION ZONE and the sequence is `cmp r4,#0xa ; ble skip ; bl 0x021B0950 ; cmp r0,#0 ; beq skip ; movs r4,#0xf` -- i.e. destination 0x0E (GY) is rewritten to 0x0F (BANISHED), the same encoding card.nast_shipped measured for the destroy-vs-banish switch at 0x021CB490, and the `cmp r4,#0xa` guard means it only applies when the card is actually leaving. The second site 0x021CF4B8 corroborates by suppressing the GY-send bookkeeping (`if (pred) { r4 = 0; r6 = 0; }`). *** CONSEQUENCE: 0x021C479C(side, slot, 0x1E15, 3, 0) is SUFFICIENT; no cid gate stands between the node and the banish. *** AND IT IS NOW IN-GAME CONFIRMED TOO (user, 2026-09-03, card.jet_synchron_clause2): a donor cid that the engine's own per-cid switch never reaches was given this node by an ov5 stub, and the summoned copy was BANISHED rather than sent to the GY when it left the field. So the static chain and the duel agree: the node alone is sufficient for an arbitrary cid."
  address: 0x021B0950
  oracle: "ov3"
  sources: [notes/jet-synchron-findings.md]
  proof: |
    # the predicate's prologue and the four marker literals it queries
    assert h.bytes_at(0x021B0950, 4, 'ov3') == bytes.fromhex('70b5324a'), \
        '0x021B0950 prologue drifted -- is this still the banish predicate?'
    def _lit(site):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{site:#010x} is not an LDR literal'
        return h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
