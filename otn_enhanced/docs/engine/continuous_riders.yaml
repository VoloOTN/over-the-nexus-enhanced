- id: "rider.node_writer_and_kind_byte"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** THE RIDER NODE WRITER, AND THE DURATION NIBBLE HIDING IN ITS KIND ARGUMENT. 0x0219F190(r0 = side, r1 = slot, r2 = kind BYTE, r3 = key, [caller sp+0] = param) allocates a node index via 0x0219F020 (first free of 0x100; pool 0x0229D33C, stride 10), appends it to the ZONE chain whose head is 0x0229AC94 + side*0xB3C + 0x3E + slot*0x14 (== 0x0229ACD2 + ...) by walking next-links at 0x0229D344, and fills the node: [+0] = key, [+2] low nibble = kind & 0xF, [+2] bits 4..7 = (kind & 0xF0) >> 4, [+4] = param, [+6] = [0x0229DD14+0x2C], [+8] = 0 (next). It returns -1 without writing when the pool is full. *** THE HIGH NIBBLE OF THE KIND BYTE IS A PER-TURN COUNTDOWN, not part of the kind -- see rider.turn_sweeper. A caller passing kind = 0x12 therefore creates a kind-2 (family 1, so rider.two_walker_families' 0x021A1430 sees it) node that survives exactly one turn boundary. THE QUEUED ROUTE to the same writer is 0x021C479C(side, slot, key, kind byte, [caller sp+0] = param), which packs animation command 0x35 | (side ? 0x8000 : 0) with arg1 = slot | kind<<8, arg2 = key, arg3 = param; its handler 0x021C3E68 -> 0x021BE044 unpacks it (side from bit 0x8000; arg2's own bit 0x8000 selects the OTHER chain writer 0x0219F230) and calls 0x0219F190 with the FULL kind byte intact. Both routes are legal from ordinary effect code: the summon-trigger evaluator 0x02265768 itself calls 0x021C479C at 0x02265C6C."
  address: 0x0219F190
  oracle: "ov3"
  sources: [notes/azure-eyes-clause2-findings.md, otn-attached-effect-rider]
  proof: |
    assert h.bytes_at(0x0219F190, 4, 'ov3') == bytes.fromhex('f8b5051c'), 'node writer prologue drifted'
    assert h.bl_target(0x0219F19A, 'ov3') == 0x0219F020, 'the node allocator call moved'
    # the field stores, in order: kind nibbles into [+2], key, param, turn stamp, next
    assert h.u16(0x0219F1F2, 'ov3') == 0x804A, 'strh r2,[r1,#2] (kind) drifted'
    assert h.u16(0x0219F208, 'ov3') == 0x804A, 'strh r2,[r1,#2] (duration) drifted'
    assert h.u16(0x0219F20C, 'ov3') == 0x800F, 'strh r7,[r1] (key) drifted'
    assert h.u16(0x0219F20E, 'ov3') == 0x808A, 'strh r2,[r1,#4] (param) drifted'
    assert h.u16(0x0219F214, 'ov3') == 0x80CA, 'strh r2,[r1,#6] (turn stamp) drifted'
    assert h.u16(0x0219F218, 'ov3') == 0x810A, 'strh r2,[r1,#8] (next) drifted'
    # the high-nibble extraction: (kind & 0xF0) >> 4 into bits 4..7
    assert h.u16(0x0219F1FA, 'ov3') == 0x23F0, 'movs r3,#0xf0 drifted'
    assert h.u16(0x0219F1FC, 'ov3') == 0x4023, 'ands r3,r4 drifted'
    # the queued route reaches the same writer with the kind byte intact
    assert h.u16(0x021C47AA, 'ov3') == 0x2035, 'command opcode 0x35 drifted'
    assert h.bl_target(0x021C47C6, 'ov3') == 0x021C3BC8, '0x021C479C no longer queues'
    assert h.bl_target(0x021BE08A, 'ov3') == 0x0219F190, 'the 0x35 handler no longer calls the writer'
    assert h.bl_target(0x021BE07E, 'ov3') == 0x0219F230, 'the 0x35 handler alternate writer moved'
    # and the engine itself makes that call from the summon-trigger evaluator
    assert h.bl_target(0x02265C6C, 'ov3') == 0x021C479C, 'the native attach in 0x02265768 moved'

- id: "rider.turn_sweeper"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** HOW A RIDER EXPIRES, AND HOW TO SPELL 'UNTIL THE END OF THE NEXT TURN'. 0x0219F9E0 sweeps every node index 1..0xFF and dispatches on the node's kind nibble through a halfword jump table at 0x0219FA2C (add-pc base 0x0219FA2E): kinds 0/4/5 -> 0x0219FAEE = keep forever; kinds 1/2 -> 0x0219FA3E = `n = [node+2]>>4 ; if n == 0 free the node else n -= 1` -- UNCONDITIONAL, it never looks at the key; kind 3 -> 0x0219FA5C = free only for keys 0x18D9 / 0x1F6A; kinds 6/7/8 -> 0x0219FA6C = family 2, which resolves the node's SOURCE LOCATOR to a cid via 0x021A36EC and then runs a per-cid switch whose 0x175D arm (Weapon Change, printed 'until the End Phase of your opponent's NEXT turn') at 0x0219FACE frees the node when [0x0229DD14+0x40] > [node+4]. *** IT RUNS EXACTLY ONCE PER TURN: its only caller is 0x021C1358 inside 0x021C12F0, the handler for animation opcode 3 (arm 0x021C3D3C), which is queued by the phase-8 handler 0x02258C3C at its step 0; phase 8 is the last entry of the phase-handler table 0x0226D2B0 driven by 0x0219D4C0 (`ldr r0,[0x0226D2B0 + phase*4] ; blx r0`), and that same handler's next step queues opcode 4 -> 0x021C102C, the SOLE site that toggles the turn player ([0x0229DD14+0x34] ^= 1) and increments the TURN COUNTER ([0x0229DD14+0x40] += 1). CONSEQUENCE: a kind-1/2 node created with duration nibble 1 (kind byte 0x1N) survives the sweep at the end of the turn it was made in and is freed by the sweep at the end of the following turn -- 'until the end of the NEXT turn' with no code edit at all; nibble 0 is 'until the end of this turn'. The family-2 route to the same duration (param = the current turn number, as 0x0221B18A does when it attaches a kind-7 node) is unusable for a NEW card because its arm is cid-gated on 0x175D."
  address: 0x0219F9E0
  oracle: "ov3"
  sources: [notes/azure-eyes-clause2-findings.md]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    # the kind jump table, decoded the way the code does it
    tbl, pcbase = 0x0219FA2C, 0x0219FA2E
    arms = [pcbase + struct.unpack_from('<h', img, tbl + i * 2 - base)[0] for i in range(9)]
    assert arms == [0x0219FAEE, 0x0219FA3E, 0x0219FA3E, 0x0219FA5C, 0x0219FAEE,
                    0x0219FAEE, 0x0219FA6C, 0x0219FA6C, 0x0219FA6C], f'kind arms moved: {[hex(a) for a in arms]}'
    # the kind-1/2 countdown arm: extract bits 4..7, free at 0, else decrement
    assert h.bytes_at(0x0219FA3E, 8, 'ov3') == bytes.fromhex('0106090f08d0491e'), 'the countdown arm drifted'
    assert h.bl_target(0x0219FAEA, 'ov3') == 0x0219F03C, 'the node-free call moved'
    # the Weapon Change turn-compare arm
    assert h.u16(0x0219FAD0, 'ov3') == 0x6C01, 'ldr r1,[r0,#0x40] (turn counter) drifted'
    assert h.u16(0x0219FAD2, 'ov3') == 0x88A0, 'ldrh r0,[r4,#4] (expiry param) drifted'
    # the sweeper has exactly one caller, inside the opcode-3 handler
    def bl_callers(target):
        out = []
        for a in range(base, base + len(img) - 4, 2):
            hw, lw = struct.unpack_from('<HH', img, a - base)
            if (hw & 0xF800) == 0xF000 and (lw & 0xF800) == 0xF800:
                imm = ((hw & 0x7FF) << 12) | ((lw & 0x7FF) << 1)
                if imm & (1 << 22): imm -= (1 << 23)
                if a + 4 + imm == target: out.append(a)
        return out
    assert bl_callers(0x0219F9E0) == [0x021C1358], 'the sweeper gained or lost a caller'
    assert bl_callers(0x021C12F0) == [0x021C3D3C], 'the opcode-3 handler gained a caller'
    # opcode 3 and 4 really are those two arms of the command dispatcher
    otbl, obase = 0x021C3C5E, 0x021C3C60
    arm3 = obase + struct.unpack_from('<H', img, otbl + 3 * 2 - base)[0]
    arm4 = obase + struct.unpack_from('<H', img, otbl + 4 * 2 - base)[0]
    assert (arm3, arm4) == (0x021C3D3C, 0x021C3D42), f'command arms moved: {hex(arm3)}, {hex(arm4)}'
    assert h.bl_target(arm4, 'ov3') == 0x021C102C, 'opcode 4 is no longer the turn flip'
    # the turn flip: toggle [+0x34], then increment [+0x40]
    assert h.u16(0x021C1046, 'ov3') == 0x6B4A, 'ldr r2,[r1,#0x34] drifted'
    assert h.u16(0x021C104A, 'ov3') == 0x4042, 'eors r2,r0 drifted'
    assert h.u16(0x021C104C, 'ov3') == 0x634A, 'str r2,[r1,#0x34] drifted'
    assert h.u16(0x021C104E, 'ov3') == 0x6C0A, 'ldr r2,[r1,#0x40] drifted'
    assert h.u16(0x021C1052, 'ov3') == 0x1C52, 'adds r2,r2,#1 drifted'
    assert h.u16(0x021C1054, 'ov3') == 0x640A, 'str r2,[r1,#0x40] drifted'
    # phase 8 is the last handler in the table and it queues opcode 3 at step 0
    assert h.u32(0x0226D2B0 + 8 * 4, 'ov3') == 0x02258C3D, 'phase 8 handler moved'
    assert h.u32(0x0226D2B0 + 9 * 4, 'ov3') == 0, 'the phase table is no longer 9 entries'
    assert h.bl_target(0x02258C68, 'ov3') == 0x021C3BC8, 'the opcode-3 queue call moved'
    assert h.u16(0x02258C5A, 'ov3') == 0x2003, 'the queued opcode is no longer 3'

- id: "rider.affect_predicate_protection_link"
  subsystem: "continuous_riders"
  confidence: "VERIFIED"
  claim: "*** WHERE TO GRANT 'CANNOT BE TARGETED **OR DESTROYED** BY CARD EFFECTS', AND WHY IT IS NOT THE LINK safe_zone USED. 0x021B021C is the general 'may this card effect affect this monster' predicate: r0 = the acting card's 0x24-byte descriptor, r1 = the target's side, r2 = its slot, r3 = a TARGETS flag, and the caller's [sp+0] is the value returned when the monster is PROTECTED. Protected exit 0x021B0296 (`ldr r0,[sp,#0x58]`), affectable exit 0x021B081E (`movs r0,#1`). At 0x021B058C it queries Vehicroid Connection Zone's family-1 rider -- `ldr r2,=0x1A5C ; adds r0,r6,#0 ; adds r1,r5,#0 ; bl 0x021A1430 ; cmp r0,#0 ; beq ; b 0x021B0296` -- and that link sits BEFORE the targets gate, which is read 0x2C bytes later at 0x021B05BE. Heart of Clear Water's link at 0x021B05CC, which safe_zone PART D borrowed, sits INSIDE that gate, and THAT is the entire origin of Safe Zone's documented divergence 'a non-targeting destruction still resolves'. *** A NON-TARGETING DESTRUCTION REALLY DOES PASS THROUGH 0x021B058C: caller 0x02245B7A calls the wrapper 0x021B0848 with its targets argument 0 and, only when the predicate says affectable, calls 0x021CF35C -> 0x021CF31C -> 0x021CDD4C(desc, mask, 0x0E, 2) -- destination zone 0x0E is the Graveyard, i.e. it destroys the monster; and 0x021B0848 passes 0 as the predicate's [sp+0x58], so 'protected' returns 0 and the destroy is skipped. NEITHER this link NOR Dreadmaster's at 0x021B05FA applies a controller test, so a grant inserted here protects from BOTH players -- drop Safe Zone's `r7+2` opponent check and the 'neither player' half of a clause is free. Chaining it needs NO frame surgery, unlike Safe Zone's insert: the native `cmp r0,#0 ; beq ; b 0x021B0296` already turns a non-zero return into the protected exit. Reachability is inherited from a SHIPPED in-game result -- Safe Zone's 0x021B05CC hook is in-game confirmed (2026-07-21) and control reaches 0x021B05CC only by first executing 0x021B0592. *** IN-GAME CONFIRMED 2026-08-24 for the non-targeting half: with a rider on this link, a Dragon survived Dark Hole and Smashing Ground -- neither of which targets -- in a live duel (card.azure_eyes_silver_dragon clause 2). So this link genuinely does NOT inherit safe_zone's 'a non-targeting destruction still resolves' divergence; that is measured now, not inferred from 0x02245B7A alone."
  address: 0x021B058C
  oracle: "ov3"
  sources: [notes/azure-eyes-clause2-findings.md, notes/safe-zone-findings.md]
  proof: |
    assert h.bytes_at(0x021B021C, 8, 'ov3') == bytes.fromhex('f8b590b00e1c1699'), 'the predicate prologue drifted'
    # the VCZ link: literal 0x1A5C, the family-1 query, and the protected exit
    w = h.u16(0x021B058C, 'ov3')
    assert w & 0xF800 == 0x4800, '0x021B058C is not an LDR literal'
    assert h.u32(((0x021B058C + 4) & ~3) + (w & 0xFF) * 4, 'ov3') == 0x1A5C, 'the VCZ literal moved'
    assert h.bl_target(0x021B0592, 'ov3') == 0x021A1430, '0x021B0592 is not the family-1 query'
    assert h.u16(0x021B0596, 'ov3') == 0x2800, 'cmp r0,#0 after the VCZ query drifted'
    assert h.u16(0x021B0296, 'ov3') == 0x9816, 'the protected exit no longer loads [sp,#0x58]'
    assert h.u16(0x021B0298, 'ov3') & 0xF800 == 0xE000, '0x021B0298 is no longer the branch to the epilogue'
    assert h.u16(0x021B081E, 'ov3') == 0x2001, 'the affectable exit is not movs r0,#1'
    # the targets gate is LATER, so 0x021B0592 is outside it and Safe Zone's link is inside
    assert h.u16(0x021B05BE, 'ov3') == 0x9800, 'the targets-flag load moved'
    assert 0x021B0592 < 0x021B05BE < 0x021B05CC, 'the ordering assumption broke'
    # the wrapper passes 0 as the protected return, and one of its callers is a DESTROY
    assert h.u16(0x021B0878, 'ov3') == 0x9100, 'the wrapper no longer passes 0 as [sp+0]'
    assert h.u16(0x021B087A, 'ov3') == 0x9101, 'the wrapper no longer passes 0 as [sp+4]'
    assert h.bl_target(0x021B0882, 'ov3') == 0x021B021C, 'the wrapper no longer calls the predicate'
    assert h.bl_target(0x02245B82, 'ov3') == 0x021B0848, 'the destroy caller moved'
    assert h.u16(0x02245B78, 'ov3') == 0x9001, 'the destroy caller no longer passes targets = 0'
    assert h.bl_target(0x02245B92, 'ov3') == 0x021CF35C, 'the destroy call moved'
    assert h.bl_target(0x021CF36E, 'ov3') == 0x021CF31C, '0x021CF35C no longer forwards'
    assert h.u16(0x021CF34E, 'ov3') == 0x220E, 'the destination zone is no longer 0x0E (the GY)'
    assert h.bl_target(0x021CF352, 'ov3') == 0x021CDD4C, 'the relocation call moved'

