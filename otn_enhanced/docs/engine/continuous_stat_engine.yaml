- id: "stat.armityle_turn_bonus"
  subsystem: "continuous_stat_engine"
  confidence: "VERIFIED"
  claim: "WORKED EXAMPLE of reading a stat-engine arm correctly, and of what the +N ATK machinery is NOT. Armityle the Chaos Phantom 0x1CAE ('gains 10000 ATK during your turn only') is a stat.recompute leaf @0x021B5B06: `ldr r0,=0x0229DD14 ; ldr r1,[r0,#0x34] ; ldr r0,[sp,#0xc] ; cmp r1,r0 ; bne +2 ; ldr r0,=0x00002710 ; b tail ; movs r0,#0` -- i.e. bonus = 10000 on its controller's turn else 0, reaching the bonus tail 0x021B5722. The constant 10000 occurs EXACTLY ONCE in 0x021B4000-0x021B8000 (the pool word [0x021B5E14]), and the leaf has EXACTLY ONE inbound edge, `bl` @0x021B5158. ⚠ READING ITS ARM IS A LIVE thumb.stack_based_switch TRAP: propagating r0 forward from the `subs r0,#0x59` @0x021B5122 yields 0x1C03 Rainbow Dragon, which is WRONG -- that subs is on the `blt` subtree. The `bgt` @0x021B510A enters at 0x021B513E with r0 still holding the pivot literal [0x021B53A4] = 0x1C62, so the two arms there are 0x1C62+0x7E = 0x1CE0 Exodius (leaf 0x021B5B18, a GY count -- matching its printed '1000 ATK for each monster with a different name in your GY') and 0x1C62+0x4C = 0x1CAE Armityle. ⚠ ALSO: the two overlay-3 pool words holding 0x00001CAE (0x0218E2AC, 0x0218FDA4) are NOT this effect -- they are ARM-MODE pools in the god-card SUMMON-ANIMATION path (loaded by ARM ldr @0x0218DFB8 / 0x0218FA64 / 0x0218FB30, sibling cids Obelisk 0x1386, Uria 0x19A3, the Earthbound Immortals, The Wicked gods), as is the stride-4 cinematic boss list @0x0226C248 that contains 0x1CAE at 0x0226C2FC. A Thumb-only `ldr [pc]` scan finds no reference to either pool, which is the tell that the caller is ARM."
  address: 0x021B5B06
  oracle: "ov3"
  sources: [notes/gladiator-beast-essedarii-findings.md]
  proof: |
    # the leaf's shape
    assert h.u32(0x021B5E14, 'ov3') == 0x2710, 'the 10000 literal moved'
    assert h.u32(0x021B5E10, 'ov3') == 0x0229DD14, 'turn-state literal moved'
    assert h.u16(0x021B5B0A, 'ov3') == 0x9803, 'leaf does not ldr r0,[sp,#0xc]'
    assert h.u16(0x021B5B0C, 'ov3') == 0x4281, 'leaf does not cmp r1,r0'
    assert h.u16(0x021B5B14, 'ov3') == 0x2000, 'leaf else-branch is not movs r0,#0'
    # 10000 appears exactly once in the stat engine
    hits = [a for a in range(0x021B4000, 0x021B8000, 2) if h.u16(a, 'ov3') == 0x2710]
    assert hits == [0x021B5E14], f'0x2710 no longer unique in the stat engine: {hits}'
    # the arm, and that it is the leaf's ONLY caller
    assert h.u16(0x021B5152, 'ov3') == 0x304C, 'arm adds r0,#0x4c moved'
    assert h.u16(0x021B5154, 'ov3') == 0x4282, 'arm cmp r2,r0 moved'
    assert h.u16(0x021B5156, 'ov3') == 0xD101, 'arm bne moved'
    assert h.bl_target(0x021B5158, 'ov3') == 0x021B5B06, 'arm no longer calls the leaf'
    callers = [a for a in range(0x021B44C0, 0x021B79F8, 2)
               if h.u16(a, 'ov3') >> 11 == 0b11110
               and h.u16(a + 2, 'ov3') >> 11 == 0b11111
               and h.bl_target(a, 'ov3') == 0x021B5B06]
    assert callers == [0x021B5158], f'leaf callers changed: {callers}'
    # the pivot that makes the arm 0x1CAE and not 0x1C03
    assert h.u32(0x021B53A4, 'ov3') == 0x1C62, 'chain pivot literal moved'
    assert 0x1C62 + 0x4C == 0x1CAE and 0x1C62 + 0x7E == 0x1CE0
    # the animation-path decoys really are ARM pools, not this effect
    for pool in (0x0218E2AC, 0x0218FDA4):
        assert h.u32(pool, 'ov3') == 0x1CAE, f'decoy pool {pool:#x} changed'
    assert h.u32(0x0226C2FC, 'ov3') == 0x1CAE, 'cinematic-list slot moved'

- id: "mem.ov3_handss_dead_run"
  subsystem: "continuous_stat_engine"
  confidence: "VERIFIED"
  claim: "A 126-BYTE CONTIGUOUS RUN OF PROVABLY-DEAD OVERLAY-3 CODE at 0x0225F240..0x0225F2BE — by far the largest always-resident cave known here, and the only one big enough for a multi-stub payload (the stat-engine pool stat.phantom_arm_scratch totals ~180 B but is fragmented into runs of <= 44 B). It is TWO ADJACENT LEAVES of the hand-SS dispatch: 0x0225F240..0x0225F26C (46 B), reached only from the dead arm 0x0225E88E (phantom cid 0x164C), and 0x0225F26E..0x0225F2BC (80 B), reached only from the dead arm 0x0225E692 (phantom 0x0E3F). Proved dead by three independent scans over the ARM9 **and all 50 overlays**: (1) BL/BLX targeting anywhere in the range = EXACTLY those two dead arms and nothing else; (2) inbound B/Bcond from outside the range = 0; (3) 4-byte-aligned words holding a pointer into the range, raw or with the Thumb bit = 0. ⚠️ WHOEVER CLAIMS THIS BLOCK MUST NEUTRALISE THE TWO ARMS (repoint them at the reject leaf 0x0225FF96) — until then a phantom cid in hand would branch into whatever code is hosted here; lightpulsar does this in its PART D. ⚠️ The literal pool at 0x0225F510+ (0x0B3C, 0x0229ACA0, 0x132C, 0x1DF4, 0x0229AC94) is SHARED with live code — the dead range loaded from it. Never touch the pool; hosted stubs must carry their own literals inside the 126 B. WHY THIS SURVIVES WHERE THE BSS CAVE DIED: ov3_cave.py's WINDOW_PRIMARY/SECONDARY are BSS, and canary round 2 showed the engine clears ov3's BSS over its ORIGINAL extent, wiping them in all five duel modes; this range is part of ov3's FILE IMAGE, so the overlay loader's memcpy puts it in RAM and nothing erases it. Being ov3 it is resident in every mode including puzzles (mem.ov3_resident_all_modes), unlike the ov5 cave."
  address: 0x0225F240
  oracle: "ov3"
  sources: [lightpulsar-findings, ov3-cave-findings]
  proof: |
    # the two leaves' bodies still start where claimed
    assert h.u16(0x0225F240, 'ov3') in (0x1C30, 0x4A05), \
        'the 0x0225F240 leaf head is neither native nor a claimed stub'
    # the ONLY two inbound references are the two dead arms
    assert h.bl_target(0x0225E88E, 'ov3') in (0x0225F240, 0x0225FF96), \
        'dead arm 0x0225E88E points somewhere unexpected'
    assert h.bl_target(0x0225E692, 'ov3') in (0x0225F26E, 0x0225FF96), \
        'dead arm 0x0225E692 points somewhere unexpected'
    # no POINTER anywhere in ov3 lands inside the range (the strongest of the three
    # scans, re-run here over the committed ov3 image)
    img = env.image('ov3')
    base = 0x02141700
    bad = []
    for off in range(0, len(img) - 4, 4):
        v = int.from_bytes(img[off:off + 4], 'little')
        if 0x0225F240 <= (v & ~1) < 0x0225F2BE:
            bad.append(base + off)
    assert not bad, f'pointers into the dead run appeared: {[hex(a) for a in bad]}'
    # and the shared literal pool it must not disturb is intact
    assert h.u32(0x0225F510, 'ov3') == 0x0B3C, 'the shared literal pool moved'
    assert h.u32(0x0225F514, 'ov3') == 0x0229ACA0, 'the shared literal pool moved'

- id: "dispatch.cls3_cond_invoker_is_ov3"
  subsystem: "continuous_stat_engine"
  confidence: "VERIFIED"
  claim: "A cls record's +0C CONDITION is invoked from ov3 0x0224A8A6: `bl 0x0224A118` (find_event_handler) ; no record -> return 1 ; `ldr r2,[r0,#0xC]` ; null -> return 1 ; `blx r2` with r0 = the caller's r5 (my desc), r1 = r4 (the activation's desc). find_event_handler has NO BL caller in arm9 or ov5, so this whole path is ov3 and runs in puzzles. CONSEQUENCE: a condition stub in the ov5 cave is a blx into ov41 bytes in a puzzle; in the ov3 compaction pool it works. Phase C pilot: Koa'ki Meiru Wall 0x1126's cls3 +0C moved to cave3.CAVE3_KMW_COND 0x0221B848 (88 B, exact fit); in-game confirmed by user 2026-10-06 in a normal duel AND a puzzle ('Works in both, ship it')."
  address: 0x0224A8A6
  oracle: "ov3"
  sources: [ov3-compaction-findings, koaki-meiru-wall-findings]
  proof: |
    assert h.bl_target(0x0224A8A6, 'ov3') == 0x0224A118, 'invoker no longer calls find_event_handler'
    assert h.u16(0x0224A8AE, 'ov3') == 0x68C2, 'not ldr r2,[r0,#0xC]'
    assert h.u16(0x0224A8B8, 'ov3') == 0x4790, 'not blx r2'
    def callers(img, base):
        n = 0
        for i in range(0, len(img) - 3, 2):
            h1 = int.from_bytes(img[i:i + 2], 'little'); h2 = int.from_bytes(img[i + 2:i + 4], 'little')
            if h1 >> 11 == 0b11110 and h2 >> 11 in (0b11111, 0b11101):
                off = ((h1 & 0x7FF) << 12) | ((h2 & 0x7FF) << 1)
                off -= (1 << 23) if off & (1 << 22) else 0
                n += base + i + 4 + off == 0x0224A118
        return n
    assert callers(env.image('ov5'), 0x022C5900) == 0, 'ov5 calls find_event_handler'
    assert callers(env.image('arm9'), 0x02000000) == 0, 'arm9 calls find_event_handler'

- id: "dispatch.tour_guide_stubs_ov3_callers"
  subsystem: "continuous_stat_engine"
  confidence: "VERIFIED"
  claim: "Every invoker of Tour Guide's three stubs is ov3, so all three live in the ov3 pool (cave3.CAVE3_TG_FILTER 0x021F1E24 / _SELECTOR 0x021D858C / _NEGATE 0x02213D74): (1) cls1 +14: the cls1 table base 0x022860D4 is loaded by ONE literal, ov3 0x0224A3A8 (find_event_handler, no arm9/ov5 callers -- dispatch.cls3_cond_invoker_is_ov3); (2) criteria h: every literal into 0x022713C4.. is ov3 (0x02243DFC/F30/FA0/FA4); (3) the filter callback (r2): DECK_BUILDER 0x0223BC3C str r2,[sp,#0xc] -> ldr r4 @0x0223BDF0 -> blx r4 @0x0223BDFA; HAND_BUILDER 0x0223C16C passes it on to 0x0223BFD4 -> blx r4 @0x0223C13E; both builders have only ov3 BL callers. PITFALL: a pool run whose entry is a REDIRECTS old (0x021DED78, 0x021DFFC8) makes a stub pointer value-identical to a stale one and ov3_compact.verify rightly rejects it. In-game confirmed by user 2026-10-06, normal duel AND puzzle ('Works in both, ship it')."
  address: 0x0223BDFA
  oracle: "ov3"
  sources: [ov3-compaction-findings]
  proof: |
    import struct
    def lits(img, base, lo, hi):
        return [base + i for i in range(0, len(img) - 3, 4) if lo <= struct.unpack_from('<I', img, i)[0] < hi]
    def bls(img, base, t):
        n = 0
        for i in range(0, len(img) - 3, 2):
            h1, h2 = struct.unpack_from('<HH', img, i)
            if h1 >> 11 == 0b11110 and h2 >> 11 == 0b11111:
                off = ((h1 & 0x7FF) << 12) | ((h2 & 0x7FF) << 1)
                off -= (1 << 23) if off & (1 << 22) else 0
                n += base + i + 4 + off == t
        return n
    for o, b in (('arm9', 0x02000000), ('ov5', 0x022C5900)):
        img = env.image(o)
        assert not lits(img, b, 0x022860D4, 0x022860D4 + 0x535 * 24), f'{o} reads cls1'
        assert not lits(img, b, 0x022713C4, 0x022713C4 + 0x56D * 12), f'{o} reads criteria'
        assert bls(img, b, 0x0223BC3C) == 0 and bls(img, b, 0x0223C16C) == 0, f'{o} calls a zone builder'
    assert h.u32(0x0224A3A8, 'ov3') == 0x022860D4, 'cls1 base literal moved'
    assert h.u16(0x0223BC46, 'ov3') == 0x9203 and h.u16(0x0223BDF0, 'ov3') == 0x9C03, 'deck builder r2 spill'
    assert h.u16(0x0223BDFA, 'ov3') == 0x47A0 and h.u16(0x0223C13E, 'ov3') == 0x47A0, 'not blx r4'
    assert h.bl_target(0x0223C1A8, 'ov3') == 0x0223BFD4, 'hand builder no longer calls 0x0223BFD4'

