- id: "save.token_slots_are_dead"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "THE 74 'UNOWNABLE' CIDS HAVE DEAD SAVE SLOTS. arm9 0x0209D34C lists 0x4A cids that cntadd 0x0202AFCC refuses to count: the 72 Tokens + 0xD48 + 0xDAC. The Tokens' card_prop RECORD indices are contiguous 173..244, so a new record 4306+k can be remapped to 173+k with arithmetic. Their count nibbles and flag bytes were 0 in every .sav on disk (2026-10-27). Flag bits 6/7 are also unused: wrappers 0x0202B058..0x0202B0F4 cover bits 0..5 only and no save ever had bit 3/5/6/7 set."
  address: 0x0209D34C
  oracle: "arm9"
  sources: [notes/new-cid-card-findings.md]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    b = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(b, 'bin2.pac')
    f = next(x for x in a.files if x.get_clean_name().lower() == 'card_prop.bin')
    cp = b[f.address:f.address + f.size]
    cids = [struct.unpack_from('<H', cp, i * 8)[0] & 0x3FFF for i in range(len(cp) // 8)]
    a9 = env.arm9
    lst =[struct.unpack_from('<I', a9, 0x0209D34C - 0x02000000 + 4 * i)[0] for i in range(0x4A)]
    idx = sorted(cids.index(c) for c in lst)
    assert idx[:2] == [1, 60] and idx[2:] == list(range(173, 245)), idx[:4]

