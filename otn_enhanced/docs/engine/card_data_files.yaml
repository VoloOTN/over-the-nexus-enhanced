- id: "carddata.card_genre_type_tags"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "*** card_genre.bin CARRIES THE CATEGORY TAGS, AND A card_prop card_type EDIT DOES NOT TOUCH THEM. *** card_genre.bin (bin2.pac) is a 4305-entry array of 8-byte LE bitfields after an 8-byte header, indexed PARALLEL to card_prop.bin (same index = same card). Tags, by whole-table census: bit 21 = 'Special Summon only / nomi' (on every Fusion AND every Synchro); bit 29 = FUSION -- set on all 39 card_type-5 and all 108 card_type-7 records and on ZERO Synchros; bit 36 = SYNCHRO -- set on 2/2 card_type-35, 136/137 card_type-37 and 1/1 card_type-39 records and on ZERO Fusions; bit 35 = TUNER -- set on ALL 178 Tuner-typed records (card_type 31/33/39). The tags also appear on cards whose TEXT mentions the keyword (221 records carry bit 35 against 178 Tuners), so they are genre/keyword tags, not a summon classifier -- the summon classification is dispatch.card_category_hub. *** WHY IT MATTERS: converting a card between Extra-Deck categories by editing card_prop ALONE leaves it tagged with the OLD category here. This is the Fusion/Synchro analogue of the Spell->Trap hybrid-record failure recorded on w_nebula_meteorite ('a one-field card_type flip is NOT enough ... renders a glitched card frame and freezes when the card is selected'), and the same remedy applies: copy a REFERENCE card's whole record. Reference records: Formula Synchron 0x239E genre 0x0000001800200004 (bits 2/21/35/36 -- bit 2 is its own effect keyword) and Gaia Knight 0x1E11, the effectless Synchro, genre 0x0000001000200000 (bits 21/36 exactly)."
  sources: [notes/accel-synchron-findings.md, otn_enhanced/cards/accel_synchron.py, otn_enhanced/rom/card_genre_codec.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    b = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(b, 'bin2.pac')
    def blob(nm):
        f = next(x for x in a.files if x.get_clean_name().lower() == nm)
        return b[f.address:f.address + f.size]
    cp, gb = blob('card_prop.bin'), blob('card_genre.bin')
    n = (len(cp) - 8) // 8
    assert n == (len(gb) - 8) // 8 == 4305, 'card_prop / card_genre are not parallel'
    prop = [int.from_bytes(cp[8 + i * 8:16 + i * 8], 'little') for i in range(n)]
    genre = [int.from_bytes(gb[8 + i * 8:16 + i * 8], 'little') for i in range(n)]
    ct = [(v >> 32) & 0x3F for v in prop]
    def bit(i, k): return (genre[i] >> k) & 1
    fus = [i for i in range(n) if ct[i] in (5, 7)]
    syn = [i for i in range(n) if ct[i] in (35, 37, 39)]
    tun = [i for i in range(n) if ct[i] in (31, 33, 39)]
    assert (len(fus), len(syn), len(tun)) == (147, 140, 178), \
        f'populations drifted: {len(fus)}/{len(syn)}/{len(tun)}'
    # bit 29 == FUSION: every Fusion has it, no Synchro does
    assert all(bit(i, 29) for i in fus), 'a Fusion lost genre bit 29'
    assert not any(bit(i, 29) for i in syn), 'a Synchro carries genre bit 29'
    # bit 36 == SYNCHRO: no Fusion has it; every Synchro but one does
    assert not any(bit(i, 36) for i in fus if ct[i] == 5), \
        'an effectless Fusion carries genre bit 36'
    assert sum(bit(i, 36) for i in syn) == 139, 'the Synchro tag count drifted'
    assert all(bit(i, 36) for i in range(n) if ct[i] in (35, 39)), \
        'a type-35/39 Synchro lost genre bit 36'
    # bit 35 == TUNER: every Tuner-typed card has it
    assert all(bit(i, 35) for i in tun), 'a Tuner lost genre bit 35'
    # bit 21 == nomi: on every Fusion and every Synchro
    assert all(bit(i, 21) for i in fus + syn), 'a Fusion/Synchro lost genre bit 21'
    # the two reference records named in the claim
    byc = {prop[i] & 0x3FFF: i for i in range(n)}
    assert genre[byc[0x239E]] == 0x0000001800200004, 'Formula Synchron genre drifted'
    assert genre[byc[0x1E11]] == 0x0000001000200000, 'Gaia Knight genre drifted'

