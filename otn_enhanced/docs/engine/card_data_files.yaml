- id: "carddata.ydc_deck_layout"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "deck.pac (PAC v1) holds 305 .ydc decks. A .ydc is an 8-byte header then three (u16 count + count x u16 konami-id) lists in the order main, extra, side, and NOTHING else: all 305 decode with ZERO trailing bytes, so a deck's size is fully determined by its three counts. Main is 40 (one deck 42), extra 0..15, side 0 or 15; sizes run 94..154 bytes; only FOUR distinct 8-byte headers exist across the 305, so a rebuilt deck must keep its own header. Entries are 512-byte aligned with >=358 bytes of slack, and no two clean filenames collide -- so a deck can be grown in place by rewriting only its file-table size word, moving no address."
  sources: [randomiser/otn_randomiser.py, otn_enhanced/rom/ydc_codec.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    d = bytes(rom.getFileByName('Data_arc_pac/deck.pac'))
    a = parse_pac(d, 'deck.pac')
    assert len(a.files) == 305, f'deck.pac count drifted: {len(a.files)}'
    names = [f.get_clean_name() for f in a.files]
    assert len(set(names)) == 305, 'duplicate clean filenames in deck.pac'
    heads, sizes = set(), []
    for f in a.files:
        raw = d[f.address:f.address + f.size]
        heads.add(raw[:8])
        pos, counts = 8, []
        for _ in range(3):
            c = struct.unpack_from('<H', raw, pos)[0]
            counts.append(c)
            pos += 2 + c * 2
        assert pos == len(raw), f'{f.get_clean_name()} has {len(raw) - pos} trailing bytes'
        sizes.append(f.size)
    assert len(heads) == 4, f'distinct ydc headers drifted: {len(heads)}'
    assert (min(sizes), max(sizes)) == (94, 154), f'ydc size range drifted: {min(sizes)}..{max(sizes)}'
    srt = sorted(a.files, key=lambda f: f.address)
    slack = min((srt[i + 1].address - srt[i].address) - srt[i].size
                for i in range(len(srt) - 1))
    assert slack >= 358, f'deck.pac slack shrank to {slack}'

