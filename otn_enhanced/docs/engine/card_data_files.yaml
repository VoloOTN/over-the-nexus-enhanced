- id: "card_data.race_accessor_decoded"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "*** 0x0202ABB8(cid) -> RACE CODE, FULLY DECODED, AND FIEND == 3. The accessor is `bl 0x0202A084` (card_prop record for cid) then `ldr r0,[r0,#4] ; lsls r0,#0x0A ; lsrs r0,#0x1B` -- i.e. **race = ((card_prop[cid].word1 << 10) & 0xFFFFFFFF) >> 27**, a 5-bit field at bits 17..21 of the record's second word. ⚠️ It is bits 17..21, NOT 16..20 -- reading it one bit low yields a self-consistent but WRONG enum (every Fiend comes out as 6) and will silently break a race filter.
*** VERIFIED BY EVALUATING IT OVER THE REAL card_prop.bin: every Dark World monster returns 3 (Beiige 0x1965, Broww 0x1966, Sillva 0x1968, Goldd 0x1969, Zure 0x1961, Renge 0x1C18); Gemini Elf 0x11BA returns 18 (Spellcaster); Bazoo 0x1482 returns 11 (Beast); and Psychic Lifetrancer 0x1EDC returns 21 -- which independently matches its own criteria row's high byte 0xA8 >> 3 = 21, closing the loop with counter.criteria_registry_layout / dispatch.criteria_word_race_attribute. Spells and Traps return 23. 264 of the 4305 cards return 3.
*** THE VALUES ARE game_constants.ERA2_RACE_MAP: 1 Dragon, 2 Zombie, **3 Fiend**, 4 Pyro, 5 Sea Serpent, 6 Rock, 7 Machine, 8 Fish, 9 Dinosaur, 10 Insect, 11 Beast, 12 Beast-Warrior, 13 Plant, 14 Aqua, 15 Warrior, 16 Winged Beast, 17 Fairy, 18 Spellcaster, 19 Thunder, 20 Reptile, 21 Psychic. ⚠️ Do NOT confuse this with the FIELD-SPELL engine's race BITMASK [r6+0x08] = 1 << race (field.race_and_attribute_bitmasks), where Fiend is bit 3 = 0x08. Same race number, two different encodings.
*** USE: this is the accessor an ov5 race filter should call -- `ldr r1,=0x0202ABB9 ; blx r1` with the cid in r0 (it is Thumb, and ARM9 so always resident). card.gates_of_dark_world_clause2 does exactly that."
  address: 0x0202ABB8
  oracle: "arm9"
  sources: [notes/gates-of-dark-world-findings.md]
  proof: |
    # the accessor's exact shift pair -- the whole point of the fact
    assert h.bytes_at(0x0202ABB8, 4, 'arm9') == bytes.fromhex('08b5fff7'), \
        '0x0202ABB8 prologue drifted'
    assert h.bl_target(0x0202ABBA, 'arm9') == 0x0202A084, 'the card_prop lookup moved'
    assert h.u16(0x0202ABBE, 'arm9') == 0x6840, 'it no longer reads word1 of the record'
    assert h.u16(0x0202ABC0, 'arm9') == 0x0280, 'the lsls #0x0A drifted'
    assert h.u16(0x0202ABC2, 'arm9') == 0x0EC0, 'the lsrs #0x1B drifted'
    # the sibling accessor directly below it is the ATTRIBUTE, same record word
    assert h.u16(0x0202ABD0, 'arm9') == 0x0580 and h.u16(0x0202ABD2, 'arm9') == 0x0F00, \
        'the attribute accessor 0x0202ABC8 drifted'
    # and the criteria row that cross-validates the enum: Psychic Lifetrancer == 21
    base, cnt = 0x022713C4, 1388
    cids = [h.u16(base + i * 12, 'ov3') for i in range(cnt)]
    j = cids.index(0x1EDC)
    assert (h.u16(base + j * 12 + 10, 'ov3') >> 8) >> 3 == 21, \
        'Psychic Lifetrancer no longer encodes race 21 -- the enum cross-check is stale'
    k = cids.index(0x1466)
    assert (h.u16(base + k * 12 + 10, 'ov3') >> 8) >> 3 == 3, \
        'Dark Necrofear no longer encodes race 3 (Fiend)'

- id: "carddata.field_spell_background_is_mandatory"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "*** A FIELD SPELL WITHOUT A BACKGROUND IN field.pac IS A HARD FREEZE ON ACTIVATION, AND THAT MAKES field.pac A REQUIRED EDIT FOR ANY CARD CONVERTED INTO A FIELD SPELL. *** The background loader is ARM code in overlay 3 at 0x02170F50(r0, r1 = card number): `movs r2,r1` then `bne`, so **r1 == 0 takes a native no-field-spell path** that strcpy's '/Duel2D/duel_stage_part2_P.LZ5bg' (the default stage), while any other value sprintf's '/Duel2D/field/duel_field_magic%04d_P.LZ5bg' (0x0229207C) with the CID IN DECIMAL and opens it by name via 0x020168E8. On a miss the name scan runs off the end of field.pac's header and **strlen at 0x02016C84 (`ldrsb r2,[r0,r1]`) takes a DATA ABORT**; the savestate at the hang has CPSR 0x40000097 (ABORT mode, IRQs masked) and the vector words in the ARM9 block are 0xEAFFFFFE = `b .`, so an abort presents as a freeze rather than a crash. Diagnosed in game on Pyramid of Light 0x17BF 2026-09-07 -- the built filename 'duel_field_magic6079_p.lz5bg' was still in RAM at the freeze. *** ALL 65 STOCK FIELD SPELLS HAVE A BACKGROUND except Speed World 0xDAC, which is Turbo-Duel only and never reaches this path -- so there is no stock example of the loader surviving a miss. *** field.pac's FORMAT, validated by re-parsing every .pac in the ROM: the name area is N chunks of 0x200, each starting `00 00 <N>` and then packing entries `{u8 name_len, u8 XOR OF THE NAME BYTES, name}` until the next will not fit; the file table starts at N*0x200, also in 0x200 chunks, each with an 8-byte head then (u32 rel_addr, u32 size) pairs, 63 per chunk; a full chunk that continues is headed `00 00 FF FF` and **the LAST table chunk is headed `00 00 <entry count>`**; rel_addr is relative to the first 0x200 boundary after the table, files are 0x200-aligned, and file k carries name k. The XOR checksum holds for every name in all 26 archives that parse this way. ⚠️ field.pac holds 65 files and one of the names is `fl_icon.lz5bg` at index 22 -- **13 chars, not 28** -- so a fixed-stride name walk desynchronises after it and loses a name; walk with the length byte. otn_enhanced/rom/pac.py does NOT model this format (its readers scan for known extensions and fill gaps with generated names) and is not an authority on it. *** THREE THINGS A NEW BACKGROUND MUST SATISFY, each of which was an in-game failure first: (a) TILES -- BGDT is a tilemap plus de-duplicated character data, and a naive one-tile-per-cell 256x192 encode is 768 tiles, which drew the top of the picture then black then garbage; de-duplicated output (388..397, the stock range) works. NOTE 397 is NOT a measured cap: 372 of the 768 cells are entirely transparent and collapse to one tile, leaving 396, so 396+1 is simply what any busy image needs -- the real limit is somewhere in 398..768 and has never been measured. (b) LUMINANCE -- the duel field's mat and zone outlines are drawn to read against a mid-dark background; the stock backgrounds run 42..137 mean with at most 13.9% of pixels above 200, and art brighter than that makes the field unreadable. (c) THE ZONE GRID IS PAINTED INTO EVERY BACKGROUND, not supplied as an overlay and not part of the transparent mask, so replacing a background's opaque pixels deletes the duel field. It cannot be recovered by intersecting the backgrounds (only 879 opaque pixels are byte-identical across all 64) but the per-pixel SPREAD isolates it: ~24% of the opaque area sits under sd 20 and renders as exactly the 5x2 zone grid on both screens. Its LIT bezel edge does not, because its colour follows the scene (spread 51.5 against 49.8 for open scenery), and has to be recovered geometrically instead. *** GEOMETRY THAT IS ACTUALLY VISIBLE: only about half the 256x192 canvas ever reaches a screen -- the opaque region is x 40..215, y 16..175, split into two bands (y 16..87 and y 104..175) by a 16-row dead strip, which is the gap between the DS's two screens. Art stretched over the full canvas puts its centre in that strip and its left/right edges off-screen."
  address: 0x02170F50
  oracle: "ov3"
  sources: [notes/pyramid-of-light-findings.md, otn_enhanced/data/field_backgrounds.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    import functools
    b = bytes(rom.getFileByName('Data_arc_pac/duel2d/field.pac'))
    xor = lambda s: functools.reduce(lambda a, c: a ^ c, s, 0)
    nchunk = b[2]
    names = []
    for ci in range(nchunk):
        base = ci * 0x200
        assert b[base:base+2] == b'\x00\x00' and b[base+2] == nchunk
        i = base + 3
        while i + 2 < base + 0x200:
            ln = b[i]
            if ln == 0: break
            nm = b[i+2:i+2+ln]
            assert xor(nm) == b[i+1], f'xor checksum failed on {nm}'
            names.append(nm); i += 2 + ln
    assert len(names) == 65, f'{len(names)} names, expected 65'
    assert names[22] == b'fl_icon.lz5bg', 'the short 13-char name moved'
    ents, off = [], nchunk * 0x200
    while True:
        head = b[off:off+4]
        last = head[2:4] != b'\xff\xff'
        for k in range(head[2] if last else 63):
            ents.append(struct.unpack_from('<II', b, off + 8 + 8*k))
        off += 0x200
        if last: break
    assert len(ents) == len(names), 'table and name counts disagree'
    assert all(b[off+a] == 0x11 and b[off+a+5:off+a+9] == b'NTBG' for a, _ in ents), \
        'a file does not start with an LZ11 NTBG payload at the computed data base'
    # every stock Field Spell has a background except Speed World 0xDAC
    a = parse_pac(bytes(rom.getFileByName('Data_arc_pac/bin2.pac')), 'bin2.pac')
    bb = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    f = next(x for x in a.files if x.get_clean_name().lower() == 'card_prop.bin')
    cp = bb[f.address:f.address + f.size]
    n = (len(cp) - 8) // 8
    have = {int(nm[16:20]) for nm in names if nm.startswith(b'duel_field_magic')}
    fld = set()
    for i in range(n):
        v = int.from_bytes(cp[8+i*8:16+i*8], 'little')
        if ((v >> 32) & 0x3F) == 27 and ((v >> 46) & 7) == 2: fld.add(v & 0x3FFF)
    assert len(fld) == 65, f'{len(fld)} field spells, expected 65'
    assert fld - have == {0x0DAC}, f'field spells without a background: {fld - have}'
    # the ov3 loader and its format string
    assert h.bytes_at(0x0229207C, 43, 'ov3') == \
        b'/Duel2D/field/duel_field_magic%04d_P.LZ5bg\x00', 'the path format string moved'
    assert h.bytes_at(0x02170F50, 0x38, 'ov3').hex() == \
        '38402de94adf4de20120b0e128008de20200001aa0119fe5866efcfa010000ea'\
        '98119fe55d7efbeb28008de20410a0e30020a0e35796fafa', \
        'the field-background loader 0x02170F50 drifted'

- id: "carddata.card_intid_field_and_monster_bits"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "*** card_intid.bin IS A SECOND, INDEPENDENT COPY OF THE 'IS THIS A MONSTER' AND 'IS THIS A FIELD SPELL' CLASSIFICATION, AND THE FIELD-ZONE PLACEMENT READS IT RATHER THAN card_prop's SUBTYPE. *** card_intid.bin (bin2.pac) is a FLAT u16 array with NO header, indexed by (cid - 0xD48) and covering 6049 cids up to 0x24E8 -- the bounds are the two literals of the lookup 0x02029E1C (arm9), which returns the u16 from the table at [[lit+0x10]+0x3C]. The u16 is: low 14 bits = the card's card_prop RECORD INDEX (counting the 8-byte header as record 0, so it is one MORE than the header-relative index -- Pyramid of Light is card_prop record 1558 and intid index 1559), bit 15 = MONSTER, bit 14 = FIELD SPELL. Censused against card_prop across all 4305 cards with ZERO mismatches in both directions: bit 15 set on 2550/2550 monsters and 0/1755 Spells+Traps; bit 14 set on 65/65 Field Spells and 0/4240 everything else. The two readers are one-line ARM9 predicates over 0x02029E1C: 0x02029E60 tests bit 15 (`movs r1,#2 ; lsls r1,#0xE ; tst`) and 0x02029E80 tests bit 14 (`ldr r4,[pc] = 0x3FFF ; adds r1,r4,#1 ; tst`). *** WHY IT MATTERS -- THIS IS A THIRD FILE THAT carddata.card_genre_type_tags' warning did NOT cover. The spell-activation resolver at 0x02217EBE calls 0x02029E80 and, only on a TRUE, destroys whatever occupies zone index 0xA and sets the destination zone to 0xA (the field zone); on a FALSE it falls through to the ordinary spell/trap placement at 0x02217EF4. So a card whose card_prop says Field Spell but whose card_intid bit 14 is clear is placed in an ORDINARY SPELL/TRAP ZONE -- observed in game on Pyramid of Light 0x17BF (card.pyramid_of_light_field_spell), which landed at player+0xC0 (spell/trap slot 3) with the field zone player+0xFC empty. card_genre is NOT involved and was ruled out by census: it carries no field-spell tag at all -- one of the 65 Field Spells has genre 0x0000000000000000, and Chain Energy, an ordinary Continuous Spell, also has 0. *** THE ZONE MODEL THIS EXPOSES: a player's zones are ONE 11-slot array of 0x14-byte records at player+0x34 (player base 0x0229AC94, stride 0xB3C) -- index 0..4 monster (+0x34/+0x48/+0x5C/+0x70/+0x84), index 5..9 spell/trap (+0x98/+0xAC/+0xC0/+0xD4/+0xE8), index 10 FIELD (+0xFC). Confirmed by censusing every savestate in data/over_the_nexus/working against card_prop: +0xFC held a Field Spell in 23/23 hits, the monster offsets held only monsters, the spell/trap offsets only non-Field Spells and Traps. The engine agrees: 0x02255A94 rejects a monster (0x02029E60) in a zone index >= 5 and rejects a card_prop-subtype-2 card in any zone index != 0xA. *** CONSEQUENCE FOR THE DONOR TECHNIQUE: any conversion that crosses the monster/spell-trap line or the Field-Spell line must write card_intid too, and a whole-record card_prop template copy does NOT do it. bulk_card_props now derives both bits from the post-edit card_prop fields on every CHANGES entry."
  address: 0x02029E80
  oracle: "arm9"
  sources: [notes/pyramid-of-light-findings.md, otn_enhanced/data/bulk_card_props.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    b = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(b, 'bin2.pac')
    def blob(nm):
        f = next(x for x in a.files if x.get_clean_name().lower() == nm)
        return b[f.address:f.address + f.size]
    cp, ci = blob('card_prop.bin'), blob('card_intid.bin')
    a9 = env.arm9
    u32 = lambda ad: struct.unpack_from('<I', a9, ad - 0x02000000)[0]
    lo = u32(((0x02029E1C + 4) & ~3) + 0x20)
    hi = u32(((0x02029E26 + 4) & ~3) + 0x1C)
    assert (lo, hi) == (0x0D48, 0x24E9), f'intid cid bounds drifted: {lo:#x}..{hi:#x}'
    assert len(ci) == (hi - lo) * 2, 'card_intid.bin is not a flat u16 array over the cid range'
    # the two readers, byte for byte
    def fn(ad, k): return a9[ad - 0x02000000:ad - 0x02000000 + k].hex()
    assert fn(0x02029E60, 0x1A) == '08b506490840fff7d9ff02218903084201d0012008bd002008bd', \
        'the MONSTER predicate 0x02029E60 drifted'
    assert fn(0x02029E80, 0x18) == '10b5054c2040fff7c9ff611c084201d0012010bd002010bd', \
        'the FIELD-SPELL predicate 0x02029E80 drifted'
    # and the classification agrees with card_prop for every card
    n = (len(cp) - 8) // 8
    prop = [int.from_bytes(cp[8 + i * 8:16 + i * 8], 'little') for i in range(n)]
    mon = fld = bad14 = bad15 = 0
    for i, v in enumerate(prop):
        cid = v & 0x3FFF
        if not lo <= cid < hi: continue
        w = struct.unpack_from('<H', ci, (cid - lo) * 2)[0]
        ct, st = (v >> 32) & 0x3F, (v >> 46) & 7
        is_mon, is_fld = ct not in (27, 29), ct == 27 and st == 2
        mon += is_mon; fld += is_fld
        bad15 += is_mon != bool(w >> 15 & 1)
        bad14 += is_fld != bool(w >> 14 & 1)
        assert (w & 0x3FFF) == i + 1, f'intid index for cid {cid:#x} is not its card_prop record'
    assert (mon, fld) == (2550, 65), f'populations drifted: {mon} monsters, {fld} field spells'
    assert bad15 == 0, f'{bad15} cards disagree with card_intid bit 15 (MONSTER)'
    assert bad14 == 0, f'{bad14} cards disagree with card_intid bit 14 (FIELD SPELL)'

- id: "carddata.card_prop_era2_bitfield"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "card_prop.bin (bin2.pac) is a 4305-entry array of 8-byte LITTLE-ENDIAN BITFIELDS after an 8-byte header -- NOT byte fields. Layout: cid[0:14], atk[14:23] (//10), def[23:32] (//10), card_type[32:38], attribute[38:41], monster/spell flag[41], level[42:46], spell_trap_subtype[46:49], race[49:54], reserved[54:57]. *** ATK straddles bytes 1-2 and DEF straddles bytes 2-3, so byte 2 is half of each: the byte-indexed otn_enhanced/tools/randomiser.py corrupts both when it randomises 'ATK', and writing level*4 as the whole of byte 5 zeroes bit 41 (turning Spells and Traps into monsters). Proven by decoding cards to their real printed stats."
  sources: [randomiser/otn_randomiser.py, otn_enhanced/rom/game_constants.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    b = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(b, 'bin2.pac')
    cpf = next(f for f in a.files if f.get_clean_name() == 'card_prop.bin')
    cp = b[cpf.address:cpf.address + cpf.size]
    n = (len(cp) - 8) // 8
    assert n == 4305, f'card_prop entry count drifted: {n}'
    def fld(v, s, w): return (v >> s) & ((1 << w) - 1)
    seen = {}
    for i in range(n):
        v = int.from_bytes(cp[8 + i * 8:16 + i * 8], 'little')
        seen[fld(v, 0, 14)] = v
    # Blue-Eyes 0x0ED9 = Lv8 3000/2500 LIGHT(1) Dragon(1) Normal Monster(1)
    v = seen[0x0ED9]
    assert (fld(v, 42, 4), fld(v, 14, 9) * 10, fld(v, 23, 9) * 10,
            fld(v, 38, 3), fld(v, 49, 5), fld(v, 32, 6)) == (8, 3000, 2500, 1, 1, 1), \
        'Blue-Eyes White Dragon does not decode to Lv8 3000/2500 LIGHT Dragon Normal'
    # Shooting Star Dragon 0x239D = Lv10 3300/2500 WIND(6) Dragon(1) Synchro Effect(37)
    v = seen[0x239D]
    assert (fld(v, 42, 4), fld(v, 14, 9) * 10, fld(v, 23, 9) * 10,
            fld(v, 38, 3), fld(v, 49, 5), fld(v, 32, 6)) == (10, 3300, 2500, 6, 1, 37), \
        'Shooting Star Dragon does not decode to Lv10 3300/2500 WIND Dragon Synchro'
    # Dark Simorgh 0x1E5A = Lv7 2700/1000 DARK(2) Winged Beast(16)
    v = seen[0x1E5A]
    assert (fld(v, 42, 4), fld(v, 14, 9) * 10, fld(v, 23, 9) * 10,
            fld(v, 38, 3), fld(v, 49, 5)) == (7, 2700, 1000, 2, 16), \
        'Dark Simorgh does not decode to Lv7 2700/1000 DARK Winged Beast'

- id: "carddata.race_field_encodes_spell_trap"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "The card_prop race field [49:54] is NOT monsters-only: it holds 23 for every Spell (card_type 27) and 24 for every Trap (card_type 29), values outside the 1..22 monster race range. So a decoder that maps race through a monster-only table returns nothing for all 1755 Spell/Trap rows -- that is correct data, not drift. Population: 4305 rows = 1024 Spells + 731 Traps + 2550 monsters, of which 72 Tokens (21), 140 Synchros (35/37/39), 177 Tuners (31/33); 47 rows carry the 511 '?' ATK/DEF marker and 4 are level 0."
  sources: [randomiser/otn_randomiser.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    b = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(b, 'bin2.pac')
    cpf = next(f for f in a.files if f.get_clean_name() == 'card_prop.bin')
    cp = b[cpf.address:cpf.address + cpf.size]
    n = (len(cp) - 8) // 8
    def fld(v, s, w): return (v >> s) & ((1 << w) - 1)
    races = {27: set(), 29: set()}
    types = {}
    for i in range(n):
        v = int.from_bytes(cp[8 + i * 8:16 + i * 8], 'little')
        ct = fld(v, 32, 6)
        types[ct] = types.get(ct, 0) + 1
        if ct in races: races[ct].add(fld(v, 49, 5))
    assert races[27] == {23}, f'Spell race values: {races[27]}'
    assert races[29] == {24}, f'Trap race values: {races[29]}'
    assert types[27] == 1024 and types[29] == 731, \
        f'spell/trap counts drifted: {types[27]}/{types[29]}'
    assert sum(types[t] for t in (35, 37, 39)) == 140, 'synchro count drifted'
    assert types[21] == 72, 'token count drifted'

- id: "carddata.ydq_lp_header"
  subsystem: "card_data_files"
  confidence: "VERIFIED"
  claim: "A .ydq duel puzzle starts with magic 'YQ' (0x59 0x51) then TWO u16-LE life-point words: player 1 at +2 and player 2 at +4. puzzle.pac (PAC format v2) holds 17 files: the ten story puzzles 2011_tume01..tume10.ydq, Ynull.ydq, four *wrgp*_bin.ydq turbo setups, and lghost_rd.ydq. Setting a puzzle's opponent LP is therefore a 2-byte in-place write at entry.address+4 -- no re-encode needed."
  sources: [randomiser/otn_randomiser.py, otn_enhanced/rom/ydq_codec.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    p = bytes(rom.getFileByName('Data_arc_pac/puzzle.pac'))
    a = parse_pac(p, 'puzzle.pac')
    assert len(a.files) == 17, f'puzzle.pac file count drifted: {len(a.files)}'
    names = {f.get_clean_name(): f for f in a.files}
    for k in range(1, 11):
        nm = f'2011_tume{k:02d}.ydq'
        assert nm in names, f'{nm} missing from puzzle.pac'
        e = names[nm]
        assert p[e.address:e.address + 2] == b'\x59\x51', f'{nm} lacks YQ magic'
        p1 = struct.unpack_from('<H', p, e.address + 2)[0]
        p2 = struct.unpack_from('<H', p, e.address + 4)[0]
        assert 0 < p1 <= 64000 and 0 < p2 <= 64000, f'{nm} LP out of range: {p1}/{p2}'
    # tume01 ships 100 / 2800 and tume09 ships 900 / 6700.
    e = names['2011_tume01.ydq']
