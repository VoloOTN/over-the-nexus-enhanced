he donor rides the default arm exactly as ten of its eleven native users do. *** DELIBERATE DEVIATIONS, all stated in the module header: CLAUSE 1 (the Quick-Effect 'targeted by a card or effect') IS NOT BUILT -- it needs a cls3 record and its invoker is still open; the position change is a TRUE TOGGLE rather than the natives' Attack->Defense-only; the turn log is stamped on resolution, before the negate is attempted; and 'then you can Special Summon' is not modelled as a second separate prompt (every native card on this handler has the same granularity). Clause 1 will be a cls3 record, a DIFFERENT table, so it cannot shadow this one, and it will share the cid-keyed turn log automatically. ov5 => NORMAL-DUEL ONLY."
