- id: "counter.capacity_gate"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "⚠️ THE GATE THAT ACTUALLY DECIDES WHETHER A COUNTER IS PLACED. 0x021C7D80 does NOT place blindly: at 0x021C7D8C it reads the current count via 0x021A3054(side, zone, type) and at 0x021C7DD0 it reads the CAPACITY via 0x021A2F10(side, zone, type), returning 0 (placing nothing) when the capacity is 0 or already reached. 0x021A2F10 switches on the counter TYPE; each arm is a hard-coded per-cid chain over the cid of the card in that zone (from 0x021A36F8). The TYPE 6 (Bushido) arm starts at 0x021A2F9E: 0x1D22 Six Samurai United -> 2 (this, NOT a separate clause, is that card's printed '(max. 2)'), 0x219A Gateway of the Six -> 0xFF, 0x247E Temple of the Six -> 0xFF, anything else -> 0. CONSEQUENCE FOR PATCHING: a donor given a registry row AND an arm call still accrues NOTHING until it also has a capacity entry. Measured in-game both ways: Shien's Dojo accumulated no counters with the row+arm correct, and accumulated correctly once a capacity entry was added (shiens_dojo PART E). So the COMPLETE recipe for 'card X accrues counters of type T' is THREE things: a registry row @0x02275510 pointing at a type-T thunk, an arm call in the event-gated branch, and a capacity entry in 0x021A2F10's type-T arm. Other type arms grant capacity by archetype predicate instead of a cid literal (type 1 calls the ARM9 thunk 0x0202352C)."
  address: 0x021A2F10
  oracle: "ov3"
  sources: [notes/shiens-dojo-findings.md]
  proof: |
    assert h.bl_target(0x021C7D8C, 'ov3') == 0x021A3054, 'current-count call moved'
    assert h.bl_target(0x021C7DD0, 'ov3') == 0x021A2F10, 'capacity call moved'
    # the type-6 chain: {cid literal, capacity immediate} x 3
    assert h.u16(0x021A2F9E, 'ov3') == 0x4926, 'type-6 chain head is not the LDR'
    for pool, cid, imm_at, cap in ((0x021A3038, 0x1D22, 0x021A2FA4, 0x02),
                                   (0x021A303C, 0x219A, 0x021A2FAE, 0xFF),
                                   (0x021A3040, 0x247E, 0x021A2FB8, 0xFF)):
        assert h.u32(pool, 'ov3') == cid, f'capacity chain literal {pool:#x} drifted'
        hw = h.u16(imm_at, 'ov3')
        assert (hw >> 11) == 0b00100 and ((hw >> 8) & 7) == 0 and (hw & 0xFF) == cap, \
            f'capacity immediate at {imm_at:#x} is not MOV R0,#{cap:#x}'

- id: "counter.deck_ss_resolver"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "The shared 'Special Summon from your Deck' RESOLVER is 0x02206CAC (Thumb entry 0x02206CAD). It is slot +04 of both Shien's Footsoldier 0x1B3A (cls2[237], whose +0C/+10 are the known leave-trigger pair) and Six Scrolls of the Samurai 0x1F76 (cls0[1024]) — the two cards whose text is 'SS 1 <filtered> monster from your Deck'. Shape: R4 = descriptor, side = [R4+2]^[R4+6], then a NINE-way phase jump table on [0x0229AAFC+0x70] - 0x78 (phases 0x78..0x80; CMP #8 / BLS), exiting at 0x02206EFE outside that range. ⚠️ CORRECTED 2026-08-31: this fact used to say the 'halfword offset table' is at 0x02206CC6. IT IS AT 0x02206CD2, WITH ADD-PC BASE 0x02206CD4 — 0x02206CC6 is the prologue's own `adds r1,r1,r1`, and decoding the table there returns the PROLOGUE'S INSTRUCTION HALFWORDS as plausible-looking 'arms' (0x02206CC8 + 0x1849 = 0x02208511, and so on for all nine). A handoff prompt did exactly that and sent a whole session after a picker arm that is not on the path. The arms are enumerated in counter.deck_ss_phase_arms. Per-cid arms sit inside the phase bodies. ⚠️ Its per-cid switch keeps the compare base in [sp,#n], so a register-only scan of its cid membership is WRONG (see thumb.stack_based_switch): such a scan misses 0x1B3A and 0x1F76 even though both provably route here via their cls records. Enumerate its arms with a CFG walk, not a linear scan."
  address: 0x02206CAC
  oracle: "ov3"
  sources: [notes/shiens-dojo-findings.md]
  proof: |
    for rec_base, idx, cid in ((0x02275C04, 237, 0x1B3A), (0x0227E64C, 1024, 0x1F76)):
        assert h.u32(rec_base + idx * 24, 'ov3') == cid, f'record {idx} is not {cid:#06x}'
        assert h.u32(rec_base + idx * 24 + 4, 'ov3') == 0x02206CAD, \
            f'{cid:#06x} slot +04 is no longer the shared deck-SS resolver'
    # the phase window: SUB R1,#0x78 ; CMP R1,#8 ; BLS
    assert h.u16(0x02206CBE, 'ov3') == 0x3978, 'phase base is not 0x78'
    assert h.u16(0x02206CC0, 'ov3') == 0x2908, 'phase span is not 9 wide'

- id: "dispatch.offer_check_probes_rel0_only"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "*** AN IGNITION EFFECT IS OFFERED ON THE STRENGTH OF REL 0 ALONE, SO A COST WHOSE ZONE IS NOT REL 0 IS NEVER PRE-CHECKED -- and on this engine that is a SOFT-LOCK, not a fizzle. The chain is the menu -> 0x0224AD94 -> slot3 -> 0x021F0BDD -> f2 0x021F0419, and f2 calls 0x02243FE0(side, desc[+0], param) with param = 0x02234E78(desc), which is 0 for any donor -- so it probes REL 0 and nothing else. A two-row card (cost in one zone, effect in the other) therefore gets NO check at all on whichever half is rel 1. *** MEASURED IN-GAME 2026-09-01 on card.upstart_golden_ninja: with a Level 4 Ninja in the Deck (rel 0, satisfied) but NO TRAP in hand (rel 1, unsatisfiable), the effect was offered, and activating it opened the discard picker with zero candidates and NO WAY OUT. The user's words: 'I am trapped in the \"choose a card to discard\" but cannot select a card to discard.' The cost filter itself was working correctly -- it rejected all four cards -- which is exactly why the picker was empty. *** THE FIX IS A SCANNING CONDITION at cls3 +0C that walks the other zone before chaining the stock condition. AND THE SCAN MUST LOOP: **BOTH 0x02243FE0 AND 0x02243FA8 TEST ONLY THE ONE CANDIDATE AT INDEX `param` WHEN THE ROW IS A HAND ROW** -- measured over a savestate, a hand of [filler, Trap] returns 0 at param 0 and 1 at param 1, and [filler, filler, Trap] returns 1 only at param 2. Neither primitive enumerates the hand, so a single param-0 probe is the same mistake in a new place (it is what made this card's FIRST in-game test fail too). The loop bound is the hand count at player + side * 0xB3C + 0x0C (ram.container_for_zone_code). *** A LATCH IS THE RIGHT TOOL FOR THE SCAN and the WRONG tool for the cost, which is worth stating together because the two look identical: 0x02243FE0 is SYNCHRONOUS and has returned before the byte is cleared, whereas 0x021E7245 merely ARMS an asynchronous picker and returns immediately (see dispatch.cost_machine_state_is_the_row_discriminator). *** ⚠️ WHEN VERIFYING SUCH A CONDITION OFFLINE, PICK A ZONE WITHOUT THE 0x0FB6 RIDER: the first run of the fix's test matrix returned 0 for every case and looked like a broken scan; tracing showed the loop had found the candidate and reached its success path, and the 0 came from the chained f1 rejecting a zone whose copy had already used its effect."
  address: 0x021F0419
  oracle: "ov3"
  sources: [notes/upstart-golden-ninja-findings.md]
  proof: |
    # f2 takes its param from the provider, whose donor default is 0 -> rel 0
    assert h.bl_target(0x021F0432, 'ov3') == 0x02234E78, \
        'f2 no longer asks the param provider'
    assert h.bl_target(0x021F043C, 'ov3') == 0x02243FE0, \
        'f2 no longer probes candidates through 0x02243FE0'
    assert h.u16(0x022355F0, 'ov3') == 0x2000, \
        'the param provider default leaf is no longer movs r0,#0'
    # and the condition it feeds is the registry-driven one
    assert h.u16(0x021F0BF0, 'ov3') & 0xFF00 == 0xD000, \
        '0x021F0BF0 is no longer the not-found conditional branch'

- id: "dispatch.cost_machine_state_is_the_row_discriminator"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "*** THE ONLY RELIABLE WAY TO TELL 'THE COST IS SELECTING' FROM 'THE MENU / THE RESOLVER IS ASKING', and the third thing tried for it -- the first two each cost an in-game test. A cls3 card whose COST filters one zone and whose EFFECT filters another needs a different criteria row at each moment, and both moments pass param 0 (dispatch.cost_flag_desc7_separates_two_rows). WHAT DOES NOT WORK: (1) desc[+7], because the menu offer-check runs before the cost has run and so shares the value 0 with the cost itself; (2) A LATCH SET BY THE COST STUB around its call to the native cost, because 0x021E7245 only ARMS the selection (0x0224B9F0 is pure setup) and RETURNS -- the candidates are filtered LATER, when the picker actually runs, by which time the stub has already cleared the latch. MEASURED in rom_upstart.ml3 with the discard picker open on screen: the card's own STAGE byte read 0 while [0x0229DD94+0x4C] (the selection mode) read 8, and the picker was consequently UNFILTERED -- any card could be discarded for a cost printed 'send 1 Trap'. *** WHAT WORKS IS THE COST MACHINE'S OWN STATE WORD, [0x0229AAFC + 0x7C], which the engine maintains across the whole asynchronous selection: non-zero exactly while the record-driven cost is running, 0 at the menu and at resolution. Measured 2 in rom_upstart.ml3 (picker open) and 0 in rom_upstart.ml2 (menu) and rom_upstart.ml4 (after resolution). THE RESET IS PROVEN, NOT ASSUMED: the activation state machine does `movs r1,#0` @0x02217FB6 and `str r1,[r4,#0x7c]` @0x02217FBA with r4 = 0x0229AAFC, in the same breath as the `strb r0,[r5,#7]` that sets desc[+7] -- so by the time the resolver runs the word is back to 0. One global read, no latch, no timing window. card.upstart_golden_ninja's arm on the shared criteria_row_hook uses exactly this."
  address: 0x0229AAFC
  oracle: "ov3"
  sources: [notes/upstart-golden-ninja-findings.md]
  proof: |
    # the cost machine's state word is zeroed by the activation machine
    assert h.u16(0x02217FB6, 'ov3') == 0x2100, '0x02217FB6 is no longer movs r1,#0'
    assert h.u16(0x02217FBA, 'ov3') == 0x67E1, \
        '0x02217FBA is no longer str r1,[r4,#0x7c] -- the cost-state reset moved'
    assert h.u32(0x02217F8C - 2, 'ov3') is not None
    # 0x0224B9F0 really is pure setup that returns (hence the latch failure mode)
    assert h.u16(0x0224BA08, 'ov3') == 0xBD38, \
        '0x0224B9F0 no longer ends in `pop {r3,r4,r5,pc}` -- it may not be setup-only'
    assert h.u16(0x0224B9F6, 'ov3') == 0x64E5, '0x0224B9F6 no longer stores mode 8'

- id: "timing.you_can_tag_posts_a_per_copy_rider"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "*** 0x021E5060, THE SHARED 'YOU CAN' TAG, IS THE PER-COPY ONCE-PER-TURN POSTER, and it is the right latch for a printed 'Once per turn:' on a MONSTER -- unlike dispatch.turnlog_once_per_turn_pair, which is keyed on the CID and therefore locks EVERY COPY of the card for the turn. Body (disassembled 2026-09-01): a gate `bl 0x021D2C1C`, then `ldrb r0,[r4,#2]` (side), `ldrb r1,[r4,#3]` (THE SLOT), `ldr r2,=0x0FB6`, `movs r3,#2`, `bl 0x021C479C` -- the attached-node writer. Because the key is side + SLOT it is scoped to ONE monster in ONE zone. *** IT PAIRS WITH A QUERY ALREADY PRESENT IN THE NATIVE IGNITION CONDITION: the ignition-condition registry row's f1 for Beast Striker 0x20B8 is 0x021F024D, whose first act is `ldrb r0,[r5,#2] ; ldrb r1,[r5,#3] ; ldr r2,=0x0FB6 ; bl 0x021A1430` -- the same side + slot + key. So a donor that takes Beast Striker's registry row and posts this tag from its cost gets 'once per turn, per copy' with NO condition stub of its own: the stock 0x021F0BDD does the whole check. *** MEASURED THE HARD WAY: with the cid-keyed turn log instead, in-game test 2 on card.upstart_golden_ninja showed a second copy Special Summoned by the first having NO effect entry in its menu (rom_upstart.ml4 has both donors on the field). ⚠️ NOT VERIFIABLE IN THE SAVESTATE EMULATOR: the attach 0x021C479C is reached (traced) and 0x021E5060 returns 1, but the following 0x021A1430 query still reads 0, because the post is an event-queue operation a static run does not settle -- the identical limitation was confirmed with Pot of Duality 0x2321 as a native control for the turn-log pair."
  address: 0x021E5060
  oracle: "ov3"
  sources: [notes/upstart-golden-ninja-findings.md]
  proof: |
    # the tag keys on side + SLOT, which is what makes it per copy
    assert h.u16(0x021E5070, 'ov3') == 0x78A0, '0x021E5070 is no longer ldrb r0,[r4,#2]'
    assert h.u16(0x021E5072, 'ov3') == 0x78E1, '0x021E5072 is no longer ldrb r1,[r4,#3]'
    assert h.bl_target(0x021E5078, 'ov3') == 0x021C479C, 'the node attach moved'
    # ... and the native ignition condition f1 queries exactly that key
    assert h.u16(0x021F0252, 'ov3') == 0x78A8, '0x021F0252 is no longer ldrb r0,[r5,#2]'
    assert h.u16(0x021F0254, 'ov3') == 0x78E9, '0x021F0254 is no longer ldrb r1,[r5,#3]'
    assert h.bl_target(0x021F0258, 'ov3') == 0x021A1430, 'the rider query moved'
    # both sides load the SAME key
    post_key = h.u32(((0x021E5074 + 4) & ~3) + (h.u16(0x021E5074, 'ov3') & 0xFF) * 4, 'ov3')
    qry_key = h.u32(((0x021F0256 + 4) & ~3) + (h.u16(0x021F0256, 'ov3') & 0xFF) * 4, 'ov3')
    assert post_key == qry_key == 0x0FB6, \
        f'the rider key drifted: post {post_key:#x} query {qry_key:#x}'

- id: "counter.deck_ss_position_encoding"
  subsystem: "counter_engine"
