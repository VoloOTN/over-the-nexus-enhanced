  address: 0x022713C4
  oracle: "ov3"
  sources: [notes/eclipse-wyvern-findings.md]
  proof: |
    base, cnt = 0x022713C4, 1388
    cids = [h.u16(base + i * 12, 'ov3') for i in range(cnt)]
    rows = {c: i for i, c in enumerate(cids)}
    # the GE form, read straight off the rows whose text names a lower bound
