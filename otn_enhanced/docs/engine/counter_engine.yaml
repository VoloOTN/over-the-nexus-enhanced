- id: "counter.normal_monster_gy_row"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "*** THE CRITERIA ROW FOR 1 NORMAL MONSTER IN YOUR GRAVEYARD IS {handler 0x0223DE05, flags 0x0002, extra 0x0001} -- i.e. criteria word 0x00010002. Handler 0x0223DE05 owns six rows in 0x022713C4; the FOUR carrying that exact word are Silent Doom 0x14F7, Soul Resurrection 0x17B7, Birthright 0x1B65 and Swing of Memories 0x1C58, and all four are printed Special Summon 1 Normal Monster from your Graveyard -- 4/4 semantic agreement. (The other two are Supervise 0x20F3, same word and same verb, and Knight of the Red Lotus 0x2113 with a different word.) The handler itself is a thin forwarder: it passes r1 = the row cid, [sp] = the row flags and [sp+4] = 0x1008 to the zone builder 0x0223C4E8. INDEPENDENTLY CROSS-VALIDATED against the 3DS build, which ships Azure-Eyes Silver Dragon (cid 0x2961, the SAME cid space) with the equivalent row against the same four handler-sharers -- two independent Konami builds agree on the encoding. CONSEQUENCE: a donor gets a Normal-Monster Graveyard selection from ONE data row, no code. azure_eyes does exactly that."
  address: 0x0223DE04
  oracle: "ov3"
  sources: [notes/azure-eyes-silver-dragon-findings.md]
  proof: |
    B, CNT = 0x022713C4, 0x56C
    rows = [(h.u16(B + i * 12, "ov3"), h.u16(B + i * 12 + 2, "ov3"),
             h.u32(B + i * 12 + 4, "ov3"), h.u32(B + i * 12 + 8, "ov3"))
            for i in range(CNT)]
    fam = [r for r in rows if r[2] == 0x0223DE05]
    assert len(fam) == 6, f"handler 0x0223DE05 now owns {len(fam)} rows, not 6"
    named = {r[0] for r in fam if r[3] == 0x00010002}
    assert {0x14F7, 0x17B7, 0x1B65, 0x1C58} <= named, "a Normal-Monster reviver left the family"
    for cid in (0x14F7, 0x17B7, 0x1B65, 0x1C58):
        row = next(r for r in rows if r[0] == cid)
        assert row[1] == 0xFFFF, f"{cid:#06x} no longer has aux 0xFFFF (no archetype filter)"

- id: "counter.trigger_registry"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "The CONTINUOUS-TRIGGER REGISTRY @0x02275510 is 181 rows x 8 bytes, laid out {+0x00 Thumb handler pointer, +0x04 cid} (cid 0 = unconditional row). It is the table that gives a face-up card a per-event continuous handler (counter accrual and friends). Geometry is closed twice over: a shape-walk from any row yields exactly 181 rows, AND both consumers hard-code the count as `CMP Rn,#0xB5`. Its last row starts at 0x02275AB0 and its exclusive end IS synchro.list_a @0x02275AB8 — there are ZERO spare bytes, so a new row must OVERWRITE an existing one (16 rows name cids with no card_prop record and are therefore dead); appending would also require editing both count immediates."
  address: 0x02275510
  oracle: "ov3"
  sources: [notes/shiens-dojo-findings.md]
  proof: |
    base, cnt = 0x02275510, 0xB5
    for i in range(cnt):
        p = h.u32(base + i * 8, 'ov3')
        c = h.u32(base + i * 8 + 4, 'ov3')
        assert p & 1 and env.oracle_name(p & ~1) == 'ov3', \
            f'row {i} handler {p:#x} is not a Thumb ov3 pointer'
        assert c in (0, 0xFFFFFFFF) or 0x0B00 <= c <= 0x2600, \
            f'row {i} cid {c:#x} out of range'
    assert base + cnt * 8 == 0x02275AB8, 'registry no longer abuts LIST_A'
    # the two walkers' hard-coded counts
    for a in (0x02248196, 0x0224821C):
        hw = h.u16(a, 'ov3')
        assert (hw >> 11) == 0b00101 and (hw & 0xFF) == 0xB5, \
            f'count immediate at {a:#x} is not CMP Rn,#0xB5'
    # the three Bushido rows
    for row, cid in ((76, 0x1D22), (77, 0x247E), (78, 0x219A)):
        assert h.u32(base + row * 8 + 4, 'ov3') == cid, f'row {row} is not {cid:#06x}'

- id: "counter.thunk_encodes_type_and_amount"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "A registry handler for a counter card is a 12-BYTE THUNK {LDR R3,[PC,#4]; MOV R1,#type; MOV R2,#amount; BX R3; .word 0x02247305} — i.e. the COUNTER TYPE and AMOUNT are encoded entirely in the thunk, and the shared body is 0x02247304. 0x022473C4 = type 6 amount 1 (Six Samurai United 0x1D22 AND Temple of the Six 0x247E share it); 0x022473D0 = type 6 amount 2 (Gateway of the Six 0x219A). The 1/1/2 split matches the printed card text exactly, which is what identifies TYPE 6 = BUSHIDO COUNTER. Consequence for patching: giving a donor Bushido counters needs NO new code — point a registry row at the existing thunk 0x022473C5."
  address: 0x022473C4
  oracle: "ov3"
  sources: [notes/shiens-dojo-findings.md]
  proof: |
    for thunk, typ, amt in ((0x022473C4, 6, 1), (0x022473D0, 6, 2)):
        assert h.u16(thunk + 0, 'ov3') == 0x4B01, 'thunk does not start LDR R3,[PC,#4]'
        mov1 = h.u16(thunk + 2, 'ov3')
        mov2 = h.u16(thunk + 4, 'ov3')
        assert (mov1 >> 11) == 0b00100 and ((mov1 >> 8) & 7) == 1 and (mov1 & 0xFF) == typ
        assert (mov2 >> 11) == 0b00100 and ((mov2 >> 8) & 7) == 2 and (mov2 & 0xFF) == amt
        assert h.u16(thunk + 6, 'ov3') == 0x4718, 'thunk does not end BX R3'
        assert h.u32(thunk + 8, 'ov3') == 0x02247305, 'thunk body pointer drifted'

- id: "counter.six_samurai_arm_site"
  subsystem: "counter_engine"
  confidence: "VERIFIED"
  claim: "The ONLY archetype gate on the Bushido path is at the summon dispatcher: 0x02266BC6 calls the ARM9 Six Samurai predicate 0x02023A18 with the summoned cid, and on a non-zero result runs three back-to-back arm calls {0x02266BD0, 0x02266BD6, 0x02266BDC} -> 0x02244418, with the cids 0x1D22 / 0x219A / 0x247E loaded from the pool words 0x02266DD4 / D8 / DC. Neither the registry walker, the thunk, the body 0x02247304, nor the place primitive 0x021C7D80 tests the archetype — so a donor needs BOTH a registry row AND an arm call here. 0x02023A18 binary-searches the 18-entry set-code table 0x0209CA8C, else the 4-entry Six Samurai Spell/Trap table 0x0209C5C2."
  address: 0x02266BC6
  oracle: "ov3"
  sources: [notes/shiens-dojo-findings.md]
