n 'the donor reaches the right arm'. *** FIXED PROPERLY 2026-08-28: _switch_leaf now follows an indirect tail, but ONLY when the BX is inside a REGISTERED stub, where the register value provably came from a literal load out of the same overlay image rather than from unmodelled code -- so the tracer's conservatism everywhere else is untouched and no other patch's reported leaf can move. Eclipse's donor now traces through GATE_ACCEPT to 0x021D19BE `STR R0,[SP,#0x14]`, the ACCEPT path's flag store, which is a MEANINGFUL terminus: reject cids stop two bytes later at SWITCH_END 0x021D19C0 `MOVS R0,#0`, so the guard now genuinely distinguishes accept from reject. ⚠️ _switch_leaf is ANALYSIS ONLY and never writes ROM bytes -- the combined ROM's sha256 was 4c5cf154... before and after this change. *** ⚠️ THE SAME REGISTRATION-IS-AN-IMPORT-SIDE-EFFECT PROPERTY BIT A SECOND TIME, IN THE VERIFY SWEEP: _verify_all_patches.py imported each module lazily inside its verify loop, so whether a stub was registered depended on SHIPPED's ORDERING. snoww sits before grapha in that list, so Snoww verified while Grapha's stub was still unregistered and reported a phantom whole-table regression against a ROM that was correct -- the same walk PASSES the moment both modules are imported. The sweep now imports EVERY module first and verifies afterwards. GENERAL RULE: when a module publishes shared state as an import side effect, any harness that loads modules one-at-a-time will see a partially-populated world, and the symptom is a failure in some OTHER module that looks like a real regression."
