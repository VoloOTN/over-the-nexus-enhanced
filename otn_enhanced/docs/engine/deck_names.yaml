  claim: "*** CORRECTED 2026-09-17 -- the original version of this fact claimed the AR-code target 0x02126976 sits inside the event-flag array below. THAT WAS AN ARITHMETIC ERROR: the 0xFA (250) constant in event_flag_get/set's range-3 dispatch is a COUNT OF FLAG IDS, not a byte size -- the array is bit-packed (asrs #3 / ands #7), so its true footprint is ceil(250/8) = 32 BYTES (0x021268F8-0x02126918), not 250. 0x02126976 is 0x5E bytes PAST the real end of that array -- outside it, not inside. The 'duelist unlock = event flag 0x5210+N-0x70' conclusion does NOT hold; do not reuse it. *** What IS still real and useful from this detour: event_flag_get(flag_id) at 0x0201B36C and its write counterpart event_flag_set/clear(flag_id, mode) at 0x0201B2AC are a genuine matched Thumb read/write pair (byte-for-byte structurally identical, both dispatching on the same 3 flag-id ranges: [10000,11280) at 0x021235C0+0xC4 sized 1280 bits/160 bytes, [20000,20250) at master+0x288C sized 250 bits/32 bytes, and a third 16-bit-per-entry range [0,80) at 0x021235C0). event_flag_get is already used throughout pack_unlock_conditions.py's StoryFlag condition (e.g. StoryFlag(0x4E40) = 20032, inside range 2). Searching for CALLERS of event_flag_set/get found NONE in plain Thumb BL within arm9 itself (only 2, unrelated flag ids 4/8) -- the real callers are ARM-mode overlay code reaching these Thumb functions via ARM's BLX(immediate) encoding, which a Thumb-BL-only scan completely misses. Found this way: 66 event_flag_set callers and 178 event_flag_get callers across overlays 1/3/7/8/10/15/18/23/25/29/30/31/32/33/34/37/38 -- NONE in ov1 for the write side. Overlay 31 alone accounts for over a third of the write callers, several as tight clusters of sequential literal flag ids (e.g. 0x02177fcc: 0x2a6a,0x2a6b,0x2a6c,... nine in a row) and many more where the flag id is a RUNTIME-COMPUTED value (not a literal my simple backward-scan could resolve) -- exactly the shape a 'for each duelist in this story chapter, set their flag' loop would have. None of the literal ones resolved so far fall in the CPU-duel roster's id space, but the computed-value calls in ov31 are the live, unexplored thread."
