- id: "deck_names.table_base"
  subsystem: "deck_names"
  confidence: "VERIFIED"
  claim: "Deck DISPLAY names (\"Dingy Daredevil\", \"My Almighty Legend\", ...) resolve through the SAME id -> game_indx_e.bin -> game_text_e.bin mechanism already used for duelist names (pack_unlock_conditions.py:304-321, DUELIST_NAME_TABLE=0x020AA7D4), but via a SEPARATE, larger arm9 u16[] array: DECK_NAME_TABLE = 0x020AA5D8, same id space as DUELIST_NAME_TABLE (ids 0x00.. -- story roster, then CPU-duel roster 0x71-0xAC, then a further roster through ~0xFC, matching the third-roster ids 0xD5-0xE8 already seen in duelist.unlocked_bitfield_offsets). DECK_NAME_TABLE is immediately followed by DUELIST_NAME_TABLE with NO gap and no other data between them -- 0x020AA5D8 + 0xFE*2 == 0x020AA7D4 exactly -- so it holds precisely 254 entries (ids 0x00-0xFD) before the two arrays alias into each other (id 0xFE/0xFF read as DUELIST_NAME_TABLE id 0/1, both \"You\"). Ids 0x00/0x01 (the player) resolve to text-id 0, an empty/invalid entry, mirroring DUELIST_NAME_TABLE's own id-0/1 behaviour. game_indx_e.bin/game_text_e.bin are inside Data_arc_pac/bin2.pac (PAC v1); each is a flat null-terminated-ASCII string pool, entries packed back-to-back and padded to the next 4-byte boundary, indexed by a u32[] offset table (game_indx_e.bin[text_id*4]) -- NOT fixed-stride slots, so a same-or-shorter rename can be patched in place but a longer one needs a new string appended elsewhere and its one index entry repointed, not a full re-flow."
  address: 0x020AA5D8
  oracle: "arm9"
  sources: [notes/deck-name-findings.md, notes/booster-pack-unlock-findings.md, otn_enhanced/system/pack_unlock_conditions.py]
  proof: |
    import logging, pathlib, struct
    logging.disable(logging.CRITICAL)
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    bin2 = bytes(rom.getFileByName('Data_arc_pac/bin2.pac'))
    a = parse_pac(bin2, 'bin2.pac')
    by_name = {f.get_clean_name(): f for f in a.files}
    idx_f, txt_f = by_name['game_indx_e.bin'], by_name['game_text_e.bin']
    idx = bin2[idx_f.address:idx_f.address + idx_f.size]
    txt = bin2[txt_f.address:txt_f.address + txt_f.size]
    img = env.image('arm9')
    DECK_NAME_TABLE = 0x020AA5D8
    def deck_name(did):
        tid = struct.unpack_from('<H', img, DECK_NAME_TABLE - 0x02000000 + did * 2)[0]
        o = struct.unpack_from('<I', idx, tid * 4)[0]
        return txt[o:txt.index(b'\x00', o)].decode('ascii')
    expect = {0x71: 'Dingy Daredevil', 0x72: 'Tomato Alliance', 0x73: 'Hip Hypnocorn', 0x74: 'Organic Cherries', 0x75: "Watt's Up?"}
    for did, want in expect.items():
        got = deck_name(did)
        assert got == want, f'id {did:#x}: got {got!r}, expected {want!r}'
    assert DECK_NAME_TABLE + 0xFE * 2 == 0x020AA7D4, 'DUELIST_NAME_TABLE adjacency drifted -- DECK_NAME_TABLE entry count is no longer 254'

- id: "duelist.unlock_is_event_flags"
