- id: "setcode.synchron_table"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "*** THE 'Synchron' ARCHETYPE IS SET CODE 0x4C, and it is the table `Tuning` searches -- so a donor that should be a Synchron MUST be inserted here or the card is invisible to Tuning. Pointer table 0x0209D0D8 index 0x4C -> thunk 0x02023E1D = `ldr r1,=0x0209C968 ; ldr r3,=0x02022E15 ; movs r2,#0xF ; bx r3`, i.e. a sorted 15-entry u16 cid array @0x0209C968 with the count hardcoded as `movs r2,#0x0F` @0x02023E20. It has EXACTLY ONE consumer: 0x0209C968 occurs as an aligned u32 literal once in all of ARM9 (at 0x02023E24), so there is no second hardcoded count to keep in sync. Members: 0x0D6B Speed Spell - Deceased Synchron, 0x1E07 Junk Synchron, 0x1E14 Nitro Synchron, 0x1E4E Synchro Deflector, 0x1EA1 Road Synchron, 0x1EBE Turbo Synchron, 0x1F46 Hyper Synchron, 0x20F7 Quickdraw Synchron, 0x21A7 Drill Synchron, 0x224C Changer Synchron, 0x229E Synchron Explorer, 0x239E Formula Synchron, 0x23EE Fleur Synchron, 0x2414 Bri Synchron, plus ONE phantom 0x2501 (a Konami-reserved Synchron id with no card_prop) -- the count-neutral drop slot, spent by unknown_synchron. *** THE CONSUMER PROOF: Tuning 0x23A2 owns criteria row 1269 @0x02274F40 = {cid 0x23A2, aux 0x004C, handler 0x0223CAF5, word 0x00008002}, and aux == 0x4C IS this set code. *** ⚠️ donor_scan.ARM9_STRUCTS does NOT list this table (it knows only Infernity / T.G. / X-Saber / AoJ / Watt / Karakuri / Gladiator Beast), so a 'no set-code table membership' verdict from that tool does not cover Synchron -- or any other unlisted archetype."
  address: 0x0209C968
  oracle: "arm9"
  sources: [unknown_synchron.py, notes/unknown-synchron-findings.md]
  proof: |
    assert h.u32(0x0209D0D8 + 0x4C * 4, 'arm9') == 0x02023E1D, 'set-code 0x4C thunk moved'
    assert h.u32(0x02023E24, 'arm9') == 0x0209C968, 'Synchron thunk pool drifted'
    assert h.u16(0x02023E20, 'arm9') == 0x220F, 'Synchron count immediate != movs r2,#0x0F'
    got = tuple(h.u16_table(0x0209C968, 15, 'arm9'))
    assert h.is_sorted_unique(got), f'Synchron table not sorted-unique: {[hex(x) for x in got]}'
    assert 0x1E07 in got and 0x20F7 in got, 'expected Junk/Quickdraw Synchron as members'
    # Tuning's criteria row carries this set code as its aux
    row = 0x022713C4 + 1269 * 12
    assert h.u16(row, 'ov3') == 0x23A2, 'Tuning criteria row moved'
    assert h.u16(row + 2, 'ov3') == 0x004C, 'Tuning aux is not set-code 0x4C'

