- id: "setcode.dark_world_table"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "The \"Dark World\" set code is 0x0F, its consumer thunk is 0x020238B5 (has_set_code pointer table 0x0209D0D8 index 0x0F), and its cid list is a sorted 16-entry u16 array @0x0209CA06: phantom 0x0EC9, Zure 0x1961, Beiige 0x1965, Broww 0x1966, Brron 0x1967, Sillva 0x1968, Goldd 0x1969, Scarr 0x196A, Dark World Lightning 0x1970, Gateway to Dark World 0x1973, Reign-Beaux 0x1B3D, Kahkki 0x1B3E, Gren 0x1B3F, Dark World Dealings 0x1B5A, RENGE 0x1C18 and Dark World Grimoire 0x1D25. The bounds are closed from both ends: 0x020238B4's ONLY literal is the list base, and the next thunk's base 0x0209CA26 is exactly 16 entries later. 0x020238B4 has ZERO direct BL callers in arm9 + ov3 -- it is reachable only through the thunk table. *** WHY IT MATTERS: aux 0x000F in a criteria row IS this set code (Scarr's row {0x196A, 0x000F, 0x0223CAF5, 0x00900002} = 'add 1 Level 4 or lower Dark World MONSTER from your Deck'; Gateway's {0x1973, 0x000F, 0x0223C9ED, 0x00010002} = '1 Dark World monster in your GY'). And RENGE 0x1C18, the records-free vanilla Normal Monster used as the Snoww donor, is ALREADY a member -- so that patch makes a real 'Dark World' card without touching this table at all.
*** MEMBERSHIP OF THIS LIST IS WHAT 'IS A DARK WORLD CARD' MEANS, AND A DONOR DOES NOT INHERIT IT FROM ITS NAME. Found IN-GAME 2026-08-27: with Snoww live, its search could not fetch 'The Gates of Dark World', because that card's donor Colosseum 0x1C8B was in NO set-code table at all (gates_of_dark_world PART E had dropped it from Gladiator Beast). That patch's PART E2 now joins it here, count-neutral over the phantom 0x0EC9 (no card_prop, so its membership was inert), landing between 0x1C18 and 0x1D25. The count is hardcoded and the list is binary-searched, so any such edit must preserve BOTH the length and STRICT sort order. A Spell here is normal -- Grimoire, Dealings, Lightning and Gateway are all members -- and it cannot make a Spell findable by Scarr, whose row filters card type MONSTER. NOTE this fact's proof runs against the COMMITTED arm9 oracle, which no patch modifies, so it pins the STOCK table, not a patched ROM's."
  address: 0x0209CA06
  oracle: "arm9"
  sources: [notes/snoww-findings.md, otn-setcode-thunk-table]
  proof: |
    DW = (0x0EC9, 0x1961, 0x1965, 0x1966, 0x1967, 0x1968, 0x1969, 0x196A,
          0x1970, 0x1973, 0x1B3D, 0x1B3E, 0x1B3F, 0x1B5A, 0x1C18, 0x1D25)
    got = tuple(h.u16_table(0x0209CA06, 16, 'arm9'))
    assert got == DW, f'Dark World table mismatch: {[hex(x) for x in got]}'
    assert h.is_sorted_unique(got), 'the Dark World table lost its order'
    # the thunk slot, and the thunk's own literal, close the bounds
    assert h.u32(0x0209D0D8 + 0x0F * 4, 'arm9') == 0x020238B5, 'the 0x0F thunk moved'
    assert h.u32(0x020238BC, 'arm9') == 0x0209CA06, "the thunk's list literal moved"
    assert h.u32(0x0202395C, 'arm9') == 0x0209CA26, 'the NEXT list no longer starts at +16 entries'
    # aux 0x000F in the criteria registry IS this set code
    B, CNT = 0x022713C4, 0x56C
    rows = [(h.u16(B + i * 12, 'ov3'), h.u16(B + i * 12 + 2, 'ov3'),
             h.u32(B + i * 12 + 4, 'ov3'), h.u32(B + i * 12 + 8, 'ov3'))
            for i in range(CNT)]
    assert (0x196A, 0x000F, 0x0223CAF5, 0x00900002) in rows, "Scarr's Dark World row drifted"
    assert (0x1973, 0x000F, 0x0223C9ED, 0x00010002) in rows, "Gateway's Dark World row drifted"

- id: "setcode.slot_addresses_are_not_stable"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "*** NEVER HARDCODE A CID'S SLOT ADDRESS IN A SET-CODE TABLE. CHECK MEMBERSHIP, AND READ THE COUNT LIVE. *** These tables are kept sorted and are inserted into COUNT-NEUTRALLY, by dropping a phantom and shifting -- so a cid's ADDRESS moves whenever any OTHER patch inserts ahead of it, while its MEMBERSHIP (the only thing a reader actually depends on) does not. *** MEASURED THE EXPENSIVE WAY 2026-08-30: card.ceruli_clause1 asserted its donor Kahkki 0x1B3E at the fixed slot 0x0209CA1C, which is where it sits in the STOCK image. card.gates_of_dark_world PART E2 inserts Colosseum 0x1C8B by dropping the phantom 0x0EC9 off the FRONT of setcode.dark_world_table, shifting every later entry two bytes earlier, so in the combined ROM 0x0209CA1C holds GREN 0x1B3F. The single-card _build_ceruli.py (which starts from stock rom.nds) PASSED; the chain died at step 32 of 41 -- and it died with EXIT CODE 0 and a buffer-truncated log whose last line was the step header, i.e. it produced a 129 MB VALID-LOOKING ROM missing nine steps including the WiFi timers. Only _verify_all_patches.py caught it (ceruli, maiden_eyes_of_blue and azure_eyes all FAILed together, which is the signature of a chain that stopped rather than of three unrelated regressions). *** THE RULE, twofold: (a) a patch that only READS a set-code table must assert `cid in table` plus strict sortedness, never `table[k] == cid`; (b) it must read the count from the thunk's own `movs r2,#N` immediate (dark world: 0x020238B8) rather than assuming it, because an earlier step may already have rewritten the table. *** THIS IS THE SAME CLASS OF BUG AS dispatch.ov3_switch_stubs_must_register, and the same lesson: a composition guard that only runs in the FULL chain is not exercised by any single-card _build_*.py, so RUN apply_all_patches WHEN YOU ADD A PATCH THAT TOUCHES SHARED STATE -- and assert the final patch count and ROM hash, because exit code 0 does not mean the chain finished."
  address: 0x0209CA06
  oracle: "arm9"
  sources: [notes/ceruli-findings.md]
  proof: |
    # the stock table, and the two Dark World monsters that bracket the donor
    imm = h.u16(0x020238B8, 'arm9')
    assert (imm & 0xFF00) == 0x2200, 'the Dark World count immediate is not `movs r2,#N`'
    n = imm & 0xFF
    tbl = h.u16_table(0x0209CA06, n, 'arm9')
    assert all(tbl[i] < tbl[i + 1] for i in range(n - 1)), 'the table is not strictly sorted'
    assert 0x1B3E in tbl, "Kahkki fell out of the Dark World table"
    # the claim: in the STOCK image the donor is at 0x0209CA1C, and Gates' insert
    # moves it -- so the address is a function of the build, not a constant.
    assert 0x0209CA06 + 2 * tbl.index(0x1B3E) == 0x0209CA1C,                  "the stock slot of 0x1B3E is no longer 0x0209CA1C"
    # and the phantom Gates drops is still the front entry it drops
    assert tbl[0] == 0x0EC9, "the phantom Gates PART E2 displaces is no longer entry 0"

