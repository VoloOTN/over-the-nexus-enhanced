- id: "setcode.thunk_record_shape"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "*** HOW TO FIND ANY ARCHETYPE'S TABLE WITHOUT REVERSE-ENGINEERING A CONSUMER. *** Every STANDARD has_set_code thunk is a fixed 16-byte record, and 95 of the 112 pointer-table slots hold one:
    +0  ldr  r1,[pc,#4]   (0x4901)   ; r1 = the cid list base
    +2  ldr  r3,[pc,#8]   (0x4B02)   ; r3 = the shared binary search
    +4  movs r2,#COUNT    (0x22NN)   ; NN = the entry count
    +6  bx   r3           (0x4718)
    +8  u32 list base
    +12 u32 0x02022E15    (the shared sorted-u16 binary search)
So for set code N: thunk = 0x0209D0D8[N] (always odd, Thumb); base = u32(thunk-1+8); count = the low byte of u16(thunk-1+4); and a thunk whose +12 literal is NOT 0x02022E15 is one of the 17 non-standard ones (different predicate shapes; do not parse them this way). Verified over ALL 112 slots this session: 95 standard, ZERO shape violations, every pointer odd. *** USE: this replaces per-archetype spelunking -- walking the table once names every list in the game, which is how setcode.scrap_table and setcode.archfiend_table were located. It also composes with setcode.junk_numbering_matches_3ds: read the archetype index off the 3DS pair table, then read the NDS list straight out of that index's thunk."
  address: 0x0209D0D8
  oracle: "arm9"
  sources: [notes/scrap-archfiend-findings.md, otn_enhanced/cards/scrap_archfiend.py]
  proof: |
    PTR, SEARCH = 0x0209D0D8, 0x02022E15
    std = 0
    for i in range(0x70):
        p = h.u32(PTR + i * 4, 'arm9')
        assert p & 1, f'has_set_code[{i:#04x}] pointer 0x{p:08X} is not Thumb'
        a = p & ~1
        if h.u32(a + 12, 'arm9') != SEARCH:
            continue                      # one of the 17 non-standard thunks
        std += 1
        c = h.bytes_at(a, 8, 'arm9')
        assert c[0:4] == bytes.fromhex('0149024b'), \
            f'has_set_code[{i:#04x}] thunk 0x{a:08X} is not the ldr/ldr prologue'
        assert c[5] == 0x22, f'has_set_code[{i:#04x}] +4 is not movs r2,#N'
        assert c[6:8] == bytes.fromhex('1847'), \
            f'has_set_code[{i:#04x}] +6 is not bx r3'
        n = c[4]
        base = h.u32(a + 8, 'arm9')
        tbl = h.u16_table(base, n, 'arm9')
        assert h.is_sorted_unique(tbl), \
            f'has_set_code[{i:#04x}] list @0x{base:08X} is not sorted-unique'
    assert std == 95, f'{std} standard thunks, expected 95'

- id: "setcode.nordic_subtype_table"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "*** 'NORDIC' IS NOT A PLAIN SET-CODE LIST -- IT IS A SUBTYPE TABLE. *** 0x02023FA4(cid) = bsearch 0x02022E44(cid, 0x0209CEF8, 0x12 rows, 4 B) over {u16 cid, s16 subtype}, returning the subtype or 0. is_nordic 0x02023FC4 = subtype > 0; 0x02023FD8 == 1 (Nordic Beasts), 0x02023FEC == 2 (Nordic ALFAR), 0x02024000 == 3 (Ascendant), 0x02024014 == 5 (Relic); nothing tests 4 (Tyr, Champions) or 6 alone. Stock rows: 0x0F85 token + 0x2455-0x2458 = 1, 0x2459-0x245B = 2, 0x245C/0x245D = 3, 0x245E = 4, 0x2478/0x248F-0x2491 = 5, and three PHANTOMS 0x24EA = 3 (3DS Vanadis), 0x24F0 = 6 (3DS The Nordic Lights), 0x24F1 = 5 (3DS Megingjord). The table literal is unique (only @0x02023FC0) and the only callers of the reader are the five wrappers, so a count-neutral row swap is closed. WARNING: is_nordic is TRUE for the Relic Spells/Traps -- a 'Nordic monster' filter must add is_monster 0x02029E60 (measured in thumbemu, scratch/mara_offline_proof.py). mara drops 0x24F0 for {0x106C, 2}."
  address: 0x0209CEF8
  oracle: "arm9"
  sources: [notes/mara-findings.md]
  proof: |
    assert h.u32(0x02023FC0, 'arm9') == 0x0209CEF8, 'Nordic table literal moved'
    assert h.u16(0x02023FA8, 'arm9') == 0x2212, 'Nordic count immediate (movs r2,#0x12) drifted'
    assert h.bl_target(0x02023FAC, 'arm9') == 0x02022E44, 'Nordic reader no longer bsearches'
    for w, k in ((0x02023FC6, None), (0x02023FDA, 1), (0x02023FEE, 2), (0x02024002, 3), (0x02024016, 5)):
        assert h.bl_target(w, 'arm9') == 0x02023FA4, f'wrapper @0x{w:08X} lost its reader BL'
        if k is not None:
            assert h.u16(w + 4, 'arm9') == 0x2800 | k, f'wrapper @0x{w:08X} no longer tests == {k}'
    rows = [(h.u16(0x0209CEF8 + 4 * i, 'arm9'), h.u16(0x0209CEF8 + 4 * i + 2, 'arm9')) for i in range(0x12)]
    assert all(rows[i][0] < rows[i + 1][0] for i in range(0x11)), 'Nordic table not sorted'
    d = dict(rows)
    assert d[0x245B] == 2 and d[0x2459] == 2 and d[0x2455] == 1 and d[0x245E] == 4 and d[0x2478] == 5
    assert (d[0x24EA], d[0x24F0], d[0x24F1]) == (3, 6, 5), 'phantom subtypes changed'

- id: "setcode.dragunity_table_is_full_and_boxed_in"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "The \"Dragunity\" set code is 0x4A: has_set_code ptr table 0x0209D0D8[0x4A] = thunk 0x02023DFD, whose body at 0x02023DFC is the standard `01 49 02 4b 15 22 18 47` (`ldr r1,=list ; ldr r3,=bsearch ; movs r2,#0x15 ; bx r3`), list base literal @0x02023E04 = 0x0209CBC0, count immediate @0x02023E00 = 21. *** ALL 21 ENTRIES ARE REAL CARDS -- THERE IS NO PHANTOM, SO THIS LIST CANNOT TAKE A COUNT-NEUTRAL INSERT. *** (Dux 0x20C4 .. Aklys 0x2358; Dragon Ravine 0x2359 and Dragon Mastery 0x235A are correctly NOT members -- they read the set code without carrying it.) *** AND IT CANNOT BE GROWN EITHER, which is the part worth banking. Walked every 0x0209D0D8 thunk 2026-09-21 and mapped each list's [base, base+2n): the lists are PACKED, and every apparent gap is another cid list belonging to a differently-shaped consumer thunk (the `10b50749..` / `38b51a49..` variants); the largest all-zero run in the whole region is 2 bytes. Growing Dragunity therefore means shifting a neighbour, and BOTH neighbours are hard-coded by shipped modules: forward, Watt 0x0209CBEA (wattcobra, ee/patches/wattcobra) then Karakuri 0x0209CC16 (ninishi, ee/patches/ninishi, karakuri_haipa, thunk 0x02023F44); backward, AoJ 0x0209CB96 (azure_eyes), X-Saber 0x0209CB6E (xsaber_table) and T.G. 0x0209CB48 (tg_table, hyper_librarian, ee/arm9.py, ee/test_utils.py). Relocating the list to the ov5 cave is WRONG: all 12 BL callers of the thunk are in ov3, which is resident in all five duel modes (mem.ov3_resident_all_modes), while ov5 is evicted by ov41 in a puzzle (mem.ov5_ov41_share_base) -- the bsearch would read overlay-41 data and return silent wrong answers with no crash. ov3 would be the correct host but its dead-code pool has only 38 B free, fragmented into 8..12 B blocks. *** SO THE OPTIONS FOR A NEW \"Dragunity\" IS EXACTLY ONE: displace a real member (the white_dragon_ninja / Sazank precedent, which is the user's choice to make). *** EVERY OTHER ROUTE IS CLOSED, and the eliminations are the point of this fact: the appended ARM9 cave [0x020AF120, 0x020B7120) is FALSIFIED, not merely unproven -- the canary was RUN 2026-08-03 and FREEZES ON ENTERING A DUEL (notes/gladiator-beast-essedarii-findings.md, 'Phase 0 -- RUN AND FAILED'); 0x020AF120 is the live NitroSDK OS main-arena base consumed by the boot/autoload crt0, so a wrong raise white-screens at startup, and one of its seven literals (0x02081558/0x0208155C) is a proven false positive. ⚠️ THAT SAME NOTE STILL CONTAINS THE STALE SENTENCE 'built 2026-07-27 and never played' two lines BELOW the failure verdict, and it was quoted as live on 2026-09-21 before the contradiction was spotted -- read the whole block, not the first matching line. And the 128 B at 0x0209D058..0x0209D0D8, between the last set-code list and the pointer table, is NOT padding: it is a live {u16 cid, u16 group} table referenced from thunk 0x02023804 (ptr-table index 0x07). *** card.dragunity_remus_clause2 TAKES THE DISPLACEMENT ROUTE: it swaps DRAGUNITY KNIGHT - TRIDENT 0x2180 out for the donor 0x106E (user's choice 2026-09-21), leaving the base and the count immediate untouched and the array strictly sorted. Trident was chosen because no \"Dragunity\" test can reach it -- Level 10, Extra Deck, not searchable from the Deck, not equippable, and every GY-targeting Dragunity effect filters \"Level 3 or lower Dragon\" -- so it forfeits only its contribution to Dux's 'gains 200 ATK for each Dragunity card you control' count. *** THE DISPLACEMENT IS IN-GAME CONFIRMED BY USER 2026-09-21: Dragon Ravine fetches Remus, Dux counts him, the other twenty members are unaffected, and Trident still summons and keeps its effect and its Extra-Deck presence -- it lost ONLY membership. So a full archetype list CAN be re-pointed at a new member for the price of one deliberately-chosen card, and the cost is exactly as narrow as the static analysis predicted."
  address: 0x0209CBC0
  oracle: "arm9"
  sources: [notes/dragunity-remus-findings.md, otn_enhanced/cards/dragunity_remus.py]
  proof: |
    sig = h.bytes_at(0x02023DFC, 8, 'arm9')
    assert sig == bytes.fromhex('0149024b15221847'), f'the 0x4A thunk drifted: {sig.hex()}'
    assert h.u32(0x0209D0D8 + 0x4A * 4, 'arm9') == 0x02023DFD, 'the 0x4A thunk slot moved'
    assert h.u32(0x02023E04, 'arm9') == 0x0209CBC0, 'the Dragunity list literal moved'
    imm = h.u16(0x02023E00, 'arm9')
    assert imm & 0xFF00 == 0x2200, 'the count is not `movs r2,#N`'
    n = imm & 0xFF
    assert n == 21, f'the Dragunity list is {n} entries, expected 21'
    tbl = h.u16_table(0x0209CBC0, n, 'arm9')
    assert h.is_sorted_unique(tbl), 'the Dragunity list lost its strict sort'
    assert tbl[0] == 0x20C4 and tbl[-1] == 0x2358, 'the list bounds moved'
    # EVERY entry is a real card -- no phantom to drop
    import json
    names = json.load(open('scratch/cid_to_name.json', encoding='utf-8'))
    ghosts = [c for c in tbl if str(c) not in names]
    assert not ghosts, f'the list gained a phantom: {[hex(c) for c in ghosts]}'
    assert all(names[str(c)].startswith('Dragunity') for c in tbl), \
        'a non-Dragunity-named card joined the list'
    # Ravine and Mastery read the set code without carrying it
    assert 0x2359 not in tbl and 0x235A not in tbl, \
        'Dragon Ravine / Dragon Mastery are not supposed to be members'
    # the list is BOXED IN: AoJ ends exactly where it starts, Watt starts exactly where it ends
    assert 0x0209CB96 + 2 * 21 == 0x0209CBC0, 'the AoJ list no longer abuts Dragunity'
    assert 0x0209CBC0 + 2 * n == 0x0209CBEA, 'Dragunity no longer ends at the Watt base'
    assert h.u32(0x02023EFC, 'arm9') == 0x0209CBEA, 'the Watt list literal moved'
    assert h.u32(0x02023F4C, 'arm9') == 0x0209CC16, 'the Karakuri list literal moved'

