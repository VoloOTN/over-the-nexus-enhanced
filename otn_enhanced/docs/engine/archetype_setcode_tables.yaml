- id: "setcode.gladiator_beast_table"
  subsystem: "archetype_setcode_tables"
  confidence: "VERIFIED"
  claim: "\"Gladiator Beast\" set-code: thunk 0x02023AB0 (`ldr r1,=0x0209CDF2 ; ldr r3,=0x02022E15 ; movs r2,#0x1d ; bx r3`) tail-calls the u16 binary search over a sorted 29-entry cid list @0x0209CDF2..0x0209CE2A. It is has_set_code index 0x24 (pointer table 0x0209D0D8). Members are every Gladiator Beast in the pool, from Alexander 0x1C72 to Lanista 0x24DC, and the LAST entry 0x2521 is a PHANTOM (no card owns it), so the list has one free slot for a count-neutral insert exactly like tg_table.py / xsaber_table.py. The list is what fusion material code 24 tests (fusion.gladiator_beast_code) and what every \"Special Summon 1 'Gladiator Beast' monster\" search consumes -- 14 ov3 call sites reach the thunk."
  address: 0x0209CDF2
  oracle: "arm9"
  sources: [notes/gladiator-beast-essedarii-findings.md]
  proof: |
    lst = h.u16_table(0x0209CDF2, 29, 'arm9')
    assert h.is_sorted_unique(lst), 'Gladiator Beast list not sorted-unique'
    assert lst[0] == 0x1C72 and lst[-1] == 0x2521, 'GB list endpoints moved'
    for cid in (0x1C75, 0x1C76, 0x1C86, 0x1C87, 0x1DC1):   # Bestiari, Laquari, the 3 fusions
        assert cid in lst, f'expected Gladiator Beast cid {cid:#06x} missing'
    # the thunk's own immediates pin base + count
    assert h.u32(0x02023AB8, 'arm9') == 0x0209CDF2, 'GB list base literal moved'
    assert h.u32(0x02023ABC, 'arm9') == 0x02022E15, 'GB thunk search target moved'
    assert h.u16(0x02023AB4, 'arm9') == 0x221D, 'GB count is not movs r2,#0x1d'
    assert h.u32(0x0209D0D8 + 0x24 * 4, 'arm9') == 0x02023AB1, 'has_set_code[0x24] moved'

