- id: "battle.atk_grant_is_gated_on_equip"
  subsystem: "battle_attributes"
  confidence: "VERIFIED"
  claim: "Mermaid Archer's +800 IS correctly conditional on 'while equipped with a monster by this effect', even though leaf 0x021B75F8 computes the 800 unconditionally (a GDB breakpoint hit it while she was unequipped). The gate is DOWNSTREAM of the accumulator. Measured at instance-record+0x20 across the sealancer_recon series: ml3 (on field, not equipped) 1200; ml4 (equipped) 2000; ml5 (equipped, destroy-redirect prompt) 2000; ml6 (equipped monster destroyed as the replacement, so no longer equipped) back to 1200; ml7 (banished) record cleared to 0. Consequence for the donor reskin: a card built on cid 0x1FFC inherits CORRECT conditional-ATK behaviour for free; only the constant needs retuning. IN-GAME CONFIRMED 2026-07-21 on the retuned card — ATK rises by 1000 on equip and drops back when the equipped monster leaves, so the downstream gate survives a leaf rewrite untouched."
  address: 0x021B75F8
  oracle: "savestate"
  sources: [sea-lancer-findings]
  proof: |
    rec = None
    for a in range(0x02296000, 0x02298000, 4):
        if h.ram_u32(a) == 0x1FFC:
            cand = a - 0x0C
            if h.ram_u32(cand + 0x24) == 3:      # Mermaid Archer is Level 3
                rec = cand
                break
    if rec is None:
        raise Skip('Mermaid Archer 0x1FFC not on the field in this savestate '
                   '(use data/over_the_nexus/working/sealancer_recon.ml3..ml6)')
    atk = h.ram_u32(rec + 0x20)
    assert atk in (1200, 2000), f'unexpected ATK {atk} at record {rec:#010x}'
    # 1200 = printed, 2000 = printed + the 800 grant; nothing else is legal
    assert atk - 1200 in (0, 800), 'ATK delta is not 0 or the +800 grant'

