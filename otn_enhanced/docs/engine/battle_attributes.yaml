- id: "battle.damage_trigger_is_a_membership_list"
  subsystem: "battle_attributes"
  confidence: "VERIFIED"
  claim: "*** 'WHEN THIS CARD INFLICTS BATTLE DAMAGE' IS A MEMBERSHIP LIST, EXACTLY LIKE THE SUMMON TRIGGERS (summon.trigger_is_a_membership_list) -- NOT something any cls1 record can receive. There are TWO sibling lists, both binary-searched by 0x02022E14 inside one function whose pool holds them in adjacent words (0x021D03FC / 0x021D0400 -- one literal reference each in the whole overlay, so membership is the ENTIRE static gate), and both post the SAME event code 0x10 through 0x021D3230:
  LIST A @0x0226EE7C, 19 entries, count immediate `movs r2,#0x13` @0x021D021A, and GATED at 0x021D020A on `ldrsb r0,[0x02298AD8 + 2]` = 'this attack was DIRECT'. This is 'inflicts Battle Damage BY A DIRECT ATTACK' -- Spirit Reaper 0x1596, Unifrog 0x1DB2, X-Saber Airbellum 0x1D71, E-HERO Ice Edge 0x1FBE, Fane 0x2069, Wattgiraffe 0x2261, Wattpheasant 0x22FD, Wattchimera 0x230F, Watthydra 0x2477, ...
  LIST B @0x0226EEA4, 51 entries, `movs r2,#0x33` @0x021D023C, UNGATED. This is the plain 'inflicts Battle Damage' family -- White Magical Hat 0x1018, Airknight Parshath 0x139F, Don Zaloog 0x1532, Vampire Lord 0x1522, ...
A MISS in the relevant list means the event is never posted at all, so a records-free donor's cls1 record is dead weight without the insert. Both lists have phantoms (list A: 0x0EC0/0x15D0/0x1A1F/0x1DB6; list B: 0x1502/0x1506/0x178C), so the insert is a count-neutral drop-and-sort. *** THIS ANSWERS notes/normal-donor-migration-findings.md Open Question 2 and moves wattcobra from Tier B to Tier A: the whole trigger is DATA. wattcobra ships the list-A insert on donor Wattkid 0x0FD3 and is IN-GAME CONFIRMED BY THE USER 2026-09-10, ON THE FIRST TEST, all five oracles ('Perfect. No Regressions and the 4) only shows monsters', then 'No regressions cover all the points') -- the card reads correctly, declares a DIRECT attack, fires the search on direct-attack battle damage, offers ONLY Watt MONSTERS, and does NOT fire when it attacks into a monster. *** THAT LAST ORACLE IS WHAT PROVES THE LIST SPLIT: membership of list A alone, with list B deliberately left untouched, really does mean 'by a direct attack' and not 'inflicts Battle Damage'. *** ⚠️ CORRECTS the old wattcobra docstring, which called the cls1 +08 slot 0x021E32D5 'the direct-attack condition'. It is not: 0x021E32D4 is `push {r3,lr}; ldr r3,=0x00040492; bl 0x021D6E40; pop {r3,pc}`, a call to the MASKED ZONE predicate. The direct-attack half is the 0x02298AD8+2 flag plus list-A membership, and nothing else."
  address: 0x0226EE7C
  oracle: "ov3"
  sources: [notes/wattcobra-normal-donor-findings.md, notes/normal-donor-migration-findings.md]
  proof: |
    # the gate: direct-attack flag, then the LIST A search, then the post
    assert h.u16(0x021D020A, 'ov3') == 0x2002, 'movs r0,#2 (the [+2] flag index) drifted'
    assert h.u16(0x021D020C, 'ov3') == 0x5628, 'ldrsb r0,[r5,r0] drifted'
    assert h.u32(0x021D03FC, 'ov3') == 0x0226EE7C, 'the LIST A literal moved'
    assert h.u32(0x021D0400, 'ov3') == 0x0226EEA4, 'the LIST B literal moved'
    assert h.u16(0x021D021A, 'ov3') == 0x2213, 'LIST A count immediate is not movs r2,#0x13'
    assert h.u16(0x021D023C, 'ov3') == 0x2233, 'LIST B count immediate is not movs r2,#0x33'
    assert h.bl_target(0x021D021C, 'ov3') == 0x02022E14, 'LIST A search is not the bsearch helper'
    assert h.bl_target(0x021D023E, 'ov3') == 0x02022E14, 'LIST B search is not the bsearch helper'
    # both arms post the same event code through the same poster
    assert h.u16(0x021D022C, 'ov3') == 0x2210, 'LIST A event code is not 0x10'
    assert h.u16(0x021D024E, 'ov3') == 0x2210, 'LIST B event code is not 0x10'
    assert h.bl_target(0x021D0230, 'ov3') == 0x021D3230, 'LIST A poster drifted'
    assert h.bl_target(0x021D0252, 'ov3') == 0x021D3230, 'LIST B poster drifted'
    # the lists themselves
    a = h.u16_table(0x0226EE7C, 0x13, 'ov3')
    b = h.u16_table(0x0226EEA4, 0x33, 'ov3')
    assert h.is_sorted_unique(a) and h.is_sorted_unique(b), 'a damage-trigger list is not sorted-unique'
    assert h.u16(0x0226EE7C + 0x13 * 2, 'ov3') == 0 and h.u16(0x0226EEA4 + 0x33 * 2, 'ov3') == 0, \
        'a damage-trigger list is not 0-terminated at its stated count'
    for cid in (0x1596, 0x1DB2, 0x2069, 0x2261):   # Spirit Reaper, Unifrog, Fane, Wattgiraffe
        assert cid in a, f'{cid:#06x} missing from the direct-attack-damage list'
    for cid in (0x139F, 0x1522, 0x1532):           # Airknight Parshath, Vampire Lord, Don Zaloog
        assert cid in b, f'{cid:#06x} missing from the plain battle-damage list'
    assert not (set(a) & set(b)), 'the two damage-trigger lists overlap -- re-read the gate'
    # the +08 correction: 0x021E32D4 is the masked ZONE predicate, not a direct-attack test
    assert h.bytes_at(0x021E32D4, 4, 'ov3') == bytes.fromhex('08b5024b'), \
        'the cls1 +08 slot 0x021E32D5 is no longer push{r3,lr}/ldr r3,[pc,#8]'
    assert h.bl_target(0x021E32D8, 'ov3') == 0x021D6E40, '0x021E32D4 no longer calls the zone predicate'

- id: "battle.defense_flip_family"
  subsystem: "battle_attributes"
  confidence: "VERIFIED"
  claim: "'Switches to Defense Position at the end of the Damage Step after attacking' is NOT a list — it is a cid-comparison CHAIN in code, evaluated in two functions whose literal pools hold the family {0x14D6 Spear Dragon, 0x1993 Axe Dragonute, 0x1C08 E-HERO Darkbright, 0x1DA6 Arcana Force EX - The Dark Ruler, 0x237F Power Breaker}. The cids are loaded by the `ldr rX,[pc]` at 0x021C6150 and 0x02252542 from the pool words 0x021C62DC / 0x022526D8. The chain is an ORDERED binary search (bgt/bge/beq), so retiring one member by repointing its pool word requires a replacement that occupies the SAME position in the ordering, or the other members mis-route. NOTE: 0x1C08 is also the Thumb encoding of `adds r0,r1,#0`, so a u16 scan for Darkbright returns 900+ false positives — scan for the u32 0x00001C08 instead."
  address: 0x021C62DC
  oracle: "ov3"
  sources: [notes/escuridao-findings.md]
  proof: |
    for pool in (0x021C62DC, 0x022526D8):
        v = h.u32(pool, 'ov3')
        assert v == 0x00001C08, f'defense-flip pool {pool:#x} holds {v:#x}'
    for site, pool in ((0x021C6150, 0x021C62DC), (0x02252542, 0x022526D8)):
        ins = h.u16(site, 'ov3')
        assert ins & 0xF800 == 0x4800, f'{site:#x} is not an ldr rX,[pc,#imm]'
        assert ((site + 4) & ~3) + (ins & 0xFF) * 4 == pool, \
            f'{site:#x} no longer loads the pool word {pool:#x}'
    fam = (0x14D6, 0x1993, 0x1DA6, 0x237F)
    pooled = {h.u32(0x021C62DC + d, 'ov3') for d in (-8, -4, 4, 8)}
    assert 0x14D6 in pooled, 'Spear Dragon left the 0x021C62DC pool'

