  claim: "*** 0x021C5324 IS 'CHANGE THE BATTLE POSITION', A TOGGLE -- IT TAKES NO TARGET-POSITION ARGUMENT. This CORRECTS the natural misreading of battle.change_own_position_resolver, which describes 0x0220C6B0's r4 as 'target position = Defense'. r4 is only a GUARD: the resolver reads the live position halfword at 0x0229ACCE + side*0xB3C + zone*0x14 and `cmp r4,r0 ; beq` SKIPS the call when the card already sits where that card wants it. The primitive's own signature is 0x021C5324(desc, side, zone, r3, [sp] = 1): it vetoes on 0x021AFCBC(desc, side, zone) != 0, computes r1 = (side == desc[+2]) ? 0 : 1 (mine vs the opponent's), and tail-calls 0x021C5358(side, zone, r3, [sp+0x20], [sp] = cid, [sp+4] = r1). No position is ever passed, so what it does is flip. CONSEQUENCE: the 16 native cards on resolver 0x0220C6B1 can only ever do Attack -> Defense, because they hardcode r4 = 1 (except Reptilianne Naga 0x21B4, r4 = 0) and pair it with the Attack-Position-only condition 0x021F4D4D. A card whose text is the unqualified 'change the battle position of this card' (Maiden with Eyes of Blue) must therefore NOT clone 0x0220C6B0 -- it should call 0x021C5324 outright after 0x021D2C1C (still on the field) and 0x021D2D18 (re-sync desc[+2]/desc[+3] from the locator desc[+0xC]), which is both simpler and more faithful than the native shape. *** STACK ABI TRAP: the 5th argument is passed in the caller's [sp], so the caller's prologue must PUSH A SCRATCH LOW REGISTER FIRST to reserve that word -- 0x0220C6B0's `push {r3,r4,r5,r6,r7,lr}` is reserving, not saving (Thumb PUSH stores the lowest-numbered register at the lowest address)."
  address: 0x021C5324
  oracle: "ov3"
  sources: [maiden-with-eyes-of-blue-findings]
  proof: |
    assert h.bytes_at(0x021C5324, 2, 'ov3') == bytes.fromhex('feb5'), \
        '0x021C5324 no longer opens push {r1,r2,r3,r4,r5,r6,r7,lr}'
    assert h.bl_target(0x021C532E, 'ov3') == 0x021AFCBC, 'the veto call moved'
    assert h.bytes_at(0x021C533A, 10, 'ov3') == bytes.fromhex('a8780121844200d10021'), \
        'the mine-vs-opponent flag computation drifted'
    assert h.u16(0x021C5346) == 0x9B08, 'the 5th argument is no longer read from [sp,#0x20]'
    assert h.bl_target(0x021C5352, 'ov3') == 0x021C5358, 'the tail call moved'
    guard = h.bytes_at(0x0220C6EC, 4, 'ov3')
    assert guard == bytes.fromhex('844205d0'), \
        'the native resolver no longer guards on cmp r4,r0 / beq -- re-read the r4 semantics'

- id: "battle.attack_target_post_is_cid_gated"
  subsystem: "battle_attributes"
  confidence: "VERIFIED"
  claim: "*** THE CODE-0x13 TARGETED-FOR-AN-ATTACK EVENT IS POSTED TO THE TARGET ONLY FOR 26 HARD-CODED CIDS, AND A DONOR IS NOT ONE OF THEM. This is the missing half of battle.attack_target_event_code and it is why a correct, live cls1 record can sit on the board and never fire. The five post sites inside 0x021C6304 are NOT interchangeable: 0x021C641C / 0x021C65AC / 0x021C6882 are zone-sweep broadcasts (their r6 is a loop counter 0..4 / 0..0xA); 0x021C6390 takes its slot from [0x02298AD8 + 8] and is gated on the 17-entry SORTED CID LIST 0x0226E740 searched by 0x02022E14 -- that is the ATTACKER family, when this card DECLARES an attack (Gravekeeper Assailant, Turbo Warrior / Turbo Synchron, Light End Dragon, Glow Moss, Chaos King Archfiend, Vylon Soldier / Sigma, Dark Diviner, Exodius, Evil HERO Dark Gaia); and 0x021C6798 -- THE TARGET PATH -- takes its slot from [0x02298AD8 + 0xA] and is gated by cmp r6,#0 ; beq 0x021C679C at 0x021C678A. That r6 comes from a PER-CID SWITCH at 0x021C6620: movs r6,#0 (DEFAULT REJECT), bl 0x021A37D8 -> the TARGET cid, then an ordered compare tree whose leaves are movs r6,#1 (0x021C6754) or ldr r6,[sp,#0x10] (0x021C6758). *** MEASURED BY CONCRETE EXECUTION over the whole cid space, not by reading the tree (thumb-stack-based-switch-footgun: the arms encode cids as base +/- imm and are UNGREPPABLE). The accepted set is EXACTLY 26 cids and it self-validates -- it is precisely the printed when this card is targeted for an attack population: 0x0E65*, 0x1A73, 0x1A78 Black Stego, 0x1ACA Cyber Shadow Gardna, 0x1B8F*, 0x1C4F Decoy Dragon, 0x1CB1*, 0x1CCC Light End Dragon, 0x1CF5 Cyber Valley, 0x1D05 Vengeful Shinobi, 0x1D11 Twinkle Moss, 0x1E24 Krebons, 0x1E8E X-Saber Galahad, 0x1EBF Mad Archfiend, 0x20E5 Cyber Larva, 0x2163 Fabled Rubyruda, 0x21CE Moon Dragon Quilla, 0x22EC Uni-Horned Familiar, 0x22FF Naturia Beans, 0x2388..0x238C the five STBL Karakuri, 0x2466 Saizan, 0x2467 Kuick. (* = 0x0E65 / 0x1B8F / 0x1CB1 have NO card_prop record, so their arms are provably dead code.) *** CONSEQUENCE FOR PATCHING: the tree CANNOT be extended by data. Every single-word edit to its literal pool (0x021C68B4.. = 0x1E24, 0x1C4F, 0x1A78, 0x0E65, 0x22EC, 0x20E5, 0x2466, 0x2467) was applied and re-simulated, and each one either admitted extra cids or dropped a real card -- none gave a clean swap. THE WORKING FIX is to retarget the single bl 0x021A37D8 at 0x021C6624 into a cave stub that calls the original and REMAPS an admitted donor cid onto one of the three dead phantoms (0x1CB1), which the tree already accepts. That is safe because the cid register is DEAD after the switch (the caller reloads r2 with =0x02298AD8 at 0x021C6788 and the post uses only r4 = side and [0x02298AD8 + 0xA] = slot), and because the switch bytes are left BIT-IDENTICAL so no other cid routing moves. Shipped as CAVE_ATKTGT_GATE / CAVE_ATKTGT_LIST (card.maiden_clause2), and *** IN-GAME CONFIRMED 2026-08-20: with the remap in place the attacked donor receives the event and its cls1 record fires; without it nothing happens at all. So both halves of this fact are measured, not inferred -- the 26-cid gate is real AND the remap defeats it. *** Dverg 0x245B is REJECTED too, which is why ninishi PART A2 grafted position-change clause had been dead since the day that patch shipped. FIXED 2026-08-20: 0x245B was added to CAVE_ATKTGT_LIST, and RE-KEYED to 0x0FFD on 2026-09-10 when ninishi moved to the Normal-Monster donor Dark Chimera and gave Dverg back (Dverg prints no such clause, so it must NOT be listed). *** SECOND IN-GAME CONFIRMATION OF THE REMAP, BY USER 2026-09-10, on a card that is NOT maiden: with 0x0FFD listed, an attacked face-up Ninishi changes battle position. *** DEVIATION WORTH KNOWING: the grafted record flips ATTACK -> DEFENSE ONLY, because its condition 0x021F4D4D is a face-up Attack Position gate (Black Stego's printed clause). Cards whose printed text is the symmetrical 'change its battle position' (Ninishi) do nothing when attacked in Defense Position; inverting that half needs a cid-scoped arm in the resolver beside Reptilianne Naga 0x21B4's (battle.change_own_position_resolver). NOTE THE CROSS-MODULE DEPENDENCY: the hook and the list are installed by maiden_eyes_of_blue, so ninishi's clause is inert in any build that omits it; maiden verify() asserts 0x0FFD is still listed so the dependency fails the build instead of going quiet."
  address: 0x021C6620
  oracle: "ov3"
  sources: [maiden-with-eyes-of-blue-findings, thumb-stack-based-switch-footgun]
  proof: |
    assert h.u16(0x021C6622, 'ov3') == 0x2600, 'the gate no longer defaults r6 to 0'
    assert h.bl_target(0x021C6624, 'ov3') == 0x021A37D8, 'the cid fetch feeding the gate moved'
    assert h.u16(0x021C678A, 'ov3') == 0x2E00, 'the post guard is no longer cmp r6,#0'
    assert h.u16(0x021C678C, 'ov3') & 0xFF00 == 0xD000, 'the post guard is no longer a Bcc'
    assert h.u16(0x021C6794, 'ov3') == 0x2213, 'the guarded post lost event code 0x13'
    assert h.bl_target(0x021C6798, 'ov3') == 0x021D3230, 'the guarded post no longer calls the poster'
    pool = [h.u32(0x021C68B4 + 4 * i, 'ov3') for i in range(8)]
    assert pool == [0x1E24, 0x1C4F, 0x1A78, 0x0E65, 0x22EC, 0x20E5, 0x2466, 0x2467], \
        f'the gate tree literal pool drifted: {[hex(x) for x in pool]}'
    lst = h.u16_table(0x0226E740, 0x11, 'ov3')
    assert h.is_sorted_unique(lst), 'the attacker-side list 0x0226E740 lost its sort'
    assert lst[0] == 0x0E11 and lst[-1] == 0x2401, 'the attacker-side list changed'
    assert 0x1ED7 not in lst and 0x245B not in lst, 'a donor appeared in the attacker list'
    assert 0x1ED7 not in pool and 0x245B not in pool, 'a donor appeared in the gate tree pool'

