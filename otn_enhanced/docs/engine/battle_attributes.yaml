ments means the event is announced to BOTH battle participants. (c) 0x021C6304 is called from 0x0224F3D4, inside the battle-sequencer band 0x0224F000..0x02253000. *** CODE 0x14 IS NEVER POSTED WITH AN IMMEDIATE through 0x021D3230: the full selector-1 histogram is {0x00:9, 0x01:1, 0x02:4, 0x06:6, 0x0C:2, 0x0D:1, 0x0E:2, 0x10:11, 0x13:5, 0x15:6, 0x16:1, 0x17:1, 0x18:4, 0x19:2, 0x1B:1, 0x1F:1}. Three sites (0x021C9EBC, 0x021D3558, 0x0224677E) build r2 indirectly and are unread, so 0x14 is presumed a sibling raised from one of them. ACCEPT BOTH CODES the way Krebons does rather than pinning one -- pinning a discriminator to a single code measured on another card's path is exactly the trap that cost Lightpulsar clause 3 an in-game test (see event.leave_field_event_codes)."
