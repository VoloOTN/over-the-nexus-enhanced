- id: "event.animation_command_dispatcher"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "The animation/relocation command queue (event.animation_command_queue) is DRAINED by a jump-table dispatcher at 0x021C3C3C: `op = [0x02299B60] & 0xFFF`, bounded `cmp op,#0x68`, halfword offset table at 0x021C3C5E based at 0x021C3C60, and each arm is a 6-byte `bl <handler> ; pop {r3,pc}` stub. THIS is where a queued command becomes a state change, which is why neither 0x021C6B00 nor 0x021C7118 nor 0x021D1300 contains any array write. Decoded opcodes: 0x1E->0x021BC254, 0x1F->0x021BC274, 0x20->0x021BC3EC, 0x26->0x021C3B70, 0x32->0x021BF884 (banish), 0x3E->0x021BC4B8 (zone-to-zone relocate), 0x40->0x021BCCDC, 0x45->0x021BF5E4, 0x52->0x021C1BB0, **0x55->0x021C0BB4 = THE DECK SHUFFLE** (which calls the Fisher-Yates permutation 0x021A7B7C(side) over player+0x304, count player+0x10, swapping through 0x021A1F9C, then raises UI code 0x15).
*** ⚠️⚠️ CONSEQUENCE — 0x021D269C IS 'SHUFFLE THE DECK', NOT 'COMPLETION'. It builds `r0 = 0x55 | (side ? 0x8000 : 0)`, passes the RNG state from [0x0229DD14+0x28] as the arguments (so a replay reproduces the permutation), and enqueues it. It sits at the end of the native add-to-hand resolver 0x02207EF5 and of Gold Sarcophagus 0x0221CD29 because BOTH SEARCH THE DECK, where shuffling is correct — that is how it got mislabelled as a phase-0x64 'completion' primitive (from the 3DS mapping 0x388E3C -> 0x021D269C) and copied into four patch modules as COMPLETE / EFFECT_DONE. MEASURED: Eclipse Wyvern's clause 2 moves a card from the banished zone to the hand and touched no Deck, yet the deck came out as the same multiset in a different order on our side only, across three builds — it survived removing the prompt, which is what isolated this call. A resolver phase does NOT need it; dropping it ends the phase cleanly."
  address: 0x021C3C3C
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
    # the dispatcher's bound and jump-table geometry
    assert h.bytes_at(0x021C3C4C, 4, 'ov3') == bytes.fromhex('6828 00d9'.replace(' ', '')), \
        'the command dispatcher bound (op <= 0x68) drifted'
    def _arm(op):
        e = h.u16(0x021C3C5E + op * 2, 'ov3')
        return 0x021C3C60 + (e if e < 0x8000 else e - 0x10000)
    assert _arm(0x55) == 0x021C3F28, f'opcode 0x55 arm moved to {_arm(0x55):#010x}'
    assert h.bl_target(0x021C3F28) == 0x021C0BB4, 'the 0x55 handler is no longer 0x021C0BB4'
    assert h.bl_target(0x021C0C20) == 0x021A7B7C, 'the 0x55 handler no longer shuffles'
    assert _arm(0x3E) == 0x021C3E9E and h.bl_target(0x021C3E9E) == 0x021BC4B8, \
        'the relocate (0x3E) arm drifted'
    assert _arm(0x32) == 0x021C3E56, 'the banish (0x32) arm drifted'
    # 0x021D269C builds opcode 0x55 and enqueues it -- it is a shuffle, not a completion
    assert h.bytes_at(0x021D26AE, 4, 'ov3') == bytes.fromhex('55200843'), \
        '0x021D269C no longer builds command 0x55'
    assert h.bl_target(0x021D26C2) == 0x021C3BC8, '0x021D269C no longer enqueues'
    # and the shuffle itself is Fisher-Yates over the deck container
    assert h.bytes_at(0x021A7B92, 4, 'ov3') == bytes.fromhex('c1208000'), \
        'the shuffle no longer indexes player+0x304'

