        assert rows.get(cid) == 0x0800, f'{cid:#06x} lost its 0x0800 mask row'

- id: "event.leave_mask_is_field_only"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "The leave-mask table 0x0226EC1C is read at EXACTLY ONE site in the whole build: the LDR at 0x021C8104 inside the leave-field dispatcher (zero literal references in arm9, one in ov3). That site is never reached on a hand DISCARD -- measured for Dandylion 0x19FE, which fires from a discard anyway. *** So a 0x0800 mask row governs FIELD leaves only and can never be what makes a discard trigger fire. Cross-checked against the 3DS build, whose own mask table (243 rows, same {u16 cid, s16 mask} shape) gives its shipped Eclipse Wyvern 0x26E5 mask 0x0800 too."
  address: 0x021C8104
  oracle: "ov3"
  sources: [eclipse-wyvern-findings, otn-leave-descriptor-slots]
  proof: |
    raw = h.bytes_at(0x021C8104, 2, 'ov3')
    assert raw[1] & 0xF8 == 0x48, f'0x021C8104 is no longer an LDR literal: {raw.hex()}'
    assert h.u16(0x0226EC1C + 47 * 4 + 2, 'ov3') is not None

- id: "event.leave_dispatcher_three_registers"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** THE LEAVE DISPATCHER HAS THREE REGISTRATION PATHS AND THEY MEAN DIFFERENT THINGS. Read straight off 0x021C80BC..0x021C8114:
  0x021C80BC  [sp+0x44] && [sp+0x90] && [sp+0x144]   battle && DESTROYED && to-GY
                && bsearch(list106 0x0226E990, 0x6A, cid) -> [sp+0x18] = 1
  0x021C80E0  [sp+0x2C] && [sp+0x144]                left the FIELD && to-GY
                && bsearch(list30  0x0226E904, 0x1E, cid) -> [sp+0x18] = 1
  0x021C80FE  ONLY IF [sp+0x18] == 0: bsearch(mask table 0x0226EC1C, 0x98, stride 4)
Membership settles the semantics with no ambiguity at all -- every member of each list is worded to match:
  * list30 (30 entries) = 'sent from the FIELD to the Graveyard': Botanical Girl 0x1ED4, Sangan 0x0FD6, Witch of the Black Forest 0x11E4, Goblin Zombie, Dupe Frog, Naturia Cliff, Naturia Eggplant, Gusto Gulldo, Gem-Knight Aquamarine, Junk Gardna, Masked Beast Des Gardius, Emissary of the Afterlife, Deepsea Macrotrema, E-Hero The Shining -- PLUS the equip spells (Axe of Despair, Black Pendant, Horn of Light, Horn of the Unicorn, Malevolent Nuzzler, Magic Formula, Crystal Release, Cursed Armaments), whose printed text is literally that sentence.
  * list106 = 'destroyed by battle and sent to the GY': Colossal Fighter 0x1E12, Lord Poison 0x156D, Sun Dragon Inti 0x21CD.
  * the mask table = 'sent to the Graveyard': the Dandylion 0x19FE family.
*** CONSEQUENCE FOR A DONOR: ONE OF THE THREE IS REQUIRED, AND THEY ARE INTERCHANGEABLE AS FAR AS THE SWITCH IS CONCERNED. All three set the SAME flag [sp+0x18], and the per-cid switch arm that follows is GENERIC: Sangan 0x0FD6 and a records-free donor at 0x0FB1 both fall in the interval (0x0EBF, 0x1174) and reach the SAME arm, `bl 0x021C93D0` @0x021C827A -- yet Sangan triggers natively and the donor does not, purely because Sangan is in list30. (0x021C93D0 is NOT a do-nothing leaf; it is the generic tail.) So a donor needs a row, and which table only decides the PRECONDITIONS. list30 is FULL (30/30 real cards) and cannot grow -- leave.attached_card_destroy_list abuts it at 0x0226E940. *** AND IT CANNOT GROW DOWNWARD EITHER, which closes the question for good (measured 2026-09-10): the two bytes below the table, 0x0226E902, ARE free (4-byte alignment pad, reading 0x0000, between the preceding sorted u16 list that ends at 0x0226E900 and list30's first entry), and the table's base has exactly ONE literal reference (@0x021C8320) and ONE count immediate (@0x021C80F0), so re-basing it to 0x0226E902 with count 0x1F is a 6-byte data edit. But a PREPENDED entry must sort below list30's first member 0x0D7C, and every one of the 52 real cids below 0x0D7C is a Speed World / Speed Spell card -- there is no monster down there at all. So no MONSTER donor can ever be given list30 membership by a data edit, in either direction. *** -- so a donor that is not natively a member takes the MASK TABLE with mask 0x0800 (bit 11 = destination is the GY), which is field-only anyway because the whole dispatcher is (event.leave_mask_is_field_only). That is lightpulsar PART M and gravekeepers_recruiter PART A3. *** THE MASK ROW IS A DROP-IN REPLACEMENT FOR list30 MEMBERSHIP, IN-GAME CONFIRMED BY THE USER 2026-09-10 on Gravekeeper's Recruiter: that card USED to ride its donor Botanical Girl 0x1ED4's native list30 slot, and when it was re-homed onto the records-free Normal Monster Battle Steer 0x0FB4 the same trigger was rebuilt as a mask row {0x0FB4, 0x0800} paired with Sangan's cls2 (+0C=0/+10=0). Measured in a duel: it fires on battle destruction, effect destruction, Tribute AND SYNCHRO MATERIAL -- the last being the case that broke Darksoul on the shared T.G. trampoline -- and does NOT fire on a discard from the hand or a mill from the Deck, i.e. it keeps list30's field-only scope exactly. So for 'sent from the field to the GY by any means' the two paths are interchangeable in practice, not just on paper. *** ⚠️ A build that UNWIRED the mask row on the theory that no registration was needed made the trigger stop firing entirely -- in-game, 2026-08-17.
*** AND THE TWO LISTS PRE-EMPT THE MASK TABLE: arming [sp+0x18] makes the dispatcher SKIP the mask lookup entirely, which is the bug an earlier Eclipse Wyvern build hit by registering in list30."
  address: 0x021C80E0
  oracle: "ov3"
  sources: [notes/lightpulsar-findings.md, eclipse-wyvern-findings]
  proof: |
    # the three search calls, their bounds and their gating loads
    assert h.bytes_at(0x021C80D2, 2, 'ov3') == bytes.fromhex('6a22'), 'list106 count imm (0x6A) drifted'
    assert h.bytes_at(0x021C80F0, 2, 'ov3') == bytes.fromhex('1e22'), 'list30 count imm (0x1E) drifted'
    assert h.bytes_at(0x021C8108, 2, 'ov3') == bytes.fromhex('9822'), 'mask-table count imm (0x98) drifted'
    # the mask lookup runs only when neither list armed [sp+0x18]
    assert h.bytes_at(0x021C80FE, 6, 'ov3') == bytes.fromhex('0698002876d1'), 'the [sp+0x18] pre-emption test drifted'
    # both list searches go through the 2-byte-element binary search
    for site in (0x021C80D4, 0x021C80F2):
        assert h.bl_target(site, 'ov3') == 0x02022E14, f'{site:#x} search retargeted'
    # list30 is 30 sorted entries and FULL of real cards -- Botanical Girl and Sangan
    l30 = h.u16_table(0x0226E904, 0x1E, 'ov3')
    assert h.is_sorted_unique(l30), 'list30 is not sorted-unique'
    for cid in (0x0FD6, 0x11E4, 0x1ED4, 0x2034, 0x23CC):
        assert cid in l30, f'{cid:#06x} left list30'
    # it cannot grow UP: the next table starts immediately after the 30th entry
    assert h.u16(0x0226E940, 'ov3') == 0x0E42, 'the table abutting list30 moved'
    # nor DOWN: 0x0226E902 is a free 2-byte alignment pad, but a prepended entry
    # would have to sort below 0x0D7C, and nothing but Speed Spells lives there
    assert h.u16(0x0226E902, 'ov3') == 0x0000, '0x0226E902 is no longer pad'
    assert l30[0] == 0x0D7C, 'list30 no longer starts at 0x0D7C'
    # list106 holds the destroyed-by-battle family
    l106 = h.u16_table(0x0226E990, 0x6A, 'ov3')
    for cid in (0x1E12, 0x156D, 0x21CD):
        assert cid in l106, f'{cid:#06x} left list106'
    # and the two populations are disjoint from the mask table's
    assert 0x19FE not in l30 and 0x19FE not in l106, 'Dandylion should be mask-table-only'

- id: "event.leave_bystander_posters"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** A BYSTANDER LEAVE TRIGGER (a card in the hand/GY reacting to ANOTHER monster leaving the field) IS A HARD-CODED ARM IN THE LEAVE DISPATCHER BODY that names the bystander's cid and calls one of two posters -- it is NOT a list/mask row (those register the LEAVING card's own triggers).
  * 0x021D3648(r0 side, r1 cid, r2 code, r3 cardword): P = 0x0229AC94 + (side&1)*0xB3C; for i < u32[P+0x14] over the GRAVEYARD array P+0x55C, each entry whose low 14 bits == cid is posted via 0x021D3168(side<<31 | (code<<25 & 0x7E000000) | 0x4E<<16 | cid, (w>>14&1) + ((w>>23&0xFF)<<1), cardword).
  * 0x021D36C0: identical over the HAND P+0x124, count P+0x0C, zone byte 0x4B.
Native callers (arms pass r6 side, [sp+0x1C] leave code, [sp+0x200] packed word):
