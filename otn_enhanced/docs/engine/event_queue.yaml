- id: "event.gy_to_banished_mover"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** EACH (source, destination) PAIR HAS ITS OWN MOVER AND ITS OWN CID GATE. There are THREE relocation routines, not one, and 0x021D1300 is only the EVENT-ADMISSION half of two of them (its own tail is nothing but `bl 0x021D3168` — it performs no physical movement at all):
  * 0x021C6B00 — the GENERAL relocation core. Exactly 8 callers, every one a thin wrapper hardcoding a destination zone in r3: 0x021C6D58/0x021C6D90/0x021C6DB4/0x021C6E5C/0x021C6E74 -> 0x0E (GY), 0x021C6DD8 -> 0x0C/0x0D (deck), and 0x021C6E4C / 0x021C6E98 -> 0x0F (banish; 0x021C6E4C has 16 callers, nearly all banishing from the HAND, zone 0x0B). Event code is picked @0x021C6B46: `[sp+0x48] != 0 -> 0x1F else 0x20`; it posts at `0x021C6CB8 bl 0x021D1300`.
  * 0x021D1DAC — reached via 0x021D21DC(side, ref, cid, flags); posts event 0x1E at 0x021D1F06, also through 0x021D1300.
  * *** 0x021C7118(r0=side, r1=&cardword, r2=flags, r3=facedown) — GRAVEYARD -> BANISHED, and it goes NOWHERE NEAR 0x021D1300. It hardcodes both zones into the word it builds (@0x021C7156 source = 0x0E, @0x021C7178 dest = 0x0F), aborts if 0x021BABE8 returns 0 or 0x021A2510 returns < 0, and posts by calling the register-prim 0x021D3168 DIRECTLY with r0 = 0x404F0000 | (side<<31) | cid — which decodes, against the identical word built at 0x021D1D5C, to zone 0x0F / event code 0x20. Wrappers: 0x021C7098(desc, &word, flags) [31 callers] and 0x021C7104. Afterwards, gate or no gate, it always runs 0x021C3BC8(0x32|flag, 0x0E, flags, ref) and 0x022391CC(0x20, word).
This is why Eclipse Wyvern's PART G was inert: it correctly admitted the donor to 0x021D1300's banish leaf, on a path a GY -> banished move never takes. Traced by identifying the actual banisher from savestates (Soul Release 0x12F9, cls0[179] +04 = 0x02208D18) rather than assuming a routine — its resolve loop is `0x02234964 (pick) -> 0x021A25E8 (ref->&word) -> 0x021C7098`, and its validation loop demands zone == 0x0E for every pick."
  address: 0x021C7118
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
    # 0x021C7118 hardcodes source zone 0x0E and dest zone 0x0F into the word
    assert h.bytes_at(0x021C7156, 6, 'ov3') == bytes.fromhex('0e2080020143'),     'GY->banished source-zone (0x0E<<10) encoding drifted'
    assert h.bytes_at(0x021C7178, 6, 'ov3') == bytes.fromhex('1e2080040843'),     'GY->banished dest-zone (0x0F, i.e. 0x1E<<18) encoding drifted'
    # the event word it hands the register-prim: zone 0x0F, event 0x20, bit22 set
    ev = h.u32(0x021C7254, 'ov3')
    assert ev == 0x404F0000, f'event literal drifted: {ev:#010x}'
    assert (ev >> 16) & 0x1F == 0x0F, 'event word zone field is not banished'
    assert (ev >> 25) & 0x3F == 0x20, 'event word code field is not 0x20'
    assert ev & (1 << 22), 'event word bit 22 not set'
    # and it posts via the register-prim directly
    assert h.bl_target(0x021C71F4) == 0x021D3168, '0x021C7118 no longer posts to 0x021D3168'
    # 0x021D1300 itself moves nothing: its only tail call is the same register-prim
    assert h.bl_target(0x021D1D92) == 0x021D3168, '0x021D1300 tail drifted'
    # the general core has exactly 8 callers, all in its own wrapper block
    import struct as _s
    img, base_ = env.image('ov3'), 0x02141700
    n = 0
    for off in range(0, len(img) - 3, 2):
        hi = _s.unpack_from('<H', img, off)[0]
        if hi & 0xF800 != 0xF000:
            continue
        lo = _s.unpack_from('<H', img, off + 2)[0]
        if lo & 0xF800 != 0xF800:
            continue
        oh = hi & 0x7FF
        oh -= 0x800 if oh & 0x400 else 0
        if (base_ + off + 4) + (oh << 12) + ((lo & 0x7FF) << 1) == 0x021C6B00:
            n += 1
    assert n == 8, f'relocation core 0x021C6B00 now has {n} callers, not 8'

- id: "event.banish_from_gy_cid_gate"
