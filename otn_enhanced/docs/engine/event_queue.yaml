- id: "event.zone_pair_relocation_emitter"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** 0x021C69D0 IS THE ONLY ROUTINE WITH BOTH ZONES AS PARAMETERS, and it is how a card is moved between two list zones:
  0x021C69D0(r0 = side, r1 = SOURCE zone, r2 = REF, r3 = side,
             [sp+0] = DEST zone, [sp+4] = DEST index, [sp+8] = flags)
It packs each endpoint into one u16 as {bit0 side, bits1..5 zone, bits6..15 ref} and emits command 0x3E through the queue append 0x021C3BC8. ⚠️ It takes a REF ((inst << 1) | side), NOT a card word and NOT a pointer.
Its EIGHT native callers are the complete zone-pair map of the engine:
    0x021C69C0 hand 0x0B -> deck 0x0D        0x021C6CA8 hand 0x0B -> GY 0x0E
    0x021C6A80 GY 0x0E -> runtime            0x021C6F78 runtime -> runtime
    0x021C6AE4 banished 0x0F -> 0x0C/0x0D (deck or Extra, by card type)
    0x021C726C banished 0x0F -> GY 0x0E      0x021C72B2 banished 0x0F -> deck 0x0D
    0x021C739C deck 0x0D -> HAND 0x0B
*** THERE IS NO NATIVE banished -> HAND CALLER — no OTN card does it — so an effect that needs one must emit it: take the deck->hand site verbatim and change the source immediate. Its shape at 0x021C7384..0x021C739C is `[sp+0] = 0x0B`, `[sp+4] = player[side].hand_count` (loaded from 0x0229ACA0 + side*0xB3C, i.e. player+0x0C — which independently corroborates ram.hand_is_zone_0x0B), `[sp+8] = 0`, r0 = r3 = side, r2 = the ref. Both native banished-source wrappers follow the call with `0x022391CC(0x26, 0)`.
*** ⚠️⚠️ CORRECTION, MEASURED IN-GAME 2026-08-13: 0x021C72CC is the **DECK** -> hand mover, NOT a general one. Eclipse Wyvern's clause 2 shipped it against a card in the banished zone and the game opened a DECK SEARCH, shuffled, and added nothing. Its one search loop (0x021C732A..0x021C744C) walks player+0x304 with count player+0x10, and `find_lit_refs 21C72D9` finds exactly ONE thunk into its body, so there are no per-zone sibling variants. It is the primitive behind White Stone of Legend and Cross Porter — both of which search the DECK. This is the THIRD (source, destination) pair to need its own routine; see event.gy_to_banished_mover."
  address: 0x021C69D0
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
    import struct as _s
