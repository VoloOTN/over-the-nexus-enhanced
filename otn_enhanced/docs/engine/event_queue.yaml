  claim: "WHETHER A TRIGGER ASKS 'you can' IS A PROPERTY OF THE cls RECORD, NOT OF THE RESOLVER. Nothing a resolver raises makes an effect optional: +0x0C slot3 is the ACTIVATION CONDITION and +0x10 slot4 the COST / ACTIVATION-PROCEDURE step, and both are driven by the activation state machine 0x02217F80 (dispatch.cls_slot_roles) — that machine is what offers the choice. The A/B pair is already shipped in gravekeepers_recruiter and holds in the stock image:
