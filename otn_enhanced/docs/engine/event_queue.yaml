  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** can_synchro 0x02249540(side, cid, forced, flag) is the 'can this Synchro be made NOW' dry run: it saves the procedure state ([0x0229ABFC+0x68..0x7C], the forced-material slot 0x0229AC7C, [0x0229AAFC+0x74]), STORES THE FORCED SLOT = r2 (@0x022495F0), then tries each of the 10 FIELD slots as the FIRST pick via the validator 0x02249AFC (side/slot from the ARM9 divide 0x020989A4, i/5 and i%5); level_sum still reaches HAND materials through the hand-mode gate 0x022494EC (the Eccentric Boy / Mara route). The Extra-Deck enumerator 0x0223BE40 calls it only for mode bit 0x20, as can_synchro(side, cid, 0, 1) @0x0223BF76 -- forced is HARD-WIRED 0. *** CORRECTION: wattuna build 1 concluded 'mode 0x24 kills the offer because can_synchro is field-only' from a savestate emulation that actually ABORTED on the ARM divide BLX @0x02249602. With a Python stand-in for the divide (scratch/wattuna_u4_offer_probe.py, rom_wattuna_cobra.ml3: Wattuna on field + Lv2 in hand, ED Wattchimera Lv6 / Watthydra Lv7), mode 0x24 counts exactly the makeable one (Wattchimera) once the gate grants the hand; mode 4 counts both."
