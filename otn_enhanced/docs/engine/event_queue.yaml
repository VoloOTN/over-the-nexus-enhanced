    assert _lit(0x021C71BE) == 0x17BB, 'Necroface arm drifted'
    assert _lit(0x021C71C8) == 0x1CF6, 'Cyber Ouroboros arm drifted'
    # the same pair guards the OTHER applier's banish leaf 0x021D1D3E
