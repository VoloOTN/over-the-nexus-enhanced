n every descriptor was taken as proof that the discard trigger had never fired, when it is exactly what a FIRING discard posts.  It also kills any desc[+3]/desc[+5] discriminator, in any combination. *** ⚠️ THE EVENT WORD IS NOT THE WHOLE DESCRIPTOR: 0x021D3168 ALSO stores its THIRD argument -- the packed card word w itself -- at desc[+0x20] (`ADDS R7,R2,#0` at 0x021D3174, `STR R7,[SP,#0x20]` at 0x021D31B6, the descriptor being `ADD R4,SP,#0`), and the post site passes `LDR R2,[SP,#0x28]` = w. So although the EVENT word carries only one side bit, the DESCRIPTOR carries the full word and with it BOTH sides: bit 9 is the owner, bit 18 the actor -- exactly dispatch.opponent_effect_discard_test's gate. DO NOT conclude from this fact that the acting side is unavailable at resolve time; it is, at desc[+0x20]."
