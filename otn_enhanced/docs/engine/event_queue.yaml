     'When this card is sent from the field to the GY, YOU CAN add 1 Plant...'
  Sangan         0x0FD6 cls2[40]  = (0x02207EF5, 0, 0,          0,          0)
     'When Sangan is sent to the Graveyard, add 1 monster...'  (MANDATORY)
Identical resolvers, and the only difference is the +0C/+10 pair. Population split: 155 of 697 cls2 records have +0C == +10 == 0; the other 542 carry an activation procedure. Eclipse Wyvern's donor record is the Sangan shape (all four trailing slots 0), which is exactly why its clause 2 resolved WITHOUT asking when tested in-game 2026-08-13.
