- id: "event.battle_destroy_flags_table"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "*** THE ATTACKER-SIDE BATTLE-DESTRUCTION TRIGGER IS A TABLE, AND IT HAD NEVER BEEN BANKED: 0x0226EA64, 110 x {u16 cid, u16 mask}, stride 4, sorted-unique. *** Read at exactly one place: `ldrsh r0,[r4,#0xA]` (the cid) ; `ldr r1,[pc,#0x9C]` @0x021CAAF2 -> the SOLE literal 0x021CAB90 = 0x0226EA64 ; `movs r2,#0x6E` @0x021CAAF4 (110 rows) ; `movs r3,#4` @0x021CAAF6 (stride 4) ; `bl 0x02022E44` @0x021CAAFC, the stride-aware binary search; a miss skips the whole refinement block. *** DO NOT CONFUSE IT WITH list106 0x0226E990, WHICH IS THE VICTIM SIDE ('this card destroyed by battle and sent to the GY', event.leave_dispatcher_three_registers). This one is 'THIS CARD DESTROYED SOMETHING'. *** MASK SEMANTICS, read straight off membership and unambiguous: 0x000F = 'destroys an OPPONENT's monster by battle AND sends it to the GY' -- Goyo Guardian 0x1E38, Hydro Genex 0x1E9A, Hydrogeddon 0x194F, Jurrac Spinos 0x2031, Flamvell Firedog 0x2088, Blackwing Shura 0x1FE3, Inferno 0x16C5, Lightning Warrior 0x2220, Truckroid 0x1A57, X-Saber Uruz 0x1D72, Chaos-End Master 0x1E9D; 0x0007 = 'destroys A monster by battle' (either controller) -- Thought Ruler Archfiend 0x1E3A, Guardian Angel Joan 0x170B, Royal Knight 0x1A23, Darkblaze Dragon 0x1C4D, Iron Chain Repairman 0x1ECD, Flamvell Grunika 0x1F16. The refinement block after the search tests the bits one at a time (bit2 @0x021CAB2A = destination zone 0x0E, i.e. the GY; bit3 @0x021CAB3E compares the destroyed card's side against [r4+0]). *** THE COUNT IS A HARD-CODED IMMEDIATE, so an insert must be COUNT-NEUTRAL -- and the table ships with FOUR PHANTOMS AT ITS HEAD, 0x0E12 / 0x0E8A / 0x0E9C / 0x0EA7, none of which has a card_prop record. crimson_blader spends 0x0E9C; three are left. *** The one-line aside in notes/safe-zone-findings.md:596 that named '0x0226EA7C, 110 entries' was quoting Zombyra the Dark 0x147D's ROW, not the base."
  address: 0x0226EA64
  oracle: "ov3"
  sources: [notes/crimson-blader-findings.md, notes/safe-zone-findings.md]
  proof: |
    base, n = 0x0226EA64, 0x6E
    w = h.u16(0x021CAAF2, 'ov3')
    assert w & 0xF800 == 0x4800, '0x021CAAF2 is not an LDR literal'
    assert ((0x021CAAF2 + 4) & ~3) + (w & 0xFF) * 4 == 0x021CAB90, 'literal slot moved'
    assert h.u32(0x021CAB90, 'ov3') == base, 'the sole flags-table literal moved'
    assert h.bytes_at(0x021CAAF4, 2, 'ov3') == bytes.fromhex('6e22'), 'count imm (movs r2,#0x6E) drifted'
    assert h.bytes_at(0x021CAAF6, 2, 'ov3') == bytes.fromhex('0423'), 'stride imm (movs r3,#4) drifted'
    assert h.bl_target(0x021CAAFC, 'ov3') == 0x02022E44, 'no longer the stride-aware search'
    rows = {h.u16(base + i * 4, 'ov3'): h.u16(base + i * 4 + 2, 'ov3') for i in range(n)}
    cids = [h.u16(base + i * 4, 'ov3') for i in range(n)]
    assert h.is_sorted_unique(cids), 'the flags table is not sorted-unique'
    # the two decoded masks, on cards whose printed text says exactly that
    for cid in (0x1E38, 0x1E9A, 0x194F, 0x2031, 0x2088, 0x1FE3, 0x16C5, 0x2220):
        assert rows[cid] == 0x000F, f'{cid:#06x} lost the opponent-monster mask'
    for cid in (0x1E3A, 0x170B, 0x1A23, 0x1C4D, 0x1ECD, 0x1F16):
        assert rows[cid] == 0x0007, f'{cid:#06x} lost the any-monster mask'
    # the four head phantoms the count-neutral insert spends
    assert cids[:4] == [0x0E12, 0x0E8A, 0x0E9C, 0x0EA7], 'the head phantoms moved'

