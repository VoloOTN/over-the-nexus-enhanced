- id: "event.sent_to_gy_registration_pair"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "A 'sent to the Graveyard by any means' card is registered by exactly TWO things and nothing else: a leave-mask row with mask 0x0800 and a cls2 record. Verified by scanning every u16 in ov3 and arm9 for five such cards -- Dandylion 0x19FE (in-game proven to fire from a hand DISCARD), Peten the Dark Clown 0x17C5, Jinzo - Returner 0x1D9B, The White Stone of Legend 0x1EAA, Skull-Mark Ladybug 0x12A2 -- which share a mask row and a cls2 record and have no other table in common. There is no third registration to join."
  address: 0x0226EC1C
  oracle: "ov3"
  sources: [eclipse-wyvern-findings, otn-leave-descriptor-slots]
