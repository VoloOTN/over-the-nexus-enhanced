  0x021C71BC  LDR R0,[R4]            ; the card word
  0x021C71BE  LDR R1,=0x17BB         ; Necroface        (pool 0x021C724C)
  0x021C71C0  LSLS R0,#0x12 ; LSRS R0,#0x12   ; cid = w & 0x3FFF
  0x021C71C4  CMP R0,R1 ; BEQ 0x021C71CE       ; -> POST
  0x021C71C8  LDR R1,=0x1CF6         ; Cyber Ouroboros  (pool 0x021C7250)
  0x021C71CA  CMP R0,R1
  0x021C71CC  BNE 0x021C71F8         ; everyone else: the card MOVES, no event
{0x17BB, 0x1CF6} is the SAME pair admitted by the 0x021D1D3E leaf of 0x021D1300's non-GY chain (`dest == 0x0F && (flags & 0xC0) != 0xC0`) — the engine registers this trigger twice, once per applier. TO GIVE A DONOR THE TRIGGER: displace `LDR R1,=0x1CF6 ; CMP R0,R1` (4 B @0x021C71C8, native `21 49 88 42`) into a BL to an ov3 dead-code stub that tests 0x1CF6 then the donor and returns with Z set for either, letting the caller's own BNE route both. Verified safe: nothing in ov3 branches to 0x021C71C8/CA/CC; r0 (the cid) is live afterwards at 0x021C71DC and the stub must not touch it; r1 is dead on both exits; LR is free (0x021C7118 pushed it and returns POP{...,PC}). ⚠️ ov3 dead code ONLY, never the ov5 cave — 0x021C7118 is shared engine code that also runs in puzzles, where ov41 evicts ov5. STILL UNPROVEN: whether the posted event actually enumerates a cls2 record on the donor. Cyber Ouroboros is cls2[307] (+04 = 0x022065B8, +10 = 0x021E5200, rest 0) and carries rows in the 0x0226F628 cost/tag table (row 29) and three other data tables; Necroface is cls2[151] AND cls1[396], both +04 = 0x0221C204. Neither has a leave-mask row, so a banish trigger needs no mask/list30 registration."
  address: 0x021C71BE
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
