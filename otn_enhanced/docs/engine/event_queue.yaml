- id: "event.packed_word_layout"
  subsystem: "event_queue"
  confidence: "VERIFIED"
  claim: "An engine event is a PACKED U32: [0..15] cid, [16..20] zone -> desc[+3], [21..23] cls selector -> desc[+5], [24] flag -> desc[+6], [25..30] event code -> desc[+4], [31] side -> desc[+2]. Proven by the unpacker at 0x021D3196 (`MOV R2,#0xE ; LSL R2,#0x14 ; AND R2,R5 ; LSR R2,#0x15` = selector) and 0x021D31AA (`MOV R2,#0x7E ; LSL R2,#0x18 ; AND R2,R5 ; LSR R2,#0x19` = event). *** The event field is SIX bits wide, so event 0x1F is the constant 0x3E000000 -- a compiler spells it `MOV #0x3E ; LSL #0x18`, NEVER `MOV #0x1F ; LSL #25`. Searching for the latter returns a false negative."
  address: 0x021D3196
  oracle: "ov3"
  sources: [eclipse-wyvern-findings]
  proof: |
    assert h.bytes_at(0x021D3196, 8, 'ov3') == bytes.fromhex('0e2212052a40520d'), 'selector unpack drifted'
    assert h.bytes_at(0x021D31AA, 8, 'ov3') == bytes.fromhex('7e2212062a40520e'), 'event-code unpack drifted'

