- id: "field.race_and_attribute_bitmasks"
  subsystem: "field_spell_engine"
  confidence: "VERIFIED"
  claim: "*** INSIDE THE FIELD-SPELL ENGINE, [r6+0x08] IS A RACE BITMASK = 1 << ERA2_race_code (game_constants.ERA2_RACE_MAP) AND [r6+0x0C] IS THE ATTRIBUTE BITMASK (read as a SIGNED halfword, `movs r0,#0xC ; ldrsh r1,[r6,r0]`). This is a CLOSED proof, not an inference: all six classic field-spell arms decode bit-exactly onto their printed race sets, six independent equations in one unknown mapping -- Forest 0x10F0 0xF<<10 = 0x3C00 = Insect|Beast|Beast-Warrior|Plant; Wasteland 0x10F1 0x91<<2 = 0x244 = Zombie|Rock|Dinosaur; Mountain 0x10F2 0x00090002 = Dragon|Winged Beast|Thunder; Sogen 0x10F3 9<<12 = 0x9000 = Beast-Warrior|Warrior; Umi 0x10F4 0x00084120 = Sea Serpent|Fish|Aqua|Thunder at +200 with 0x90 = Pyro|Machine at -200; Yami 0x10F5 0x00040008 = Fiend(bit 3)|Spellcaster(bit 18) at +200 with 0x20000 = Fairy(bit 17) at -200. Harpies' Hunting Ground 0x183F (1<<16 = Winged Beast) and Jurassic World 0x1AA7 (1<<9 = Dinosaur) close it further. ==> FIEND = BIT 3 = 0x8, which fits a `movs r0,#8` with no literal pool. CONSEQUENCE: an 'all <race> monsters gain N' clause is a race-bit test plus an amount, with no table and no cave slot."
  address: 0x021B2856
  oracle: "ov3"
  sources: [notes/gates-of-dark-world-findings.md]
  proof: |
    RACE = {'Dragon': 1, 'Zombie': 2, 'Fiend': 3, 'Pyro': 4, 'Sea Serpent': 5, 'Rock': 6,
            'Machine': 7, 'Fish': 8, 'Dinosaur': 9, 'Insect': 10, 'Beast': 11,
            'Beast-Warrior': 12, 'Plant': 13, 'Aqua': 14, 'Warrior': 15,
            'Winged Beast': 16, 'Fairy': 17, 'Spellcaster': 18, 'Thunder': 19}
    def m(*names):
        v = 0
        for n in names:
            v |= 1 << RACE[n]
        return v
    # cross-check against game_constants so a renamed race cannot silently drift
    from otn_enhanced.rom.game_constants import ERA2_RACE_MAP
    for name, bit in RACE.items():
        assert ERA2_RACE_MAP[bit] == name, f'ERA2_RACE_MAP[{bit}] is not {name}'
    # Forest: movs r0,#0xf ; ldr r1,[r6,#8] ; lsls r0,r0,#0xa
    assert h.u16(0x021B2856, 'ov3') == 0x200F and h.u16(0x021B2858, 'ov3') == 0x68B1
    assert h.u16(0x021B285A, 'ov3') == (10 << 6)
    assert (0x0F << 10) == m('Insect', 'Beast', 'Beast-Warrior', 'Plant')
    # Wasteland: movs r0,#0x91 ; lsls r0,r0,#2
    assert h.u16(0x021B2866, 'ov3') == 0x2091 and h.u16(0x021B286A, 'ov3') == (2 << 6)
    assert (0x91 << 2) == m('Zombie', 'Rock', 'Dinosaur')
    # Mountain / Umi / Yami: pool-word masks
    assert h.u32(0x021B29D4, 'ov3') == m('Dragon', 'Winged Beast', 'Thunder')
    assert h.u32(0x021B29D8, 'ov3') == m('Sea Serpent', 'Fish', 'Aqua', 'Thunder')
    assert h.u32(0x021B29DC, 'ov3') == m('Fiend', 'Spellcaster')
    # Sogen: movs r0,#9 ; lsls r0,r0,#0xc
    assert h.u16(0x021B287C, 'ov3') == 0x2009 and h.u16(0x021B2880, 'ov3') == (12 << 6)
    assert (9 << 12) == m('Beast-Warrior', 'Warrior')
    # the negative halves: Umi's Pyro|Machine and Yami's Fairy
    assert h.u16(0x021B2894, 'ov3') == 0x2090 and 0x90 == m('Pyro', 'Machine')
    assert h.u16(0x021B28AC, 'ov3') == 0x2002 and h.u16(0x021B28AE, 'ov3') == (16 << 6)
    assert (2 << 16) == m('Fairy')
    # Harpies' Hunting Ground and Jurassic World close the mapping
    assert h.u16(0x021B28B6, 'ov3') == 0x2001 and h.u16(0x021B28BA, 'ov3') == (16 << 6)
    assert (1 << 16) == m('Winged Beast')
    assert h.u16(0x021B28C2, 'ov3') == 0x2102 and h.u16(0x021B28C6, 'ov3') == 0x0209
    assert (2 << 8) == m('Dinosaur')
    # and the attribute mask is the OTHER offset, read signed
    assert h.u16(0x021B28D8, 'ov3') == 0x200C and h.u16(0x021B28DA, 'ov3') == 0x5E31

- id: "field.plus300_tail"
  subsystem: "field_spell_engine"
  confidence: "VERIFIED"
  claim: "THE ENGINE ALREADY SHIPS A '+300 ATK AND +300 DEF' TAIL: 0x021B28CC (`adds r0,r1,#0 ; subs r0,#0xd4 ; subs r1,#0xd4 ; adds r4,r4,r0 ; adds r5,r5,r1 ; b 0x021B2B48`). It takes the amount from r1 and REQUIRES r1 == 0x200 on entry, because the compiler reused Jurassic World's race-mask constant as the amount source (300 = 0x200 - 0xD4). Its only native inbound edge is fall-through from Jurassic World 0x1AA7's arm 0x021B28C2, whose printed text is 'All Dinosaur-Type monsters gain 300 ATK and DEF'. There is a matching +200/+200 tail at 0x021B2860 (`adds r4,#0xc8 ; adds r5,#0xc8`) and a -200/-200 one at 0x021B289A. CONSEQUENCE: a new 'all <race> monsters gain 300 ATK/DEF' card is SEVEN halfwords -- test the race bit, set r1 = 0x200, branch here -- and the arithmetic is then Konami's own shipped implementation of exactly that clause rather than new code. Used by gates_of_dark_world PART A (donor Colosseum 0x1C8B, race bit 3 = Fiend). NOTE the +300 amount CANNOT be reached with a single `adds rN,#imm8` (max 255), which is why the tail exists at all."
  address: 0x021B28CC
  oracle: "ov3"
  sources: [notes/gates-of-dark-world-findings.md]
  proof: |
    assert h.bytes_at(0x021B28CC, 12, 'ov3') == bytes.fromhex('081cd438d43924186d1837e1'), \
        'the +300/+300 tail moved or changed'
    # it needs r1 == 0x200, which Jurassic World's arm supplies
    assert h.u16(0x021B28C2, 'ov3') == 0x2102 and h.u16(0x021B28C6, 'ov3') == 0x0209, \
        "Jurassic World's arm no longer builds r1 = 0x200"
    assert (2 << 8) - 0xD4 == 300, 'the 300 identity is wrong'
    # the tail's exit is the engine epilogue
    _off = h.u16(0x021B28D6, 'ov3') & 0x7FF
    _off -= 0x800 if _off & 0x400 else 0
    assert 0x021B28D6 + 4 + 2 * _off == 0x021B2B48, 'the tail no longer exits to the epilogue'
    # the sibling +200 / -200 tails
    assert h.u16(0x021B2860, 'ov3') == 0x34C8 and h.u16(0x021B2862, 'ov3') == 0x35C8
    assert h.u16(0x021B289A, 'ov3') == 0x3CC8 and h.u16(0x021B289C, 'ov3') == 0x3DC8

