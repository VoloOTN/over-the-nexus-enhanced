  claim: "THE FIELD-SPELL ARM MAP (cid -> arm), enumerated by walking the stack-based switch rather than scanning for cids -- a raw value scan finds NOTHING for most of these (Sogen and Umiiruka have ZERO occurrences anywhere in arm9+ov3). Forest 0x10F0 -> 0x021B2856, Wasteland 0x10F1 -> 0x021B2866, Mountain 0x10F2 -> 0x021B2872, Sogen 0x10F3 -> 0x021B287C, Umi 0x10F4 -> 0x021B2888, Yami 0x10F5 -> 0x021B28A0 (these six via a PC-relative halfword jump table @0x021B2764 based at 0x021B2766), Chorus of Sanctuary 0x1323 -> 0x021B294C, Gaia Power 0x1344 -> 0x021B28D8, Umiiruka 0x1345 -> 0x021B28EE, Molten Destruction 0x1346 -> 0x021B28FA, Rising Air Current 0x1347 -> 0x021B2906, Luminous Spark 0x1348 -> 0x021B2912, Mystic Plasma Zone 0x1349 -> 0x021B291E, A Legendary Ocean 0x150B -> 0x021B292C, Necrovalley 0x159D -> 0x021B296C, Harpies' Hunting Ground 0x183F -> 0x021B28B6, Neo Space 0x1A77 -> 0x021B2986, Jurassic World 0x1AA7 -> 0x021B28C2, Venom Swamp 0x1BFC -> 0x021B2A1E, Colosseum 0x1C8B -> 0x021B2A3E, Acidic Downpour 0x1D21 -> 0x021B2938, Realm of Light 0x1DCA -> 0x021B2A6A, Wetlands 0x1DCB -> 0x021B2A8C, Morphtronic Map 0x1F6D -> 0x021B2AAE, Ojama Country 0x204A -> 0x021B2ACE, Closed Forest 0x2189 -> 0x021B2AE4, Amazoness Village 0x2318 -> 0x021B2AFC, PHANTOM 0x2348 -> 0x021B2B10, Temple of the Six 0x247E -> 0x021B2B34. *** 0x2348 HAS NO card_prop RECORD, so its 36-byte arm 0x021B2B10..0x021B2B33 is PROVABLY DEAD overlay-3 code -- a free, puzzle-safe code slot inside the engine itself (cf. stat.phantom_arm_scratch). *** Each arm is delimited by the next one, so an arm's size is its successor's address minus its own; Colosseum's is the roomiest at 44 B and Harpies' the tightest at 12 B."
  address: 0x021B2764
  oracle: "ov3"
  sources: [notes/gates-of-dark-world-findings.md]
  proof: |
    jt = [0x021B2766 + h.u16(0x021B2764 + 2 * k, 'ov3') for k in range(6)]
    assert jt == [0x021B2856, 0x021B2866, 0x021B2872, 0x021B287C, 0x021B2888, 0x021B28A0], \
        f'the six-entry field-spell jump table changed: {[hex(a) for a in jt]}'
    # the two arms the Gates patch depends on, pinned by their entry branches
    def b_target(site):
        v = h.u16(site, 'ov3')
        assert v & 0xF800 == 0xE000, f'{site:#x} is not an unconditional B'
        off = v & 0x7FF
        off -= 0x800 if off & 0x400 else 0
        return site + 4 + 2 * off
    assert b_target(0x021B27DC) == 0x021B2A3E, 'Colosseum no longer routes to 0x021B2A3E'
    # 0x2348 is a phantom: it names no card, so its arm is dead code
    import json, pathlib
    p = pathlib.Path('scratch/cid_to_name.json')
    if not p.exists():
        raise Skip('scratch/cid_to_name.json absent')
    names = json.loads(p.read_text(encoding='utf-8'))
    assert str(0x2348) not in names, '0x2348 is a real card -- its arm is NOT dead'
    for real in (0x10F5, 0x1AA7, 0x1C8B, 0x183F):
        assert str(real) in names, f'{real:#06x} should be a real card'
