- id: "fusion.code_classes"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "A recipe material slot holds either a literal card cid (>= 51) or a small CATEGORY CODE. In the predicate 0x02231A74: codes 1..22 are Type/race (tested as (1 << code) & (1 << get_race)), codes 23..50 index a 28-entry PC-relative halfword jump table @0x02231B54, and the cid/code split is the `cmp r0,#0x33` at 0x02232146. Every code used by the 166 shipped recipes is <= 50, so the code space is exactly 1..50."
  address: 0x02231A74
  oracle: "ov3"
  sources: [notes/escuridao-findings.md]
  proof: |
    assert h.u16(0x02231B1E, 'ov3') == 0x2816, 'cmp r0,#0x16 (race ceiling) moved'
    assert h.u16(0x02231B40, 'ov3') == 0x3817, 'subs r0,#0x17 (jump-table bias) moved'
    assert h.u16(0x02231B42, 'ov3') == 0x281B, 'cmp r0,#0x1b (28 entries) moved'
    assert h.u16(0x02232146, 'ov3') == 0x2833, 'cmp r0,#0x33 (cid/code split) moved'
    codes = set()
    for base, cnt, stride, slots in ((0x02270B94, 161, 8, 3), (0x02270B58, 5, 12, 5)):
        for i in range(cnt):
            for k in range(1, slots + 1):
                v = h.u16(base + i * stride + k * 2, 'ov3')
                if 0 < v < 0x33: codes.add(v)
    assert max(codes) == 50, f'category codes now reach {max(codes)}, not 50'

- id: "fusion.attribute_leaf"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "Material codes 36..41 ALL share one parametric leaf @0x02231CF2 whose test is exactly `attribute == code - 35` (`subs r0,#0x23; movs r1,#1; lsls r1,r0; ands r0,[sp,#0xc]` where [sp+0xC] = 1 << get_attribute). With the engine numbering (LIGHT 1, DARK 2, WATER 3, FIRE 4, EARTH 5, WIND 6) that makes 36=LIGHT, 37=DARK, 38=WATER, 39=FIRE, 40=EARTH, 41=WIND — cross-checked against the five shipped attribute-HERO recipes, which leaves 37 (DARK) as the only unused slot."
  address: 0x02231CF2
  oracle: "ov3"
  sources: [notes/escuridao-findings.md, escuridao.py]
  proof: |
    tb = 0x02231B54
    tgt = []
    for i in range(28):
        off = h.u16(tb + i * 2, 'ov3')
        if off >= 0x8000: off -= 0x10000
        tgt.append(0x02231B56 + off)
    assert len(set(tgt[13:19])) == 1 and tgt[13] == 0x02231CF2, \
        f'codes 36-41 no longer share one leaf: {[hex(x) for x in tgt[13:19]]}'
    assert h.u16(0x02231CF6, 'ov3') == 0x3823, 'attribute leaf is not subs r0,#0x23'
    sib = {0x1FBA: 40, 0x1FC1: 38, 0x2161: 36, 0x2190: 41, 0x24DF: 39}
    rows = {h.u16(0x02270B94 + i * 8, 'ov3'): i for i in range(161)}
    for cid, code in sib.items():
        got = h.u16(0x02270B94 + rows[cid] * 8 + 4, 'ov3')
        assert got == code, f'sibling 0x{cid:04X} attribute code {got} != {code}'

