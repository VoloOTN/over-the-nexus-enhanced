- id: "fusion.atk_delta_tables"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "Continuous ATK/DEF modifiers are TWO per-cid tables of stride 6, {u16 cid, s16 atk_delta, s16 def_delta}, sorted and binary-searched by 0x02022E44: table 1 @0x0226E1E4 (111 rows) and table 2 @0x0226E480 (0x71 = 113 rows). A stored delta of +1 or -1 is a SENTINEL meaning 'variable — multiply by the runtime amount in [sp+0x80]' (the `cmp rX,#1` / `cmp rX,#-1` then `muls` idiom at 0x021B60E8 and 0x021B611E); a literal delta is applied as-is. 45 of table 2's rows carry the sentinel and are exactly the 'gains N ATK for each X' cards (Chaosrider Gustaph, Card Trooper, Necroface, ...), while fixed-delta rows match their printed text (Zombyra -200, Exarion Universe -400, Legendary Fiend +700, Insect Princess +500). ⚠ CORRECTED 2026-08-03: table 2 was recorded as 0x0226E4BC/103 rows, which is TEN ROWS TOO HIGH -- it came from a manual walk that started mid-array. The consumer's own immediates are `movs r2,#0x71` @0x021B60BA and `movs r3,#6` @0x021B60BC with the base literal at 0x021B6184, and 0x0226E480 + 113*6 = 0x0226E726 while table 1 ends exactly at 0x0226E47E. The old fact still PASSed because a subrange of a sorted array is still sorted and all three spot-checked rows lay inside it -- the proof below now pins both bases to the consumer's literals so the same mistake cannot pass again. ⚠ These tables are NOT where a continuous 'gains N ATK for each X' effect lives: every one of table 2's 51 sentinel rows is an activated or event-driven gain, and the amount is frozen at attach time. See stat.recompute for the continuous engine."
  address: 0x0226E480
  oracle: "ov3"
  sources: [notes/escuridao-findings.md]
  proof: |
    assert h.u32(0x021B6188, 'ov3') == 0x0226E1E4, 'delta table 1 base literal moved'
    assert h.u16(0x021B610C, 'ov3') == 0x226F, 'table 1 count is not movs r2,#0x6f'
    assert h.u16(0x021B610E, 'ov3') == 0x2306, 'table 1 stride is not movs r3,#6'
    assert h.u32(0x021B6184, 'ov3') == 0x0226E480, 'delta table 2 base literal moved'
    assert h.u16(0x021B60BA, 'ov3') == 0x2271, 'table 2 count is not movs r2,#0x71'
    assert h.u16(0x021B60BC, 'ov3') == 0x2306, 'table 2 stride is not movs r3,#6'
    for base, cnt in ((0x0226E1E4, 111), (0x0226E480, 113)):
        cids = [h.u16(base + i * 6, 'ov3') for i in range(cnt)]
        assert h.is_sorted_unique(cids), f'delta table {base:#x} not sorted'
    assert 0x0226E1E4 + 111 * 6 == 0x0226E47E, 'table 1 no longer abuts table 2'
    assert 0x0226E480 + 113 * 6 == 0x0226E726, 'table 2 end moved'
    def delta(base, cnt, cid):
        for i in range(cnt):
            if h.u16(base + i * 6, 'ov3') == cid:
                v = h.u16(base + i * 6 + 2, 'ov3')
                return v - 0x10000 if v >= 0x8000 else v
    assert delta(0x0226E480, 113, 0x147D) == -200, 'Zombyra row changed'
    assert delta(0x0226E480, 113, 0x16C4) == 1, 'Chaosrider Gustaph lost the sentinel'
    assert delta(0x0226E480, 113, 0x1704) == 500, 'Insect Princess row changed'
    # the ten rows the old base skipped must really be there
    assert h.u16(0x0226E480, 'ov3') == 0x0E69 and h.u16(0x0226E4B6, 'ov3') == 0x147A, \
        'the 10 rows below the retracted 0x0226E4BC base are missing'

- id: "fusion.variable_atk_is_rider_param"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "The variable ATK amount is a RIDER-NODE FIELD, not a per-cid computation. In the whole 0x021B4000-0x021B7000 region there is exactly ONE write to [sp+0x80], `str r0,[sp,#0x80]` @0x021B5FD0, and it is a plain struct load from the relationship-node pool 0x0229D33C (stride 0xA): node+0 = the GRANTING cid (which is then the delta-table key), node+2 = kind, node+4 = THE AMOUNT -> [sp+0x80]. So the function is the continuous-rider walker: per attached node it looks the granting card up in the delta tables and applies its delta, multiplied by the node's amount when the delta is the +-1 sentinel. The amount is baked in at ATTACH time. Correspondingly, 'gains N ATK for each X' cards attach via the shared tail 0x02219AE0-0x02219B0E: `ldr r1,[r5,#0x34]` (the count) x a per-arm multiplier (0x02219AFC -> 200 kind 3; 0x02219AEA -> 0x19<<4 = 400; 0x02219AF4 -> 0x7D<<2 = 500), truncated to u16, `str r0,[sp]` as the param, then bl 0x021C479C (riders.attach_api). Absolute Zero attaches through the same API @0x02250DD4 (kind 4), which is why its ATK gain owns no cls record."
  address: 0x021B5FD0
  oracle: "ov3"
  sources: [notes/escuridao-findings.md]
  proof: |
    assert h.u16(0x021B5FD0, 'ov3') == 0x9020, 'the sole str r0,[sp,#0x80] moved'
    assert h.u32(0x021B6180, 'ov3') == 0x0229D33C, 'relationship-pool literal moved'
    assert h.u16(0x021B5FB8, 'ov3') == 0x220A, 'node stride immediate is not movs r2,#0xa'
    assert h.u16(0x021B5FCE, 'ov3') == 0x8880, 'node+4 read (ldrh r0,[r0,#4]) moved'
    # the shared count x multiplier attach tail
    assert h.u16(0x02219AFE, 'ov3') == 0x20C8, 'the x200 multiplier arm moved'
    assert h.u16(0x02219B02, 'ov3') == 0x2303, 'the kind=3 immediate moved'
    assert h.u16(0x02219B08, 'ov3') == 0x9000, 'param str r0,[sp] moved'
    assert h.bl_target(0x02219B0E, 'ov3') == 0x021C479C, 'attach call moved'
    assert h.bl_target(0x02250DD4, 'ov3') == 0x021C479C, 'Absolute Zero attach moved'

- id: "fusion.variable_atk_routing"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "RESOLVED 2026-08-03 (was UNVERIFIED). The switch at 0x02219C2E — function 0x02219BF0, reached as cls slot1 0x02219BF1 on 21 records — is DELTA TABLE 1's amount computer, i.e. the cards that buff ANOTHER monster. It reads the cid with `ldrh r4,[r5]` and has 22 arms (0x0D53 0x0DB3 0x0DBC 0x0E5E 0x0E72 0x1492 0x14BE 0x1511 0x16CE 0x16E3 0x1890 0x18CA 0x19AB 0x19B4 0x1BE0 0x1E1D 0x1E26 0x1EF1 0x2023 0x2226 0x2272 0x229F), each leaf computing a count x a multiplier into r6 through the shared tail 0x02219D24 (`adds r6,r0,#0 ; muls r6,r1,r6`) and then attaching via 0x021C47CC with kind 2 and the amount at [sp+4]. Deal of Phantom 0x1492's leaf @0x02219D2A is `ldrb r0,[r5,#2] ; bl 0x021B16F0 ; movs r1,#0x64` = 100 x (monsters in own GY), which settles the units question: [r5+0x34] is NOT involved here. That slot belongs to a DIFFERENT, activated family — the 4-cid switch at 0x02219AB6 (Chaosrider Gustaph 0x16C4, Prometheus 0x1BEC, Maniacal Servant 0x1E78, Ancient Flamvell Deity 0x2218) whose text is 'once per turn ... gains N ATK for each card removed', so [r5+0x34] is the count that effect's own cost step produced, not a live board/GY count. NEITHER family is usable for a continuous 'for each X in your GY' gain — see stat.recompute."
  address: 0x02219C2E
  oracle: "ov3"
  sources: [notes/escuridao-findings.md]
  proof: |
    assert h.u16(0x02219C2C, 'ov3') == 0x882C, 'ldrh r4,[r5] (the cid read) moved'
    assert h.u32(0x02219E40, 'ov3') == 0x1890, 'switch root pool word moved'
    # Deal of Phantom's leaf: side -> GY monster count -> x100 -> shared tail
    assert h.u16(0x02219D2A, 'ov3') == 0x78A8, 'leaf does not start ldrb r0,[r5,#2]'
    assert h.bl_target(0x02219D2C, 'ov3') == 0x021B16F0, 'GY monster counter moved'
    assert h.u16(0x02219D30, 'ov3') == 0x2164, 'multiplier is not movs r1,#0x64'
    assert h.u16(0x02219D24, 'ov3') == 0x1C06 and h.u16(0x02219D26, 'ov3') == 0x434E, \
        'shared count x multiplier tail moved'
    assert h.bl_target(0x02219E34, 'ov3') == 0x021C47CC, 'table-1 attach call moved'
    # the activated family that owns [r5+0x34]
    assert h.u16(0x02219AB6, 'ov3') == 0x8822, 'activated-family cid read moved'
    assert h.u16(0x02219AE0, 'ov3') == 0x6B69, '[r5+0x34] read moved'
    assert h.u32(0x02219B2C, 'ov3') == 0x16C4, "Gustaph's pool word moved"

- id: "fusion.gladiator_beast_code"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "Fusion material CODE 24 = any \"Gladiator Beast\" monster. The jump table 0x02231B54 routes code 24 (index 1) to leaf 0x02231BA8, which is `bl 0x02029E60` (the is-a-monster gate) then `bl 0x02023AB0` -- the \"Gladiator Beast\" set-code thunk (setcode.gladiator_beast_table) -- and accepts by branching to the shared 0x02231DF4. Corroborated by its only three users, whose recipes match the printed cards exactly: Gaiodiaz 0x1C86 {Spartacus 0x1C73, 24} @0x02270F84, Heraklinos 0x1C87 {Laquari 0x1C76, 24, 24} @0x02270F8C, Gyzarus 0x1DC1 {Bestiari 0x1C75, 24} @0x02270FDC. So a recipe of 'N \"Gladiator Beast\" monsters' is expressible as data alone -- no code, no cls record."
  address: 0x02231BA8
  oracle: "ov3"
  sources: [notes/gladiator-beast-essedarii-findings.md]
  proof: |
    tb = 0x02231B54
    off = h.u16(tb + (24 - 23) * 2, 'ov3')
    leaf = 0x02231B56 + (off - 0x10000 if off >= 0x8000 else off)
    assert leaf == 0x02231BA8, f'code 24 leaf moved to {leaf:#x}'
    assert h.bl_target(0x02231BAA, 'ov3') == 0x02029E60, 'is-a-monster gate retargeted'
    assert h.bl_target(0x02231BB8, 'ov3') == 0x02023AB0, 'code 24 no longer calls the GB thunk'
    # the three shipped users still carry code 24 in the slot the printed card needs
    for row, slots in ((0x02270F84, (0x1C73, 24, 0)),
                       (0x02270F8C, (0x1C76, 24, 24)),
                       (0x02270FDC, (0x1C75, 24, 0))):
        got = tuple(h.u16(row + 2 + k * 2, 'ov3') for k in range(3))
        assert got == slots, f'GB recipe {row:#x} changed: {got}'

- id: "fusion.synchro_codes_and_plain_synchro_tail"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "Fusion material codes 47..50 are the SYNCHRO codes, and none of them means 'any Synchro Monster'. 47 @0x02231D82 / 48 @0x02231D96 / 49 @0x02231DAC test (1 << race) against bit 1 / bit 21 / bit 18 (r6 = 1 << race, built in the prologue) AND is_synchro 0x02023050 -- used by Dragon Knight Draco-Equiste 0x2309 {47, 15}, Ultimate Axon Kicker 0x230A {48, 21}, Supreme Arcanite Magician 0x239B {49, 18}. 50 @0x02231DC2 is `0x02023008(cid) == 0` AND is_synchro (Gaia Drake 0x239C {0x1E11, 50}), i.e. it REJECTS Synchro Tuners. But code 50's tail 0x02231DCC..0x02231DD6 (`adds r0,r5,#0 ; bl 0x02023050 ; cmp r0,#0 ; beq reject ; b accept 0x02231DF4`) is a self-contained plain is_synchro test, and r5 = the candidate cid is set by the prologue for every leaf, so ANY code's jump entry can be pointed there to get '1 Synchro Monster' as pure data (entry value 0x0276). Codes 43..46 are used only by the phantom rows 0x0EA1/0x0EA2/0x1C55/0x1C5F, so they are the spare codes (37 is Escuridao's). elder_entity_norden repoints code 46 (in-game confirmed by user 2026-09-28)."
  address: 0x02231DCC
  oracle: "ov3"
  sources: [notes/elder-entity-norden-findings.md]
  proof: |
    tb = 0x02231B54
    def leaf(code):
        off = h.u16(tb + (code - 23) * 2, 'ov3')
        return 0x02231B56 + (off - 0x10000 if off >= 0x8000 else off)
    assert (leaf(47), leaf(48), leaf(49), leaf(50)) == (0x02231D82, 0x02231D96, 0x02231DAC, 0x02231DC2)
    for s in (0x02231D8A, 0x02231DA0, 0x02231DB6, 0x02231DCE):
        assert h.bl_target(s, 'ov3') == 0x02023050, f'{s:#x} is not bl is_synchro'
    assert h.bl_target(0x02231DC4, 'ov3') == 0x02023008, 'code 50 tuner gate moved'
    assert h.bytes_at(0x02231DCC, 12, 'ov3') == bytes.fromhex('281cf1f53ff9002800d00de0'), 'plain tail moved'
    assert 0x02231DCC - 0x02231B56 == 0x0276
    assert h.u16(0x02231D82, 'ov3') == 0x2002 and h.u16(0x02231D98, 'ov3') == 0x0500
    users = {}
    for i in range(161):
        r = 0x02270B94 + i * 8
        for k in (2, 4, 6):
            v = h.u16(r + k, 'ov3')
