- id: "fusion.contact_fusion_list"
  subsystem: "fusion_material"
  confidence: "VERIFIED"
  claim: "The CONTACT-FUSION cid list @0x0209BB82: 21 sorted u16, ending at 0x0209BBAA. Membership IS the clause 'Must first be Special Summoned (from your Extra Deck) by <its own procedure>. (You do not use Polymerization.)' -- the members are exactly the pool's contact fusions: XY 0x15B1 / XYZ 0x15B4 / XZ 0x15F9 / YZ 0x15FA / VW 0x1953 / VWXYZ 0x1954, the ten E-HERO Neos contact fusions (0x1A6D 0x1A6E 0x1A6F 0x1B4C 0x1B4D 0x1B4E 0x1C07 0x1C09 0x1C6B 0x1D12), Gladiator Beast Gaiodiaz 0x1C86 / Heraklinos 0x1C87 / Gyzarus 0x1DC1, Armityle 0x1CAE and Chimeratech Fortress Dragon 0x1CEB. ⚠ THE DONOR CONSTRAINT: the count is a hard-coded immediate, EVERY entry is a real card (no phantom to drop), and the array is boxed in -- the halfword below the base is 0x2470 Yaksha (the tail of the flip/spirit list) and the halfword above the end is 0x1E12 Colossal Fighter (the head of the Assault-Mode pair list), so neither end can absorb a 22nd member. A new contact fusion therefore has to REUSE one of these 21 cids as its donor, unless the whole array is relocated into always-resident space."
  address: 0x0209BB82
  oracle: "arm9"
  sources: [notes/gladiator-beast-essedarii-findings.md]
  proof: |
    lst = h.u16_table(0x0209BB82, 21, 'arm9')
    assert h.is_sorted_unique(lst), 'contact-fusion list not sorted-unique'
    assert lst[0] == 0x15B1 and lst[-1] == 0x1DC1, 'contact list endpoints moved'
    for cid in (0x15F9, 0x1C86, 0x1C87, 0x1CAE, 0x1CEB, 0x1DC1):
        assert cid in lst, f'expected contact-fusion cid {cid:#06x} missing'
    assert 0x0209BB82 + 21 * 2 == 0x0209BBAC, 'contact list end moved'
    # boxed in on both sides -- a 22nd entry cannot be appended or prepended in place
    assert h.u16(0x0209BB80, 'arm9') == 0x2470, 'the halfword below the base changed'
    assert h.u16(0x0209BBAC, 'arm9') == 0x1E12, 'the halfword above the end changed'
    # every member also owns a fusion recipe row (they are all Fusion monsters)
    rows = {h.u16(0x02270B94 + i * 8, 'ov3'): i for i in range(161)}
    missing = [c for c in lst if c not in rows]
    assert not missing, f'contact fusions with no recipe row: {[hex(c) for c in missing]}'

