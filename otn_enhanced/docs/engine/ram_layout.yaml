- id: "ram.deck_count_player_0x10"
  subsystem: "ram_layout"
  confidence: "VERIFIED"
  claim: "THE DECK CARD COUNT is player+0x10 = u32 [0x0229ACA4 + (side&1)*0xB3C] (Deck array player+0x304). Needlebug Nest's activation condition 0x021FEB74 reads it (`cmp r1,#5; bhs`), and the mill core 0x021D2094 CLAMPS its N to it (`cmp N,count; blo; str count`) -- so passing a negative N (unsigned huge) to 0x021D2148 mills the WHOLE Deck. Proven 2026-10-01 by disassembly (That Grass Looks Greener)."
  address: 0x0229ACA4
  oracle: "ov3"
  sources: [notes/that-grass-looks-greener-findings.md]
  proof: |
    assert h.u32(0x021FEBA4, 'ov3') == 0x0229ACA4 and h.u32(0x021FEBA0, 'ov3') == 0xB3C, 'Needlebug pool moved'
    assert h.u16(0x021FEB92, 'ov3') == 0x58C9 and h.u16(0x021FEB94, 'ov3') == 0x2905, 'ldr r1,[r1,r3]; cmp r1,#5 moved'
    assert h.u32(0x021D2130, 'ov3') == 0x0229ACA4, 'mill clamp literal moved'
    assert h.bytes_at(0x021D20B6, 6, 'ov3') == bytes.fromhex('884200d30191'), 'mill clamp cmp/blo/str moved'

- id: "ram.zone_record_faceup_flag"
  subsystem: "ram_layout"
  confidence: "ANCHORED"
  claim: "Field zone record = player (0x0229AC94 + side*0xB3C) + 0x34 + zone*0x14 for zones 0..10 (0..4 monsters, 5..9 S/T, 10 Field): +0 card word (cid = low 14 bits; 0 = empty), +6 position, +8 FACE-UP halfword (0 = face-down / Set), +0x10 flags. Census 2026-10-18 over 17 savestates: every face-up S/T / Field Spell (Seal of Orichalcos z10, face-up Continuous cards) has +8 = 1, every Set card +8 = 0. Denko Sekka's lock reads exactly these fields."
  address: 0x0229ACC8
  oracle: "savestate"
  sources: [notes/denko-sekka-findings.md, otn_enhanced/cards/denko_sekka.py, scratch/denko_path_proof.py, scratch/denko_stub_emu.py]
  proof: |
    for side in (0, 1):
        for z in range(11):
            r = 0x0229ACC8 + side * 0xB3C + z * 0x14
            if h.ram_u32(r) & 0x3FFF:
                assert h.ram_u16(r + 8) in (0, 1), f'face-up flag {h.ram_u16(r + 8):#x} not boolean @{r:#x}'
