- id: "ram.container_for_zone_code"
  subsystem: "ram_layout"
  confidence: "VERIFIED"
  claim: "0x0219CA28(r0=side, r1=zone_code, r2=index) is the ZONE-CODE -> CONTAINER selector: it returns a pointer to one packed u32 card word. `r4 = zone_code - 0xB; if (unsigned)r4 > 4` falls through to the slot path `player + 0x34 + (zone_code + index) * 0x14` (the 0x14-stride zone records, clamped at 10); otherwise a 5-entry PC-relative jump table @0x0219CA40 picks a list container `player + CONST + index * 4`:
  0x0B -> +0x124 THE HAND           (count +0x0C)  [was mislabelled
                 'recent-summon list'; see ram.hand_is_zone_0x0B]
  0x0C -> +0x4E4 Extra Deck         (count +0x18)
  0x0D -> +0x304 Deck               (count +0x10)
  0x0E -> +0x55C Graveyard          (count +0x14)
  0x0F -> +0x7B4 BANISHED           (count +0x1C)
So **zone code 0x0F is the banished zone** and 0x0E is the GY — which independently explains the Armory Arm `cmp r0,#0xE` GY-presence gate. Container/count pairings were measured on sealancer_recon.ml4 (side0 deck 27 cards = count +0x10 = 27; side1 30 = 30; GY 7/4; banished 0/0, and 1 in .ml7)."
  address: 0x0219CA28
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    # the switch bound: zone_code - 0xB must be <= 4 to reach the jump table
    assert h.bytes_at(0x0219CA2A, 4, 'ov3') == bytes.fromhex('0c1c0b3c'), 'prologue drifted'
    # 5-entry halfword jump table; each entry is an offset from PC=0x0219CA42
    arms = [0x0219CA42 + h.u16(0x0219CA40 + i * 2, 'ov3') for i in range(5)]
    assert arms == [0x0219CA9C, 0x0219CA4A, 0x0219CA5E, 0x0219CA74, 0x0219CA88], \
        f'zone jump table drifted: {[hex(a) for a in arms]}'
    # the two list offsets that are literal-pool words (the other three are movs+lsls)
    def lit(ldr_site):
        w = h.u16(ldr_site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{ldr_site:#x} is not an LDR literal'
        return h.u32(((ldr_site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
    assert lit(0x0219CA92) == 0x7B4, 'banished arm no longer loads +0x7B4'
    assert lit(0x0219CA7E) == 0x55C, 'graveyard arm no longer loads +0x55C'
    assert lit(0x0219CA54) == 0x4E4, 'extra-deck arm no longer loads +0x4E4'
    # each list arm first loads the 0xB3C player stride, then its own offset
    for stride_site in (0x0219CA4E, 0x0219CA78, 0x0219CA8C):
        assert lit(stride_site) == 0xB3C, f'{stride_site:#x} no longer loads the player stride'
    # and the two encoded as movs #imm8 ; lsls #n
    assert h.u8(0x0219CA68, 'ov3') == 0xC1 and h.u8(0x0219CAA6, 'ov3') == 0x49, \
        'deck (0xC1<<2=0x304) / recent-list (0x49<<2=0x124) immediates drifted'

- id: "ram.graveyard_and_banished_arrays"
  subsystem: "ram_layout"
  confidence: "VERIFIED"
  claim: "Graveyard = player+0x55C, count = player+0x14. Banished ('removed from play') = player+0x7B4, count = player+0x1C. Both are PACKED u32 card-word arrays with the same shape as the Extra Deck (+0x4E4 / count +0x18): the first `count` words are the live entries. ⚠️ CORRECTED 2026-08-13: the original wording added 'then zeros', and that is FALSE — a REMOVAL shifts the survivors down but leaves the old tail word in place, so there can be stale nonzero words past `count`. Counter-example in rom_all_patches.ml2: side-0 GY has count 2 but words [0x14002387, 0x08001859, 0x08001859] — the third is a duplicate ghost of the second. ALWAYS trust the count, never the nonzero span (this is exactly how a banished-zone reader would silently pick up a card that is no longer there). Found by diffing sealancer_recon.ml6 (Mermaid Archer 0x1FFC on the field, equipped with Deep Sea Diva 0x1FFB) against .ml7 (Mermaid Archer banished): 0x1FFC appeared at player+0x7B4 with +0x1C going 0->1, while the equipped Diva was appended to the GY at player+0x578 with +0x14 going 7->8. The invariant was then checked over 5 savestates x 2 players = 20 cases, all clean. This is what a 'target your banished monsters' effect (Sea Lancer E1) must enumerate — the equip-target selector 0x0224FA4C/0x0225028E only sweeps monster zones 5..9, so E1 is NOT reachable by swapping that leaf's predicate."
  address: 0x0229AC94
  oracle: "savestate"
  sources: [sea-lancer-findings]
  proof: |
    base, stride = 0x0229AC94, 0xB3C
    for side in (0, 1):
        pb = base + side * stride
        for name, arr, cnt, cap in (('GY', 0x55C, 0x14, 60), ('banished', 0x7B4, 0x1C, 60)):
            n = h.ram_u32(pb + cnt)
            assert 0 <= n <= cap, f'{name} count {n} out of range for side {side}'
            words = [h.ram_u32(pb + arr + i * 4) for i in range(cap)]
            lead = [w for w in words[:n] if w == 0]
            assert not lead, f'{name} side {side}: hole inside the first {n} entries'
            # every LIVE entry must decode to a plausible cid on the owning side
            for i, w in enumerate(words[:n]):
                assert 0x0B00 < (w & 0x3FFF) < 0x2600, \
                    f'{name} side {side}[{i}] = {w:#010x} is not a card word'
            # NOT asserted: zeros past the count. Removals leave stale ghost words
            # (see the correction in the claim) — the count is the only truth.

- id: "ram.card_instance_record"
  subsystem: "ram_layout"
  confidence: "VERIFIED"
  claim: "Card-instance records live in a stride-0x28 array in the 0x0229 6xxx heap: cid at +0x0C, EFFECTIVE (post-modifier) ATK at +0x20, Level at +0x24. The ATK and Level fields are live only while the card is face-up ON THE FIELD — a card in the hand/Deck/GY, or one equipped to another monster, carries 0 in both, and a banished card's record is cleared entirely. This is how to read a monster's current ATK from a savestate (the 0x021B7226 accumulator's result is written back here). Validated in sealancer_recon.ml3: the four in-array records for on-field cards give Deep Sea Diva 0x1FFB 200/Lv2, Mermaid Archer 0x1FFC 1200/Lv3, Gladiator Beast Laquari 0x1C76 1800/Lv4 — each matching the printed card exactly. ⚠️ CORRECTED 2026-08-13: the 'face-up' qualifier is load-bearing and the original proof ignored it — it swept EVERY occupied monster zone and demanded a live record for each, so it FAILED on rom_all_patches.ml2, where side-1 zone 2 holds cid 0x1867 with no live record (a SET / face-down monster). A face-down monster on the field carries 0 in +0x20/+0x24 exactly like a card in the hand. The proof now requires that at least one on-field monster resolves, and treats the rest as legitimately face-down."
  address: 0x02296470
  oracle: "savestate"
  sources: [sea-lancer-findings]
  proof: |
    base, stride = 0x0229AC94, 0xB3C
    occupied = resolved = 0
    for side in (0, 1):
        for z in range(5):
            w = h.ram_u32(base + side * stride + 0x34 + z * 0x14)
            if not w:
                continue
            occupied += 1
            cid = w & 0x3FFF
            recs = [a - 0x0C for a in range(0x02296000, 0x02298000, 4)
                    if h.ram_u32(a) == cid]
            good = [r for r in recs if 1 <= h.ram_u32(r + 0x24) <= 12
                    and h.ram_u32(r + 0x20) % 10 == 0 and h.ram_u32(r + 0x20) <= 5000]
            if good:
                resolved += 1
    if not occupied:
        raise Skip('no monsters on the field in this savestate')
    assert resolved, (f'{occupied} monster(s) on the field and NOT ONE has an instance '
                      'record with a live Level/ATK — the record layout has drifted')

- id: "ram.hand_is_zone_0x0B"
  subsystem: "ram_layout"
  confidence: "VERIFIED"
  claim: "Zone code 0x0B (`player+0x124`, count `player+0x0C`) is THE HAND — not the 'recent-summon list' that ram.container_for_zone_code and the otn-summon-event-dispatch-tg note both called it. Measured across four savestates x 2 sides: the count is 3..5 every time and equals the nonzero span exactly, the entries are the cards a player is holding, and in the rom_eclipse_wyvern.ml2 -> .ml3 pair side 0 goes 4 -> 3 precisely as Soul Release 0x12F9 is activated out of hand (it appears in the GY in .ml3). This is why the 'banish from zone 0x0B' wrappers 0x021C6E98 / 0x021C6EA2 and the hand-discard paths all pass r1 = 0x0B. Note `player+0x10` is the DECK count (27..35), a different field entirely."
  address: 0x0229ADB8
  oracle: "savestate"
  sources: [eclipse-wyvern-findings]
  proof: |
    base, stride = 0x0229AC94, 0xB3C
    for side in (0, 1):
        pb = base + side * stride
        n = h.ram_u32(pb + 0x0C)
        words = [h.ram_u32(pb + 0x124 + i * 4) for i in range(20)]
        assert 0 <= n <= 10, f'side {side} hand count {n} is not a plausible hand size'
        assert all(w for w in words[:n]), f'side {side} hole inside the first {n} cards'
        for i, w in enumerate(words[:n]):
            assert 0x0B00 < (w & 0x3FFF) < 0x2600, \
                f'side {side} hand[{i}] = {w:#010x} is not a card word'
        assert h.ram_u32(pb + 0x10) > 10, \
            f'side {side}: +0x10 = {h.ram_u32(pb + 0x10)} is too small to be the deck count'

