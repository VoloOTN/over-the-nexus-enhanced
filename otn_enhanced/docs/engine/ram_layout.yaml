- id: "ram.savestate_autodetect"
  subsystem: "ram_layout"
  confidence: "ANCHORED"
  claim: "A duel savestate's main-RAM file offset is auto-detected via the 0x021A25A0 anchor (version-independent; 0x24 in 2026-07 captures, 0x3C in older ones)."
  address: 0x021A25A0
  oracle: "savestate"
  sources: [librarian_recorder.py, otn-summon-event-dispatch-tg]
  proof: |
    off = h.ss.off0
    assert off >= 0, 'RAM0 offset not detected'
    # the anchor prologue must actually be at that offset
    got = h.ss.read(0x021A25A0, 12)
    assert got == bytes.fromhex('38b5012202400e480e4c5043'), 'anchor mismatch at detected off'

