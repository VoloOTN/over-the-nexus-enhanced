- id: "ram.extra_deck_array"
  subsystem: "ram_layout"
  confidence: "ANCHORED"
  claim: "Extra Deck = player+0x4E4 (u32 packed card words), count = player+0x18; the array is packed (exactly `count` leading nonzero-cid words, then zeros)."
  address: 0x022A0178
  oracle: "savestate"
  sources: [otn-extra-deck-array]
  proof: |
    for side in (0, 1):
        b = 0x0229AC94 + side * 0xB3C
        n = h.ram_u32(b + 0x18)
        assert 0 <= n <= 15
        for i in range(n):
            w = h.ram_u32(b + 0x4E4 + i * 4)
            assert 1 <= (w & 0x3FFF) <= 0x3FFF, f'ED[{i}] side{side} cid=0 inside count'
        if n < 15:
            w = h.ram_u32(b + 0x4E4 + n * 4)
            assert (w & 0x3FFF) == 0, f'ED word past count is nonzero -> not packed at +0x4E4'

