- id: "tool.card_name_must_fit_the_donor_slot"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** A RENAMED DONOR'S NEW NAME MUST FIT THE DONOR'S EXISTING NAME SLOT, IN EVERY LANGUAGE YOU WRITE -- IN-GAME CONFIRMED BY THE USER 2026-08-31. *** card.ninjitsu_art_super_transformation froze with the card in hand at a 36 B name and is clean at 10 B, and the LENGTH was the ONLY difference between the two builds (the description was byte-identical in both), so this is the mechanism and not a workaround. boggart_knight.apply_stats_and_text -- which every patch in finished_patches/ uses for text -- has TWO name paths and picks silently: if the new name fits the card's current NUL-terminated slot it overwrites IN PLACE and the index table is untouched; if it does not, it APPENDS the name at the end of card_name_<L>.bin and REPOINTS that card's u32 name offset, growing the blob. The DESCRIPTION has no such fallback -- it is written strictly in place, and a language whose slot is too small is SKIPPED (that language keeps the donor's printed text), which is a silent wrong-text bug rather than a crash. *** THE CENSUS, over all 34 patch modules with a NEW_NAME, comparing against the donor's ENGLISH slot: 32 write IN PLACE and 2 append. Every in-game-confirmed card in the repo is in the in-place group, and that is precisely why their names are abbreviated -- 'GK's Recruiter' 14/14, 'MetalArm Bug' 12/12, 'TG RushRhino' 12/12, 'XXS - Boggart' 13/14, 'T. Sea Horse' 12/14. The two appenders are card.ninjitsu_art_super_transformation (36 B into Goblin Fan 0x1255's 10 B slot -- it FROZE the game with the card in hand, where the name is rendered continuously, while the same build with --no-text was clean) and tg_striker ('TG Striker', 10 B into donor 0x1F18's 9 B slot, over by ONE byte and untested with text). *** SO: read the donor's per-language slots BEFORE choosing a name, take the minimum, and assert it at build time -- see ninjitsu_art_super_transformation.assert_text_fits_in_place(). Goblin Fan's are e 10 / f 19 / g 12 / i 20 / s 25 / j 12 / k 11 / r 22 for the name and e 153 / f 191 / g 201 / i 195 / s 184 / j 138 / k 131 / r 246 for the description. NOTE the English name slot is often the TIGHTEST despite English being the longest language for most cards, because a short English name like 'Goblin Fan' leaves no room."
  oracle: "rom"
  sources: [notes/ninjitsu-art-super-transformation-findings.md]
  proof: |
    import ndspy.rom, struct
    from otn_enhanced.data.card_stats import iter_paths as _iter_paths, read_cstr as _read_cstr
    from otn_enhanced.rom.pac import parse_pac
    rom = ndspy.rom.NintendoDSRom.fromFile(str(h.env.rom_path))
    pp = next(p for p in _iter_paths(rom.filenames)
              if p.lower().endswith('bin2.pac'))
    blob = bytes(rom.files[rom.filenames.idOf(pp)])
    ar = parse_pac(blob, pp)
    def inner(n):
        f = next(x for x in ar.files if x.get_clean_name().lower() == n)
        return blob[f.address:f.address + f.size]
    prop = inner('card_prop.bin')
    def slot(cid):
        i = next(k for k in range((len(prop) - 8) // 8)
                 if int.from_bytes(prop[8 + k * 8:16 + k * 8], 'little') & 0x3FFF == cid)
        ix, nb = inner('card_indx_e.bin'), inner('card_name_e.bin')
        return len(_read_cstr(nb, struct.unpack_from('<I', ix, 8 + i * 8)[0]))
    assert slot(0x1255) == 10, "Goblin Fan's English name slot is not 10 B"
    assert slot(0x1F18) == 9, "donor 0x1F18's English name slot is not 9 B"
    # the in-place group really does fit, on three independent confirmed cards
    for cid, nm in ((0x1ED4, b'GK\'s Recruiter'), (0x0FD8, b'MetalArm Bug'),
                    (0x13E7, b'Ninja Grandmaster Hanzo')):
        assert len(nm) <= slot(cid), f'{nm!r} no longer fits 0x{cid:04X}'

- id: "tool.lift_extent_truncation"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "⚠️ FOOTGUN — `detect_function_size` UNDER-REPORTS, AND A TRUNCATED LIFT STILL ROUND-TRIPS. When cloning an ov3 function into the ov5 cave with effect_shim.lift_handler_to_builder, the detected extent stops at the first `pop {..,pc}` it likes. A function with SEVERAL returns and an INLINE literal pool (very common in the slot5 target templates, which are 3-sub-step machines with a return per sub-step) is therefore cut short. The trap is that the obvious guard does not catch it: `build(orig_addr) == the original bytes` passes for a truncated lift, because the prefix that WAS copied is genuine code. The lift looks perfect and the ROM builds clean. WORKED EXAMPLE, and how it presents: the multi-select target template 0x02235700 has a true extent of 0x34C (code to 0x02235A40, trailing pool to 0x02235A4C, where the next function's `push` begins) but detect_function_size returns 0x232 — it stops at the `pop {r3,r4,r5,r6,r7,pc}` at 0x02235946, which sits BEFORE the inline pool at 0x02235954..0x02235990. Relocated at 0x0239BB70, the tail's `ldr r7,[pc,#0x78]` (literal at clone offset 0x28C) then read past the 0x232 bytes copied, got 0, and `ldr r1,[r7,#0]` took a DATA ABORT. In the melonDS freeze savestate's ARM9 register block that reads as PC = 0xFFFF0108 (the abort vector) with LR pointing inside the clone — which is how it was diagnosed, without GDB. THE GUARD THAT WORKS: after lifting, assert every `ldr rX,[pc,#imm]` in the copy resolves INSIDE the copy. Pass an explicit `size=` to lift_handler_to_builder when it does not. sea_lancer._assert_pools_contained is the implementation."
  address: 0x02235700
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    # the template really does have several returns before its inline pool
    assert h.u16(0x02235946, 'ov3') == 0xBDF8, 'the early pop{..,pc} moved'
    assert h.u16(0x02235A40, 'ov3') == 0xBDF8, 'the final pop{..,pc} moved'
    # the tail literal that the truncated copy could not reach
    assert h.u16(0x02235912, 'ov3') == 0x4F1E, 'the tail ldr r7,[pc,#0x78] changed'
    assert h.u32(0x0223598C, 'ov3') == 0x0229AB7C, 'the tail literal moved'
    assert 0x0223598C - 0x02235700 == 0x28C, 'the literal offset changed'
    # ...which is past the DETECTED extent but inside the TRUE one
    from otn_enhanced.asm.effect_shim import lift_handler_to_builder
    detected = len(lift_handler_to_builder(env.ov3, 0x02235700).build(0x02235700))
    assert detected == 0x232, f'detect_function_size now returns {detected:#x}'
    assert 0x28C + 4 > detected, 'the literal is no longer past the detected extent'
    # a truncated lift STILL round-trips -- the check that cannot catch this
    short = lift_handler_to_builder(env.ov3, 0x02235700).build(0x02235700)
    assert short == h.bytes_at(0x02235700, detected, 'ov3'), \
        'the truncated lift no longer round-trips (the trap is gone?)'
    # the true extent ends exactly where the next function begins
    assert h.u16(0x02235A4C, 'ov3') == 0xB5F8, 'the next function no longer starts at +0x34C'
    full = lift_handler_to_builder(env.ov3, 0x02235700, size=0x34C).build(0x02235700)
    assert len(full) == 0x34C and full == h.bytes_at(0x02235700, 0x34C, 'ov3')

