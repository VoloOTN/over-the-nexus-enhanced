- id: "tool.rom_files_entries_must_be_bytearray"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** THE OLD CHAIN'S PER-STEP FILE ROUND-TRIP IS LOAD-BEARING IN A WAY NOTHING DOCUMENTS: IT LAUNDERS rom.files ENTRIES BACK TO bytearray. MEASURED 2026-09-11. *** ndspy's NintendoDSRom.fromFile produces 127 MUTABLE bytearrays (and rom.arm9 / rom.arm9OverlayTable likewise). But about twenty patch modules assign IMMUTABLE bytes back into rom.files[fid] -- `rom2.files[fid] = bytes(pac_data)` in reborn_tengu:535, ceruli:551, grapha:1459, gates_of_dark_world:1131, jet_warrior:644, orient_dragon:416, accel_synchron:1038, plus build_modified_pac() results in card_text:793 and a compressed overlay in ov5_cave:1624. In apply_all_patches this never mattered, because EVERY STEP RE-READ THE ROM FROM DISK and ndspy re-created bytearrays from the file. *** bulk_card_props.py:209 is the ONLY in-place rom.files mutation in the repo: `old_rom.files[old_rom.filenames.idOf(pac_path)][addr:addr+len(data)] = data`. Slice assignment requires a bytearray, so the moment the ROM is held in memory across steps instead of round-tripped through a file, step 45 dies on `TypeError: 'bytes' object does not support item assignment`. That is exactly what happened on the first full run of the enhanced_edition_definitive build, and the fix is Session.normalise(), which restores the types a fresh fromFile guarantees -- TYPES ONLY, NEVER BYTES, which the matching sha256 proves. *** THE SAME MODULE HIDES A SECOND BYPASS at bulk_card_props.py:204-207: a raw `open(src,'rb').read()` / `open(out,'wb').write(...)` copy that goes around ndspy entirely, so the work path must exist as a real file or it raises FileNotFoundError. It had been silently succeeding off a LEFTOVER ROM from an earlier run. *** THE REUSABLE RULE: any invariant a patch module gets FOR FREE from being handed a freshly-loaded ROM is an invariant an in-memory build must supply DELIBERATELY. When a module misbehaves under the fast build, suspect this class of thing before suspecting the rewrite. *** UPDATE 2026-11-13: bulk_card_props has since been refactored onto apply_card_stat_edits and no longer has the in-place slice or the raw open() copy; the rule and Session.normalise() still stand."
  sources: [notes/enhanced-edition-definitive-findings.md, otn_enhanced/session.py]
  proof: |
    import inspect, importlib
    # (bulk_card_props was refactored onto apply_card_stat_edits: its in-place slice and raw open() copy are gone)
    # and at least one module that stores IMMUTABLE bytes into rom.files
    rt = inspect.getsource(importlib.import_module(
        'otn_enhanced.dsl'))
    assert 'files[fid] = bytes(' in rt, \
        'the DSL (card_genre_word, ex-aratama) no longer stores immutable bytes into rom.files'
    # the session helper that restores the fromFile invariant
    sess = importlib.import_module(
        'otn_enhanced.session')
    assert hasattr(sess.Session, 'normalise'), 'Session.normalise() is gone'
    assert 'bytearray' in inspect.getsource(sess.Session.normalise)

- id: "tool.mwcc_bl_is_a_far_branch_inside_big_functions"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** IN OV3, A THUMB `BL` IS NOT ALWAYS A CALL: mwcc EMITS `BL <label>` AS A FAR BRANCH (beyond B's +-2 KB) TO A LABEL INSIDE THE SAME FUNCTION, usually as `BL x; NOP (0x46C0); <literal pool>` and sometimes with the pool directly after the BL. Proven 2026-10-02 while building docs/ov3_catalogue: in the LP-change resolver 0x02204D08 (entry `SUB SP,#0x58` = 0xB096 at 0x02204D0A), the BL at 0x0220502E targets 0x02206106 = `ADD SP,#0x58` (0xB016) -- the resolver's OWN epilogue, which undoes its own prologue -- and is followed by the NOP pad at 0x02205032; 0x02206106 has no pointer anywhere in ov3 and the next real entry is the handler-table function 0x02206138. *** CONSEQUENCES: (1) a disassembler or call-graph tool that treats every BL target as a function invents fake functions mid-body (the first ov3 discovery pass split the leave dispatcher 0x021C7FD0 into dozens); a BL target is a function only with independent evidence (pointer, handler table, prologue, a BL from a DIFFERENT function). (2) Fall-through after such a BL is NOT executed -- the bytes after it are pool. (3) Never hook such a BL as if it were a call: its 'return address' is data. otn_enhanced/tools/ov3_discover.py implements the rule."
  address: 0x0220502E
  oracle: "ov3"
  sources: [otn_enhanced/tools/ov3_discover.py]
  proof: |
    assert h.u16(0x02204D0A, 'ov3') == 0xB096, 'resolver prologue is no longer SUB SP,#0x58'
    assert h.bl_target(0x0220502E, 'ov3') == 0x02206106, 'far-branch BL moved'
    assert h.u16(0x02205032, 'ov3') == 0x46C0, 'the NOP pad after the far-branch BL is gone'
    assert h.u16(0x02206106, 'ov3') == 0xB016, 'target is no longer ADD SP,#0x58 (own epilogue)'
    # no pointer to the target anywhere in ov3 (it is a label, not an entry)
    ov = h.bytes_at(0x02141700, 0x152CE0, 'ov3')
    assert struct.pack('<I', 0x02206107) not in ov, 'something now points at 0x02206106'
    # the next real entry is a card-handler function
    tab = h.bytes_at(0x02141700 + 0x134508, 4116 * 24, 'ov3')
    ptrs = {struct.unpack_from('<I', tab, i * 24 + 4 * s)[0]
            for i in range(4116) for s in range(5)}
    assert 0x02206139 in ptrs and 0x02204D09 not in ptrs
