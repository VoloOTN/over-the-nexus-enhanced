- id: "tool.register_the_phantom_in_the_same_edit"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** A LEDGER CLAIM THAT WAS NEVER ENTERED IS A COLLISION NOBODY CATCHES, AND IT COSTS A 25-MINUTE CHAIN BUILD TO FIND. MEASURED 2026-09-03. *** tg_warwolf has always consumed phantom 0x234A (POP_PHANTOM, its count-neutral populate insert) but its `populate_table` claim was never added to check_allocations.PHANTOM_CLAIMS -- only its tg_setcode_table / cls2_table / registry_row claims were. So when card.jet_synchron_clause1 was independently written to drop the SAME row, check_allocations reported `[OK] no phantom double-claims` and the single-card build passed, IN-GAME INCLUDED, for two days: Warwolf is not applied in a single-card ROM, so 0x234A really is free there. The collision only exists in the chain, where Warwolf runs first -- and apply_all_patches died at step 48/49 on `phantom 0x234A owns 0 row(s), need exactly 1`. *** THREE REUSABLE RULES. (1) REGISTER A PHANTOM IN THE SAME EDIT THAT CONSUMES IT, exactly the way otn-chain-build-verify-artifact requires a PatchStep and its _verify_all_patches entry to land together. The guard is only a backstop if the claim is in it. (2) CHOOSE A PHANTOM THAT IS FREE IN BOTH IMAGES, not just the stock one: count its rows in the STOCK ROM *and* in the fully-chained ROM before committing to it. There were 59 such phantoms available here, so the constraint costs nothing. (3) A SINGLE-CARD ROM CANNOT SEE THIS CLASS OF BUG AT ALL -- not by verify(), not by check_allocations, and not in game. It is exactly what the chain build is for, which is the argument for running the chain BEFORE calling a card shipped rather than after. *** THE OTHER HALF OF THE LESSON IS ABOUT EXIT CODES: the chain reported success to the task runner while the build itself had exited 1, because the wrapper ended in a `tail` that succeeded. otn-chain-build-verify-artifact already says exit 0 has lied twice; it lied a third time here. ASSERT THE ARTIFACT -- the final step number in the log, the patch count, and the ROM's own sha256 -- never the status line."
  sources: [notes/jet-synchron-findings.md, otn_enhanced/knowledge/check_allocations.py]
  proof: |
    # Warwolf's phantom and this patch's replacement are BOTH single-row in stock ...
    cbase, ccount, cstride = 0x022713C4, 0x56C, 12
    crit = [h.u16(cbase + i * cstride, 'ov3') for i in range(ccount)]
    assert crit.count(0x234A) == 1, 'Warwolf phantom 0x234A is not single-row in stock'
    assert crit.count(0x0EAF) == 1, 'the replacement 0x0EAF is not single-row in stock'
    # ... which is precisely why the stock image cannot distinguish them, and why the
    # claim register rather than the image has to be the source of truth.
    import importlib
    ca = importlib.import_module('otn_enhanced.knowledge.check_allocations')
    claims = {(pool, cid): owner for pool, cid, owner in ca.PHANTOM_CLAIMS}
    assert claims.get(('populate_table', 0x234A)) == 'tg_warwolf', \
        'the late-registered tg_warwolf claim on 0x234A is missing again'
    assert claims.get(('populate_table', 0x0EAF)) == 'jet_synchron', \
        'jet_synchron no longer claims its replacement phantom'
    # and the patch module really does consume the one it claims
    js = importlib.import_module(
        'otn_enhanced.cards.jet_synchron')
    assert js.CRIT_DROP_PHANTOM == 0x0EAF, 'the patch and the ledger disagree'
    ww = importlib.import_module('otn_enhanced.cards.tg_warwolf')
    assert ww.POP_PHANTOM == 0x234A, 'Warwolf no longer consumes 0x234A'

- id: "tool.insert_sorted_two_incompatible_variants"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** THE COUNT-NEUTRAL SORTED INSERT EXISTS NINE TIMES IN finished_patches/, IN TWO ALGORITHMS WHOSE ARGUMENT ORDERS ARE INCOMPATIBLE -- AND ONE OF THEM HAS A LATENT StopIteration. MEASURED 2026-09-11. *** VARIANT A, grapha._insert_sorted (also snoww, reborn_tengu, ninja_grandmaster_hanzo, ninjitsu_art_super_transformation, eclipse_wyvern, boggart_knight), takes (ov, base, COUNT, STRIDE, fmt, record, drop_cid, label, wide) and memmoves only the block between the phantom and the insert point. VARIANT B, tg_striker._insert_sorted (imported by darksoul and gravekeepers_recruiter), takes (ov, base, STRIDE, COUNT, fmt, record, phantom_cid, label) -- *** STRIDE AND COUNT ARE SWAPPED *** -- and unpacks every record, pops the phantom, reinserts and repacks the region. Calling one with the other's argument order silently reads the table with the wrong geometry. *** THE LATENT BUG: variant B computes its insert index as `next(i for i, r in enumerate(recs) if r[0] > cid)`, which has NO FALLBACK when the new cid is larger than every remaining key -- it raises StopIteration instead of appending at the end. No shipped card has ever hit it because every inserted cid is mid-table, so it has never fired; the next card with a high cid on a B-derived table would have been the first. Variant A's `pos = sum(1 for k in keys if k < new_cid)` has no such hole. *** OTHERWISE THE TWO ARE BYTE-EQUIVALENT, and that was measured rather than assumed: otn_enhanced/tests/test_tables.py runs A, B and the replacement against the REAL criteria registry (0x022713C4, 1388 x 12 B) from rom.nds, spending single-row phantom 0x1DBD at index 694, across five insert positions -- far before the phantom, just before, just after, far after, and smallest-in-table -- and diffs the whole 16656-byte region. All three produce identical bytes at every position B can handle. *** THE REUSABLE RULE: before replacing a helper that has multiple shipped implementations, DIFFERENTIALLY TEST THE REPLACEMENT AGAINST EVERY ONE OF THEM ON REAL ROM DATA. Reading them and concluding 'these look the same' would have missed both the swapped signature and the StopIteration."
  sources: [notes/enhanced-edition-definitive-findings.md, otn_enhanced/tests/test_tables.py]
  proof: |
    import inspect, importlib
    g = importlib.import_module('otn_enhanced.cards.grapha')
    t = importlib.import_module('otn_enhanced.effects.common')
    a = list(inspect.signature(g._insert_sorted).parameters)
    b = list(inspect.signature(t.insert_row_by_stride).parameters)
    assert a[1:5] == ['base', 'count', 'stride', 'fmt'], a
    assert b[1:5] == ['base', 'stride', 'count', 'fmt'], b
    assert a[2] == b[3] and a[3] == b[2], 'stride/count are no longer swapped between the variants'
    # the StopIteration hole in variant B
