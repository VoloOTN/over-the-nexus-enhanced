- id: "tool.gdb_one_shot_session"
  subsystem: "toolchain_and_verification"
  confidence: "UNVERIFIED"
  claim: "*** THE melonDS GDB STUB IS EFFECTIVELY ONE-SHOT: CONNECT EXACTLY ONCE PER EMULATOR SESSION AND DO NOT PROBE. *** Repeated connect/detach cycles and rapid halt/continue polling destabilise the stub -- observed 2026-08-03: the 2nd connection's halt() timed out and the 3rd died with ConnectionResetError (WinError 10054), burning the user's duel setup and forcing an emulator restart. This repeats the warning already in otn-shooting-quasar ('melonDS stub = ONE session per toggle, never probe'). PROCEDURE: decide the FULL experiment offline (breakpoint addresses, registers to capture, how long to stay armed); then run ONE script that connects once, halts once, arms every breakpoint, collects a bounded set of hits inside a single wait window, cleans up and detaches, and writes results to a JSON file so nothing is lost. Never spend a connection on a 'is it running / is ov3 resident' pre-probe -- fold those reads into the one session, and if the answer is wrong, report and stop rather than reconnecting. *** COROLLARY (bit us 2026-08-03): WHEN THE STUB DIES MID-WINDOW, YOUR CLEANUP NEVER RUNS AND THE BREAKPOINTS STAY ARMED. *** Session #3's data was corrupted by session #2's leftover breakpoint at 0x0202ABB8 -- its hits were parsed as if they were the new breakpoint's, producing nonsense arguments that looked like real discoveries. ALWAYS del_breakpoint() every address any previous session may have armed BEFORE arming the new one, and sanity-check each hit's pc (or lr) against the breakpoint you think you set. *** SECOND COROLLARY: size the record budget for the NOISE RATE, not the interesting event -- a 150-record cap filled in 50 ms of unrelated traffic and the window never reached the user's action. Filter aggressively, and cap on TIME rather than on record count. ***"
  sources: [CLAUDE.md, otn-shooting-quasar, wonder-wand-findings]
  next_experiment: "Hold to the one-shot procedure for a full experiment and confirm the stub stays healthy for the whole window; promote to VERIFIED once a single-session capture has completed end-to-end without a reset."

- id: "tool.lr_parity_selects_mode"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "A captured LR tells you which INSTRUCTION SET the caller is in, and OTN's ov3 contains BOTH ARM and Thumb code. **Odd LR = Thumb caller; EVEN LR = ARM caller.** Disassembling an even LR as Thumb yields plausible-looking garbage (`udf`, stray `movs`) rather than an obvious failure -- that cost a round on Wonder Wand when 0x0214ACEC / 0x0214C814 / 0x02173240 decoded as nonsense until re-read as ARM, where they are all `cmp r0,#0x17`. Always branch on `lr & 1` before choosing the capstone mode."
  address: 0x0214ACEC
  oracle: "ov3"
  sources: [wonder-wand-findings]
  proof: |
    # these three call sites are ARM: the word AT the return address is ARM cmp r0,#0x17
    for site in (0x0214ACEC, 0x0214C814):
        assert site % 2 == 0, 'sample LR should be even (ARM)'
        assert h.u32(site, 'ov3') == 0xE3500017, f'0x{site:08X} is no longer ARM cmp r0,#0x17'
    # and a known Thumb function entry is odd when taken as a BL target
    assert h.u16(0x0202ABB8, 'arm9') == 0xB508, 'Thumb accessor prologue drifted'

- id: "tool.savestate_ram0_autodetect"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "A melonDS savestate's main-RAM file offset is VERSION-DEPENDENT and must be auto-detected (env.py uses librarian_recorder's 0x021A25A0 anchor). The current melonDS build maps 0x02000000 at file offset 0x24, NOT the 0x3C hardcoded in otn_enhanced/tools/savestate_diff.py -- reading at the wrong offset returns silently SHIFTED bytes that look plausible rather than failing, which has burned a debugging round. Never hardcode; probe a known structure."
  sources: [melonds-savestate-ram-offset, otn-lp-change-table-burn]
  proof: |
    import re, pathlib
    src = pathlib.Path('otn_enhanced/tools/savestate_diff.py').read_text(encoding='utf-8')
    m = re.search(r'FILE_OFF_OF_RAM0\s*=\s*(0x[0-9A-Fa-f]+)', src)
    assert m, 'savestate_diff.py no longer defines FILE_OFF_OF_RAM0'
    # Guard the wart: if this constant is ever used as a universal truth it is wrong.
    assert int(m.group(1), 16) in (0x24, 0x3C), f'unexpected constant {m.group(1)}'
    # The KB's own reader must NOT depend on that constant.
    import inspect
    from otn_enhanced.knowledge import env as _env
    assert 'find_ram_offset' in inspect.getsource(_env), \
        'env.py must auto-detect RAM0, never hardcode it'

