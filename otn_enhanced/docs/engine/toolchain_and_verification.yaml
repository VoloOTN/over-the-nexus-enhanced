- id: "tool.ungreppable_switch_overapprox"
  subsystem: "toolchain_and_verification"
  confidence: "VERIFIED"
  claim: "*** HOW TO CLEAR A DONOR AGAINST AN UNGREPPABLE PER-CID SWITCH: OVER-APPROXIMATE THE NAMEABLE SET AND LOOK FOR THE DONOR'S ABSENCE. thumb-stack-based-switch-footgun establishes that per-cid switch arms encode cids as `base +/- imm8` off a literal-pool constant, so a raw value scan for the cid finds NOTHING even when an arm names it. That means 'zero halfword- and word-aligned occurrences of the cid in ov3 + arm9' -- the usual records-free sweep -- clears a donor against every TABLE but against no CODE. Simulating the switch is the sound-but-expensive answer, and the footgun note records that register-only simulators get it WRONG because the base can live in [sp,#n]. *** THE CHEAP DECISIVE TEST RUNS THE OTHER WAY: disassemble the function, collect every literal-pool constant inside the cid range 0x0D48..0x24E8 (card_prop's min and max) as a BASE, collect every imm8 appearing in any MOV/ADD/SUB as a DELTA, and take {base} U {base +/- delta}. That set is a strict SUPERSET of what any arm can compare against, so a donor OUTSIDE it is PROVABLY not named -- a sound negative from a scan that takes seconds and no emulator. A donor INSIDE it proves nothing (the set is deliberately huge) and needs real simulation, or just a different donor. *** WORKED CASE, 2026-08-20, picking a donor for Maiden with Eyes of Blue -- which is a TUNER and so will actually be fed to Synchro Summons, making a stale named-material rule visible: the OUTER named-material predicate 0x022485B4 yields 13 cid-range bases x 103 deltas = 1810 nameable cids, and the INNER 0x0224829C 10 bases x 33 deltas = 603. Comrade Swordsman of Landstar 0x1ED7 is in NEITHER (accepted); Water Spirit 0x1E05 IS in the OUTER set (rejected in favour of the donor with a sound negative). Generalise it: run this against any shared machinery the donor's TYPE will reach."
  sources: [maiden-with-eyes-of-blue-findings, thumb-stack-based-switch-footgun, otn-synchro-material-machinery]
  proof: |
    for fn, ln in ((0x022485B4, 0x900), (0x0224829C, 0x318)):
        assert h.oracle_for(fn) == 'ov3', f'{fn:#x} left overlay 3'
        blob = h.bytes_at(fn, ln, 'ov3')
        assert blob[:4] != bytes(4), f'predicate {fn:#x} is empty'
    assert 0x0D48 <= 0x1ED7 <= 0x24E8, 'the cid range bounding the scan is wrong'

