- id: "mem.ov5_ov41_share_base"
  subsystem: "overlay_memory_map"
  confidence: "VERIFIED"
  claim: "Overlay 5 and overlay 41 BOTH load at 0x022C5900, so they can never be co-resident: the PUZZLE EDITOR (and puzzles played from it) loads ov41 and EVICTS ov5, so ov5 cave stubs are dead there. ⚠️ CORRECTED 2026-10-08: this used to say 'a puzzle loads ov41 ... every ov5 cave stub is therefore normal-duel-only'. Canary state rom_ov5_canary.ml7 (an ordinary puzzle NOT via the editor) has ov5 resident and the cave intact -- see mem.ov5_cave_canary_all_modes. Overlay 3, by contrast, spans [0x02141700, 0x022C5900) and overlaps NEITHER ov41 nor the other puzzle-side overlays (ov47/ov49), so ov3 can be co-resident with the puzzle overlay set."
  address: 0x022C5900
  sources: [ov5_cave.py, notes/ov3-cave-findings.md]
  proof: |
    if env.rom_path is None:
        raise Skip('no rom.nds on disk (overlay table unavailable)')
    import ndspy.rom
    tbl = ndspy.rom.NintendoDSRom.fromFile(str(env.rom_path)).arm9OverlayTable
    def ent(oid):
        _id, ram, size, bss = struct.unpack_from('<IIII', tbl, oid * 32)
        return ram, ram + size + bss
    ov3_lo, ov3_hi = ent(3)
    ov5_lo, ov5_hi = ent(5)
    ov41_lo, ov41_hi = ent(41)
    assert ov5_lo == ov41_lo == 0x022C5900, (
        f'ov5/ov41 no longer share a base: 0x{ov5_lo:08X} / 0x{ov41_lo:08X}')
    assert ov3_lo == 0x02141700 and ov3_hi == 0x022C5900, (
        f'ov3 footprint drifted: [0x{ov3_lo:08X}, 0x{ov3_hi:08X})')
    # ov3 must not overlap any puzzle-side overlay
    for oid in (41, 47, 49):
        lo, hi = ent(oid)
        assert not (ov3_lo < hi and lo < ov3_hi), f'ov3 overlaps ov{oid}'

- id: "mem.ov3_resident_all_modes"
  subsystem: "overlay_memory_map"
  confidence: "ANCHORED"
  claim: "MEASURED 2026-07-22 by matching each overlay's decompressed image against savestate RAM in five modes (normal duel / puzzle / turbo / tag / tag turbo): ov3 = 100% in ALL FIVE, ov5 = 100% except 3.5% in the PUZZLE, ov41 = 100% only in the puzzle, all 47 other overlays ~8% (noise floor). ov3 is the ONLY overlay co-resident across every duel mode. This CORRECTS the older claim (CLAUDE.md, Emulator/GDB Preflight) that overlay 3 is not resident in a puzzle -- only the ov5 half of that claim was true."
  address: 0x02141700
  oracle: "savestate"
  sources: [notes/ov3-cave-findings.md, ov5_cave.py]
  proof: |
    img = env.ov3
    n = 0x40000
    ram = h.ram_bytes(0x02141700, n)   # Skips if no savestate
    match = sum(1 for i in range(n) if ram[i] == img[i]) / n
    assert match > 0.99, f'ov3 image matches only {match:.1%} of RAM -- not resident'

- id: "mem.ov5_cave_canary_all_modes"
  subsystem: "overlay_memory_map"
  confidence: "ANCHORED"
  claim: "MEASURED 2026-10-08 with _build_ov5_canary.py (CLEAN rom.nds, ov5 grown by RESERVE 0x10000 filled 0xA5, arena-lo raised to 0x023AA120; sha256 d6cb9645...3f54b55) and savestates rom_ov5_canary.ml1-ml7, read by ov5_cave_check: in normal (ml1), turbo (ml2), tag (ml3), tag-turbo (ml4) duels AND an ordinary puzzle not entered via the editor (ml7) ov5 is resident and EVERY byte of [0x0239A120, 0x023AA120) is still 0xA5 -- nothing writes non-image bytes anywhere in the 64 KB cave. In the PUZZLE EDITOR (ml5) and a puzzle played from the editor (ml6), same boot as ml1-ml4 per user 2026-10-08 so the canary WAS in RAM, ov41 is resident and the whole region is overwritten (65534/65536 bytes; ~39.6 KB zeros, the rest ARM code words, ml5 == ml6) -- puzzle-EDITOR mode reuses those addresses; ordinary puzzles do not. ov41 itself is data 0x161E0 + bss 0xB60, ending 0x022DC640 (mem.ov5_cave_can_grow's 0x022DBAE0 omits the bss), far below the cave. ⚠️ A canary CANNOT see an ov5 RELOAD from ROM (it would restore the same 0xA5), so this proves cave CODE safe in duels, NOT runtime state -- see mem.ov5_runtime_state_wiped_mid_duel."
  address: 0x0239A120
  oracle: "savestate"
  sources: [notes/ov5-cave-capacity-findings.md, _build_ov5_canary.py, otn_enhanced/tools/ov5_cave_check.py]
  proof: |
    import os
    from otn_enhanced.tools.ov3_cave_check import find_ram_offset
    base = 'data/over_the_nexus/working/rom_ov5_canary.ml'
    if not all(os.path.exists(base + str(i)) for i in range(1, 8)):
        raise Skip('rom_ov5_canary.ml1-ml7 not on disk')
    for i in range(1, 8):
        b = open(base + str(i), 'rb').read(); o = find_ram_offset(b)
        r = b[o + 0x39A120:o + 0x3AA120]
        n = sum(1 for x in r if x == 0xA5)
        if i in (5, 6):
            assert n < 0x100, f'editor state ml{i}: cave unexpectedly intact ({n})'
        else:
            assert n == 0x10000, f'state ml{i}: {0x10000 - n} cave bytes reclaimed'

- id: "event.cmd_queue_draw_summon_activate_opcodes"
  subsystem: "overlay_memory_map"
  confidence: "ANCHORED"
  claim: "MEASURED 2026-11-03 by the CPU battery probe (otn_enhanced/tools/cpu_battery, build --probe): 0x021C3BC8 (event.animation_command_queue) replaced by a behaviour-identical C copy that logs every call; duel rpg001_0_syoki vs default_jf on rom_all_patches.nds, 1203 entries, duel result identical to unhooked builds. Op bit 15 = side. 0x56 = DRAW, b = count (opening hand a=0xFFFF b=5); the entry carries no card -- the drawn cards are deck[0..b-1] (player+0x304) at push time, i.e. the TOP OF THE DECK IS INDEX 0 (47/47 single draws: newest hand card == pre-draw deck[0]). 0x2B = Normal Summon face-up, a = cid. 0x2C = Special Summon, b = ref ((inst<<1)|side). 0x2D = effect activation (Spell/Trap/monster), b = cid, c = ref. 0x50 = monster hand->zone (b 0x8000 set / 0x4000 face-up), 0x51 = Spell/Trap from hand (b 0x4000 activated, else Set), 0x52 = Deck->hand by effect (a = ref), 0x4E = Synchro Summon (a = cid). FLIP SUMMON = 0x2B with c = 1 (Normal Summon has c = 0): over 3 probe duels 19x c=0 each right after 0x50, 10x c=1 each right after 0x33 (position change) in Main Phase 1 by the turn player; battle flips emit 0x62 (a = cid, b = 1) and NO 0x2B (probe saves probe_flip_rpg021_7_seria_vs_wcs021_zakka/_wcs077_gallis.sav, log count at 0x7700). Probe log layout: count u32 at save 0x2900, 16-B entries {u16 op,a,b,c; u8 turn, phase|player<<4, deck[2], hand[2]} at 0x8600; probe2 adds pseudo-entries 0x7F00 {a=deck[count-1], b=deck[0]} before each 0x56 and 0x7F01 {a=newest hand} after it."
  address: 0x021C3BC8
  oracle: "savestate"
  sources: [notes/cpu-battery-findings.md, otn_enhanced/tools/cpu_battery/rig.c]
  proof: |
    import os, struct
    p = 'build/cpu_battery/probe2.sav'
    if not os.path.exists(p):
        raise Skip('probe2.sav not on disk')
    d = open(p, 'rb').read()
    k = struct.unpack_from('<I', d, 0x2900)[0]
    ev = [struct.unpack_from('<4H', d, 0x8600 + 16 * i) for i in range(k)]
    n = top = 0
    for i, e in enumerate(ev[:-2]):
        if e[0] & 0x7fff == 0x7f00 and ev[i + 1][0] & 0x7fff == 0x56 and ev[i + 1][2] == 1:
            nxt = [x for x in ev[i + 2:i + 4] if x[0] & 0x7fff == 0x7f01]
            if nxt:
                n += 1; top += nxt[0][1] == e[2]
    assert n >= 40 and top == n, f'draw top-of-deck rule: {top}/{n}'

- id: "mem.ov5_runtime_state_wiped_mid_duel"
  subsystem: "overlay_memory_map"
  confidence: "UNVERIFIED"
  claim: "*** RUNTIME STATE WRITTEN INTO THE ov5 CAVE DOES NOT SURVIVE A WHOLE DUEL. Measured 2026-09-14 on the user's normal-duel savestates rom_assault_synchron.ml2/.ml3/.ml4 (build a265b823): the appended ov5 region differed from the ROM image only at runtime cells -- CAVE_TGW_ARMLATCH 0x0239B248 = 1 in ml2 and ml3, CAVE_ASSAULT_C2REFS 0x0239F510 = 0x00048056 in ml3 -- and in ml4, 11 s later, after Accel Synchro Stardust Dragon's C2/C3 resolved (Special Summon of Stardust Dragon + a Synchro Summon), the WHOLE appended region was byte-identical to the ROM image: both cells back to 0 together, every stub intact, native ov5 identical in all three states. Consistent with overlay 5 being RELOADED from the ROM mid-duel. CONSEQUENCE: an ov5 latch/list is only safe for state that is written and consumed with no summon animation in between; state that must survive a chain belongs in main RAM (e.g. an attached node via 0x021C479C). Shipped latches that may be exposed: CAVE_TGW_ARMLATCH, CAVE_ASSD_STAGE, CAVE_LIB_LATCH, CAVE_AS_LATCH."
  address: 0x0239F510
  oracle: "ov5"
  sources: [notes/assault-synchron-findings.md, scratch/assault_c2_timing_probe.py]
  next_experiment: "Pin the reloader: in a normal duel, savestate immediately before and after (a) a plain Synchro Summon, (b) a Special Summon from the Extra Deck by effect, (c) any Summon from the hand, with a known nonzero byte written into an unused ov5 cave word; the first pair where it returns to 0 names the step. Then find the overlay load call on that path."

