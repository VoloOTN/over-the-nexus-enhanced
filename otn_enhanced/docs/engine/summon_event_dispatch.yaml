  claim: "*** WRONG IN THE ONLY WAY THAT MATTERS -- SUPERSEDED BY summon.commit_r0_places_bit4_only_attributes. The instruction reading was right (0x0226925C really does `TST #0x10` the fifth argument and `EORS R0,R5 ; STRH R0,[R4]`), but the CONCLUSION -- that this is what puts the card on the other player's field -- was NOT MEASURED, only inferred, and it is false. card.ceruli_clause1 round 1 shipped on it and the card Special Summoned itself onto ITS OWNER'S field. Savestate rom_ceruli.ml3 read [g+0] = 1 and [g+2] = 0 with the card physically in SIDE 0's monster zone: the placement follows r0, and [g+0] is a separate attribution field nothing in the placement path reads. *** THE LESSON: a field a function demonstrably WRITES is not thereby the field the SUBSYSTEM READS. Ojama Trio -- the one stock card that summons to the opponent's field -- was visible the whole time and passes `1 - side` in r0 WITHOUT touching bit 4; that precedent should have outranked the inference."
