- id: "summon.commit_r0_places_bit4_only_attributes"
  subsystem: "summon_event_dispatch"
  confidence: "VERIFIED"
  claim: "*** IN 0x0226925C -- THE GENERIC SPECIAL SUMMON COMMIT -- r0 IS THE SIDE THE CARD IS PHYSICALLY PLACED ON. Signature (r0 = placing side, r1 = &locator, r2 = face-up, r3 = position, [sp] = word whose HIGH half is the cid and LOW half is a flag field). *** BIT 4 (0x10) OF THAT WORD DOES NOT MOVE THE CARD. It only writes the SEPARATE attribution field [g+0] of the summon block 0x02298A28: `LDR R1,[SP,#0x18] ; MOVS R0,#0x10 ; TST R0,R1` -> 1/0 -> `EORS R0,R5 ; STRH R0,[R4]`, while `STRH R5,[R4,#2]` stores r0 itself at [g+2]. Nothing in the placement path reads [g+0]: every downstream call in the function passes r5 (0x022692E6 `ADDS R0,R5,#0` -> 0x021A25A0, 0x022692F0 -> 0x02244D08, 0x02269302 -> 0x02244D50) and the finaliser 0x02269084 takes no arguments. *** MEASURED, NOT INFERRED -- this is the correction of summon.commit_bit4_flips_destination_side, which cost card.ceruli_clause1 one in-game test. Savestate rom_ceruli.ml3 (2026-08-30, round 1: r0 = desc[+2] = 0 with bit 4 set) read the block as [g+0] = 1, [g+2] = 0, face-up 1, position 1, zone 0x0E, cid 0x1B3E, [g+0x10] = 0x14 -- so the fifth argument arrived intact and the flip WAS applied to [g+0] -- and yet the card sat in SIDE 0's monster zone 2, the owner's field. *** THE STOCK PRECEDENT AGREES: Ojama Trio, the only stock card that Special Summons to the opponent's field, passes `1 - side` as r0 and leaves the low half ZERO (its per-cid leaf 0x02207BAA, dispatch.token_table). *** AND SO DOES THE 3DS, once read correctly: 3DS Ceruli 0x00443184 passes r0 = 1 - owner AND sets bit 4, i.e. it PLACES on the opponent while RECORDING [g+0] = the owner. Both halves are deliberate, and that pair is what card.ceruli_clause1 round 2 reproduces. [g+0x10] = (word & 0xFFFF) | 4, so the low half is readable back out of a savestate as a build fingerprint. Bit 5 (0x20) is a further flag set by the 3DS self-SS handler for one cid group; NOT decoded."
  address: 0x0226925C
  oracle: "ov3"
  sources: [notes/ceruli-findings.md]
  proof: |
    # the bit-4 test and the two stores are real -- that half was never in doubt
    assert h.u16(0x0226927A, 'ov3') == 0x9906, '0x0226925C no longer loads [sp,#0x18]'
    assert h.u16(0x0226927C, 'ov3') == 0x2010, 'the `movs r0,#0x10` (bit 4) moved'
    assert h.u16(0x0226927E, 'ov3') == 0x4208, 'the `tst r0,r1` moved'
    assert h.u16(0x0226928A, 'ov3') == 0x4068, 'the `eors r0,r5` moved'
    assert h.u16(0x0226928C, 'ov3') == 0x8020, 'the [g+0] `strh r0,[r4]` moved'
    assert h.u16(0x0226928E, 'ov3') == 0x8065, 'the [g+2] `strh r5,[r4,#2]` moved'
    # THE CORRECTION, closed structurally: every downstream call takes r5 (= r0),
    # and [g+0] is written once and never read again inside the function.
    for a in (0x022692E6, 0x022692F0, 0x02269300):
        assert h.u16(a, 'ov3') == 0x1C28, f'{a:#x} is no longer `adds r0,r5,#0`'
    body = h.bytes_at(0x0226925C, 0x0226930C - 0x0226925C, 'ov3')
    import struct
    hw = [struct.unpack_from('<H', body, i)[0] for i in range(0, len(body), 2)]
    assert hw.count(0x8820) == 0, 'something now READS [g+0] (`ldrh r0,[r4]`) in-function'
    assert hw.count(0x8020) == 1, '[g+0] is written more than once'
    # Ojama Trio's leaf reaches the opponent WITHOUT bit 4: `movs r0,#1 ; subs r0,r0,r4`
    assert h.u16(0x02207BAA, 'ov3') == 0x2001, "Ojama Trio's `movs r0,#1` moved"
    assert h.u16(0x02207BAC, 'ov3') == 0x1B00, "Ojama Trio's `subs r0,r0,r4` moved"

- id: "summon.extra_normal_summon_granters"
  subsystem: "summon_event_dispatch"
  confidence: "VERIFIED"
  claim: "*** 'NORMAL SUMMON 1 <ARCHETYPE> MONSTER IN ADDITION TO YOUR NORMAL SUMMON OR SET' IS NOT A cls RECORD -- IT IS FOUR LITERAL-POOL WORDS. The granter cid (Grunard 0x20D6 / Swap Frog 0x2115 / Dverg 0x245B, alongside the card-effect granters Ultimate Offering 0x12F3, Cry Havoc! 0x1D35, Brain Research Lab 0x209B, Advance Force 0x21D3, Big Evolution Pill 0x1AA3, Double Summon 0x1C33) appears in ov3 ONLY as a pool literal at four sites, each an arm of a per-granter chain: (1) 0x021B95C4 'WHICH GRANTER PERMITS SUMMONING THIS HAND CARD' -- pool 0x021B9670, read once @0x021B9642. Arm shape: archetype-predicate(hand cid, or skip when r4 == 0 = 'any card') -> granter-on-field 0x021ABE4C(side, cid) with `blt` = absent -> spent-rider 0x021A1430(side, 0xB, cid) with `bne` = already used -> return the granter cid. *** THE TWO FIELD CHECKS ARE NOT INTERCHANGEABLE, AND THAT IS THE CARD'S PRINTED TIMING WINDOW. 0x021ABE4C -- which the DVERG arm uses -- is not a plain cid scan: after matching the cid and the alive/not-negated predicate 0x021A32B4 it ALSO requires 0x021A1430(side, SLOT, cid), a kind<6 node keyed by the card's OWN cid on its OWN slot, and skips the slot when that node is absent. MEASURED by executing it over the repo's 8 duel savestates (scratch/ninishi_onfield_probe.py): it returns -1 for EVERY face-up monster in EVERY state, because no ordinary card carries such a node. That node is Dverg's printed 'AFTER YOU NORMAL SUMMON THIS CARD, you can Normal Summon 1 Nordic monster during your Main Phase THIS TURN'. The GRUNARD arm, whose text has no such window ('During your Main Phase, you can Normal Summon 1 Ice Barrier monster in addition...'), calls 0x021AC0C8(side, cid, -1) instead, which the same probe shows returning 1 for every alive face-up monster and 0 otherwise. So: node-gated 0x021ABE4C == 'the granter was Normal Summoned this turn'; 0x021AC0C8 == 'the granter is simply face-up'. CONSEQUENCE: a donor cloned off Dverg's arm inherits Dverg's window and its grant is NEVER OFFERED unless the donor is also given that node -- ninishi shipped exactly that bug on 2026-09-10 and it failed in-game; the fix (CAVE_NS_FIELD) reruns the native loop without the node query for the donor cid and tail-calls the native function for every other cid, and is itself measured on 9 boards (it returns the true slot wherever native returns -1). *** THE FIX IS IN-GAME CONFIRMED BY USER 2026-09-10: with CAVE_NS_FIELD the donor's extra Normal Summon is offered; without it the same build offered nothing. MATCH THE FIELD CHECK TO THE PRINTED TEXT. *** (2) 0x021B9EFC 'IS THE EXTRA NORMAL SUMMON SPENT' -- pool 0x021B9FBC, read @0x021B9F92; a flat chain of the same rider query, one link per granter. (3) the action state machine at 0x02261D60.. -- pool 0x02261F84, read THREE times (0x02261E62 / 0x02261E9A / 0x02261EE8), all inside the one arm the archetype test @0x02261E3E selects; the last stamps the granter into summon-descriptor +0x12. (4) the consume path @0x0226515A -- pool 0x022651B4, read @0x0226515C (compare against descriptor +0x12) and @0x02265174 (the cid handed to the spent-rider set 0x021D2584(side, cid, 1, 0)). *** KIND 0xB RIDER KEYED BY GRANTER CID == 'THIS GRANTER'S EXTRA SUMMON IS SPENT THIS TURN'. *** CONSEQUENCE FOR PATCHING: nothing in the four sites is card-specific, so the grant can be RETARGETED (rewrite the four words) or DUPLICATED for a second cid without the donor-cid technique -- ninishi moved off Dverg onto the Normal Monster Dark Chimera 0x0FFD this way, adding a fifth arm at each site (CAVE_NS_ARM / CAVE_NS_SPENT / CAVE_NS_PRED / CAVE_NS_MATCH) and handing Dverg back whole -- the donor's grant is IN-GAME CONFIRMED BY USER 2026-09-10 (the second build; the first shipped the field-check bug below). The pool-word count is closed by scanning EVERY `ldr rX,[pc,#imm]` encoding in ov3 and resolving its target, which is what licenses site 3's stub writing the granter cid INTO pool 0x02261F84 at runtime: that word has exactly three readers and all are downstream of the predicate that sets it. *** STATIC STRUCTURE plus one in-game confirmation of the grant itself; the cls1-record clauses this card also carries are gated elsewhere and are NOT covered by it."
  address: 0x021B95C4
  oracle: "ov3"
  sources: [notes/ninishi-normal-donor-findings.md, ninishi.py]
  proof: |
    import struct
    WANT = {0x021B9670: [0x021B9642],
            0x021B9FBC: [0x021B9F92],
            0x02261F84: [0x02261E62, 0x02261E9A, 0x02261EE8],
            0x022651B4: [0x0226515C, 0x02265174]}
    img, base = h.env.image('ov3'), h.env.base('ov3')
    found = {p: [] for p in WANT}
    for off in range(0, len(img) - 1, 2):
        w = struct.unpack_from('<H', img, off)[0]
        if w & 0xF800 != 0x4800:
            continue
        a = base + off
        t = ((a + 4) & ~3) + (w & 0xFF) * 4
        if t in found:
            found[t].append(a)
    for pool, readers in WANT.items():
        assert h.u32(pool, 'ov3') == 0x245B, f'granter pool {pool:#x} is not Dverg'
        assert found[pool] == readers, \
            f'pool {pool:#x} readers are {[hex(x) for x in found[pool]]}, expected {[hex(x) for x in readers]}'
    assert h.bl_target(0x021B963A, 'ov3') == 0x02023FC4, 'site 1 lost its is_nordic BL'
    assert h.bl_target(0x02261E3E, 'ov3') == 0x02023FC4, 'site 3 lost its is_nordic BL'
    assert h.bl_target(0x021B9648, 'ov3') == 0x021ABE4C, 'site 1 on-field call drifted'
    assert h.bl_target(0x021B9656, 'ov3') == 0x021A1430, 'site 1 rider query drifted'
    assert h.bl_target(0x0226517C, 'ov3') == 0x021D2584, 'the spent-rider set drifted'
    # the two field checks, and the node query that separates them
    assert h.bl_target(0x021B95E0, 'ov3') == 0x021AC0C8, \
        'Grunard arm no longer uses the node-free field check'
    assert h.bl_target(0x021B9648, 'ov3') == 0x021ABE4C, \
        'Dverg arm no longer uses the node-gated field check'
    assert h.bl_target(0x021ABEA8, 'ov3') == 0x021A1430, \
        '0x021ABE4C lost the self-node query that makes it summoned-this-turn'
    assert h.u16(0x021ABEAE, 'ov3') == 0xD001, \
        'the self-node query is no longer `beq <next slot>`'

