- id: "summon.trigger_is_a_membership_list"
  subsystem: "summon_event_dispatch"
  confidence: "VERIFIED"
  claim: "*** 'WHEN THIS CARD IS SUMMONED' IS A DATA TABLE, NOT A PREDICATE IN THE cls RECORD. 0x02265768(r0 = event code) is the summon-trigger evaluator; it runs after every summon with r4 = the global summon record 0x02298A28 ({+0x02 side, +0x04 zone, +0x0E cid, +0x10 flags, +0x12 a second cid}) and returns early unless the summoned card's zone is face-up. THREE CALLERS, THREE CODES: 0x02267A38 passes 7 (NORMAL summon), 0x02268B7C passes 8 (FLIP summon), 0x0226878A passes 9 (SPECIAL summon). It computes ONE flag r5 and, when it is non-zero, posts the event at 0x02265CA8 via the register-prim 0x021D3168 with zone -> bits 16..20, side -> bit 31, the event code -> bits 25..30 and -- decisively -- `movs r6,#2 ; lsls r6,r6,#0x14` = 0x00200000, i.e. THE SELECTOR IS HARD-CODED TO 1. So a summon trigger can only ever be dispatched to a cls1 record; cls3 is unreachable from it. And 0x0224A115 -- the `+0C` value shared by three of the five native 'when this card is Synchro Summoned' cards, and the obvious-looking candidate for a was-I-just-summoned test -- is 0x0224A114|1 = `movs r0,#2 ; bx lr`, the ubiquitous slot3 always-activatable stub (dispatch.cls_slot_roles). It says nothing about the summon. r5 COMES FROM NINE SORTED cid LISTS searched with the generic binary search 0x02022E14(value, table, count), plus one per-cid switch of special conditions: 0x0228F7AC x0x67 (code 7), 0x0228F5B8 x0x12 (code 7 + tribute, the Monarchs), 0x0228F580 x0x0C (code 8), 0x0228F63A x0x1F (code 9, NO further gate = plain 'when this card is Special Summoned'), 0x0228F5DC x0x17 (code 9 + [+0x12] == cid), 0x0228F6C0 x0x24 (code 9 + [0x02298A28+0x10] & 1), 0x0228F598 x0x10 (code 7 or 8), 0x0228F60A x0x18 (code 7 or 9), 0x0228F678 x0x23 (any code). 0x0228F6C0 is the 'when Synchro / Fusion / Ritual Summoned' set -- it holds Mist Wurm 0x1D7D, Locomotion R-Genex 0x2045, Trishula 0x221C, Vylon Alpha 0x24B1, Junk Warrior, Black Rose Dragon, Formula Synchron, Karakuri Burei, the Vylons, the 'when Fusion Summoned' HEROes and two Rituals -- so [0x02298A28+0x10] bit 0 means 'this Special Summon was a PROPER summon via a summoning procedure'. HOW TO USE IT: adding a cid to the right list plus a cls1 record gives a donor a native summon trigger; hooking one of the `bl 0x02022E14` call sites instead gives arbitrary code on that summon with the cid live, and returning the engine's own verdict leaves the dispatch byte-identical (card.azure_eyes_silver_dragon PART G). *** IN-GAME CONFIRMED 2026-08-24: a stub hooked at the 0x022658B8 search ran on a live Synchro Summon, so this evaluator is genuinely the post-summon path. *** AND THE LIST-INSERT HALF IS NOW IN-GAME CONFIRMED TOO (2026-08-30, card.ninja_grandmaster_hanzo_clause1, first test): a RECORDS-FREE donor (Melchid 0x13E7) inserted into the code-7 list 0x0228F7AC over the phantom 0x14CC, plus one cls1 row, fired its Normal-Summon trigger. *** SECOND INDEPENDENT IN-GAME CONFIRMATION (in-game confirmed by user 2026-09-08, first test, all five oracles): card.boggart_knight was RE-HOMED off Vampire Orchis 0x15D4 -- a real Effect Monster borrowed only for her native cls1 record -- onto the records-free vanilla Molten Behemoth 0x13A5, using THREE rows: code-7 list over the phantom 0x0E74, cls1 record over 0x0E11 (Boggart 0x2346's cls1[1227] verbatim, which is byte-identical to Orchis's cls1[278] apart from the cid), criteria row over 0x0E20 (Boggart's own row 1235 {0x0048, 0x0223CA71, 0x00900002}). It also proves the recipe COMPOSES: the same donor simultaneously carries an ARM9 set-code insert and an ov5 predicate stub, and a later chain step (tg_rush_rhino) deleting the 0x2346 TEMPLATE rows does not regress it, because the donor owns its own rows and the engine binary-searches by cid, never by row index. PREFER THIS OVER THE HOOK. It is ONE u16 in a sorted list plus ONE cls1 row and ZERO code -- no ov5 cave slot, so the card stays puzzle-safe -- whereas the hook costs a stub and makes the card normal-duel-only. The hook is for donors that ALREADY own a cls1 record (which is the only reason card.azure_eyes_silver_dragon needed it: a second dispatchable cls1 record is Spirit-only, see dispatch.second_cls1_record_is_spirit_only), or when the trigger needs a condition no list expresses. EVERY list has droppable phantoms for a count-neutral insert except 0x0228F6C0 (code 9 + proper summon), measured 2026-08-30: c7 0x0228F7AC has nine (0xE74, 0xE7E, 0xE7F, 0x14CC, 0x15D0, 0x19C0, 0x19D3, 0x1B1A, 0x2346), c8 0x0228F580 has exactly ONE (0x1A9F), c9 0x0228F63A has five (0xE12, 0x167C, 0x176C, 0x1ABE, 0x1ABF), and the 'any code' list 0x0228F678 has six. ⚠️ c8's single phantom is the scarcest slot in the whole subsystem -- spend it deliberately."
  address: 0x02265768
  oracle: "ov3"
  sources: [notes/azure-eyes-clause2-findings.md, notes/ninja-grandmaster-hanzo-findings.md]
  proof: |
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    # the three callers and their event-code immediates
    for site, code in ((0x02267A38, 7), (0x0226878A, 9), (0x02268B7C, 8)):
        assert h.bl_target(site, 'ov3') == 0x02265768, f'{site:#x} no longer calls the evaluator'
        assert h.u16(site - 6, 'ov3') == 0x2000 | code, f'{site:#x} event-code immediate drifted'
    # the evaluator's prologue: the summon record and the incoming code
    assert h.bytes_at(0x02265768, 8, 'ov3') == bytes.fromhex('f8b588b09b4c061c'), 'evaluator prologue drifted'
    # the posted event word forces SELECTOR 1 (bit 21) -- movs r6,#2 ; lsls r6,r6,#0x14
    assert h.u16(0x02265C8E, 'ov3') == 0x2602, 'movs r6,#2 drifted'
    assert h.u16(0x02265C94, 'ov3') == 0x0536, 'lsls r6,r6,#0x14 drifted'
    assert h.bl_target(0x02265CA8, 'ov3') == 0x021D3168, 'the event post moved'
    assert (2 << 0x14) == 0x00200000 and ((0x00200000 >> 21) & 7) == 1, 'selector arithmetic'
    # the nine lists: (bl site, count-immediate site, table-LDR site, table, count).
    # 0x022658B8 is the odd one -- an `ldrh r7,[r4,#0x12]` sits between the count and the bl.
    LISTS = ((0x022657A2, 0x022657A0, 0x0226579E, 0x0228F7AC, 0x67),
             (0x022657B8, 0x022657B6, 0x022657B4, 0x0228F5B8, 0x12),
             (0x02265878, 0x02265876, 0x02265874, 0x0228F580, 0x0C),
             (0x022658B8, 0x022658B4, 0x022658B2, 0x0228F63A, 0x1F),
             (0x022658E2, 0x022658E0, 0x022658DE, 0x0228F5DC, 0x17),
             (0x022658FC, 0x022658FA, 0x022658F8, 0x0228F6C0, 0x24),
             (0x02265C28, 0x02265C26, 0x02265C24, 0x0228F598, 0x10),
             (0x02265C40, 0x02265C3E, 0x02265C3C, 0x0228F60A, 0x18),
             (0x02265C50, 0x02265C4E, 0x02265C4C, 0x0228F678, 0x23))
    for site, cnt_site, ldr_site, tbl, cnt in LISTS:
        assert h.bl_target(site, 'ov3') == 0x02022E14, f'{site:#x} is not the list search'
        assert h.u16(cnt_site, 'ov3') == 0x2200 | cnt, f'{site:#x} count immediate drifted'
        w = h.u16(ldr_site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{site:#x} table load is not an LDR literal'
        got = h.u32(((ldr_site + 4) & ~3) + (w & 0xFF) * 4, 'ov3')
        assert got == tbl, f'{site:#x} table is {got:#x}, expected {tbl:#x}'
        rows = struct.unpack_from(f'<{cnt}H', img, tbl - base)
        assert all(rows[i] < rows[i + 1] for i in range(cnt - 1)), f'{tbl:#x} not strictly sorted'
    # the four native 'when this card is Synchro Summoned' cards are in the PROPER list
    proper = struct.unpack_from('<36H', img, 0x0228F6C0 - base)
    cls1 = {h.u32(0x022860D4 + i * 24, 'ov3') & 0xFFFF for i in range(0x535)}
    for cid in (0x1D7D, 0x2045, 0x221C, 0x24B1):
        assert cid in proper, f'{cid:#06x} left the proper-summon trigger list'
        assert cid in cls1, f'{cid:#06x} lost its cls1 record'
    # 0x0224A115 is the always-activatable stub, NOT a summon test
    assert h.bytes_at(0x0224A114, 4, 'ov3') == bytes.fromhex('02207047'), '0x0224A114 is not movs r0,#2 ; bx lr'
    # the count-neutral insert budget: how many phantoms each list still has.
    # c8 having exactly ONE is the scarcity the claim warns about.
    import json
    names = json.load(open('scratch/cid_to_name.json', encoding='utf-8'))
    PHANTOMS = {0x0228F7AC: 9, 0x0228F5B8: 3, 0x0228F580: 1, 0x0228F63A: 5,
                0x0228F5DC: 2, 0x0228F6C0: 0, 0x0228F598: 4, 0x0228F60A: 4,
                0x0228F678: 6}
    for _site, _cs, _ls, tbl, cnt in LISTS:
        rows = struct.unpack_from(f'<{cnt}H', img, tbl - base)
        free = sum(1 for c in rows if str(c) not in names)
        assert free == PHANTOMS[tbl], \
            f'{tbl:#x} has {free} phantoms, expected {PHANTOMS[tbl]} -- insert budget changed'
    assert PHANTOMS[0x0228F580] == 1, 'the c8 scarcity warning is stale'
    # card.ninja_grandmaster_hanzo_clause1 spent c7's 0x14CC; it is still a phantom here
    # because the committed oracle is the STOCK image, which no patch modifies.
    assert str(0x14CC) not in names, '0x14CC is a real card -- the c7 insert is unsound'

- id: "summon.commit_descriptor_carries_source_zone"
  subsystem: "summon_event_dispatch"
  confidence: "VERIFIED"
  claim: "*** THE [+0x0A] == 0x0B = 'FROM THE HAND' READING IS CORROBORATED IN GAME (card.unknown_synchron, user 2026-09-02): a stamp gated on it fired for the card's own hand Special Summon and did NOT fire for a Monster Reborn revival of the same card, tested in both orders. *** THE SS-COMMIT DESCRIPTOR SAYS WHERE THE MONSTER CAME FROM, which is how you implement any 'Special Summoned FROM THE HAND / GY / DECK' distinction -- including a printed 'once per Duel THIS WAY' (see dispatch.turnlog_once_per_duel_is_kind_5). The global descriptor is SUMMON_DESC = 0x02298A28 (pool word of both commit routines, e.g. @0x02269310 and @0x022693BC). Routine A 0x0226925C fills it: `strh r5,[r4,#2]` @0x0226928E -> [+0x02] = SIDE; `bl 0x021A220C` @0x0226929E then bits [15:8] of the result -> `strh r0,[r4,#0xA]` @0x022692AC -> [+0x0A] = THE SOURCE ZONE; `strh r0,[r4,#0xE]` @0x022692C2 -> [+0x0E] = the summoned CID. Routine C is its twin, ending 0x022693BA. *** THE ZONE VOCABULARY OF [+0x0A] IS EXACTLY {0x0B HAND, 0x0D DECK, 0x0E GY} -- 4 / 2 / 9 compare sites across all of overlay 3 and nothing else -- the same numbering as the capability enumerator (zone 0x0B -> 0x0224BEFC, dispatch.card_capability_enum) and as Armory Arm's GY gate (0x0E). The engine uses it as its OWN 'summoned from where' discriminator: at 0x022662F8, after `cmp r6,#9` (event 9 = Special Summon), it branches on [+0xA] == 0xE (from the GY) and then == 0xD (from the Deck); at 0x02265A80 and 0x02265A9A it tests [+0xA] == 0xB (from the HAND). *** REACHED ONLY FOR SPECIAL SUMMONS -- GDB-confirmed 2026-07-12 (recorded in tg_warwolf._build_arm_hook): a Normal Summon never reaches these routines, so no genuine-SS test is needed on top. *** FOUR HOOKABLE CALLS, TWO PER ROUTINE, AND THEY ARE INDEPENDENTLY CLAIMABLE: `BL 0x021A25A0` @0x022692E8 / 0x02269396 (T.G. Warwolf's arm hook) and `BL 0x02244D08` @0x022692F2 / 0x022693A0 (Unknown Synchron's once-per-Duel stamp). At all four r0 = side; at the 0x02244D08 pair the return value is DEAD (the caller's next instruction is `ldrh r0,[r4,#0xE]`), so a stub there need preserve nothing across the replayed call. The caller keeps SUMMON_DESC in r4, so a stub must preserve r4. Both pairs verified to coexist in one ROM 2026-09-02."
  address: 0x02298A28
  oracle: "ov3"
  sources: [unknown_synchron.py, notes/unknown-synchron-findings.md, otn-summon-event-dispatch-tg]
  proof: |
    assert h.u32(0x02269310, 'ov3') == 0x02298A28, 'routine A SUMMON_DESC pool drifted'
    assert h.u32(0x022693BC, 'ov3') == 0x02298A28, 'routine C SUMMON_DESC pool drifted'
    # the three descriptor stores: side @+2, source zone @+0xA, cid @+0xE
    assert h.u16(0x0226928E, 'ov3') == 0x8065, 'strh r5,[r4,#2] (side) drifted'
    assert h.u16(0x022692AC, 'ov3') == 0x8160, 'strh r0,[r4,#0xA] (source zone) drifted'
    assert h.u16(0x022692C2, 'ov3') == 0x81E0, 'strh r0,[r4,#0xE] (cid) drifted'
    assert h.bl_target(0x0226929E, 'ov3') == 0x021A220C, 'the zone lookup moved'
    # the engine's own from-hand / from-GY / from-Deck tests on that field
    assert h.u16(0x02265A80, 'ov3') == 0x280B, 'the from-HAND test (cmp r0,#0xB) moved'
    assert h.u16(0x022662FA, 'ov3') == 0x280E, 'the from-GY test (cmp r0,#0xE) moved'
    assert h.u16(0x02266310, 'ov3') == 0x280D, 'the from-DECK test (cmp r0,#0xD) moved'
    # the four hookable calls, two per routine
    for _a in (0x022692E8, 0x02269396):
        assert h.bl_target(_a, 'ov3') == 0x021A25A0, f'{_a:#x} is not the SS-lookup call'
    for _a in (0x022692F2, 0x022693A0):
        assert h.bl_target(_a, 'ov3') == 0x02244D08, f'{_a:#x} is not the second call'

