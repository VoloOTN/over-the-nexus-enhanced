- id: "dispatch.criteria_probe_side_is_xor_desc6"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE SIDE ARGUMENT OF A CRITERIA PROBE IS `desc[+2] ^ desc[+6]`, NEVER desc[+2] ALONE — and getting it wrong is INVISIBLE on two thirds of the call sites. *** Every native consumer of 0x02243FE0 / 0x02243FA8 derives its side that way: Card Ejector's condition tail 0x021F05A8 does `ldrb r1,[r5,#2] ; ldrb r0,[r5,#6] ; adds r6,r1,#0 ; eors r6,r0` before the call, and the off-field picker 0x02235605 opens with the same `desc[+2] ^ desc[+6]`. IT MATTERS BECAUSE THE ON-FIELD CAPABILITY ENUMERATOR 0x0224BCF2 SETS desc[+6] = 1 (`movs r1,#1 ; strb r1,[r0,#6]`), so for any on-field ignition the effective side is the OPPOSITE of desc[+2]. A stub that passes desc[+2] raw addresses THE OPPONENT. *** AND HERE IS THE TRAP THAT MAKES IT EXPENSIVE: whether you notice depends on the ROW's handler flags (dispatch.criteria_handler_flags_word). A row whose flags set bit 1 SCANS BOTH SIDES, so the side argument barely changes its answer; only single-side rows expose the bug. Darkflare Dragon's clause-2 gate probes three rows — hand 0x0223CB65, deck 0x0223CAD9 and either-GY 0x0223D741 — and the either-GY row (flags 0x00010003, bit 1 set) answered correctly while the other two counted the OPPONENT's hand and Deck. IN-GAME 2026-08-18 that shipped as 'the effect refuses to activate even though the cost is plainly payable', and the savestate rom_ew_lp_df.ml2 disproved every board-state explanation before the side was suspected: the player held a Dragon monster and had SIX Dragon monsters in the Deck. Fixing it to `eors r0,r1` on both probes made the card gate correctly, confirmed in-game the same day. RULE: any new caller of the criteria probes must XOR, and any single-side row is the one that will tell you whether you did."
  address: 0x021F05A8
  oracle: "ov3"
  sources: [darkflare-dragon-findings]
  proof: |
    # the native consumer computes side = desc[+2] ^ desc[+6]
    assert h.u16(0x021F05AC, 'ov3') == 0x78A9, 'the `ldrb r1,[r5,#2]` side read drifted'
    assert h.u16(0x021F05AE, 'ov3') == 0x79A8, 'the `ldrb r0,[r5,#6]` flip read drifted'
    assert h.u16(0x021F05B4, 'ov3') == 0x4046, 'the `eors r6,r0` side XOR drifted'
    assert h.bl_target(0x021F05C8, 'ov3') == 0x02234E78, \
        'the condition tail no longer reads the param provider'
    assert h.bl_target(0x021F05D2, 'ov3') == 0x02243FE0, \
        'the condition tail no longer probes the criteria registry'
    # ...and the on-field enumerator is what makes desc[+6] nonzero
    import struct as _s
    img, base_ = env.image('ov3'), 0x02141700
    hits = 0
    for a in range(0x0224BCF2, 0x0224BE00, 2):
        o = a - base_
        if _s.unpack_from('<H', img, o)[0] == 0x2101 and \
           _s.unpack_from('<H', img, o + 2)[0] == 0x7181:
            hits += 1
    assert hits == 1, f'expected exactly one `movs r1,#1 ; strb r1,[r0,#6]`, found {hits}'

- id: "dispatch.criteria_handler_flags_word"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** WHAT A CRITERIA-ROW HANDLER ACTUALLY IS, AND HOW TO READ ITS SIDE/ACTION. *** The handler at row+0x04 is not bespoke logic: the GY family are 14-byte THUNKS that differ from each other in ONE POOLED WORD, which they pass as arg6 to the shared worker 0x0223C4E8 (and its sibling 0x0223BC3C). 0x0223D6FC and 0x0223D740 are byte-identical apart from that word -- 0x00010001 vs 0x00010003 -- and it is a BITFIELD:
    bit 0  0x00001  scan the OPPONENT's side, not the controller's
                    (`tst r1,#1 ; eor r5,#1` @0x0223BC72/0x0223BC76)
    bit 1  0x00002  scan BOTH sides: run pass 1 with bit 1 cleared, then
                    `flags ^= 1` @0x0223C510 and run pass 2 (0x0223C4FA..0x0223C520)
    bit 3  0x00008  action = Special Summon
    bit 16 0x10000  action = BANISH
TEXT-VERIFIED ACROSS THE WHOLE TABLE, with zero counterexamples: all 24 rows on 0x0223D6FD (flags 0x00010001) belong to cards printed 'banish ... from your OPPONENT's GY' (D.D. Crow 0x1B44, Disappear 0x1515, Kycoo 0x1480, Card Ejector 0x1D44, Trishula 0x221C, Delg 0x239A, ...), plus 0x0224265D/Power Pickaxe for 25/25 on that flag class; the single row on 0x0223D741 (flags 0x00010003) is Soul Release 0x12F9, 'Target up to 5 cards in ANY GY(s); banish them'. ⚠️ D.D. Guide 0x19C0 LOOKS like a counterexample ('your opponent selects 1 card from the GY of this card's controller') and is in fact the strongest confirmation that bit 0 is RELATIVE: the card gives itself to the opponent, so its controller IS the relative opponent. Dropping bit 16 gives the return-to-Deck twins -- 0x0223D4E5 (flags 0x1, Graverobber / Hard-sellin' Zombie / Atomic Scrap Dragon / Foolish Return, 4/4 opponent-GY) and 0x0223FB39 (flags 0x2, Transmigration Prophecy / Pot of Benevolence / Evigishki Mind Augus, 3/3 either-GY). CONSEQUENCE FOR PATCHING: the side and the action of a GY selection are chosen by picking the right HANDLER, never by editing the criteria word -- and a side/action combination the ROM lacks can be synthesised as a 14-byte clone with one word changed. This is what settled card.darkflare_clause2's target row: it needs EITHER GY plus banish, i.e. 0x0223D741; the 2026-08-05 note's guess of 0x0223D6FD would have silently narrowed the card to the opponent's Graveyard."
  address: 0x0223D740
  oracle: "ov3"
  sources: [darkflare-dragon-findings]
  proof: |
    # the two thunks are byte-identical apart from one pooled word
    a = h.bytes_at(0x0223D6FC, 0x14, 'ov3')
    b = h.bytes_at(0x0223D740, 0x14, 'ov3')
    assert a[:0x14 - 6] == b[:0x14 - 6], 'the GY handler thunks diverged before the BL'
    assert h.bl_target(0x0223D710, 'ov3') == 0x0223C4E8, \
        'the opponent-GY thunk no longer calls the shared worker'
    assert h.bl_target(0x0223D754, 'ov3') == 0x0223C4E8, \
        'the either-GY thunk no longer calls the shared worker'
    # ...and that one word is the flags field
    assert h.u32(0x0223D718, 'ov3') == 0x00010001, 'opponent-GY flags drifted'
    assert h.u32(0x0223D75C, 'ov3') == 0x00010003, 'either-GY flags drifted'
    # bit 0 = flip to the opponent's side
    assert h.u16(0x0223BC72, 'ov3') == 0x4201, 'the `tst r1,r0` side test drifted'
    assert h.u16(0x0223BC76, 'ov3') == 0x4045, 'the `eor r5,r0` side flip drifted'
    # bit 1 = both sides: clear it, run, flip bit 0, run again
    assert h.u16(0x0223C4FA, 'ov3') == 0x422E, 'the `tst r6,r5` both-sides test drifted'
    assert h.u16(0x0223C510, 'ov3') == 0x4045, 'the `eor r5,r0` second-pass flip drifted'
    assert h.bl_target(0x0223C508, 'ov3') == h.bl_target(0x0223C520, 'ov3'), \
        'the two passes no longer call the same walker'
    # the row that consumes the either-GY handler, and the one that must NOT
    def rows_on(fn):
        return [i for i in range(0x56C)
                if h.u32(0x022713C4 + i * 12 + 4, 'ov3') == fn]
    assert len(rows_on(0x0223D6FD)) == 24, 'the opponent-GY handler row count changed'
    opp = rows_on(0x0223D741)
    assert len(opp) == 1 and h.u16(0x022713C4 + opp[0] * 12, 'ov3') == 0x12F9, \
        'Soul Release is no longer the sole either-GY witness'
    assert h.u32(0x022713C4 + opp[0] * 12 + 8, 'ov3') == 0x0001000E, \
        "Soul Release's word is no longer 'any card'"

- id: "dispatch.criteria_hand_vs_deck_handlers"
  subsystem: "effect_dispatch_tables"
