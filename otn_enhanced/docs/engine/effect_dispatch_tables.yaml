  claim: "*** 0x0223CAD9 IGNORES THE CRITERIA ROW'S aux; 0x0223CAF5 IS THE aux-AWARE TWIN. *** dispatch.criteria_hand_vs_deck_handlers correctly names 0x0223CAD9 'select from the DECK', and it is -- but a set-code filter placed on such a row is DEAD DATA, because the handler never reads row[+2]. Disassembled: 0x0223CAD8 is `push {r1,r2,r3,lr} ; adds r2,r0,#0 ; ldr r0,[r2,#8] (the word) ; movs r3,#0 ; str r0,[sp] ; movs r0,#2 ; str r0,[sp,#4] ; adds r0,r1,#0 (side) ; ldrh r1,[r2] (the CID, from row+0) ; movs r2,#0 ; bl 0x0223BC3C' -- r2 = r3 = 0, i.e. no extra predicate and no value list. Its immediate neighbour 0x0223CAF4 is the same function instruction for instruction EXCEPT that it loads the aux and passes the set-code filter through the (r2 = extra predicate, r3 = &value list) mechanism of dispatch.criteria_word_race_attribute: `ldrsh r2,[r3,r0]` with r0 = 2 reads row[+2], `str r2,[sp,#8]` makes the aux a one-element value list, `ldr r2,[pc,#8]` loads the set-code predicate 0x0223C825, `add r3,sp,#8` points at the aux, and it calls the SAME callee 0x0223BC3C with the SAME type 2. So the ONLY difference between the two handlers is the set-code filter -- NOT the destination (GY vs hand), which is the resolver's business, not the handler's. *** THE PRACTICAL RULE: an ARCHETYPE Deck search needs handler 0x0223CAF5, and a row that pairs aux != 0xFFFF with 0x0223CAD9 is a silent bug whose symptom is a picker offering EVERY monster in the Deck. *** SEVEN native cards already pair 0x0223CAF5 + a real aux + the shared deck-send resolver 0x02208DD5, i.e. already print 'send 1 <archetype> monster from your Deck to the GY': Hero Mask 0x1DC2 (aux 0x08), Worm Xex 0x20DB (0x32), The Fabled Peggulsus 0x2209 (0x41), Laval Miller 0x22C3 (0x55), Dragon Ravine 0x2359 (0x4A), Scrap Shark 0x2469 (0x57) and Tender of the Laval Volcano 0x249D (0x55). Peggulsus and Scrap Shark carry the bare word 0x00000002, so {aux, 0x0223CAF5, 0x00000002} is Konami's own row for that sentence. Used by