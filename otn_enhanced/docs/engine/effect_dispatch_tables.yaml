nge -- and the fact that these Extra-Deck Synchro monsters' triggers work natively is the standing evidence that cls1 dispatch DOES reach an Extra-Deck donor, which cls2 provably does not. card.junk_speeder_clause2 rewrites Daigusto Sphreeze 0x24B3 exactly this way."
