    sib = [(i, r[0]) for i, r in enumerate(rows)
           if (r[2], r[3]) == (0x0224C55D, 0x0224C669) and str(r[0]) not in names]
    assert sib == [(11, 0x1449), (12, 0x144C), (13, 0x1452)], \
        f'the sibling-family phantom rows moved: {sib}'
    # the Grapha family really is full: its only phantoms are the three spent ones
    gph = [r[0] for r in rows if (r[2], r[3]) == (0x0224C591, 0x0224C6C1)
           and str(r[0]) not in names]
    assert sorted(gph) == [0x0E3E, 0x0E64, 0x0EB2], f'Grapha phantoms drifted: {gph}'
    # every converted row keeps zone 0x0E, so the enumerator still finds it
    assert all(r[1] == 0x0E for i, r in enumerate(rows) if i in (11, 12, 13))
    # and the three count immediates are untouched by a conversion
    for site in (0x0224C99A, 0x0224CD30, 0x0224CD5C):
        assert h.bytes_at(site, 1, 'ov3')[0] == 0x3C, f'count imm at {site:#x} moved'

