- id: "dispatch.selection_param_and_zone"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** HOW A COST SELECTS ITS CANDIDATES, and the two things everyone gets wrong. The record-driven selection cost (Dark Simorgh's 0x021EC57D is the reference) is a FOUR-STATE machine on [0x0229AAFC+0x7C]: state 0 zeroes desc[+0x12] (**the PASS INDEX**) and prompts; state 1 calls 0x0224B9F0(side, cid, param, callback); state 2 banks the pick at desc[+0x14 + pass*2], increments desc[+0x12] and loops to state 1 while < 2; state 3 performs the move. 0x0224B9F0 is pure setup — it stores [0x0229DD94+0x4C] = 8 (mode), [+0x50] = param, [+0x60] = cid, [+0x74] = side and [0x0229DE14+0x0C] = the callback — and returns.
*** (1) THE ZONE IS ENFORCED BY THE CALLBACK, NOT BY THE ROW'S HANDLER. The per-candidate filter 0x022065F9 reads the acting descriptor from [0x0229A9FC+0x50], rejects a candidate whose controller != desc[+2]^desc[+6], then hardcodes `CMP R1,#0xB ; BNE reject` @0x0220660C — the candidate must be in the HAND — and only then runs the criteria probe 0x02243FE0(side, desc[+0], param). So the row supplies the attribute/race/level filter and the CALLER supplies the zone. This REFINES dispatch.criteria_zone_is_the_handler, which is right about Dark Simorgh's row pairs but wrong as a general rule for this path.
*** (2) FOR A CID IN MEMBERSHIP LIST A, `param` IS A 0/1 FLAG, NOT A ROW INDEX. 0x02243B9C's disambiguation @0x02243BEC..0x02243C00 binary-searches list A 0x0227134C and, on a hit, takes `r4 = (param == 0) ? 0 : 1` (branch to 0x02243EEC vs 0x02243EC6). So such a cid can only ever address its rows 0 and 1, whatever param it is handed — a hard ceiling that no amount of extra rows can lift.
*** (3) AND THE COST HARDCODES param = 0 ON BOTH PASSES (`MOVS R2,#0` @0x021EC5B6), keeping the pass index in desc[+0x12] instead. IN-GAME 2026-08-14 that combination produced a card whose Graveyard effect activated but offered only ONE hand card: both passes resolved to row 0. To give a donor a genuine two-attribute hand cost, override param with desc[+0x12] — lightpulsar PART L repoints the cost's callback literal 0x021EC644 (single loader, `LDR R3,[PC,#0x8C]` @0x021EC5B4) at a CID-SCOPED ov3 trampoline that does exactly that and tail-calls the native filter, leaving Dark Simorgh's own param untouched. ⚠️ ov3 dead code only — that cost is shared with Simorgh and runs in puzzles, where ov41 evicts the ov5 cave."
  address: 0x021EC57C
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # the cost's four-state shape and its hardcoded param
    assert h.bytes_at(0x021EC59C, 4, 'ov3') == bytes.fromhex('00206082'), \
        'state 0 no longer zeroes the pass index desc[+0x12]'
    assert h.u16(0x021EC5B6, 'ov3') == 0x2200, 'the cost no longer passes param 0 in r2'
    assert h.bl_target(0x021EC5B8, 'ov3') == 0x0224B9F0, 'the cost no longer arms 0x0224B9F0'
    assert h.bytes_at(0x021EC5F8, 4, 'ov3') == bytes.fromhex('608a401c'), \
        'state 2 no longer increments desc[+0x12]'
    # 0x0224B9F0 is setup only: mode 8, then param/callback/side/cid
    assert h.bytes_at(0x0224B9F4, 6, 'ov3') == bytes.fromhex('0825e5642265'), \
        '0x0224B9F0 no longer stores mode 8 and the param'
    # the callback pins candidates to the hand, then probes the criteria row
    assert h.u16(0x0220660C, 'ov3') == 0x290B, 'the callback lost its `cmp r1,#0xB` hand gate'
    assert h.bl_target(0x02206654, 'ov3') == 0x02243FE0, 'the callback no longer probes criteria'
    # the single loader of the callback literal, and the literal itself
    w = h.u16(0x021EC5B4, 'ov3')
    assert w & 0xF800 == 0x4800, '0x021EC5B4 is not an LDR literal'
    slot = ((0x021EC5B4 + 4) & ~3) + (w & 0xFF) * 4
    assert slot == 0x021EC644, f'the callback literal slot moved to {slot:#010x}'
    assert h.u32(slot, 'ov3') == 0x022065F9, 'the stock callback literal drifted'
    import struct as _s
    img, base_ = env.image('ov3'), 0x02141700
    n = 0
    for o in range(0, len(img) - 1, 2):
        v = _s.unpack_from('<H', img, o)[0]
        if v & 0xF800 != 0x4800:
            continue
        if ((base_ + o + 4) & ~3) + (v & 0xFF) * 4 == 0x021EC644:
            n += 1
    assert n == 1, f'{n} instructions load the callback literal, expected exactly 1'
    # the membership-list-A clamp: param 0 -> r4 = 0, anything else -> r4 = 1
    assert h.bytes_at(0x02243BFA, 4, 'ov3') == bytes.fromhex('002c00d0'), \
        'the list-A `cmp r4,#0` param clamp drifted'
    assert h.u16(0x02243EEC, 'ov3') == 0x2400 and h.u16(0x02243EC6, 'ov3') == 0x2401, \
        'the r4 = 0 / r4 = 1 leaves changed'

- id: "dispatch.gy_offer_call_chain"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** HOW A GRAVEYARD EFFECT GETS OFFERED, end to end. The chain, closed this session by disassembly and a whole-image call-graph walk:
  GY-action registry row {cid, zone 0x0E, 0x0224C591, 0x0224C6C1}
    -> 0x0224C590(side, cid, ref)   memsets a 0x24-B descriptor and fills it in:
       desc[+0]=cid, desc[+2]=side, desc[+5]=2 (CLASS 2), desc[+3]=0x0E (ZONE GY),
       desc[+4]= the EVENT CODE read from the pending-event queue 0x0229A37C,
       desc[+0xC]= the packed ref
    -> 0x021EC740(desc, other_desc)
    -> 0x021EDA14                   the COMMIT body (0x021EDA08 is a 3-instruction
                                    thunk: `ldr r3,=0x021EDA15 ; movs r2,#0 ; bx r3`)
    -> 0x0224AD94(desc, arg)        the cls2 condition invoker
    -> find_event_handler 0x0224A118 -> record[+0x0C]
*** ONLY FOUR SITES IN THE WHOLE OVERLAY build a class-2 descriptor (`movs rX,#2 ; strb rX,[desc,#5]`): 0x021EC894, 0x021EC998, 0x0224C5E6 and 0x0224C744. The last two are 0x0224C590 / 0x0224C6C0 and both hardcode desc[+3] = 0x0E. Neither has a single BL caller anywhere in ov3 — they exist solely as the registry's function pointers (dispatch.gy_action_registry), which is why a missing row is fatal and invisible.
*** A GY EFFECT IS EVENT-DRIVEN, NOT A CAPABILITY BIT. The per-card capability enumerator 0x0224BC40(side, zone, index) dispatches on zone through a 16-entry halfword jump table at 0x0224BCD2 (base 0x0224BCD4): zones 0..4 -> 0x0224BCF2, 5..0x0A -> 0x0224BEB4, 0x0B (HAND) -> 0x0224BEFC — which is where the hand-SS BST 0x0225E51C is consulted, at 0x0224C026 — and 0x0C..0x0F (deck / GY / banished) -> 0x0224C0E6, whose entire body is two cid-BLIND calls (0x0224B7CC, 0x0224B838). So there is no 'this GY card can act' bit to set; the offer must arrive as an event."
  address: 0x0224C590
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # the four class-2 descriptor builders, and the two that mean 'from the GY'
    for site in (0x0224C5E4, 0x0224C742):
        assert h.u16(site, 'ov3') & 0xF8FF == 0x2002, f'{site:#010x} no longer `movs rX,#2`'
        w = h.u16(site + 2, 'ov3')
        assert w & 0xF800 == 0x7000 and (w >> 6) & 0x1F == 5, \
            f'{site + 2:#010x} no longer stores the class selector at desc[+5]'
    for site in (0x0224C5E8, 0x0224C746):
        assert h.u16(site, 'ov3') & 0xF8FF == 0x200E, \
            f'{site:#010x} no longer loads zone 0x0E'
        w = h.u16(site + 2, 'ov3')
        assert w & 0xF800 == 0x7000 and (w >> 6) & 0x1F == 3, \
            f'{site + 2:#010x} no longer stores the zone at desc[+3]'
    # the chain's BLs
    assert h.bl_target(0x0224C60A, 'ov3') == 0x021EC740, '0x0224C590 no longer calls 0x021EC740'
    assert h.bl_target(0x0224C76A, 'ov3') == 0x021EC740, '0x0224C6C0 no longer calls 0x021EC740'
    assert h.bl_target(0x0224AD9A, 'ov3') == 0x0224A118, 'the invoker lost find_event_handler'
    # COMMIT 0x021EDA08 is a thunk into 0x021EDA14, which is what 0x021EC740 reaches
    assert h.bytes_at(0x021EDA08, 6, 'ov3') == bytes.fromhex('014b00221847'), \
        'the COMMIT thunk drifted'
    assert h.u32(((0x021EDA08 + 4) & ~3) + 4, 'ov3') == 0x021EDA15, \
        'the COMMIT thunk no longer targets 0x021EDA14'
    for site in (0x021EDC06, 0x021EDC60, 0x021EDC8C):
        assert h.bl_target(site, 'ov3') == 0x0224AD94, \
            f'the COMMIT body call to the cls2 invoker at {site:#010x} drifted'
    # the zone jump table that proves the GY arm is cid-blind
    tbl = [0x0224BCD4 + h.u16(0x0224BCD2 + 2 * z, 'ov3') for z in range(16)]
    assert tbl[0x0B] == 0x0224BEFC, f'the HAND arm moved to {tbl[0x0B]:#010x}'
    assert tbl[0x0C] == tbl[0x0D] == tbl[0x0E] == tbl[0x0F] == 0x0224C0E6, \
        'the deck/GY/banished arm moved'
    assert h.bl_target(0x0224C026, 'ov3') == 0x0225E51C, \
        'the HAND arm no longer consults the hand-SS dispatch'
    for site, tgt in ((0x0224C0E6, 0x0224B7CC), (0x0224C0F2, 0x0224B838)):
        assert h.bl_target(site, 'ov3') == tgt, \
            f'the GY arm call at {site:#010x} is no longer {tgt:#010x}'

- id: "dispatch.cls2_invoker_is_not_an_enumerator"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** CORRECTS A MIS-READING THAT COST A SESSION. LR = 0x0224AE13 (seen at the entry of a cls2 condition under GDB) is the return address of the `blx r2` at 0x0224AE10 INSIDE 0x0224AD94 — and 0x0224AD94 ENUMERATES NOTHING. It is a single-descriptor query: find_event_handler(desc), then `blx [record+0x0C]` if that slot is non-zero. With no record found it falls to 0x0224AE3E with r6 still 1 and returns 1 = ACCEPT (event.admission_accepts_recordless), so a missing record can never SUPPRESS an offer. If a card's condition never fires, the fault is strictly upstream — see dispatch.gy_offer_call_chain.
