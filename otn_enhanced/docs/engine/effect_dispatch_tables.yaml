- id: "ai.per_cid_knowledge_lists"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE FOUR SORTED-u16 LISTS THAT DECIDE WHETHER THE CPU KNOWS HOW TO USE A CARD, with their exact extents. All four live inside the per-cid AI switch 0x022393CC (prologue 0xB5F8, five BL callers: 0x0223983E, 0x02239922, 0x022399AC, 0x0224C8BE, 0x0226A722) and are all queried through the ARM9 binary search 0x02022E14 contains_sorted_s16(r0=cid, r1=list, r2=count) -- the routine PC sampling saw hot ONLY on the AI's turn (15 samples vs 0 at baseline, round 2). 0x0227113C x19 @0x022395BA = opponent's-turn usables; 0x02271162 x21 @0x02239738 = destruction responses; 0x0227118C x22 @0x0223989E (inside the leaf 0x02239898, callers 0x02239B9E / 0x02239C3E) = chain-related; 0x022711B8 x48 @0x0223961E = summon responses. THEY ARE PACKED BACK TO BACK IN THAT ADDRESS ORDER and run 0x0227113C..0x02271218, where the ritual-pair table begins -- so a list CANNOT grow without moving its neighbour, while editing an entry in place is free (each count is a `movs r2,#imm8` at the read site). *** DO NOT CONFUSE THEM WITH THEIR NEIGHBOURS 0x0227109C / 0x022710B2 / 0x022710CA / 0x022710E2 / 0x02271104, read at 0x02234EBA / 0x02234EA6 / 0x02234ECE / 0x02234E7E / 0x02234E92 -- those belong to 0x02234E78, the shared card-effect PARAM PROVIDER (see dispatch.param_provider_internal_hook), not to the AI. One contiguous data block, two unrelated consumers. *** CONSEQUENCE FOR DONOR PATCHES: a newly authored card's cid is in none of these four lists and in none of the 164 cids of the reactive rule table 0x02275510, so the CPU has no special-case knowledge of it and will only ever play it through the generic main-phase path."
  address: 0x0227113C
  oracle: "ov3"
  sources: [notes/dueling-ai-findings.md, notes/steam-synchron-findings.md]
  proof: |
    assert h.u16(0x022393CC, 'ov3') == 0xB5F8, 'the per-cid AI switch prologue drifted'
    assert h.u16(0x02234E78, 'ov3') == 0xB5F8, 'the param provider prologue drifted'
    spec = ((0x022395BA, 0x0227113C, 0x13, 4, 6),
            (0x0223961E, 0x022711B8, 0x30, 4, 6),
            (0x02239738, 0x02271162, 0x15, 4, 6),
            (0x0223989E, 0x0227118C, 0x16, 2, 4))
    for site, base, count, coff, boff in spec:
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x4800, f'{site:#x} is not ldr r1,[pc,#imm]'
        assert h.u32(((site + 4) & ~3) + (w & 0xFF) * 4, 'ov3') == base,                      f'the list literal at {site:#x} moved'
