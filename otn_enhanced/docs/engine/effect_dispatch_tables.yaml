    assert h.bytes_at(0x021FEBB0, 4, 'ov3') == bytes.fromhex('0b2a24d1'), \
        'Simorgh no longer branches on zone == 0x0B (hand)'
    # and both of its cls2 records share that one condition
    recs = [(h.u32(0x02275C04 + i * 24, 'ov3'), h.u32(0x02275C04 + i * 24 + 0xC, 'ov3'))
