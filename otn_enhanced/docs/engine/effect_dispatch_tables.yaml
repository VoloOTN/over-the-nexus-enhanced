- id: "dispatch.criteria_word_level_field"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The criteria registry word's byte at bits 23:16 is the LEVEL filter, laid out [op:2 @bits7:6][level:4 @bits5:2][flag:2 @bits1:0]. op 0 = 'Level N' exactly, 1 = 'Level N or higher', 2 = 'Level N or lower'; level 0 = no level constraint. This completes the criteria word alongside dispatch.criteria_word_race_attribute (top byte = race<<3 | attribute). Decoded by cross-checking every registry row against its ygoprodeck text: 177 rows carry both a nonzero level field and a 'Level N (or higher/lower)' phrase, and the decode agrees with the text on ALL 177 with ZERO disagreements, spanning op 0 (levels 1,2,3,4,5,7,8), op 1 (levels 4,5,7) and op 2 (levels 2,3,4,5,6,7). Worked anchors: Decoy Dragon 0x1C4F 0x085D0002 = Dragon / 'Level 7 or higher' (0x5D -> op1 lvl7); Chaos Goddess 0x2273 0x02550002 = DARK / 'Level 5 or higher' (0x55 -> op1 lvl5); Cyberdark Horn 0x1AAE 0x088D0002 = Dragon / 'Level 3 or lower' (0x8D -> op2 lvl3); Dragonic Tactics 0x20E6 0x08200002 = Dragon / 'Level 8' exactly (0x20 -> op0 lvl8). The low 2 bits track the zone family (set on GY-reading rows, clear on hand/Deck rows) but were NOT independently decoded — copy them from a same-zone donor row rather than synthesising them."
  address: 0x022713CC
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    import re, json
    B, CNT = 0x022713C4, 0x56C
    rows = [(h.u16(B + i * 12, 'ov3'), h.u32(B + i * 12 + 8, 'ov3'))
            for i in range(CNT)]
    names = json.load(open('scratch/cid_to_name.json', encoding='utf-8'))
    descs = {c['name']: c['desc'] for c in json.load(
        open('scratch/ygoprodeck_cache.json', encoding='utf-8'))['data']}
    RX = re.compile(r'Level (\d+) or (higher|lower)|Level (\d+)\b', re.I)
    agree = 0
    for cid, crit in rows:
        byte = (crit >> 16) & 0xFF
        op, lvl = byte >> 6, (byte >> 2) & 0xF
        if not lvl:
            continue
        d = descs.get(names.get(str(cid), ''))
        if not d:
            continue
        m = RX.search(d)
        if not m:
            continue
        if m.group(1):
            t = (1 if m.group(2).lower() == 'higher' else 2, int(m.group(1)))
        else:
            t = (0, int(m.group(3)))
        assert (op, lvl) == t, f'{cid:#x} crit {crit:#010x} decodes {(op, lvl)} vs text {t}'
        agree += 1
    assert agree >= 170, f'only {agree} level-bearing rows cross-checked'
    # the four worked anchors
    def crit_of(cid):
        return {c for x, c in rows if x == cid}
    assert 0x085D0002 in crit_of(0x1C4F), 'Decoy Dragon criteria drifted'
    assert 0x02550002 in crit_of(0x2273), 'Chaos Goddess criteria drifted'
    assert 0x088D0002 in crit_of(0x1AAE), 'Cyberdark Horn criteria drifted'
    assert 0x08200002 in crit_of(0x20E6), 'Dragonic Tactics criteria drifted'

