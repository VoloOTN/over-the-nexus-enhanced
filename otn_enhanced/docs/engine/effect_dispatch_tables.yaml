- id: "dispatch.cls_tables"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The cls dispatch tables are THREE separate sorted arrays of 24-byte records, each record laid out CID-FIRST: {+0x00 cid, +0x04..+0x14 five Thumb callback slots}. Geometry (as used by the shipped patches): cls2 base 0x02275C04 count 0x2B9 (697); cls0 base 0x0227E64C count 0x51A (1306); cls1 base 0x022860D4 count 0x535 (1333). Each is independently sorted by cid, which is the binary-search precondition. Anchored externally: armory_arm.py's shipped burn chain starts at cls1[0x1F33] +04 = 0x022215DD, and cls1 record 938 is exactly that. ⚠️ CORRECTION: an earlier version of this fact said Mermaid Archer 0x1FFC (the Sea Lancer donor) is 'records-free'. THAT WAS WRONG, and it misdirected several rounds of Sea Lancer analysis. It was true only of cls0/cls1/cls2 — the search was run before cls3 was discovered (see dispatch.cls_table_selector) and was never re-run. She has a full record at cls3[527]; see dispatch.donor_cls3_record. ALWAYS search all FOUR tables."
  address: 0x02275C04
  oracle: "ov3"
  sources: [sea-lancer-findings, otn-lp-change-table-burn]
  proof: |
    for name, base, cnt in (('cls2', 0x02275C04, 0x2B9),
                            ('cls0', 0x0227E64C, 0x51A),
                            ('cls1', 0x022860D4, 0x535)):
        cids = [h.u32(base + i * 24, 'ov3') for i in range(cnt)]
        assert all(cids[i] <= cids[i + 1] for i in range(cnt - 1)), \
            f'{name} is not sorted by cid at +0x00'
        assert 0x0B00 < min(cids) and max(cids) < 0x2600, \
            f'{name} +0x00 column out of cid range: {min(cids):#x}..{max(cids):#x}'
        # the five callback slots are Thumb ov3 pointers or NULL
        for i in range(cnt):
            for k in (4, 8, 0xC, 0x10, 0x14):
                v = h.u32(base + i * 24 + k, 'ov3')
                assert not v or (v & 1 and env.oracle_name(v & ~1) == 'ov3'), \
                    f'{name}[{i}]+{k:#x} = {v:#x} is not a Thumb ov3 pointer'
    # the external anchor that caught the earlier mis-framing
    hit = [i for i in range(0x535) if h.u32(0x022860D4 + i * 24, 'ov3') == 0x1F33]
    assert hit == [938], f'Armory Arm cls1 record moved: {hit}'
    assert h.u32(0x022860D4 + 938 * 24 + 4, 'ov3') == 0x022215DD, \
        'cls1[0x1F33]+04 no longer matches the shipped armory_arm anchor'

- id: "dispatch.step_table_replacement"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The 'instead of being destroyed' REPLACEMENT dispatcher is step 5 of a 13-entry function-pointer step table @0x0228EF84, driven by 0x0225CD92 (step index from [r4,#0x58], bounds-checked 1..0xC, then blx). Step 5 = 0x0225C2B8, whose per-cid switch holds exactly 8 cids and every one of them has an 'instead' replacement clause: 0x1B39 Great Shogun Shien, 0x1FC6 Defender the Magical Knight, 0x1FC9 Power Tool Dragon, 0x1FFC Mermaid Archer, 0x2073 Earthbound Immortal Cusillu, 0x2172 Dragunity Javelin, 0x219B Underground Arachnid, 0x226F Black-Winged Dragon. The 0x1FFC/0x219B shared leaf @0x0225C3B2 sweeps side 0..1 x zone 0..10 calling 0x0225C288 and records the found equipped monster as the replacement victim."
  address: 0x0225C2B8
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    assert h.u32(0x0228EF98, 'ov3') == 0x0225C2B9, 'step-5 pointer retargeted'
    # the eight switch members must still be loadable literals inside the host
    lo, hi = 0x0225C2B8, 0x0225C700
    seen = set()
    for a in range(lo, hi, 2):
        w = h.u16(a, 'ov3')
        if (w & 0xF800) == 0x4800:
            t = ((a + 4) & ~3) + (w & 0xFF) * 4
            if lo - 0x400 <= t < hi + 0x400:
                v = h.u32(t, 'ov3')
                if 0x0D00 <= v <= 0x2500:
                    seen.add(v)
    want = {0x1B39, 0x1FC6, 0x1FC9, 0x1FFC, 0x2073, 0x2172, 0x219B, 0x226F}
    assert seen == want, f'replacement switch membership drifted: {sorted(hex(x) for x in seen ^ want)}'

- id: "dispatch.step_table_target_select"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The equip-target SELECTOR is step 5 (NOT 7 — that index was miscounted; the address was always right) of an 11-entry NULL-terminated step table @0x0228E1B8, driven by 0x02253834 (state block 0x0229DD94, step index at +4, advanced on success). Step 5 = 0x0224FA4C; its switch funnels the three 'select a card then equip it to this card' cids — 0x1FC9 Power Tool Dragon, 0x1FFC Mermaid Archer, 0x219B Underground Arachnid — into one shared leaf @0x0225028E, which loops side 0..1 x zone 5..9 calling the per-cid target predicate 0x021A3930(side, zone, packed_ref, cid), ORs a bit per legal target into [sp,#0x44], and hands the mask to 0x02251040. Retargeting a donor's selection therefore means replacing 0x021A3930's verdict, not editing the leaf."
  address: 0x0224FA4C
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    assert h.u32(0x0228E1CC, 'ov3') == 0x0224FA4D, 'step-7 pointer retargeted'
    assert h.bl_target(0x022502BC, 'ov3') == 0x021A3930, 'target predicate call retargeted'
    assert h.bl_target(0x0225031E, 'ov3') == 0x02251040, 'mask consumer call retargeted'
    # the three equip-to-self cids must still share the leaf at 0x0225028E
    assert h.u32(0x02250424, 'ov3') == 0x00001FFC, 'Mermaid Archer literal drifted'
    assert h.u32(0x02250428, 'ov3') == 0x0000219B, 'Underground Arachnid literal drifted'

- id: "dispatch.ss_from_list_position_mode"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE SUMMON POSITION OF A SPECIAL-SUMMON-FROM-A-LIST-ZONE RESOLVER IS A REGISTER, NOT A DATA FIELD. cls-slot resolver 0x02207191 is a per-cid ORDERED COMPARE TREE (cids encoded as pool-literal bases, so it is UNGREPPABLE) that initialises r4 = 1 and r5 = 2 and then ends, on every path, in bl 0x02204730(desc, r4, r5) -- the machine that actually summons the recorded pick. The per-cid arms do nothing but OVERRIDE r4/r5, so an unlisted cid reaches the tail with the DEFAULTS. r5 is the position mode, and the tree was executed symbolically to read it off: Silent Doom 0x14F7 -> r5 = 1, and Swing of Memories 0x1C58, Destiny Hero - Captain Tenacious 0x1A03 and Supervise 0x20F3 -> r5 = 2. Silent Doom is the ONLY one of the four whose printed text names a position (in face-up DEFENSE Position); the other three all read simply Special Summon it / that target. So r5 = 1 is Defense and r5 = 2 is player-chooses, and the walk reproducing exactly the one card that differs is what makes the reading credible rather than a guess. CONSEQUENCE: a donor given this resolver inherits r5 = 2 (free choice), which is what an unqualified Special Summon it wants -- no code needed, and that is CONFIRMED IN-GAME (2026-08-21): Azure-Eyes Silver Dragon on this resolver prompts the player for the revived monster battle position. NOTE the thumb.stack_based_switch footgun does NOT apply here: every base in the routing path is a pc-relative literal, never an [sp,#n] slot, which is why a register-only walk is sound for THIS tree specifically. Check that before trusting a simulator on any other per-cid switch."
  address: 0x02207190
  oracle: "ov3"
  sources: [notes/azure-eyes-silver-dragon-findings.md]
  proof: |
    # the tail every path funnels into, and the r4/r5 defaults set in the prologue
    assert h.u16(0x02207198, "ov3") == 0x2401, "r4 default is no longer movs r4,#1"
    assert h.u16(0x0220719A, "ov3") == 0x2502, "r5 default is no longer movs r5,#2"
    assert h.bytes_at(0x022072DA, 6, "ov3") == bytes.fromhex("301c211c2a1c"), "the tail arg setup drifted"
    lo = h.u16(0x022072E0, "ov3")
    hi = h.u16(0x022072E2, "ov3")
    assert lo & 0xF800 == 0xF000 and hi & 0xF800 == 0xF800, "the tail is not a BL"
    off = ((lo & 0x7FF) << 12) | ((hi & 0x7FF) << 1)
    if off & (1 << 22):
        off -= (1 << 23)
    assert 0x022072E0 + 4 + off == 0x02204730, "the tail no longer calls 0x02204730"
    # the four cards whose printed text pins the r5 reading all still own their rows
    cls0 = [(h.u32(0x0227E64C + i * 24, "ov3"), h.u32(0x0227E64C + i * 24 + 4, "ov3"))
            for i in range(0x51A)]
    for cid in (0x14F7, 0x1C58):
        assert (cid, 0x02207191) in cls0, f"{cid:#06x} no longer uses resolver 0x02207191"
    cls1 = [(h.u32(0x022860D4 + i * 24, "ov3"), h.u32(0x022860D4 + i * 24 + 4, "ov3"))
            for i in range(0x535)]
    assert (0x1A03, 0x02207191) in cls1, "Captain Tenacious no longer uses resolver 0x02207191"

