  claim: "0x0223CB65 SELECTS FROM THE HAND and 0x0223CAD9 SELECTS FROM THE DECK -- not the other way round, which matters because the two are adjacent in the table and Darkflare Dragon's cost reads one of each. THE INTERNAL CONTROL IS DARK GREPHER 0x1D89, which owns two adjacent rows with the SAME word 0x02000002 and different handlers: row 673 {0x0223CB19, 'You can discard 1 DARK monster'} and row 674 {0x0223CAD9, 'send 1 DARK monster FROM YOUR DECK to the GY'}. Table-wide the split is clean: all 25 rows on 0x0223CB65 belong to cards that send or discard from the HAND (Archlord Zerato 0x1758, Fabled Soulkius 0x202C, Vanguard of the Dragon 0x1FFE, Genesis Dragon 0x1F2A, Herald of Perfection, Trade-In ...) and all 66 rows on 0x0223CAD9 belong to cards that read the DECK (Foolish Burial 0x1474, Reinforcement of the Army, Sangan, Dragon Ravine 0x2359, Dragunity Tribus 0x20C6, Armageddon Knight ...), with ZERO crossovers either way. 0x0223CB19 is the same hand family as 0x0223CB65 (dispatch.criteria_zone_is_the_handler pins it via Dark Simorgh), differing in destination rather than source. PRACTICAL USE: Darkflare's two Dragon send rows are {0x0223CB65, 0x08000002} and {0x0223CAD9, 0x08000002}, and BOTH already ship verbatim in the ROM -- the first on Vanguard of the Dragon crit[885] and Genesis Dragon crit[792], the second on Dragon Ravine crit[1249] ('send 1 Dragon monster from your Deck to the GY'). ⚠️ BUT THE HANDLER ONLY DECIDES THE ZONE ON THE LIST-ZONE PATH (0x02243FA8 / 0x0219C430, which dispatches through the stride-12 table at 0x022713C4). On the 0x0224B9F0 mode-8 path the zone is hardcoded in the CALLBACK instead -- see dispatch.selection_param_and_zone -- and the only callback in the ROM, 0x022065F9, pins candidates to the HAND with `cmp r1,#0xB` @0x0220660C. So a DECK selection cannot be armed through 0x0224B9F0 at all; every native Deck read runs from a resolver such as 0x02208DD5 (Foolish Burial / Dragunity Tribus / Dark Grepher / Dragon Ravine) via the list-zone enumerator."
