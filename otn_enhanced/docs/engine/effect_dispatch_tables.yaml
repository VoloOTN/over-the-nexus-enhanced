- id: "dispatch.criteria_aux_is_has_set_code_index"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** A CRITERIA ROW'S `aux` (row+0x02) IS LITERALLY THE has_set_code INDEX -- the whole chain, read off the disassembly rather than inferred from correlation. *** The Deck-search handler 0x0223CAF4(r0 = row, r1 = side) is 14 halfwords: `adds r3,r0,#0 ; movs r0,#2 ; ldrsh r2,[r3,r0] ; str r2,[sp,#8] ; ldr r2,[r3,#8] ; str r2,[sp] ; str r0,[sp,#4] ; adds r0,r1,#0 ; ldrh r1,[r3] ; ldr r2,=0x0223C825 ; add r3,sp,#8 ; bl 0x0223BC3C`. So it hands the enumerator (side, row.cid, the PREDICATE 0x0223C825, a one-element list holding aux, [sp] = the criteria word, [sp+4] = type 2). The predicate 0x0223C824 is five instructions: it loads the candidate's card word and the list head, masks the candidate to 14 bits (`lsls #0x12 ; lsrs #0x12`) and TAIL-CALLS the pool word at 0x0223C834 = 0x020240D9. And 0x020240D8 is has_set_code(r0 = cid, r1 = code): `cmp r1,#0x70 ; blt ; movs r0,#0 ; pop` else `lsls r2,r1,#2 ; ldr r1,=0x0209D0D8 ; ldr r1,[r1,r2] ; blx r1`. THREE CONSEQUENCES. (1) aux is read with LDRSH, so 0xFFFF is -1 and means 'no set-code restriction' -- which is why most rows carry it. (2) aux is bounded to < 0x70 = 112, exactly the length of the pointer table, so ANY index in 0..0x6F is a legal aux. (3) The set-code tables are reached from ov3 ONLY through this path plus the criteria engine's sibling predicates: sweeping arm9 + ov3 for two-halfword BL/BLX to 0x020240D8 finds ten sites, eight of them in the criteria module 0x0223F53A..0x022435CA taking r1 from a row's aux list, and the other two in the deck-editor archetype filter (0x0202A358, 0x0202A3F0). So 'no criteria row carries aux N' plus 'no pool reference to thunk N' is a SOUND test that set code N is dead -- which is what licenses setcode.inert_2a_table."
  address: 0x0223CAF4
  oracle: "ov3"
  sources: [notes/ninja-grandmaster-hanzo-findings.md, otn_enhanced/cards/ninja_grandmaster_hanzo.py]
  proof: |
    # the handler reads aux with LDRSH and passes the set-code predicate
    assert h.u16(0x0223CAFA, 'ov3') == 0x5E1A, '0x0223CAFA is not ldrsh r2,[r3,r0]'
    assert h.u32(0x0223CB14, 'ov3') == 0x0223C825, 'the predicate pool word moved'
    assert h.bl_target(0x0223CB0C, 'ov3') == 0x0223BC3C, 'the enumerator call moved'
    # the predicate tail-calls has_set_code
    assert h.u32(0x0223C834, 'ov3') == 0x020240D9, '0x0223C824 no longer tail-calls has_set_code'
    assert h.u16(0x0223C832, 'ov3') == 0x4718, '0x0223C832 is not bx r3'
    # has_set_code: bound, then dispatch through the pointer table
    assert h.u16(0x020240DA, 'arm9') == 0x2970, 'has_set_code no longer does cmp r1,#0x70'
    assert h.u16(0x020240E2, 'arm9') == 0x008A, 'has_set_code no longer does lsls r2,r1,#2'
    assert h.u32(0x020240EC, 'arm9') == 0x0209D0D8, 'the has_set_code pointer-table literal moved'
    assert h.u16(0x020240E8, 'arm9') == 0x4788, 'has_set_code no longer does blx r1'
    # every slot in 0..0x6F is a plausible thunk pointer -- the table really is 112 long
    for i in range(0x70):
        v = h.u32(0x0209D0D8 + i * 4, 'arm9')
        assert 0x02000000 <= v < 0x020A0000 and (v & 1), \
            f'has_set_code[{i:#04x}] = {v:#010x} is not a Thumb pointer'

- id: "dispatch.row_param_provider_call_sites"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** WHERE TO INTERCEPT THE CRITERIA ROW SELECTOR, AND WHAT IS LIVE THERE. *** The row a card reads is `leftmost-row-for-this-cid + r4`, and r4 comes from the `param` handed to 0x02243B9C -- LIST A's rule is `param != 0`, LIST B's is `param & 0x10000000` (dispatch.two_row_criteria_is_list_b_plus_l2). Most steps obtain that param from ONE shared provider, 0x02234E78(desc), which has SIXTY `bl` sites in overlay 3. ⚠️⚠️ CORRECTED 2026-08-30 (card.ninja_grandmaster_hanzo_clause2): this entry used to say 'THE TWO THAT MATTER' and name only 0x02208028 + 0x021F0858. THERE ARE THREE, and the omitted one is the one that decides what the player actually sees. Building to the old two-site reading ships a card that offers the WRONG ROW's cards and still passes verify(). The three, all keeping the EVENT DESCRIPTOR in r5:\\n  0x021F0858  slot3 0x021F0820    -> 0x02243FE0  the activation CONDITION\\n  0x02208028  resolver 0x02207EF4 -> 0x02243FA8  a GUARD only: `cmp r0,r4 ; blt` -> bail with code 0x78\\n  0x022080D6  resolver 0x02207EF4 -> 0x0219C430  *** THE PROMPT ***\\nThe first two are the byte-identical `adds r0,r5,#0 / bl / adds r2,r0,#0 / ldrh r1,[r5]` shape. The third is NOT that shape -- it is `adds r0,r5,#0 ; bl 0x02234E78 ; adds r3,r0,#0 ; ldrh r2,[r5] ; adds r0,r6,#0 ; adds r1,r4,#0 ; bl 0x0219C430`, which is why a shape-matching scan misses it. 0x0219C430(side, n, cid, param) stashes the pair (`str r2,[sp] ; str r3,[sp,#4]`) and re-reads it at 0x0219C47C `bl 0x02243FA8` -- and THAT call is what builds the picker list. So 0x02208028 only decides whether the resolver errors out; 0x022080D6 decides the CONTENTS.\\n*** THE PAYOFF: because r5 is the descriptor and dispatch.cls_table_selector gives its layout as {+0x00 u16 cid, +0x04 u8 EVENT CODE, +0x05 u8 table selector, ...}, a cid-scoped trampoline on these sites can select the criteria row FROM THE EVENT CODE -- `ldrh r1,[r0]` for the cid and `ldrb rX,[r0,#4]` for the code (7 Normal / 8 Flip / 9 Special summon