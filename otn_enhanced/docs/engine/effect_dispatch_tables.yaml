    assert h.bl_target(0x02023112, 'arm9') == 0x0202ABF8, 'the card-type accessor moved'
    assert h.u16(0x02023116, 'arm9') == 0x380F, 'subs r0,#0x0F drifted'
    assert h.u16(0x02023118, 'arm9') == 0x2805, 'cmp r0,#5 drifted'
    assert h.u16(0x0202312E, 'arm9') == 0x2001, 'the TRUE arm is not movs r0,#1'
    assert h.u16(0x02023132, 'arm9') == 0x2000, 'the FALSE arm is not movs r0,#0'
    tbl = h.bytes_at(0x02023128, 6, 'arm9')
