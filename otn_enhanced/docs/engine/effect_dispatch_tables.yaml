arena_lo values appear across the sample (0x0239A120 pre-cave, 0x0239E120 post-cave), which independently confirms the raise takes effect. So ~242 KB of the arena is unused at the observed peak; RESERVE 0x10000 (64 KB) would still leave 178 KB spare above it. ⚠️ 37.3 KB is a measured LOWER BOUND on the true peak -- the sample is mid-turn normal duels, not duel load or tag/turbo modes -- so the margin carries the risk, not the sample. ⚠️ Growing RESERVE moves only the cave's CEILING; existing CAVE_* slots keep their addresses and no patch needs editing. But it is shared state (every ROM's ov5 length and arena-lo literal change) and env.py's and check_allocations.py's OV5_END WERE hardcoded copies of the derived ceiling; on 2026-09-02 both were changed to DERIVE it -- env._ov5_reserve() parses RESERVE out of ov5_cave.py and check_allocations imports env.OV5_END -- so the ceiling now has one source. A stale copy was silent and nasty: cave addresses above the old ceiling fall outside oracle_name's ranges, so ov5 proofs report UNVERIFIED instead of reading the image, and the allocation guard stops flagging out-of-region slots. *** THE 64 KB CAVE IS NOT YET IN-GAME CONFIRMED: the geometry, the ledger and the whole shipped chain re-verify cleanly, but only a duel can confirm the smaller heap, and the rollback is this one constant."
  address: 0x02051ED8
  oracle: "arm9"
  sources: [notes/ov5-cave-capacity-findings.md, otn_enhanced/effects/ov5_cave.py]
  proof: |
    import ndspy.code, ndspy.rom, pathlib
    # the arena bounds, straight out of the region table
    assert h.u32(0x02051ED8, 'arm9') == 0x0239A120, 'the duel arena-lo literal moved'
    assert h.u32(0x02051EE0, 'arm9') == 0x023E0000, 'the duel arena-hi literal moved'
    # ov5_cave.py still derives everything from one RESERVE
    from otn_enhanced.effects import ov5_cave as C
    assert C.OV5_NATIVE_END == 0x0239A120, 'ov5 native end drifted'
    assert C.OV5_NEW_LEN == C.OV5_NATIVE_LEN + C.RESERVE, 'OV5_NEW_LEN is not derived'
    assert C.ARENA_LO_NEW == C.ARENA_LO_NATIVE + C.RESERVE, 'ARENA_LO_NEW is not derived'
    assert C.OV5_RAM_BASE + C.OV5_NATIVE_LEN == C.OV5_NATIVE_END, 'ov5 geometry drifted'
    # THE safety claim: exactly one aligned u32 copy of arena-lo in the whole ROM
    rp = pathlib.Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no data/over_the_nexus/working/rom.nds')
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    def count(data):
        return sum(1 for o in range(0, len(data) - 3, 4)
                   if int.from_bytes(data[o:o + 4], 'little') == 0x0239A120)
    total = sum(count(s.data) for s in ndspy.code.MainCodeFile(rom.arm9, 0x02000000).sections)
    ovs = rom.loadArm9Overlays()
    total += sum(count(ovs[k].data) for k in ovs)
