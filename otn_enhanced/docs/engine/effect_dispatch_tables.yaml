- id: "battle.atk_grant_two_pass_stacking"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "AN 'EQUIPPED' ATK GRANT IS APPLIED ONCE PER EQUIPPED CARD, NOT ONCE — and the per-cid grant leaves in 0x021B44C0 cannot tell the difference, so a donor that can only ever hold ONE equip hides it. The ATK-compute function 0x021B44C0 zeroes its modifier accumulator [sp+0xB0] at 0x021B44EE and reaches the per-cid grant leaves through a shared tail (each leaf sets r1 then branches to 0x021B7226, which does `[sp+0xB0] += r1`). That tail is entered by TWO KINDS OF PASS, told apart by the stat block in r7 -- but ⚠️ THE CONTRIBUTING PASSES ARE INDISTINGUISHABLE, and two attempts to tell them apart from a single GDB sample both failed IN OPPOSITE DIRECTIONS. Measured on Sea Lancer (donor Mermaid Archer 0x1FFC, leaf 0x021B75F8) by reading the card-instance ATK at three equip counts:   gate the leaf on [r7+0x3C] != 0  -> grant = N x 1000  (0/1/2 equips: 1300/2300/3300)   gate the leaf on [r7+0x3C] == 0  -> grant = 0         (0/1/2 equips: 1300/1300/1300) So EVERY pass that actually reaches the stored ATK has [r7+0x3C] != 0, and the [r7+0x3C] == 0 pass exists but its accumulator never reaches the card's ATK. A single-sample read of the stat block (one hit showing [r7+0x3C] = a card-instance pointer, another showing 0 with [r7+0x24] = the equipped card's packed word) invites a 'holder vs equip pass' story that the arithmetic does NOT support. Each pass owns a SEPARATE frame (SP differs, so [sp+0xB0] is at a different address) and the totals are summed upstream, which is why a flat `movs r1,#imm` leaf stacks. The native donor never exposed any of this because its text is 'you can only equip 1 monster at a time'. SO: do NOT try to discriminate passes -- COUNT them. Grant once per computation with a flag cleared exactly where 0x021B44C0 zeroes its own accumulator (0x021B44EC, `mov r4,#0 ; str r4,[sp,#0xB0]`), which by construction runs once per invocation. That is exact for every equip count, unlike dividing by the count (1000/3 = 999). See card.sea_lancer_e3."
  address: 0x021B44C0
  oracle: "ov3"
  sources: [sea-lancer-findings]
