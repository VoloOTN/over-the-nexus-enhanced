- id: "dispatch.cls_slot_roles"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "What the five cls callback slots DO (the decompiler's names main/sub/activation_cond/target_filter/resolution in data/over_the_nexus/decompiled/cards/ are guesses and THREE OF THE FIVE ARE WRONG). Roles, each read by a dedicated wrapper next to find_event_handler: +0x04 slot1 = RESOLVER, the effect body — invoked by 0x0224AEB8/0x0224AEEE (getter 0x0224AF10), DEFAULT 0 when absent, called once per resolution phase; present on ~99% of records (1132/1167 cls0, 1099/1104 cls1, 592/592 cls2). +0x08 slot2 = ON-FIELD CANDIDATE PREDICATE (desc, side, zone) -> bool — never called directly by a card; it is fed to generic sweepers that loop side 0..1 x zone 0..0xA (0x0224A8C0 one card, 0x0224A988 -> bitmask, 0x0224AA94 count, 0x0224AC54 zones 0..4, 0x0224ACD0 zones 5..0xA) and is SKIPPED for any zone whose record word [player + 0x44 + zone*0x14] has bit 0x200000 set. +0x0C slot3 = ACTIVATION CONDITION returning a CODE, not a bool: 0 = cannot activate, 1 = activatable but slot2 must find at least one legal target, >=2 = activatable unconditionally. Proven by 0x0224AD94, which runs slot3 and only consults slot2 when slot3 returned exactly 1. The two ubiquitous stubs live beside the dispatcher: 0x0224A114 'movs r0,#2; bx lr' (318 cls1 + 112 cls2 records) and 0x0224A110 'movs r0,#0; bx lr'. DEFAULT 1 when absent. +0x10 slot4 = COST / activation-procedure step. +0x14 slot5 = TARGET DECLARATION step. Both slot4 and slot5 are multi-step sub-machines driven by the counter at [0x0229AB7C] / [0x0229AAFC+0x7C], run by the activation state machine @0x02217F80 (slot4 block gated on descriptor[+7], slot5 block on descriptor[+8], then slot1 at 0x0221803E); each returns 0 or negative to ABORT the activation and positive to advance. Slots never share code: pooling all 2166 pointers across cls0/1/2, the five slot pools are pairwise DISJOINT and fall in five near-contiguous address blocks (slot2 0x021D81A0.., slot4 0x021E4D80.., slot3 0x021F01C0.., slot1 0x02204898.., slot5 0x02234D74..)."
  address: 0x0224AD94
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    for slot, wrapper, getter in ((0x04, 0x0224AEF6, 0x0224AF42),
                                  (0x10, 0x0224AE5E, 0x0224AE7A),
                                  (0x14, 0x0224AE92, 0x0224AEAE)):
        # wrapper: ldr r2,[r0,#slot] right after the find_event_handler call
        w = h.u16(wrapper, 'ov3')
        assert (w & 0xF800) == 0x6800 and ((w >> 6) & 0x1F) * 4 == slot, \
            f'slot {slot:#x} invoke wrapper no longer loads [rec,#{slot:#x}]'
        g = h.u16(getter, 'ov3')
        assert (g & 0xF800) == 0x6800 and ((g >> 6) & 0x1F) * 4 == slot, \
            f'slot {slot:#x} getter no longer loads [rec,#{slot:#x}]'
    # 0x0224AD94: slot3 at +0x0C, then slot2 at +0x08 only when slot3 returned 1
    assert h.bl_target(0x0224AD9A, 'ov3') == 0x0224A118
    w = h.u16(0x0224AE06, 'ov3')
    assert (w & 0xF800) == 0x6800 and ((w >> 6) & 0x1F) * 4 == 0x0C, 'slot3 load moved'
    assert h.u16(0x0224AE14, 'ov3') == 0x2E01, "0x0224AD94 no longer tests slot3 == 1"
    w = h.u16(0x0224AE18, 'ov3')
    assert (w & 0xF800) == 0x6800 and ((w >> 6) & 0x1F) * 4 == 0x08, 'slot2 load moved'
    assert h.bl_target(0x0224AE26, 'ov3') == 0x0224A988, 'slot2 sweeper call retargeted'
    # the two constant slot3 stubs
    assert h.bytes_at(0x0224A110, 8, 'ov3') == bytes.fromhex('0020704702207047')
    # the five slot pools are pairwise disjoint across all three tables
    pools = [set(), set(), set(), set(), set()]
    for base, cnt in ((0x0227E64C, 0x51A), (0x022860D4, 0x535), (0x02275C04, 0x2B9)):
        for i in range(cnt):
            for si, k in enumerate((4, 8, 0xC, 0x10, 0x14)):
                v = h.u32(base + i * 24 + k, 'ov3')
                if v:
                    pools[si].add(v & ~1)
    assert sum(len(p) for p in pools) == 2166, \
        f'pointer population changed: {sum(len(p) for p in pools)}'
    for i in range(5):
        for j in range(i + 1, 5):
            assert not (pools[i] & pools[j]), \
                f'slot{i+1} and slot{j+1} now share {len(pools[i] & pools[j])} pointers'

- id: "dispatch.slot5_target_picker"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "slot5 (+0x14) is the TARGET-DECLARATION step, and its dominant template is the shared body 0x02234CA4(desc, r1, r2=prompt_code), reached from 361 cards through one-line thunks 'movs r2,#code; ldr r3,=0x02234CA5; bx r3'. Sub-step 0: count legal targets with 0x0224AA94 (which sweeps the board applying SLOT2); if 0 return 1 (succeed silently); otherwise show the prompt via 0x0219A818(side, code) and open the board cursor 0x0224BA34(side, cid, 0, 0x0224A8C1) — passing the SLOT2 single-card invoker 0x0224A8C0 as the picker's legality callback — then return 0 to yield. Sub-step 1: when 0x0224BBB0 reports the pick is finished, record it via 0x022347B0 and return 1. The per-card immediate is a PROMPT-STRING id, not an action: code 0x3A = 12 cards all worded 'send it to the Graveyard' (Ruthless Denial, NEX, Faustian Bargain, Mask Change), 0x4E = 12 cards all 'place that target on the top of the Deck / return it to the Deck' (Back to Square One, Phoenix Wing Wind Blast, Level Down!?), 0x4F = 5 cards all 'return that target to the Extra Deck' (De-Fusion, Contact Out, De-Synchro), 0x57 = 31 cards all 'return that target to the hand' (Compulsory Evacuation Device, Spiritualism, Relieve Monster). The ACTION itself lives in slot1. CONSEQUENCE for off-field selection: this template and slot2 only ever address the on-field board (side 0..1 x zone 0..0xA), so it CANNOT pick from a list zone. The banished/GY selectors use the OTHER slot5 template 0x02235604 (254 records), which instead calls the list-zone enumerator 0x02243FA8(side, cid, param) with param from 0x02234E78(desc); its sibling 0x02243FE0 is what Release from Stone's slot3 uses to test 'is there a legal banished card'. 0x02243F38/0x02243F60 dispatch through a stride-12 table at 0x022713C4/0x022713C8 indexed by container kind."
  address: 0x02234CA4
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    # the shared body and one thunk into it
    assert h.bytes_at(0x02234CA4, 6, 'ov3') == bytes.fromhex('f8b5051c141c')
    assert h.u32(0x02234D7C, 'ov3') == 0x02234CA5, 'thunk literal no longer targets body'
    assert h.bytes_at(0x02234D74, 6, 'ov3') == bytes.fromhex('014b00221847'), \
        'slot5 thunk shape changed'
    # sub-step 0 calls the slot2-based counter, then the picker with the slot2 invoker
    assert h.bl_target(0x02234CC4, 'ov3') == 0x0224AA94, 'slot5 target counter retargeted'
    assert h.bl_target(0x02234CF4, 'ov3') == 0x0219A818, 'slot5 prompt call retargeted'
    assert h.u32(0x02234D68, 'ov3') == 0x0224A8C1, \
        'picker no longer receives the slot2 invoker 0x0224A8C0 as its callback'
    assert h.bl_target(0x02234D1A, 'ov3') == 0x0224BA34, 'picker call retargeted'
    assert h.bl_target(0x02234D2A, 'ov3') == 0x0224BBB0, 'pick-finished call retargeted'
    # the off-field template and its list-zone enumerator
    assert h.bl_target(0x02235610, 'ov3') == 0x02234E78, '0x02235604 param call retargeted'
    assert h.bl_target(0x0223562E, 'ov3') == 0x02243FA8, '0x02235604 enumerator retargeted'
    assert h.bl_target(0x021F03D8, 'ov3') == 0x02243FE0, \
        'Release from Stone slot3 no longer calls the list-zone tester'
    # and 0x02235604 really is shared by the banished selectors of the study set
    for cid in (0x1C95, 0x231A):
        row = [i for i in range(0x51A) if h.u32(0x0227E64C + i * 24, 'ov3') == cid]
        assert row, f'cls0 record for {cid:#x} vanished'
        assert h.u32(0x0227E64C + row[0] * 24 + 0x14, 'ov3') == 0x02235605, \
            f'{cid:#x} slot5 is no longer the off-field template'

- id: "dispatch.race_mask_fish_seaserpent_aqua"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The Fish / Sea Serpent / Aqua race triple that Sea Lancer E1 needs already exists in the ROM as a SINGLE 16-bit mask, not three comparisons. Forgotten Temple of the Deep 0x21EF ('target 1 Level 4 or lower Fish, Sea Serpent or Aqua-Type monster you control; banish that target') implements it in its cls0 SLOT2 (the on-field candidate predicate) at 0x021E3CF0: 0x021B44B4(side, zone, &buf) fills a 0x24-byte stat block on the stack, then buf[+0x0E] (s16) is the LEVEL — rejected when > 4 — and buf[+0x08] is a RACE BITFIELD tested with 'ldr r0,=0x00004120; tst r0,r1; beq reject'. So the triple is the constant 0x4120 (bits 0x0020 | 0x0100 | 0x4000) ANDed against stat_block[+0x08]. Reusable verbatim for an on-field filter. NOTE the per-bit assignment (which of the three bits is Fish, which Sea Serpent, which Aqua) is NOT proven — only that the union of the three is 0x4120 — and 0x021B44B4 is keyed by (side, zone), i.e. on-field, so a banished-zone filter needs the equivalent stat fetch for a packed card word rather than this entry point."
  address: 0x021E3CF0
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    assert h.bl_target(0x021E3D1E, 'ov3') == 0x021B44B4, 'stat-block fetch retargeted'
    # level gate: ldrsh r0,[sp,#0xE] ; cmp r0,#4 ; ble accept-path
    assert h.u16(0x021E3D24, 'ov3') == 0x200E and h.u16(0x021E3D26, 'ov3') == 0x5E08, \
        'level field is no longer read as (s16)buf[+0x0E]'
    assert h.u16(0x021E3D28, 'ov3') == 0x2804, 'level cap is no longer cmp #4'
    # race gate: ldr r1,[sp,#8] ; ldr r0,=0x4120 ; tst r0,r1 ; beq reject
    assert h.u16(0x021E3D2E, 'ov3') == 0x9902, 'race field is no longer buf[+0x08]'
    lit = h.u16(0x021E3D30, 'ov3')
    assert (lit & 0xF800) == 0x4800, 'race mask is no longer a pc-relative literal'
    pool = ((0x021E3D30 + 4) & ~3) + (lit & 0xFF) * 4
    assert pool == 0x021E3D6C and h.u32(pool, 'ov3') == 0x00004120, \
        f'Fish/SeaSerpent/Aqua mask changed: {h.u32(pool, "ov3"):#x} @{pool:#x}'
    assert h.u16(0x021E3D32, 'ov3') == 0x4208, 'race test is no longer TST'
    # and this really is Forgotten Temple's slot2
    row = [i for i in range(0x51A) if h.u32(0x0227E64C + i * 24, 'ov3') == 0x21EF]
    assert row and h.u32(0x0227E64C + row[0] * 24 + 8, 'ov3') == 0x021E3CF1, \
        'Forgotten Temple cls0 slot2 is no longer 0x021E3CF0'

- id: "dispatch.criteria_registry"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "A FIFTH per-card dispatch table — the OFF-FIELD SELECTION (criteria) registry — at 0x022713C4: stride 12, count 0x56C (1388), sorted by cid, binary-searched by 0x02243B9C (loop @0x02243BC0, 'ldrh r2,[r0,r2]' against the u16 at row+0). Row layout {+0x00 u16 cid, +0x02 u16 aux (0xFFFF for most), +0x04 Thumb handler, +0x08 u32 criteria word}; all 1388 handlers are Thumb ov3 pointers in 0x0223C938..0x02243A9C. 0x02243F38 calls blx [row+4](row, side, param); 0x02243FA8 (count) and 0x02243FE0 (any?) wrap it, and those are what slot5 template 0x02235604 and Release from Stone's slot3 0x021F03B4 call. This is the engine that reads LIST zones (Deck / GY / banished) — the one the on-field slot2+slot5 pair cannot reach. The banished readers share a handful of handlers, and THE ONLY PER-CARD PARAMETER IS THE CRITERIA WORD: 0x0223E5D0 'Special Summon from banished' (10 cards: Dimension Distortion, Dimension Fusion, Return from the Different Dimension, D.D.M., Miraculous Descent, Release from Stone, Dimension Explosion, Escape from the Dark Dimension, D.D.R., Agent of Miracles - Jupiter); 0x0223DB24 'add banished to hand' (9 cards: Miracle Dig, Layard, Shutendoji, Dimensional Alchemist, Light of Redemption, Psychic Path, Genetic Woman, Parallel Selection, Laval Lancelord); 0x0223F8C8 'return banished to GY' (Burial from a Different Dimension). 0x0223E5D0 is a 9-instruction thunk that forwards to 0x0223C6AC(side, row.cid, 0, 0, [sp]=row.criteria, [sp+4]=0xC)."
  address: 0x022713C4
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    BASE, CNT = 0x022713C4, 0x56C
    cids = [h.u16(BASE + i * 12, 'ov3') for i in range(CNT)]
    assert all(cids[i] <= cids[i + 1] for i in range(CNT - 1)), 'criteria registry unsorted'
    for i in range(CNT):
        fn = h.u32(BASE + i * 12 + 4, 'ov3')
        assert fn & 1 and env.oracle_name(fn & ~1) == 'ov3', \
            f'criteria row {i} handler {fn:#x} is not a Thumb ov3 pointer'
    # the binary search really keys on the u16 at row+0 with stride 12
    assert h.u32(0x02243DF8, 'ov3') == 0x56C, 'criteria registry count literal drifted'
    assert h.u32(0x02243DFC, 'ov3') == 0x022713C4, 'criteria registry base literal drifted'
    assert h.u16(0x02243BCC, 'ov3') == 0x5A82, 'search no longer ldrh from row+0'
    # the dispatch site and its two wrappers
    assert h.u32(0x02243FA0, 'ov3') == 0x022713C4 and h.u32(0x02243FA4, 'ov3') == 0x022713C8
    assert h.bl_target(0x02243FB6, 'ov3') == 0x02243B9C, '0x02243FA8 -> builder retargeted'
    assert h.bl_target(0x02243FEE, 'ov3') == 0x02243B9C, '0x02243FE0 -> builder retargeted'
    assert h.bl_target(0x02243FCA, 'ov3') == 0x02243F38 and \
           h.bl_target(0x02244002, 'ov3') == 0x02243F38, 'enumerator call retargeted'
    # 0x0223E5D0 forwards row.criteria ([r0,#8]) and nothing else per-card
    assert h.bytes_at(0x0223E5D0, 8, 'ov3') == bytes.fromhex('0eb5021c90680023')
    assert h.bl_target(0x0223E5E4, 'ov3') == 0x0223C6AC, '0x0223E5D0 forwardee retargeted'
    # the three shared banished handlers still own their families
    fam = {}
    for i in range(CNT):
        fam.setdefault(h.u32(BASE + i * 12 + 4, 'ov3'), []).append(h.u16(BASE + i * 12, 'ov3'))
    assert set(fam.get(0x0223E5D1, [])) == {0x16D8, 0x1712, 0x17BE, 0x191E, 0x1A36,
                                            0x1C95, 0x1D1A, 0x1D2F, 0x1D5F, 0x2449}, \
        'the SS-from-banished family changed'
    assert set(fam.get(0x0223DB25, [])) == {0x149E, 0x1A26, 0x1CBE, 0x1D5D, 0x1DCE,
                                            0x2012, 0x2081, 0x2325, 0x24E2}, \
        'the add-banished-to-hand family changed'
    assert fam.get(0x0223F8C9) == [0x1B1D], 'Burial from a Different Dimension row moved'

- id: "dispatch.criteria_word_race_attribute"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "The criteria registry's word at row+0x08 carries the card-selection filter, and its TOP BYTE is 'race in the high 5 bits, attribute in the low 3': race = byte >> 3, attribute = byte & 7 (0 = unrestricted in either field). Anchored by cards whose text names exactly one race and/or attribute, with the decisive case being Agent of Miracles - Jupiter 0x2449 = 0x89 = 0x88 (Fairy) | 0x01 (LIGHT), whose text is 'select 1 face-up LIGHT Fairy' — the only way one byte carries both. ATTRIBUTE codes (Konami order, each 100% pure over its rows except LIGHT 14/15): 1 LIGHT, 2 DARK, 3 WATER, 4 FIRE, 5 EARTH, 6 WIND. RACE codes (this game's internal order, NOT Konami's): 1 Dragon (29/35), 2 Zombie (18/19), 3 Fiend (9/10), 4 Pyro (6/6), 5 SEA SERPENT (1/1), 6 Rock (6/6), 7 Machine (12/15), 8 FISH (2/3), 9 Dinosaur (8/8), 10 Insect (13/13), 11 Beast (11/12), 12 Beast-Warrior, 13 Plant (19/19), 14 AQUA, 15 Warrior (15/16), 16 Winged Beast (5/5), 17 Fairy (14/15), 18 Spellcaster (4/5), 19 Thunder (2/2), 20 Reptile (16/16), 21 Psychic (15/15). The three codes Sea Lancer E1 needs: FISH = 8 (Superancient Deepsea King Coelacanth 0x1D0A crit 0x40900002 'Level 4 or lower Fish-Type'; Metabo-Shark 0x2197 crit 0x40010002 '2 Fish-Type monsters'), SEA SERPENT = 5 (Deep Sea Diva 0x1FFB crit 0x288C0002 'Level 3 or lower Sea Serpent monster'), AQUA = 14 (originally derived by elimination — 14 was the only code left unassigned in 1..21 — and since CONFIRMED from two directions: Unicorn Beacon's in-ROM race list 0x022712DC = {0x0B, 0x10, 0} validates the numbering against its 'Beast or Winged Beast' text, and the sibling 3DS engine implements Sea Lancer natively with a race list that reads literally {8, 5, 14, 0} for 'Fish, Sea Serpent, and Aqua'. See dispatch.criteria_registrar_predicate_list). CONSEQUENCE FOR E1: the word holds ONE race code, so a plain registry row CANNOT express Sea Lancer's Fish/Sea Serpent/Aqua triple. Unicorn Beacon 0x231A (banished + TWO races + level cap) is the in-ROM precedent and it needed a BESPOKE handler, 0x02242E60 — that is E1's blueprint, not a plain row."
  address: 0x022713CC
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    B = 0x022713C4
    rows = [(h.u16(B + i * 12, 'ov3'), h.u32(B + i * 12 + 4, 'ov3'),
             h.u32(B + i * 12 + 8, 'ov3')) for i in range(0x56C)]
    def tops(cid):   # a cid may own SEVERAL criteria rows (Jupiter owns three)
        return {c >> 24 for x, _, c in rows if x == cid}
    # the decisive two-field anchor: Jupiter carries both a Fairy row and a LIGHT-Fairy row
    assert 0x89 in tops(0x2449), 'Agent of Miracles - Jupiter LIGHT-Fairy row drifted'
    assert 0x88 in tops(0x2449), 'Agent of Miracles - Jupiter Fairy row drifted'
    assert 0x88 in tops(0x1A36) and 0x88 in tops(0x1A26), 'Fairy rows drifted'
    assert 0x01 in tops(0x1DCE), 'Light of Redemption (LIGHT) drifted'
    assert (0x89 >> 3) == (0x88 >> 3) and (0x89 & 7) == (0x01 & 7), 'field split broken'
    # single-race and single-attribute anchors
    for cid, top, what in ((0x1C95, 0x30, 'Rock'), (0x1CBE, 0x10, 'Zombie'),
                           (0x2012, 0xA8, 'Psychic'), (0x2081, 0xA8, 'Psychic'),
                           (0x1D0A, 0x40, 'Fish'), (0x2197, 0x40, 'Fish'),
                           (0x1FFB, 0x28, 'Sea Serpent'), (0x2115, 0x73, 'Aqua/WATER'),
                           (0x1D2F, 0x02, 'DARK'), (0x24E2, 0x04, 'FIRE')):
        assert top in tops(cid), f'{what} anchor {cid:#x} criteria drifted: {tops(cid)}'
    # the three codes E1 needs
    assert 8 in {t >> 3 for t in tops(0x1D0A)}, 'FISH is no longer race 8'
    assert 5 in {t >> 3 for t in tops(0x1FFB)}, 'SEA SERPENT is no longer race 5'
    assert 14 in {t >> 3 for t in tops(0x2115)}, 'the Aqua-by-elimination row moved'
    # Unicorn Beacon: TWO races -> a bespoke handler, and no race in the criteria byte
    ub = [(fn, c) for x, fn, c in rows if x == 0x231A]
    assert ub == [(0x02242E61, 0x00950002)], f'Unicorn Beacon row changed: {ub}'

- id: "dispatch.criteria_registrar_predicate_list"
