- id: "dispatch.multiselect_target_template"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "THE MULTI-SELECT SIBLING OF THE OFF-FIELD TARGET TEMPLATE, AND HOW ITS COUNT IS ENCODED. dispatch.offfield_picker_sequence's template 0x02235604 records EXACTLY ONE pick — it reads the picker result once and calls one recorder — so any effect built on it can only ever act on a single card. 0x02235700 is its multi-select twin (Pot of Avarice, Miracle Dig, Burial from a Different Dimension, Psychic Path, Backup Soldier ...). Its prologue is a per-cid switch that sets TWO values, r4 (a count code) and r6 (a prompt id), then falls into a shared tail at 0x02235912 which is a 3-sub-step machine on [0x0229AB7C], exactly like 0x02235604's:   sub-step 0: min = (r4 - 6) if 6 <= r4 <= 0x26 else 1; if 0x02243FE0(side, cid,               param) < min then return 1 (fizzle); 0x0219A6F4(r6) sets the prompt,               0x0219A7F8(r4 - 6) sets the MAX pick count, 0x0219A818(side, 1) opens;   sub-step 1: 0x0219C430(side, r4, cid, param) — note r1 is the count code r4, where               0x02235604 passes the constant 6, so mode 6 == 'exactly one';   sub-step 2: a LOOP — [state+0x74] indexes the picks, 0x0219C94C/0x0219C93C fetch               pick i, then the SAME recorders as the single template               (0x022347B0 for a board zone <= 0xA, else 0x02234880), returning 0 each               time so the machine re-enters until every pick is recorded. ⚠️ CORRECTED 2026-09-13 (see dispatch.multiselect_count_code_ranges): 'max picks = r4 - 6' is only the value QUEUED through 0x0219A7F8, NOT the enforced cap — Soul Charge with r4 = 0x29 was capped at 3 picks in-game (6 candidates, 4 free zones). For r4 in 0x28..0x46 the count is r4 - 0x27 (Psychic Path/Infernity Launcher 0x29 'up to 2', Burial/Backup Soldier 0x2A 'up to 3'); 0x26/0x47/0x48 = all candidates. SO (as originally written): max picks = r4 - 6, and min required = the same value only while r4 <= 0x26; above that the minimum collapses to 1, which is how 'any number' is expressed. A cid with no case takes the DEFAULT r4 = 8 = 'exactly 2'. ⚠️ READ THE PAIRS BY CONCRETE EXECUTION, NOT BY WALKING THE CFG. A symbolic walk of this switch that follows BGT/BLT edges as though they were equality cases invents pairs that no card has: it reported Burial from a Different Dimension as prompt 0x4C, and shipping that id — which NO card uses — froze the game in 0x0219A6F4. Set r1 to the real cid, evaluate the flags, take or don't take each branch. Sanity-check the interpreter against cards whose text pins the count: Pot of Avarice 0x196F -> r4 0x0B (exactly 5), Miracle Dig 0x149E -> 0x09 (3), Gladiator's Return 0x1C90 -> 0x09 (3). See thumb-stack-based-switch-footgun. Concretely-measured pairs (r4, prompt): Pot of Avarice (0x0B, 0x116), Miracle Dig (0x09, 0x116), Behemoth (0x26, 0x116), Burial from a Different Dimension (0x2A, 0x5A), Backup Soldier (0x2A, 0x37), Psychic Path (0x29, 0x4D), Infernity Launcher (0x29, 0x11D), and DRAGUNITY KNIGHT - BARCHA (0x47, 0x139) = max 65 / min 1. CONSEQUENCE: to give an arbitrary card 'target any number', clone 0x02235700 and overwrite the prologue halfwords at +0x06 with `mov r4,#imm ; <build r6> ; b +0x212`, bypassing the switch. card.sea_lancer_e1 uses BARCHA's pair, because Barcha is the exact analogue — 'select ANY NUMBER of Dragunity monsters in your Graveyard and EQUIP them to this card', cls1[1166] = {+04 0x022186E5 (the equip-from-list-zone resolver), +08 NULL, +14 0x02235701} — i.e. the same resolver AND the same template."
  address: 0x02235700
  oracle: "ov3"
  sources: [sea-lancer-findings]
  proof: |
    # the single-pick template records exactly one and returns 1
    assert h.bl_target(0x022356E8, 'ov3') == 0x02234880, 'single template recorder changed'
    assert h.u16(0x022356EC, 'ov3') == 0x2001, 'single template no longer returns 1'
    # the multi template: prologue defaults, then the shared tail
    assert h.u16(0x0223570A, 'ov3') == 0x2408, 'the default count code is no longer 8'
    assert h.u32(0x02235958, 'ov3') == 0x116, 'the default prompt id changed'
    # tail: the min-required window 6..0x26 and `min = r4 - 6`
    assert h.u16(0x02235924, 'ov3') == 0x2701, 'the min default (1) changed'
    assert h.u16(0x02235926, 'ov3') == 0x2C06 and h.u16(0x0223592A, 'ov3') == 0x2C26, \
        'the 6..0x26 min-required window changed'
    assert h.u16(0x0223592E, 'ov3') == 0x1FA7, 'min is no longer r4 - 6'
    assert h.bl_target(0x0223593C, 'ov3') == 0x02243FE0, 'candidate probe retargeted'
    assert h.u16(0x02235940, 'ov3') == 0x42B8 and h.u16(0x02235942, 'ov3') == 0xDA01, \
        'the not-enough-candidates fizzle changed'
    # sub-step 0 tail: prompt, MAX COUNT = r4 - 6, open
    assert h.bl_target(0x022359AA, 'ov3') == 0x0219A6F4, 'prompt setter retargeted'
    assert h.u16(0x022359AE, 'ov3') == 0x1FA0, \
        'the max-count computation (sub r0,r4,#6) changed'
    assert h.bl_target(0x022359B0, 'ov3') == 0x0219A7F8, 'max-count setter retargeted'
    # sub-step 1 passes the COUNT CODE as the picker mode (vs the constant 6 next door)
    assert h.u16(0x022359D4, 'ov3') == 0x1C21, 'the picker mode is no longer r4'
    assert h.bl_target(0x022359D6, 'ov3') == 0x0219C430, 'multi picker retargeted'
    assert h.u16(0x0223568E, 'ov3') == 0x2106, 'the single template no longer passes mode 6'
    # sub-step 2 is a LOOP over the picks, ending in the shared recorders
    assert h.bl_target(0x022359F4, 'ov3') == 0x0219C94C, 'per-pick fetch retargeted'
    assert h.bl_target(0x022359FC, 'ov3') == 0x0219C93C, 'per-pick select retargeted'
    assert h.bl_target(0x02235A12, 'ov3') == 0x022347B0, 'multi board recorder changed'
    assert h.bl_target(0x02235A2E, 'ov3') == 0x02234880, 'multi list recorder changed'
    assert h.u16(0x02235A32, 'ov3') == 0x2000, 'the loop no longer yields with 0'
    # Barcha really is the equip-any-number reference: same resolver, same template
    b = [0x022860D4 + i * 24 for i in range(0x535)]
    row = next(a for a in b if h.u32(a, 'ov3') == 0x221B)
    assert h.u32(row + 4, 'ov3') == 0x022186E5, 'Barcha no longer uses the equip resolver'
    assert h.u32(row + 0x14, 'ov3') == 0x02235701, 'Barcha no longer uses this template'
    assert h.u32(row + 8, 'ov3') == 0, 'Barcha gained a slot2'

