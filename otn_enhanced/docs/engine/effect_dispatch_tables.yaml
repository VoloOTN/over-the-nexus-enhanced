- id: "engine.ref_to_locator_0x021A220C"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** 0x021A220C(ref) -> LOCATOR: FIND WHERE A PACKED CARD REFERENCE CURRENTLY LIVES, 100 callers, body proven 2026-10-18 from the stock bytes (224 instructions, pinned by a SHA-256 of the decode plus the return-site constants). For each stored card word w it forms key := ((w << 1) >> 24) * 2 + ((w >> 14) & 1) (the same extraction the picker readback uses) and compares it with `ref`. Search order and return value: (1) FIELD, side 0..1 x zone 0..10, words at [0x0229AC94 + side*0xB3C + zone*0x14 + 0x34] (skipping words whose low 14 bits are 0): returns (zone << 8) | side. (2) For each side in turn the list zones at player offsets +0x55C (Graveyard, count [+0x14]) -> code 0xE, +0x7B4 (Banished, count [+0x1C]) -> 0xF, +0x304 (Deck, count [+0x10]) -> 0xD, +0x4E4 (Extra Deck, count [+0x18]) -> 0xC; (3) then the Hand, +0x124 with count [+0xC] -> 0xB. For every list hit the return is (index << 16) | (code << 8) | side. (4) Not found -> 0x1000. So the high byte of the low half is the SAME zone code the container accessor 0x0219CA28 takes (0xB hand, 0xC Extra, 0xD Deck, 0xE GY, 0xF banished), and 0..10 for the field. NOT proven: why the key skips bits 22..15 of the word, and which of the two stored fields a 'ref' normally is; the first match in the stated order wins."
  address: 0x021A220C
  oracle: "ov3"
  sources: [notes/ov3-catalogue-findings.md]
  proof: |
    import hashlib, struct, capstone
    md = capstone.Cs(capstone.CS_ARCH_ARM, capstone.CS_MODE_THUMB)
    def dec(a, e):
        return [(i.mnemonic + ' ' + i.op_str) for i in md.disasm(h.bytes_at(a, e - a, 'ov3'), a)]
    body = dec(0x021A220C, 0x021A23CC)
    assert len(body) == 224, len(body)
    assert hashlib.sha256('\n'.join(body).encode()).hexdigest() == 'ae6c966b61769613318cfbae069d04a030b5ee91f4e2797ca75117e63604a9bb', 'body changed'
    def at(a):
        return dec(a, a + 2)[0]
    for a, t in {0x021A2298: 'movs r0, #0xe', 0x021A22D4: 'movs r0, #0xf', 0x021A2312: 'movs r0, #0xd', 0x021A234E: 'movs r0, #3',
                 0x021A2350: 'lsls r0, r0, #0xa', 0x021A23A6: 'movs r0, #0xb', 0x021A23C6: 'movs r0, #1', 0x021A23C8: 'lsls r0, r0, #0xc'}.items():
        assert at(a) == t, hex(a)
    assert [h.u32(0x021A23CC + 4 * k, 'ov3') for k in range(5)] == [0x0229AC94, 0x0B3C, 0x055C, 0x07B4, 0x04E4]

- id: "engine.field_cid_count_0x021AC204"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "0x021AC204(cid) -> COUNT of field cards with that cid across BOTH players (106 callers), body proven 2026-10-18 from the stock bytes (149 instructions, SHA-256 pinned). It branches on two predicates of cid: if 0x02029E60(cid) (the MONSTER predicate) is nonzero it scans field slots 0..4; else if 0x02029E80(cid) (the FIELD-SPELL predicate) is zero it scans slots 5..9; else it scans slot 10 only. For each side 0..1 and each slot in range it counts +1 iff ALL of: (a) 0x021A36EC(side, slot) == cid (zone cid read); (b) 0x021A32B4(side, slot) != 0 (zone presence); (c) bit 26 of the u32 at [0x0229AC94 + side*0xB3C + slot*0x14 + 0x44] is CLEAR (slot 10: 0x0229ADA0 + side*0xB3C, the same address); (d) bit (side*16 + slot) of the u32 at [0x0229C314] is CLEAR. Returns the count. Read-only, one argument (r0). NOT proven: what bit 26 of the slot word means (the 0x021AC5A8 savestate note says it is tested as 'clear'), what the 0x0229C314 mask represents, or what any caller's cid names."
  address: 0x021AC204
  oracle: "ov3"
  sources: [notes/ov3-catalogue-findings.md]
  proof: |
    import hashlib, capstone
    md = capstone.Cs(capstone.CS_ARCH_ARM, capstone.CS_MODE_THUMB)
    def dec(a, e):
        return [(i.mnemonic + ' ' + i.op_str) for i in md.disasm(h.bytes_at(a, e - a, 'ov3'), a)]
    def sha(a, e, n, d):
        b = dec(a, e)
        assert len(b) == n, len(b)
        assert hashlib.sha256(chr(10).join(b).encode()).hexdigest() == d, 'body changed'

    sha(0x021AC204, 0x021AC33E, 149, 'b02031eeac9afd1856cd3d3929b0c5c5d279977f3a6843f77855647049fcaca9')
    assert [h.u32(0x021AC340 + 4 * k, 'ov3') for k in range(3)] == [0xB3C, 0x0229AC94, 0x0229C314]
    assert h.bl_target(0x021AC20C, 'ov3') == 0x02029E60 and h.bl_target(0x021AC27C, 'ov3') == 0x02029E80
    assert h.bl_target(0x021AC232, 'ov3') == 0x021A36EC and h.bl_target(0x021AC23E, 'ov3') == 0x021A32B4
    assert h.bl_target(0x021AC2F2, 'ov3') == 0x021A36EC and h.bl_target(0x021AC2FE, 'ov3') == 0x021A32B4

