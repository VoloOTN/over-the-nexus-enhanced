- id: "dispatch.cls_table_selector"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "There are FOUR cls tables, and which one find_event_handler 0x0224A118 searches is chosen by the event descriptor's byte at +0x05 (0..3) through a PC-relative halfword jump table @0x0224A134 (offsets 0x12/0x30/0x06/0x36 relative to 0x0224A136). sel 0 -> cls0 0x0227E64C count 0x51A; sel 1 -> cls1 0x022860D4 count 0x535; sel 2 -> cls2 0x02275C04 count 0x2B9 (but sel 2 with descriptor[+4]==0x25 falls through to the cls0 arm); sel 3 -> cls3 0x02279D74 count 0x308 (776) — the fourth table, previously unmapped. This PROVES the cls0/cls1/cls2 names (they were previously inference): the selector index IS the cls number. cls3 ends at 0x0227E634, 0x18 (one record) below cls0's base. The descriptor is a 0x24-byte stack struct: {+0x00 u16 cid, +0x04 u8 event code, +0x05 u8 table selector, +0x07/+0x08 'slot4 / slot5 already done' flags}. find_event_handler binary-searches (stride 0x18, leftmost-equal walk-back @0x0224A808) and returns the RECORD BASE, so the caller's [r0,#0x04..0x14] are exactly slots 1..5."
  address: 0x0224A118
