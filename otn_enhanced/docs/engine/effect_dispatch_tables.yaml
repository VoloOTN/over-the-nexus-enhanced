- id: "dispatch.zone_predicate_mask_rosetta"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** 0x021D6E40 IS A GENERIC BITMASK CANDIDATE PREDICATE -- (r0 = source desc, r1 = candidate side, r2 = candidate zone, r3 = MASK) -> 1 accept / 0 reject -- and overlay 3 contains a 168-ENTRY ROSETTA STONE for the mask. The corpus: scan ov3 for the exact 4-instruction thin wrapper `push {r3,lr} (0xB508) ; ldr r3,[pc,#8] (0x4B02) ; bl 0x021D6E40 ; pop {r3,pc} (0xBD08)` followed by its literal; each hit pairs a mask with the cls0/1/2/3 rows that point at it, i.e. with PRINTED CARD TEXT. DECODED FIELDS: bits 0-1 = side selector (01 = same side as the source, compared against [desc+2]^[desc+6]); BITS 4-6 ARE A 3-BIT ZONE-CLASS FIELD, NOT FLAGS (switch at 0x021D6F32 over 0x00/0x10/0x20/0x30/0x40/0x50; 0x10 = 'zone < 5' i.e. a monster zone; 0x60 and 0x70 are unhandled = no zone test from this field); bit 15 at 0x021D714E; bit 21 (0x00200000) at 0x021D72B2. THE WORKED DIFF that decodes the field: Genex Ally Birdman 0x2205 ('return 1 face-up monster you control') uses mask 0x00008015 and Blackwing - Zephyrus the Elite 0x241C uses 0x00208075. ⚠️ BIT 21 IS NOT AN ARCHETYPE TEST -- its arm reads the SOURCE cid, sets a required count (2 iff the source cid is 0x13FC, else 1) and calls 0x021AD870 / 0x021AD488 / 0x021AD79C: a 'this still leaves you enough monsters' check. It is set by exactly ONE of the 168 wrappers."
  address: 0x021D6E40
  oracle: "ov3"
  sources: [notes/grapha-findings.md, otn_enhanced/cards/grapha.py]
  proof: |
    import struct
    base, ov = 0x02141700, h.env.image('ov3')
    found = {}
    for off in range(0, len(ov) - 16, 2):
        if struct.unpack_from('<H', ov, off)[0] != 0xB508: continue
        if struct.unpack_from('<H', ov, off + 2)[0] != 0x4B02: continue
        if struct.unpack_from('<H', ov, off + 8)[0] != 0xBD08: continue
        va = base + off
        if h.bl_target(va + 4, 'ov3') != 0x021D6E40: continue
        found[va] = struct.unpack_from('<I', ov, off + 12)[0]
    assert len(found) == 168, 'the wrapper corpus changed size'
    assert found.get(0x021E3E04) == 0x00008015, 'Genex Ally Birdman mask moved'
    assert found.get(0x021E454C) == 0x00208075, 'Zephyrus mask moved'
    bit21 = [v for v in found.values() if v & 0x00200000]
    assert len(bit21) == 1, 'bit 21 is no longer unique to Zephyrus'

