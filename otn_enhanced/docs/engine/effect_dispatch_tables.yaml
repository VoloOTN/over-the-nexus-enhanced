  address: 0x0224AD94
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    # 0x0224AD94: find_event_handler, then blx the +0x0C slot
    assert h.bl_target(0x0224AD9A, 'ov3') == 0x0224A118, 'the invoker lost its lookup'
    assert h.bytes_at(0x0224AE06, 6, 'ov3') == bytes.fromhex('e268002a03d0'), \
        'the `ldr r2,[r4,#0xC] ; cmp r2,#0 ; beq` condition-slot test drifted'
    assert h.u16(0x0224AE10, 'ov3') == 0x4790, '0x0224AE10 is no longer `blx r2`'
    # the recordless path: r6 = 1 survives to the >0 return
    assert h.u16(0x0224ADA2, 'ov3') == 0x2601, 'the r6 = 1 default drifted'
    assert h.bytes_at(0x0224ADF4, 4, 'ov3') == bytes.fromhex('002c22d0'), \
        'the `cmp r4,#0 ; beq 0x0224AE3E` no-record branch drifted'
    assert h.bytes_at(0x0224AE3E, 6, 'ov3') == bytes.fromhex('0120002e00dc'), \
        'the `movs r0,#1 ; cmp r6,#0 ; bgt` return drifted'
    # desc[+3] is read as the zone by Simorgh's condition
    assert h.bytes_at(0x021FEBAC, 2, 'ov3') == bytes.fromhex('e278'), \
