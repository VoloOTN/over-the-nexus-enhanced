  claim: "A RESOLVER RE-VALIDATES ITS RECORDED PICK THROUGH slot2, SO RETARGETING slot5 TO THE OFF-FIELD TEMPLATE REQUIRES NULLING slot2. Mermaid Archer's resolver 0x0220BFFC calls 0x0224A924(desc, side, key) at 0x0220C03A with the two bytes it just decoded from the pick, and ABORTS the whole resolution when that returns 0. 0x0224A924 is the slot2 single-card invoker: it looks the record up with find_event_handler and, BEFORE calling slot2, indexes the board itself — `ldr r0,[player + key*0x14]`, then tests bit 21 (the negated/disabled bit). For an off-field pick the key is the zone code 0x0F, which is ten zone-records past the five monster zones, so leaving an on-field slot2 in place both reads out of range and applies a meaningless predicate. THE FIX IS FREE: when the record's +0x08 is NULL, 0x0224A924 returns early with r1, which it loaded from its own literal pool at 0x0224A978 = 1 — i.e. ACCEPT. This is also why every off-field card ships with no slot2 (Unicorn Beacon 0x231A and Release from Stone 0x1C95 both have +0x08 == 0, as do 2596 records overall). NULLing +0x08 additionally removes the bogus precondition 0x0224AD94 would impose: when slot3 returns exactly 1 it demands that slot2 find an on-field target before the effect may be activated at all."
  address: 0x0224A924
  oracle: "ov3"
  sources: [sea-lancer-findings]
