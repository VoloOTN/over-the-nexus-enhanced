    TRUE_ARM, FALSE_ARM = 0x0202312E, 0x02023132
    got = {15 + i: (0x0202312A + tbl[i]) for i in range(6)}
    assert all(v in (TRUE_ARM, FALSE_ARM) for v in got.values()),                  f'an arm leaves the two-value return: {got}'
    tuners = {k for k, v in got.items() if v == TRUE_ARM}
    assert tuners == {15, 16, 19, 20}, f'the TRUE set moved: {sorted(tuners)}'
