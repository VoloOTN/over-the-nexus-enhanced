  claim: "*** CRITERIA-WORD BIT 15 (0x8000) MEANS 'IS A TUNER'. dispatch.criteria_word_fully_decoded reads the low-half predicate bits off the matcher 0x0223BA24 and lists bit 15 only as the opaque `0x02023110(cid) == 1`; this decodes that callee. 0x02023110 is `bl 0x0202ABF8 ; subs r0,#0x0F ; cmp r0,#5 ; bhi <return 0>` followed by a BYTE jump table at 0x02023128 (add-pc base 0x0202312A, read with `ldrb r0,[r0,#6]`). 0x0202ABF8 returns card_type >> 1 (the same accessor dispatch.second_cls1_record_is_spirit_only uses for 'Spirit' == 7), so the six table entries cover card_type >> 1 in 15..20. The bytes are 04 04 08 08 04 04: offset 4 -> 0x0202312E `movs r0,#1` and offset 8 -> 0x02023132 `movs r0,#0`. That makes the predicate TRUE for card_type >> 1 in {15, 16, 19, 20} and FALSE for {17, 18} -- i.e. TRUE for card_type 31 Normal Tuner Monster, 33 Tuner Monster and 39 Synchro Tuner Effect Monster, FALSE for 35 Synchro Monster and 37 Synchro Effect Monster. That is EXACTLY the three Tuner entries of game_constants.ERA2_CARD_TYPE_MAP against the two non-Tuner Synchro entries. *** CROSS-VALIDATED BY A SHIPPED ROW, not just by the enum: Tuning 0x23A2 owns criteria row {aux 0x004C, handler 0x0223CAF5, word 0x00008002} and is printed 'Add 1 \"Synchron\" TUNER monster from your Deck to your hand'; Necro Linker 0x237A carries the same 0x8002 low half with the same aux. aux 0x4C is the Synchron set code (setcode.synchron_table), so the row reads literally 'Synchron' + Tuner + real card. *** PRACTICAL USE: a Tuner-only archetype search is `aux = <set code>, word = 0x00008002`, and adding dispatch.criteria_word_level_field's op-0 Level byte gives 'Level EXACTLY k' -- which is how card.junk_speeder_clause2 expresses 'as many \"Synchron\" Tuners as possible with different Levels' as twelve searches rather than a bespoke Deck walker. It also means Synchron Explorer 0x229E, the only non-Tuner Main-Deck 'Synchron' monster, is excluded with no special-casing. *** SAME FUNCTION, TWO SUBSYSTEMS: synchro.is_tuner_predicate already decoded 0x02023110 (identically -- card_type>>1 in {15,16,19,20}) as the SYNCHRO MATERIAL engine's is-a-Tuner test, reached at runtime through the wrapper 0x021A1C7C(side, idx) which adds an attached-rider fallback. What is new here is that the CRITERIA WORD's bit 15 is the same predicate, which is what makes a Tuner-only Deck search expressible as a plain row. A grep for the ADDRESS finds both; a search for the concept found neither."
