  claim: "*** THE kind-5 = PER-DUEL READING IS CORROBORATED IN GAME (card.unknown_synchron, user 2026-09-02): the card's summon was refused for the rest of the Duel after one use and offered again in a NEW Duel, which is the behaviour this fact predicts and is not explainable by the node simply never being posted. *** 'ONCE PER DUEL' IS THE SAME TURN-LOG PAIR AS dispatch.turnlog_once_per_turn_pair, WITH kind = 5 INSTEAD OF kind = 1 -- so a hard once-per-Duel is the same two-shim job, and it is cid-generic, so it works for any donor. QUERY = 0x021A14E8(side, 0x0B, cid, 5); POST = 0x021D2584(side, cid, 5, 0). *** THE NATIVE MODEL: the ignition-condition registry 0x0226FAFC (146 x {u16 cid, u16 aux, u32 f1, u32 f2}) gives Spore 0x225B (row 110 @0x02270024) and Glow-Up Bulb 0x2387 (row 120 @0x0227009C) the SAME f2 = 0x021F44D9, and that function is the whole restriction: `r0 = desc[+2] (side) ; r2 = desc[+0] (cid) ; r1 = 0x0B ; r3 = 5 ; bl 0x021A14E8 ; if r0 != 0 return 0 ; else return 0x021F04FC(desc, r1)` -- deny if the node is already posted, else chain the real condition. Both are printed once-per-Duel cards. Census: 0x021A14E8 has 89 call sites of which only THREE pass kind 5 (0x0219D0A0, 0x021BF4BA, 0x021F44E6); the poster has 206 sites of which 17 post kind 5. *** WHY kind 5 IS DUEL-SCOPED (closed proof, three reads): (a) the node list search 0x021A1268 walks 10-byte nodes (link at node[+8]) and matches on r7 = node[+2] & 0xF with `cmp r7,#6 ; bhs skip`, then node[+0] == key, then r7 == kind -- so node[+2] & 0xF IS the kind and kinds run 0..5. (b) The END-OF-TURN SWEEPER 0x0219F9E0 switches on that SAME field through a 9-entry halfword jump table (table @0x0219FA2C, PC base 0x0219FA2E): kinds 1 and 2 -> 0x0219FA3E, the high-nibble countdown-or-remove block; kinds 0, 4 and 5 -> 0x0219FAEE. (c) 0x0219FAEE is SKIP, not remove: the removal call is 0x0219FAEA `bl 0x0219F03C` and 0x0219FAEE sits after it at the loop increment (`movs r0,#1 ; adds r5,r5,#1 ; lsls r0,r0,#8 ; cmp r5,r0 ; blt 0x0219FA0C`). So a kind-1 node is decremented and removed at end of turn while a kind-5 node is never touched -- it persists for the Duel. *** THE STAMP SITE FOR A SUMMON-SCOPED RESTRICTION ('once per Duel THIS WAY') is the SS-commit descriptor, see summon.commit_descriptor_carries_source_zone: hook one of the two commit routines and post only when desc[+0xE] == your cid AND desc[+0xA] == 0x0B (summoned FROM THE HAND), which excludes a later Monster Reborn (zone 0x0E). *** THREE CANDIDATE SITES RULED OUT, so the next session does not re-derive them: (a) 0x0225F4EC is inside the hand-SS ELIGIBILITY dispatch 0x0225E51C -- it only tests satisfiability via 0x0225CE0C(side, cid, 1, 1), it is not execution. (b) 0x022625DC has ZERO ov3 callers because all 13 references to 0x022625DD lie inside the summon-procedure registry 0x0228F158 as {u32 cid, u32 handler} rows -- it is a row HANDLER, so it never runs for a cid without a row. (c) Adding a registry row for the donor, which looks like the natural 'this way' hook, ATTACHES A COST: the registry's 133 rows / 23 handlers contain NONE of the five costless Cyber-Dragon-condition cards (Cyber Dragon 0x0F07 / 0x18F6, Vice Dragon 0x1F37, Level Warrior 0x1FDB, Oracle of the Sun 0x21B6) -- every row belongs to a card with a real procedure (Ancient Gear 0x19AA and Sphinx Teleia 0x17C8 tribute; Cyber Eltanin 0x20EE, Ananta 0x1D62, The Atmosphere 0x221E banish). There is no 'free but tracked' handler, and an unintended cost is exactly what failed card.darkflare_clause2 twice."
