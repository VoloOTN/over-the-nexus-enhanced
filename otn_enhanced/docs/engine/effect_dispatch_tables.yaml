- id: "dispatch.deck_walker_word_is_a_type_union"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE DECK WALKER 0x0223BC3C(r0 side, r1 row cid, r2 predicate|0, r3 predicate list, [sp] criteria word, [sp+4] type) KEEPS A CANDIDATE IF ANY OF THREE TYPE BRANCHES PASSES, so one criteria word can mean 'monster OR Spell'. *** Disassembled 2026-09-29: per Deck card it calls the MONSTER branch 0x0223BA24 (@0x0223BD56; it runs only if word bit 0x2, `movs r7,#2 ; tst` @0x0223BA2C, then is_monster 0x02029E60), the SPELL branch 0x0223BBCC (@0x0223BDC0; word bit 0x4, is_spell 0x02022FC8, Spell subtype in word bits 7..9 with 0 = any) and the TRAP branch 0x0223BC04 (@0x0223BDD0; word bit 0x8), ORing their verdicts into [sp+0x34]. Race (bits 27..31), attribute (24..26) and Level (value bits 18..21; bit 22 = '>=', bit 23 = '<=', neither = EXACT) are tested only inside the MONSTER branch and only when non-zero; for a zone other than the field (0xB) the Level is the PRINTED one, 0x0202ABD8 (@0x0223BB4C) = the card's ORIGINAL Level. Survivors then face the caller's predicate at 0x0223BDFA: pred(r0 side, r1 0xD, r2 Deck index, r3 the ROW cid -- not the candidate's, [sp] &candidate card word, [sp+4] the r3 list); 0 rejects. CONSEQUENCE (animadorned_archosaur): 'a <race list> monster with Level N, OR a <named> Spell' is word 0x6 + an ov5 predicate, and N is written into the row's +0xA byte at resolution (Spells ignore it)."
  address: 0x0223BC3C
  oracle: "ov3"
  sources: [notes/animadorned-archosaur-findings.md, otn_enhanced/cards/animadorned_archosaur.py]
  proof: |
    assert h.bl_target(0x0223BD56, 'ov3') == 0x0223BA24, 'monster branch call moved'
    assert h.bl_target(0x0223BDC0, 'ov3') == 0x0223BBCC, 'spell branch call moved'
    assert h.bl_target(0x0223BDD0, 'ov3') == 0x0223BC04, 'trap branch call moved'
    assert h.u16(0x0223BA2C, 'ov3') == 0x2702, 'monster branch no longer gates on word bit 0x2'
    assert h.u16(0x0223BBD0, 'ov3') == 0x2104, 'spell branch no longer gates on word bit 0x4'
    assert h.u16(0x0223BC08, 'ov3') == 0x2108, 'trap branch no longer gates on word bit 0x8'
    assert h.bl_target(0x0223BBD8, 'ov3') == 0x02022FC8, 'is_spell call moved'
    assert h.bl_target(0x0223BA50, 'ov3') == 0x02029E60, 'is_monster call moved'
    assert h.bl_target(0x0223BB4C, 'ov3') == 0x0202ABD8, 'printed-Level call moved'
    assert h.u16(0x0223BDF6, 'ov3') == 0x210D, 'predicate r1 is no longer the Deck zone 0xD'
    assert h.u16(0x0223BDFA, 'ov3') == 0x47A0, 'predicate is no longer blx r4'
    assert h.u16(0x0223BDEA, 'ov3') == 0x9B02, 'predicate r3 is no longer the row cid [sp+8]'

- id: "dispatch.criteria_row_hook_full"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "THE SHARED criteria_row_hook STUB HAS NO ROOM FOR ANOTHER ARM (measured 2026-09-29): with its 9 shipped arms, appending one more makes the stub head's `beq native` (acting descriptor == 0) branch 270 B -- past Thumb-1's +-256 B conditional range, so it no longer assembles. A new card that needs a second criteria row must instead MODE-SWITCH its single row-0 handler on the acting descriptor [0x0229A9FC+0x50] (e.g. desc[0] == cid && desc[+5] == record class) -- the double_evolution_pill / overtex_qoatlus recipe -- or restructure the shared stub."
  address: 0x02243BEC
  oracle: "ov3"
  sources: [overtex-qoatlus-findings]
  proof: |
    from otn_enhanced.effects import criteria_row_hook as crh, ov5_cave
    from otn_enhanced.asm.thumb_disasm import ThumbEncodeError
    extra = crh.ARMS + ((0x7FFF, 'probe', lambda b, tag: crh.ARM_SM(b, tag, 0x7FFF), ''),)
    try:
        crh.stub(ov5_cave.CAVE_ROWHOOK, extra)
        raise AssertionError('the row hook took another arm -- the fact is stale')
    except ThumbEncodeError:
        pass

