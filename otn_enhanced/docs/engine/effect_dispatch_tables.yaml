  claim: "slot3 (the activation condition) IS RE-EVALUATED MID-ACTIVATION, AFTER THE COST HAS RUN — so a HOPT/'already used' condition that the cost consumes will make the effect activate from the menu and then FIZZLE SILENTLY at the target step. This bit an ov5 condition shim (nothing happened on activation; no freeze). THE TWO CALL SITES: (1) the menu asks 0x0224AD94(desc) — which returns slot3(desc) > 0 (slot2's branch is skipped when +0x08 is NULL) — to decide whether to OFFER the effect; (2) the MULTI-SELECT target template 0x02235700 calls 0x0224AD94 AGAIN at 0x0223599C, inside its own sub-step 0, before opening the picker. (The single-pick template 0x02235604 does NOT re-check, which is why this only bites multi-select effects.) BETWEEN THE TWO the activation state machine 0x02217F80 runs the COST: at 0x02217F8E it tests desc[+7], runs slot4 (0x0224AE50) only if it is clear, then SETS desc[+7]=1 at 0x02217FB4 and yields 0x76. So desc[+7] is exactly 'the cost has already run' — 0 at the menu call, 1 at the template's re-check. WORKED EXAMPLE (Sea Lancer donor 0x1FFC): the donor's slot3 0x021F2460 requires 0x021A10A0(side, slot) == 0xFFFF, a once-per-turn 'effect not yet used' marker, and the donor's slot4 cost 0x021E5060 spends it. Chaining slot3 unconditionally in the shim therefore returned 1 at the menu and 0 on the re-check. GDB-confirmed (scratch/gdb_sealancer_e1_trace.py): a breakpoint after the shim's candidate probe hit ONCE with count 2, and the template's `mov r0,#1` fizzle exit (0x02235A14, i.e. clone +0x2A4) then hit with the legality result 0. THE FIX: gate the donor-condition call on desc[+7] — run it only when +7 == 0 (menu), and mid-activation return the candidate-count check alone. Nothing slot3 tests can change between the cost and the target step of a single activation, so skipping it there is safe."
  address: 0x02217F80
  oracle: "ov3"
  sources: [sea-lancer-findings]
