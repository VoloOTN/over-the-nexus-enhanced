    assert h.u16(cad9 + 0x12, 'ov3') == 0x2200, '0x0223CAD9: movs r2,#0 moved'
    assert h.u16(cad9 + 0x10, 'ov3') == 0x8811, '0x0223CAD9: ldrh r1,[r2] moved'
