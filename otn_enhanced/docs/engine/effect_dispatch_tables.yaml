- id: "dispatch.criteria_zone_is_the_handler"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "THE SELECTION ZONE OF A CRITERIA ROW IS ITS HANDLER, NOT ITS WORD. The criteria word encodes WHAT to select (top byte race<<3|attribute, bits 23:16 the level filter, low half a selection-TYPE code) and says NOTHING about WHERE. The zone is the row's handler function at +0x04. THE CLEAN PROOF IS DARK SIMORGH 0x1E5A, which pays the SAME two attributes from EITHER zone — 'You can banish 1 DARK monster and 1 WIND monster from your GRAVEYARD; Special Summon this card from your hand. You can banish 1 DARK monster and 1 WIND monster from your HAND; Special Summon this card from your Graveyard.' — and owns FOUR rows whose words are pairwise IDENTICAL, differing only in handler:
    row 741  fn 0x0223CA11  word 0x02000002   DARK, from the GRAVEYARD
    row 742  fn 0x0223CA11  word 0x06000002   WIND, from the GRAVEYARD
    row 743  fn 0x0223CB19  word 0x02000002   DARK, from the HAND
    row 744  fn 0x0223CB19  word 0x06000002   WIND, from the HAND
Because both pairs sit on ONE cid with ONE text, everything except the zone is controlled for. So 0x0223CA11 = select from the GRAVEYARD and 0x0223CB19 = select from the HAND, and a row is retargeted between zones by swapping the handler and leaving the word alone. Corroborated across the table: of the 11 rows carrying 0x0223CB19, 8 belong to cards whose text selects from the hand (including the discard cards Trade-In 0x1C50 and Fabled Valkyrus 0x1FB5 — a discard IS a hand selection). ⚠️ THIS KILLS THE OBVIOUS WRONG THEORY that the word's LOW HALF is a zone field: 0x0802 looks like 'hand' because Armed Dragon LV5 0x17DA carries it, but only 71 of the 148 rows with low half 0x0802 mention the hand at all, and Time Wizard 0x0FB6, Cyber-Stein 0x114A, Chimera 0x1294 and Dark Magic Curtain 0x12DE are decisive counter-examples. The low half is a selection-TYPE code and remains UNDECODED — copy it verbatim from a row of the same shape (dispatch.criteria_word_level_field's standing advice) rather than synthesising it. CONSEQUENCE for Lightpulsar clause 2 ('send 1 LIGHT and 1 DARK monster from your HAND to the GY'): its rows are clause 1's words 0x01000002 / 0x02000002 UNCHANGED, with the handler swapped from 0x0223CA11 to 0x0223CB19."
  address: 0x0223CB19
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    B, CNT = 0x022713C4, 0x56C
    rows = [(h.u16(B + i * 12, 'ov3'), h.u32(B + i * 12 + 4, 'ov3'),
             h.u32(B + i * 12 + 8, 'ov3')) for i in range(CNT)]
    sim = [(fn, w) for cid, fn, w in rows if cid == 0x1E5A]
    assert sim == [(0x0223CA11, 0x02000002), (0x0223CA11, 0x06000002),
                   (0x0223CB19, 0x02000002), (0x0223CB19, 0x06000002)], \
        f'Dark Simorgh 0x1E5A no longer shows the zone A/B: {[(hex(a), hex(b)) for a, b in sim]}'
    # the two words are pairwise identical across the zone split -- the whole point
    assert sim[0][1] == sim[2][1] and sim[1][1] == sim[3][1], \
        'the GY and HAND rows no longer carry identical words'
    assert sim[0][0] != sim[2][0], 'the two zone handlers are no longer distinct'
    # and the GY handler is the one the banish-cost family uses
    fam = {cid for cid, fn, _ in rows if fn == 0x0223CA11}
    for cid in (0x16C9, 0x16CB, 0x16E4):
        assert cid in fam, f'{cid:#06x} left the GY-select handler family'

