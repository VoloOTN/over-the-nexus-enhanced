  claim: "*** A GY-ACTION REGISTRY ROW IS FOUR DATA WORDS, SO A PHANTOM ROW IN THE WRONG FAMILY CAN BE CONVERTED INTO THE RIGHT ONE -- THE REGISTRY IS NOT EXHAUSTED. *** dispatch.gy_action_registry describes 0x0228DDF8 as 60 rows x 0x10 {u32 cid, u32 zone, u32 check_fn, u32 post_fn} in three check/post families, and dispatch.gy_action_family_0224C55D_is_a_hand_gate correctly warns that the {0x0224C55D, 0x0224C669} family CANNOT host a Graveyard effect -- it builds no class descriptor and it gates on the HAND via 0x021A1584(side, 0x0B, cid). *** BUT THAT IS A PROPERTY OF THOSE TWO FUNCTIONS, NOT OF THE ROW SLOT. Rewriting a phantom row's check_fn/post_fn to the Grapha pair {0x0224C591, 0x0224C6C1} CONVERTS it into a real GY-effect row, and all four readers (dispatch.gy_action_registry_consumers) agree because every discriminator they use is a DATA comparison: the enumerator A 0x0224C820 scans [row+4] (the zone, left at 0x0E); reader D 0x0224CBD8 tests [row+0xC] == 0x0224C669 and now takes the generic ref path like all the Grapha rows; reader B 0x0224CD08 calls post() for rows with that cid; reader C 0x0224CD3C tests post != 0x0224C7C1. The row count is untouched, so the three imm8 bounds at 0x0224C99A / 0x0224CD30 / 0x0224CD5C are undisturbed. *** WHY IT MATTERS: the Grapha family is FULL -- its three phantoms went to card.grapha_clause1 (row 15, 0x0EB2), lightpulsar (row 47, 0x0E3E) and card.jet_synchron (row 48, 0x0E64) -- and that is why card.revolution_synchron C2 synthesised a VIRTUAL row 60 in the ov5 cave behind FOUR hooks (an enumerator row-fetch, an enumerator loop-exit, and the two other readers). This conversion achieves the same thing with ZERO hooks and zero cave, is puzzle-safe, and leaves two more sibling phantoms (rows 12/13, 0x144C and 0x1452) for future cards. card.dragunity_remus_clause2's C3a takes row 11 (0x1449). *** THE GENERAL LESSON: before building machinery to fake a table row, check whether the table's DISCRIMINATOR IS DATA -- a 'wrong family' row may just be a right-family row with two words changed."
  address: 0x0228DDF8
  oracle: "ov3"
  sources: [notes/dragunity-remus-findings.md, otn_enhanced/cards/dragunity_remus.py]
  proof: |
    B, CNT = 0x0228DDF8, 60
    rows = [tuple(h.u32(B + i * 16 + k, 'ov3') for k in (0, 4, 8, 12))
            for i in range(CNT)]
    fam = {}
    for r in rows:
        fam[(r[2], r[3])] = fam.get((r[2], r[3]), 0) + 1
    assert fam == {(0x0224C591, 0x0224C6C1): 45,
                   (0x0224C63D, 0x0224C7C1): 9,
                   (0x0224C55D, 0x0224C669): 6}, f'family split drifted: {fam}'
