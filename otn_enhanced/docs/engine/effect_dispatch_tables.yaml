    assert others and max(others.values()) < C.OV5_NATIVE_LEN,                  f'an overlay sharing ov5 base is >= ov5: {others}'

- id: "synchro.tuner_gate_hook"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE TUNER-SIDE MATERIAL GATE HOOKS `bl 0x0224829C` AT 0x022485D8 -- the exact mirror of synchro.nontuner_gate_hook, and it was UNCLAIMED until Junk Speeder. synchro.third_pred_is_the_nontuner_caller establishes that INNER 0x0224829C has EXACTLY TWO callers: 0x022485D8 inside OUTER 0x022485B4, and 0x02248AAC inside THIRD 0x02248A88 -- and that the driver 0x02249C60 sends the TUNER to OUTER and every NON-TUNER to THIRD. The non-Tuner half of that pair is Azure Eyes' gate. This is the other half: a gate at 0x022485D8 is TUNER-ONLY BY CONSTRUCTION, so it needs no is-a-Tuner test, no GDB and no LR sniffing at 0x022482B6. *** WHY NOT 0x022482B6/0x022482B2: shooting_quasar owns the first and boggart_knight the second, they already chain into 0x022482BC, and a gate there runs for EVERY material of EVERY Synchro. *** CALLING CONVENTION AT THE SITE: r0 = the SYNCHRO's cid, r1/r2/r3 = INNER's other three arguments, and the MATERIAL's cid is obtained with 0x021A3320(r1, r2) -- the same accessor OUTER itself uses at 0x022485CA and the per-cid non-Tuner leaves use. A stub must replay INNER, return its verdict UNCHANGED when it rejected or when the Synchro is not the one being restricted, and otherwise AND in its own test. *** IN-GAME CONFIRMED 2026-09-02 by card.junk_speeder_clause1: with a 52-byte ov5 gate here ANDing has_set_code[0x4C], Junk Speeder accepts only a 'Synchron' Tuner, refuses other Tuners, and NO other Synchro's materials changed."
  address: 0x022485D8
  oracle: "ov3"
  sources: [notes/junk-speeder-findings.md, otn_enhanced/cards/junk_speeder.py]
  proof: |
    # INNER still has exactly the two callers, and this is the OUTER one
    img, b = env.ov3, 0x02141700
    callers = []
    for off in range(0, len(img) - 3, 2):
        hw1 = int.from_bytes(img[off:off+2], 'little')
        hw2 = int.from_bytes(img[off+2:off+4], 'little')
        if (hw1 & 0xF800) == 0xF000 and (hw2 & 0xF800) == 0xF800:
            a = b + off
            o1 = (hw1 & 0x7FF) << 12
            if o1 & 0x400000: o1 -= 0x800000
            if a + 4 + o1 + ((hw2 & 0x7FF) << 1) == 0x0224829C:
                callers.append(a)
    assert callers == [0x022485D8, 0x02248AAC],                  f'INNER callers moved: {[hex(c) for c in callers]}'
    # the site sits inside OUTER, and OUTER is the caller the driver gives the Tuner
    assert 0x022485B4 < 0x022485D8 < 0x02248A88, 'the site left OUTER'
    # OUTER resolves the material cid with 0x021A3320(r1, r2) just before the call
    assert h.bl_target(0x022485CA, 'ov3') == 0x021A3320, 'the material-cid accessor moved'
    # the Synchron thunk this gate ANDs in
    assert h.u32(0x0209D0D8 + 0x4C * 4, 'arm9') == 0x02023E1D, 'Synchron thunk moved'

