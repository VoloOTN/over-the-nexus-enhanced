- id: "dispatch.criteria_block_size_tiers"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "HOW A CID'S Nth CRITERIA ROW IS ADDRESSED — the missing half of dispatch.criteria_registry_lookup_default. 0x02243B9C returns the LEFTMOST row for the cid PLUS r4, and what sets r4 is a THREE-TIER mechanism keyed purely on how many rows the cid owns:
    1 row     -> default leaf 0x02243EEC, r4 = 0                      1141 cids
    2 rows    -> the cid MUST appear in membership list A 0x0227134C
                 (0x3B entries) or list B 0x02271314 (0x1B) -> r4 = 1   108 cids
    3-4 rows  -> the cid MUST be a case in the compiled switch
                 @0x02243C1C                                             10 cids
Registry block-size histogram: {1: 1141, 2: 108, 3: 9, 4: 1}. The 2-row tier is proven by a perfect correspondence: EVERY cid in list A or B owns exactly two rows (the only exceptions own zero — two unimplemented Speed Spells). Those lists are literally a 'this cid has a two-row block' register, and both are SORTED with hard-coded counts. The 3-row tier is proven by 8 of the 10 multi-row cids being switch cases (0x0D6B, 0x0E12, 0x1522 Vampire Lord, 0x1746 Vampire Lady, 0x1E5A Dark Simorgh with 4 rows, 0x210E, 0x22D6, 0x24AD); the two stragglers 0x21BC Koa'ki Meiru Urnight and 0x2449 Agent of Miracles - Jupiter are in neither list nor the inherited 22-case enumeration, so either that enumeration is incomplete or their third row is vestigial — NOT resolved. CONSEQUENCES: (a) giving a donor a TWO-ROW cost ('banish 1 LIGHT and 1 DARK') requires a count-neutral insert into membership list A **as well as** the rows — without it the param-1 pass silently re-reads row 0 and half the cost vanishes; (b) row ORDER within a block is load-bearing, because param IS the relative index (dispatch.multi_attribute_summon_cost_is_multiple_rows).
⚠️ CORRECTED 2026-08-13 (same session, before anything relied on it): an earlier version of this fact said a THREE-row block 'needs a new case compiled into 0x02243C1C'. THAT OVERSTATED THE TIERS. r4 is NOT a pure 0/1 flag — 0x02243B9C initialises it FROM THE CALLER'S param (`adds r4,r1,#0` at 0x02243BA0), and only two of the ELEVEN branches into the common tail 0x02243EEE pass through an override (`movs r4,#0` at 0x02243EEC, `movs r4,#1` at 0x02243EC6). The other nine reach the tail with the caller's param intact, so for those cids the row offset is ARBITRARY and a 3rd/4th row is directly addressable. The tier table above therefore describes which cids get FORCED to row 0 or row 1, not a hard ceiling. PROVEN IN-GAME: the Lightpulsar donor 0x0FB1 owns a 2-row block and its clause-1 leaf passes param 0 then 1 as bare literals — the duel shows a LIGHT prompt then a DARK prompt, i.e. two DIFFERENT rows, which is only possible if param passed through. NOTE the two consumers differ: the hand-SS leaf 0x0225FA46 passes param as an immediate, whereas RECORD-driven paths get it from the per-cid provider 0x02234E78 (itself a BST over cid, returning descriptor fields or flag words). A card wanting a 3rd row read by a record-driven path must therefore be handled in 0x02234E78, not here."
  address: 0x022713C4
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    B, CNT = 0x022713C4, 0x56C
    from collections import defaultdict
    blocks = defaultdict(int)
    for i in range(CNT):
        blocks[h.u16(B + i * 12, 'ov3')] += 1
    hist = defaultdict(int)
    for n in blocks.values():
        hist[n] += 1
    assert dict(hist) == {1: 1141, 2: 108, 3: 9, 4: 1}, \
        f'criteria block-size histogram changed: {dict(sorted(hist.items()))}'
    listA = [h.u16(0x0227134C + 2 * i, 'ov3') for i in range(0x3B)]
    listB = [h.u16(0x02271314 + 2 * i, 'ov3') for i in range(0x1B)]
    assert listA == sorted(listA) and listB == sorted(listB), \
        'a membership list lost its sort order (both are binary-searched)'
    # the defining property: membership => a two-row block (or an unimplemented zero)
    for cid in set(listA) | set(listB):
        assert blocks.get(cid, 0) in (0, 2), \
            f'{cid:#06x} is in a membership list but owns {blocks.get(cid, 0)} rows'
    # the two families that depend on it
    for cid in (0x16C9, 0x16CB, 0x16E4):
        assert cid in listA, f'Chaos-family {cid:#06x} left membership list A'
    assert 0x2273 in listB, 'Chaos Goddess left membership list B'
    assert h.u16(0x02243EEC, 'ov3') == 0x2400 and h.u16(0x02243EC6, 'ov3') == 0x2401, \
        'the r4 = 0 / r4 = 1 disambiguation leaves changed'

- id: "dispatch.gy_action_registry"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE GATE THAT DECIDES WHETHER A CARD'S GRAVEYARD EFFECT IS EVER OFFERED. 0x0228DDF8 is a table of 60 rows x 0x10 B: {u32 cid, u32 zone, u32 check_fn, u32 post_fn}, zone 0x0E = Graveyard (52 rows) / 0x0D = Deck (8). It is UNSORTED and LINEAR-SCANNED — four scanners, each bounded by a hard-coded `cmp rX,#0x3C`: 0x0224C88E (by [row+4] zone), 0x0224CD14 (by [row+0] cid, then `blx [row+0xC]`), 0x0224CBD8 and 0x0224CD42 (by post_fn). Three check/post families: 0x0224C591/0x0224C6C1 x45 (the GY-EFFECT family), 0x0224C63D/0x0224C7C1 x9, 0x0224C55D/0x0224C669 x6.
*** A cid with NO ROW here has its Graveyard effect silently never offered, with every other structure correct and RAM-resident — cls2 record, criteria rows, condition stub, the lot. Membership is both necessary and the whole story for an IGNITION-style GY summon: Dark Simorgh 0x1E5A, Plaguespreader 0x1EA9, Quillbolt 0x1E15, Fabled Soulkius 0x202C, Spore 0x225B, Glow-Up Bulb 0x2387 and Ronintoadin 0x2269 are ALL in it.
⚠️⚠️ TREEBORN FROG 0x19CB IS NOT, AND IS THEREFORE A MISLEADING CONTROL. It owns cls2[199] and nothing else, which is what produced the earlier (wrong) rule 'a self-SS-from-GY card needs only a cls2 record'. Treeborn is a STANDBY-PHASE trigger, wired through its own structures 0x0228EB24 / 0x0226D384. Profile Plaguespreader or Soulkius instead.
⚠️ This table was ruled out in an earlier session because the search window began at 0x0228E000 — which is INSIDE it, past its first 32 rows, i.e. past Simorgh, Plaguespreader, Quillbolt and Soulkius. Always find a table's base from a literal load, not from where the interesting rows appear.
TO CLAIM A ROW: unsorted + imm8 bounds means a count-neutral insert is an in-place rewrite of one PHANTOM row's cid word (4 bytes) — no sort to maintain, no bound to bump. Phantoms in the GY-effect family: 0x0EB2 (row 15), 0x0E3E (row 47, taken by lightpulsar), 0x0E64 (row 48)."
  address: 0x0228DDF8
  oracle: "ov3"
  sources: [lightpulsar-findings]
  proof: |
    B, STRIDE, CNT = 0x0228DDF8, 0x10, 0x3C
    rows = [(h.u32(B + i * STRIDE, 'ov3'), h.u32(B + i * STRIDE + 4, 'ov3'),
             h.u32(B + i * STRIDE + 8, 'ov3'), h.u32(B + i * STRIDE + 12, 'ov3'))
            for i in range(CNT)]
    from collections import Counter
    fams = Counter((r[2], r[3]) for r in rows)
    assert fams[(0x0224C591, 0x0224C6C1)] == 45, \
        f'the GY-effect family is {fams[(0x0224C591, 0x0224C6C1)]} rows, expected 45'
    assert fams[(0x0224C63D, 0x0224C7C1)] == 9 and fams[(0x0224C55D, 0x0224C669)] == 6, \
        f'the check/post families changed: {sorted(fams.items())}'
    assert Counter(r[1] for r in rows) == Counter({0x0E: 52, 0x0D: 8}), \
        'the zone split changed'
    cids = [r[0] for r in rows]
    assert cids != sorted(cids), 'the table became sorted — a binary search may now exist'
    # every ignition-style GY summoner is a member; Treeborn deliberately is not
    for cid in (0x1E5A, 0x1EA9, 0x1E15, 0x202C, 0x225B, 0x2387, 0x2269):
        assert cid in cids, f'{cid:#06x} lost its GY-action registry row'
    assert 0x19CB not in cids, 'Treeborn Frog appeared — it is a Standby trigger'
    # the row count is an imm8 at every scanner (bits 8..10 hold Rd, so mask them off)
    for site in (0x0224C99A, 0x0224CD30):
        w = h.u16(site, 'ov3')
        assert w & 0xF800 == 0x2800 and w & 0xFF == CNT, \
            f'the scanner bound at {site:#010x} is not `cmp rX,#0x3C`: {w:#06x}'
    # and 0x0224C88E really indexes this base at stride 0x10
    w = h.u16(0x0224C88E, 'ov3')
    assert w & 0xF800 == 0x4800, '0x0224C88E is no longer an LDR literal'
    assert h.u32(((0x0224C88E + 4) & ~3) + (w & 0xFF) * 4, 'ov3') == B, \
        'the scanner no longer loads the registry base'
    assert h.bytes_at(0x0224C890, 4, 'ov3') == bytes.fromhex('30010818'), \
        'the `lsls r0,r6,#4 ; adds r0,r1,r0` row indexing drifted'

