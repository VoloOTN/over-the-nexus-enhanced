- id: "dispatch.slot4_and_slot5_are_interchangeable_machines"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** SLOT4 AND SLOT5 HAVE THE IDENTICAL INVOCATION ABI, AND THE SHARED SUB-STEP COUNTER IS RESET BETWEEN THEM -- so a slot4-family cost machine can be placed in slot5 and will run cleanly from its own state 0. The two invokers are byte-identical apart from the record offset: 0x0224AE50 does `push {r3,r4,r5,lr} ; bl 0x0224A118 ; ldr r2,[rec,#0x10] ; blx r2` and 0x0224AE84 the same with `ldr r2,[rec,#0x14]`, both called as (r0 = desc, r1 = event) and both returning 1 when the slot is absent. In the activation state machine 0x02217F80 the SLOT4 BLOCK (0x02217F8E..0x02217FC0, gated on desc[+7], getter 0x0224AE70, invoker 0x0224AE50) and the SLOT5 BLOCK (0x02217FC4..0x02217FFA, gated on desc[+8], getter 0x0224AEA4, invoker 0x0224AE84) are the same shape, and EACH ENDS BY WRITING ZERO TO [0x0229AAFC+0x7C] -- the sub-step counter that every cost/target sub-machine runs on -- before setting its done-flag and advancing. THE RETURN PROTOCOL, read off the same code: 0 = YIELD (call me again), > 0 = FINISHED, < 0 = ABORT the whole activation (branch to 0x0221804E). ⚠️ THE STOCK IMAGE NEVER PUTS A slot4 FUNCTION IN slot5: dispatch.cls_slot_roles observes that the five pointer pools are pairwise disjoint. That is a property of Konami's codegen, not a constraint enforced anywhere -- but it means any patch relying on this is UNEXERCISED by the stock image and must be proven in-game."
  address: 0x02217F80
  oracle: "ov3"
  sources: [notes/gates-of-dark-world-findings.md]
  proof: |
    # the two invokers differ only in the record offset
    a = h.bytes_at(0x0224AE84, 26, 'ov3')       # slot5 invoker, whole function
    assert h.u16(0x0224AE5E, 'ov3') == 0x6902, 'slot4 invoker no longer ldr r2,[r0,#0x10]'
    assert h.u16(0x0224AE92, 'ov3') == 0x6942, 'slot5 invoker no longer ldr r2,[r0,#0x14]'
    for off in (0, 2, 4):                        # identical prologues
        assert h.u16(0x0224AE84 + off, 'ov3') == h.u16(0x0224AE84 + off, 'ov3')
    assert h.bl_target(0x0224AE8A, 'ov3') == 0x0224A118, 'slot5 invoker lookup retargeted'
    assert h.u16(0x0224AE98, 'ov3') == 0x1C28 and h.u16(0x0224AE9A, 'ov3') == 0x1C21, \
        'slot5 invoker no longer passes (desc, event)'
    assert h.u16(0x0224AE9C, 'ov3') == 0x4790, 'slot5 invoker no longer blx r2'
    assert h.u16(0x0224AEA0, 'ov3') == 0x2001, 'absent slot5 no longer returns 1'
    assert h.u16(0x0224AE6C, 'ov3') == 0x2001, 'absent slot4 no longer returns 1'
    assert len(a) == 26
    # the activation machine: both blocks gate, invoke, then ZERO the sub-step counter
    assert h.u16(0x02217F8E, 'ov3') == 0x79E8, 'the slot4 gate no longer reads desc[+7]'
    assert h.u16(0x02217FC4, 'ov3') == 0x7A28, 'the slot5 gate no longer reads desc[+8]'
    assert h.bl_target(0x02217F96, 'ov3') == 0x0224AE70, 'slot4 getter call retargeted'
    assert h.bl_target(0x02217FA2, 'ov3') == 0x0224AE50, 'slot4 invoker call retargeted'
    assert h.bl_target(0x02217FCE, 'ov3') == 0x0224AEA4, 'slot5 getter call retargeted'
    assert h.bl_target(0x02217FDA, 'ov3') == 0x0224AE84, 'slot5 invoker call retargeted'
    for a2 in (0x02217FBA, 0x02217FF4):
        assert h.u16(a2, 'ov3') == 0x67E1, \
            f'the `str r1,[r4,#0x7c]` sub-step reset at {a2:#x} drifted'
    for a2 in (0x02217FB6, 0x02217FF0):
        assert h.u16(a2, 'ov3') == 0x2100, f'r1 is no longer zeroed before the reset at {a2:#x}'
    # the done-flags, and the shared abort target
    assert h.u16(0x02217FB4, 'ov3') == 0x71E8, 'slot4 done-flag write drifted'
    assert h.u16(0x02217FEE, 'ov3') == 0x7228, 'slot5 done-flag write drifted'
    # the five slot pools are still pairwise disjoint (so this remains UNEXERCISED)
    pools = [set(), set(), set(), set(), set()]
    for base, cnt in ((0x0227E64C, 0x51A), (0x022860D4, 0x535), (0x02275C04, 0x2B9)):
        for i in range(cnt):
            for si, k in enumerate((4, 8, 0xC, 0x10, 0x14)):
                v = h.u32(base + i * 24 + k, 'ov3')
                if v:
                    pools[si].add(v & ~1)
