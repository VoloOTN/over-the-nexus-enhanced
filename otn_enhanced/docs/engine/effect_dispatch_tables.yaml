  address: 0x0224A7F0
  oracle: "ov3"
  sources: [notes/zeta-reticulant-findings.md, notes/azure-eyes-clause2-findings.md]
  next_experiment: "None -- superseded. See dispatch.second_cls1_record_is_spirit_only, which carries the full gate, the per-cid switch, the fallback and the Doppelwarrior note with an executable proof."
  corrected_by: "dispatch.second_cls1_record_is_spirit_only"

- id: "dispatch.second_cls1_record_is_spirit_only"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** THE SECOND cls1 RECORD IS FOR SPIRIT MONSTERS AND NOBODY ELSE -- corrects dispatch.find_event_handler_second_record, which quoted only half the gate and made 'give the donor a second cls1 record' look like a general technique. find_event_handler's `leftmost + offset` offset is produced by a PER-CID SWITCH on the record's cid (entered at 0x0224A1F2, right after the binary search finds the leftmost row). Almost every cid reaches the DEFAULT arm 0x0224A7E6, which is `adds r0,r1,#0 ; bl 0x020230D4 ; cmp r0,#0 ; beq <offset 0>` followed by the two tests the old fact quoted -- descriptor[+5] == 1 (cls1) and descriptor[+4] != 6. 0x020230D4(cid) is `0x0202ABF8(cid) == 7`, i.e. card_type >> 1 == 7 = card_type 14/15 = SPIRIT MONSTER (game_constants ERA2_CARD_TYPE_MAP[15] = 'Spirit Monster'), which is exactly the family that needs two records: one for the summon effect and one for the End-Phase return to the hand. A handful of cids take non-default arms with their own conditions (0x0224A7A2 [r4+0x20] > 1, 0x0224A7B0 [r4+0x20] == 2, 0x0224A7C6 [0x0229DD14+0x48] == 3, 0x0224A7D2 event 9 with nibble 0xE), so the switch is a per-card refinement, NOT a general mechanism. CONSEQUENCE FOR THE DONOR TECHNIQUE: a non-Spirit donor that already owns a cls1 record can never be given a SECOND dispatchable one -- worked concretely for Ally of Justice Light Gazer 0x1E9C, which routes 0x0224A1F2 -> 0x0224A45A -> 0x0224A464 -> 0x0224A46E -> 0x0224A4A2 -> 0x0224A4B8 -> 0x0224A4C6 -> the default arm, and whose card_type 37 gives card_type >> 1 = 18. Still true from the old fact: the fallback to leftmost when leftmost+offset is out of range or holds a different cid (0x0224A81E..0x0224A83E), and that Doppelwarrior 0x244D's two cls2 records are reached through the hand-SS dispatch 0x0225E51C, never through this function."
  address: 0x0224A7E6
  oracle: "ov3"
  sources: [notes/azure-eyes-clause2-findings.md, notes/zeta-reticulant-findings.md]
  proof: |
    # the default arm: is-Spirit, THEN selector, THEN event code
    assert h.bl_target(0x0224A7E8, 'ov3') == 0x020230D4, 'the is-Spirit gate moved'
    assert h.u16(0x0224A7F0, 'ov3') == 0x7960, 'ldrb r0,[r4,#5] drifted'
    assert h.u16(0x0224A7F2, 'ov3') == 0x2801, 'cmp r0,#1 (selector) drifted'
    assert h.u16(0x0224A7F6, 'ov3') == 0x7920, 'ldrb r0,[r4,#4] drifted'
    assert h.u16(0x0224A7F8, 'ov3') == 0x2806, 'cmp r0,#6 (event code) drifted'
    assert h.u16(0x0224A7FC, 'ov3') == 0x2001, 'movs r0,#1 (offset=1) drifted'
    assert h.u16(0x0224A802, 'ov3') == 0x2000, 'movs r0,#0 (offset=0) drifted'
    # 0x020230D4(cid) == (card_type >> 1 == 7)
    assert h.bl_target(0x020230D6, 'arm9') == 0x0202ABF8, '0x020230D4 no longer calls the card-type reader'
    assert h.u16(0x020230DA, 'arm9') == 0x2807, 'the compare is not `cmp r0,#7`'
    assert h.u16(0x020230DE, 'arm9') == 0x2001, '0x020230D4 true-branch drifted'
    assert h.u16(0x020230E2, 'arm9') == 0x2000, '0x020230D4 false-branch drifted'
    # card_type >> 1 == 7 means card_type 14 or 15, and 15 is the Spirit Monster code
    from otn_enhanced.rom.game_constants import ERA2_CARD_TYPE_MAP
    assert ERA2_CARD_TYPE_MAP[15] == 'Spirit Monster', 'the card-type map changed'
    # the leftmost fallback the old fact documented is still there
    assert h.u16(0x0224A81E, 'ov3') == 0x1831, 'adds r1,r6,r0 (leftmost+offset) drifted'
    assert h.u16(0x0224A830, 'ov3') == 0x4288, 'cmp r0,r1 (cid recheck) drifted'
    # Doppelwarrior still owns two adjacent cls2 records
    base = 0x02275C04
    hits = [i for i in range(0x2B9) if h.u32(base + i * 24, 'ov3') == 0x244D]
    assert hits == [657, 658], f'Doppelwarrior cls2 records moved: {hits}'

- id: "dispatch.token_summon_table"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "TOKEN SUMMONING IS TABLE-DRIVEN, not per-card code. Every token-maker shares slot1 resolver 0x02207A09 (Scapegoat 0x12D2 cls0[152], Ojama Trio 0x166A cls0[455], Dandylion 0x19FE cls2[203], Fires of Doomsday 0x1D1E cls0[901], Reptilianne Spawn 0x2125 cls0[1107], Doppelwarrior 0x244D cls2[657], and the CUT Zeta Reticulant 0x1A8A cls2[220]). The resolver's first act is `ldrh r0,[r5]` (the descriptor cid) -> `bl 0x021A2EE0`, a LINEAR scan of 0x4C (76) 8-byte records based at 0x0226D484 matching the u16 at +0 and returning the record base. RECORD LAYOUT: {+0 u16 activating cid, +2 u16 TOKEN cid, +4 u16 count, +6 u16 mode}. MODE = battle position: 1 = Defense (Scapegoat, Ojama Trio and Dandylion all print 'in Defense Position'), 0 = Attack (Doppelwarrior, Nightmare Archfiends), 2 = unspecified/player's choice (Sweet Corn). The per-cid side flip that puts Ojama Trio's tokens on the OPPONENT's field is a leaf in the resolver's cid switch at 0x02207BAA (movs r0,#1 / subs r0,r0,r4 / str r0,[sp,#0x10]). The per-token loop ends in 0x0226925C(r0 = target side, r1 = &locator, r2 = 1, r3 = mode) — the generic Special Summon entry point, which CONTAINS the known SS-commit hook summon.ss_commit_hook 0x022692E6 at +0x8A. ⚠️ The table ends at 0x0226D6E4 with NO free gap (the battle-attribute cid lists follow immediately), so any new row must overwrite an existing one. ⚠️ COUNT DOES NOT MEAN CONSECUTIVE CIDS: the `token_cid + counter` addressing at 0x02207D6E is reached only through a per-cid switch at 0x02207D36, so it applies just to the cards that own several distinct token cids (Scapegoat x4, Ojama Trio x3, Dandylion x2, Stray Lambs x2). Of the 28 rows with count >= 2 only 6 have token..token+count-1 sharing one name; the other 22 reuse a single cid N times via the leaf at 0x02207D9E."
  address: 0x0226D484
  oracle: "ov3"
  sources: [notes/zeta-reticulant-findings.md]
  proof: |
    base = 0x0226D484
    # the lookup is a linear scan of exactly 0x4C records, based at the table
    assert h.u16(0x021A2EF6, 'ov3') == 0x2C4C, 'record count immediate (cmp r4,#0x4C) drifted'
    w = h.u16(0x021A2EE4, 'ov3')
    assert w & 0xF800 == 0x4800, '0x021A2EE4 is not an LDR literal'
    assert h.u32(((0x021A2EE4 + 4) & ~3) + (w & 0xFF) * 4, 'ov3') == base, 'token table base drifted'
    # every row's activating cid and token cid are in card-id range, count sane
    rows = [tuple(h.u16(base + i * 8 + k, 'ov3') for k in (0, 2, 4, 6)) for i in range(0x4C)]
    for cid, tok, cnt, mode in rows:
        assert 0x0B00 < cid < 0x2600, f'token-table cid {cid:#x} out of range'
        assert 0x0B00 < tok < 0x2600, f'token-table token {tok:#x} out of range'
        assert cnt <= 4 and mode <= 2, f'token-table count/mode out of range: {cnt}/{mode}'
    # the known rows still say what the claim says
    byc = {c: (t, n, m) for c, t, n, m in rows}
    assert byc[0x12D2] == (0x0F3E, 4, 1), 'Scapegoat row changed'
    assert byc[0x166A] == (0x0F4B, 3, 1), 'Ojama Trio row changed'
    assert byc[0x19FE] == (0x0F55, 2, 1), 'Dandylion row changed'
    assert byc[0x1A8A] == (0x0F5A, 1, 2), 'Zeta Reticulant row changed'
    assert byc[0x2299] == (0x0F7E, 1, 2), 'Sweet Corn row changed'
    # the table abuts the next structure -- no headroom
    assert base + 0x4C * 8 == 0x0226D6E4, 'token table geometry moved'
    # the resolver really is shared by those cards
    for tbl, tbase, tcnt, cid in ((0, 0x0227E64C, 0x51A, 0x12D2), (2, 0x02275C04, 0x2B9, 0x19FE),
                                  (2, 0x02275C04, 0x2B9, 0x1A8A)):
        hit = [i for i in range(tcnt) if h.u32(tbase + i * 24, 'ov3') == cid]
        assert hit, f'cid {cid:#x} lost its cls{tbl} record'
        assert h.u32(tbase + hit[0] * 24 + 4, 'ov3') == 0x02207A09, \
            f'cid {cid:#x} slot1 is no longer the token resolver'

