  confidence: "VERIFIED"
  claim: "The Deck criteria handlers 0x0223CA99 and 0x0223CAD9 are the SAME 12-instruction thunk differing only in the flags immediate stored at [sp+4] (0xA vs 2): both do [sp]=row.word, r0=side, r1=row.cid, r2=0, r3=0, bl 0x0223BC3C (the Deck builder). So the criteria word (incl. the level op of dispatch.criteria_word_level_field) reaches the SAME builder unchanged; op1 'or higher' is exercised natively through that builder by Summoner's Art 0x1C34 (0x0223CAD9, 0x00540402) and Gusto Skwirl 0x24A6 (0x0223CAB5, flags 0xA, 0x00540002) although no stock 0x0223CA99 row uses op1. Petiteranodon relies on this (0x48500002 on 0x0223CA99). Whether the flags difference affects the level op is NOT proven by this fact -- that is the in-game test."
  address: 0x0223CA98
  oracle: "ov3"
  sources: [notes/petiteranodon-findings.md, petiteranodon.py]
  proof: |
    for a, flag in ((0x0223CA98, 0x200A), (0x0223CAD8, 0x2002)):
        assert h.bytes_at(a, 10, 'ov3') == bytes.fromhex('0eb5021c906800230090'), hex(a)
        assert h.u16(a + 10, 'ov3') == flag, f'{a:#x} flags immediate drifted'
        assert h.bytes_at(a + 12, 8, 'ov3') == bytes.fromhex('0190081c11880022'), hex(a)
        assert h.bl_target(a + 20, 'ov3') == 0x0223BC3C, f'{a:#x} no longer calls the Deck builder'

