    assert h.u32(0x0224A3A0, 'ov3') == 0x0227E64C and h.u32(0x0224A3A4, 'ov3') == 0x51A
    assert h.u32(0x0224A3A8, 'ov3') == 0x022860D4 and h.u32(0x0224A3AC, 'ov3') == 0x535
