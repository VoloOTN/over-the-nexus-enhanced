                h.u32(0x022713C4 + i * 12 + 4, 'ov3'),
                h.u32(0x022713C4 + i * 12 + 8, 'ov3'))
    assert (0x1FFE, 0x0223CB65, 0x08000002) in [row(i) for i in hand], \
