    assert h.u16(caf5 + 0x08, 'ov3') == 0x9202, '0x0223CAF5: str r2,[sp,#8] moved'
    assert h.u16(caf5 + 0x16, 'ov3') == 0xAB02, '0x0223CAF5: add r3,sp,#8 moved'
