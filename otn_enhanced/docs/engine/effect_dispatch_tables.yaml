- id: "dispatch.card_category_hub"
  subsystem: "effect_dispatch_tables"
  confidence: "VERIFIED"
  claim: "*** 0x02022D70 card_category(cid) IS WHERE FUSION / SYNCHRO / RITUAL / SPELL / TRAP ARE ACTUALLY DECIDED -- NOT 0x0202ABF8. *** None of 0x0202ABF8's 19 BL callers compares its result against the Fusion codes (card_type>>1 == 2 or 3) or the Synchro codes (17/18/19); they all route through this hub. Body: `push {r4,lr} ; adds r4,r0 ; bl 0x0202ABF8 ; cmp r0,#0x15 ; bhi <default> ; adds r0,r0,r0 ; add r0,pc ; ldrh r0,[r0,#6] ; lsls/asrs #16 ; add pc,r0`, i.e. a 22-entry halfword jump table at 0x02022D88 whose targets are 0x02022D8A + the sign-extended entry. EVERY arm is `movs r0,#N ; pop {r4,pc}`: 0 Normal -> 0, 1 Effect -> 1, **2 and 3 Fusion -> 3**, 4/5 Ritual -> 2, 6 Toon / 7 Spirit / 8 Union / 9 Gemini -> 1, 10 Token -> 9, 11 Divine -> cid - 4994, 13 Spell -> 7, 14 Trap -> 8, 15 Normal Tuner -> 0, 16 Tuner -> 1, **17/18/19 Synchro -> 0xA**, 20 Dark Tuner -> 1, **21 Dark Synchro -> 0xB**, anything above 21 -> 0. *** THE PREDICATE CLUSTER BUILT ON IT, all `push {r3,lr} ; bl 0x02022D70 ; cmp ; movs r0,#1/#0 ; pop`: 0x0202303C is_fusion (== 3), 0x02023050 is_synchro (== 0xA or 0xB), and 0x0202307C is_extra_deck (== 3 OR 0xA OR 0xB). *** WHY IT MATTERS: is_extra_deck accepts the Fusion and Synchro categories ALIKE, which is exactly why a Fusion->Synchro card_prop conversion (carddata.fusion_to_synchro_conversion) does not disturb Extra-Deck residency, deck legality or zone placement -- only is_fusion and is_synchro flip. is_extra_deck has 33 BL callers; is_fusion 38; is_synchro 61."
  address: 0x02022D70
  oracle: "arm9"
  sources: [notes/accel-synchron-findings.md]
  proof: |
    # the hub's own shape
    assert h.bl_target(0x02022D74, 'arm9') == 0x0202ABF8, 'the hub no longer reads card_type'
    assert h.u16(0x02022D78, 'arm9') == 0x2815, '0x02022D78 is not cmp r0,#0x15'
    assert h.u16(0x02022D86, 'arm9') == 0x4487, '0x02022D86 is not add pc,r0'
    # decode the 22-arm table exactly as the code does, and read each leaf
    want = {0: 0, 1: 1, 2: 3, 3: 3, 4: 2, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1,
            10: 9, 13: 7, 14: 8, 15: 0, 16: 1, 17: 0xA, 18: 0xA, 19: 0xA,
            20: 1, 21: 0xB}
    for idx, val in want.items():
        e = h.u16(0x02022D88 + 2 * idx, 'arm9')
        tgt = 0x02022D8A + (e - 0x10000 if e >= 0x8000 else e)
        assert h.u16(tgt, 'arm9') == (0x2000 | val), \
            f'category arm {idx} @0x{tgt:08X} is not movs r0,#{val}'
        assert h.u16(tgt + 2, 'arm9') == 0xBD10, \
            f'category arm {idx} does not return via pop {{r4,pc}}'
    # the three predicates, each pinned to the hub and to its compare immediates
    for addr in (0x0202303C, 0x02023050, 0x0202307C):
        assert h.u16(addr, 'arm9') == 0xB508, f'0x{addr:08X} prologue drifted'
        assert h.bl_target(addr + 2, 'arm9') == 0x02022D70, \
            f'0x{addr:08X} no longer calls card_category'
