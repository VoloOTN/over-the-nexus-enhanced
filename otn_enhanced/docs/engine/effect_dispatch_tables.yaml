  address: 0x02234E78
  oracle: "ov3"
  sources: [notes/ninja-grandmaster-hanzo-findings.md, otn_enhanced/cards/ninja_grandmaster_hanzo.py]
  proof: |
    # both sites are `adds r0,r5,#0 ; bl 0x02234E78 ; adds r2,r0,#0 ; ldrh r1,[r5]`
    for site in (0x02208028, 0x021F0858):
        assert h.u16(site - 2, 'ov3') == 0x1C28, \
            f'{site:#x} is not preceded by adds r0,r5,#0'
        assert h.bl_target(site, 'ov3') == 0x02234E78, \
            f'{site:#x} no longer calls the row-param provider'
        assert h.u16(site + 4, 'ov3') == 0x1C02, f'{site:#x} tail is not adds r2,r0,#0'
        assert h.u16(site + 6, 'ov3') == 0x8829, f'{site:#x} tail is not ldrh r1,[r5]'
    # slot3 feeds the same param to the candidate COUNT, hence must be hooked too
    assert h.bl_target(0x021F0862, 'ov3') == 0x02243FE0, 'slot3 count call moved'
    # the resolver's own consumer is the sibling counter
    assert h.bl_target(0x02208032, 'ov3') == 0x02243FA8, 'resolver count call moved'
    # --- THE THIRD SITE (corrected 2026-08-30): the PROMPT ---------------
    assert h.u16(0x022080D4, 'ov3') == 0x1C28, '0x022080D6 not preceded by adds r0,r5,#0'
    assert h.bl_target(0x022080D6, 'ov3') == 0x02234E78, \
        'the prompt site no longer calls the row-param provider'
    assert h.u16(0x022080DA, 'ov3') == 0x1C03, 'prompt tail is not adds r3,r0,#0'
    assert h.u16(0x022080DC, 'ov3') == 0x882A, 'prompt tail is not ldrh r2,[r5]'
    assert h.bl_target(0x022080E2, 'ov3') == 0x0219C430, 'the selection prompt moved'
    # ... and the prompt really does re-read that param to build the list
    assert h.bl_target(0x0219C47C, 'ov3') == 0x02243FA8, \
        '0x0219C430 no longer counts candidates from the stashed param'
    # exactly THREE provider sites lie in the two functions this card uses
    sites = [a for a in range(0x021F0820, 0x02208400, 2)
             if h.u16(a, 'ov3') >> 11 == 0b11110
             and h.u16(a + 2, 'ov3') >> 11 == 0b11111
             and h.bl_target(a, 'ov3') == 0x02234E78
             and (0x021F0820 <= a < 0x021F0880 or 0x02207EF4 <= a < 0x02208400)]
    assert sites == [0x021F0858, 0x02207F36, 0x02208028, 0x022080D6], \
        f'the provider call-site set changed: {[hex(a) for a in sites]}'
    # exactly 60 provider call sites, and Snoww's claimed one is among them
    import struct
    img = env.image('ov3'); base = env.base('ov3')
    sites = []
    for off in range(0, len(img) - 4, 2):
        hw1, hw2 = struct.unpack_from('<HH', img, off)
        if (hw1 & 0xF800) != 0xF000 or (hw2 & 0xF800) != 0xF800:
            continue
        a = base + off
        imm = ((hw1 & 0x7FF) << 12) | ((hw2 & 0x7FF) << 1)
        if imm & (1 << 22):
            imm -= (1 << 23)
        if a + 4 + imm == 0x02234E78:
            sites.append(a)
    assert len(sites) == 60, f'{len(sites)} provider call sites, expected 60'
    for a in (0x02208028, 0x021F0858, 0x02235610):
        assert a in sites, f'{a:#x} is no longer a provider call site'

