- id: "dispatch.master_handler_row_layout"
  subsystem: "effect_dispatch_tables"
  confidence: "UNVERIFIED"
  claim: "WRONG — kept so the correction survives. Claimed the cls record layout is '{+0x00 main, +0x04 sub, +0x08 act, +0x0C, +0x10, +0x14 CID}', i.e. cid LAST. It is cid FIRST. The error came from assuming a single 4116-record table based at 0x02275C08; the real cls2 base is 0x02275C04, four bytes lower, which shifts every field by one word and makes the cid look like it sits at +0x14. The structural checks I ran (the +0x14 column is per-segment sorted; the +0x00 column is 100% Thumb pointers) are all TRUE of the shifted reading too, so they did not catch it — a reminder that a self-consistent structural story is not a proof of the labels. Caught by an external anchor: the shipped armory_arm.py records cls1[0x1F33] +04 = 0x022215DD, which no record matched under the shifted reading."
