        assert h.bl_target(site + boff, 'ov3') == 0x02022E14,                      f'{base:#x} is no longer looked up by the sorted binary search'
        cids = [h.u16(base + i * 2, 'ov3') for i in range(count)]
        assert cids == sorted(cids), f'list {base:#x} is not sorted -- bsearch would lie'
        assert all(0x0B00 < c < 0x2600 for c in cids), f'list {base:#x} holds a non-cid'
    # packed back to back, in address order, ending at the ritual-pair table
    ends = [b + c * 2 for _s, b, c, _o, _p in
            sorted(spec, key=lambda t: t[1])]
    starts = [b for _s, b, _c, _o, _p in sorted(spec, key=lambda t: t[1])]
    assert ends[:-1] == starts[1:], 'the AI list block is no longer contiguous'
    assert ends[-1] == 0x02271218, 'the AI list block no longer ends at 0x02271218'
    # membership spot-checks that name the lists
    assert 0x22E5 in [h.u16(0x0227113C + i * 2, 'ov3') for i in range(0x13)],                  'Effect Veiler left the opponent-turn list'
    assert 0x13FA in [h.u16(0x022711B8 + i * 2, 'ov3') for i in range(0x30)],                  'Torrential Tribute left the summon-response list'

