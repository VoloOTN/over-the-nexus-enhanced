- id: "resolver.phase_protocol"
  subsystem: "resolver_protocol"
  confidence: "VERIFIED"
  claim: "*** A cls RESOLVER (+04 / slot1) IS RE-ENTERED ONCE PER RESOLUTION PHASE, THE PHASE LIVES AT [0x0229AAFC + 0x70], THE ENTRY PHASE IS 0x80, AND THE RETURN VALUE NAMES THE NEXT PHASE (0 = done). Previously UNVERIFIED and stated only as the HANDSS_RES folklore 'act at 0x80, return 0x7F'. CLOSED STRUCTURALLY on the shared named-Special-Summon resolver 0x02206F40, which spells the whole protocol out in one function: `ldr r0,=0x0229AAFC ; ldr r0,[r0,#0x70] ; subs r0,#0x75 ; cmp r0,#0xB ; bls` then a PC-relative halfword jump table at 0x02206FF6 whose twelve entries cover phases 0x75..0x80, and EVERY arm ends `movs r0,#<next phase> ; pop`.  Decoded (target = 0x02206FF8 + signed offset): 0x80 -> 0x0220700E, 0x7F -> 0x02207082, 0x7E -> 0x02207098, 0x7D -> 0x02207116, 0x78 -> 0x02207124, 0x75 -> 0x02207140, and the seven unused phases all -> 0x0220714E (`movs r0,#0 ; pop`).  The observed walk is 0x80 (gate 0x021F0384, count candidates 0x02243FA8, prompt) -> returns 0x7F (open the picker 0x0219C430) -> 0x7E (read the pick and summon) -> 0x7D -> teardown, or 0x80 -> 0x78 when no candidate exists.  So 'act at 0x80' is right but 'return 0x7F' is only ONE card's next step, not the protocol: the return value is a phase id and a resolver that does one thing returns 0.  A 2-arg resolver must still preserve r1 = the event (0x02206F40 parks it with `str r1,[sp]` at 0x02206F48 and re-reads it for 0x021F0384).  *** CONSEQUENCE, and how card.maiden_clause2 is built: a donor can PREPEND its own verbs to any native resolver by gating on phase == 0x80 and then tail-calling the native one for every phase, which costs no ov3 code at all. *** SCOPE LIMIT, MEASURED 2026-08-20 -- DO NOT OVER-GENERALISE. This is closed on 0x02206F40's OWN code, which really does read [0x0229AAFC + 0x70]. It does NOT follow that +0x70 holds the phase for every invocation of every resolver. A cls3 (selector-3) activation drives its slot1 with a DIFFERENT counter: diagnostic counters in card.maiden_clause1's resolver recorded [0x0229AAFC + 0x70] == 1 on EVERY entry, never 0x80, while the effect resolved correctly and Special Summoned. A `cmp phase,#0x80` gate written on that assumption was DEAD CODE that silently never ran. The slot4 activation procedure 0x021E50DC uses its own separate counter at [0x0229AAFC + 0x7C] again. If a stub only needs an IDEMPOTENT side effect (posting a keyed turn-log node, say), do it unconditionally rather than behind a phase compare."
  address: 0x02206F40
  oracle: "ov3"
  sources: [otn-hyper-librarian-chain-protocol, otn-shooting-quasar, maiden-with-eyes-of-blue-findings]
  proof: |
    hw = lambda a: h.u16(a, 'ov3')
    assert h.bytes_at(0x02206FDE, 10, 'ov3')[2:] == bytes.fromhex('006f75380b2800d9'), \
        'the phase load / normalise / bound drifted'
    tgt = []
    for i in range(12):
        off = hw(0x02206FF6 + 2 * i)
        if off & 0x8000:
            off -= 0x10000
        tgt.append(0x02206FF8 + off)
    assert tgt[0xB] == 0x0220700E, 'phase 0x80 arm moved'
    assert tgt[0xA] == 0x02207082 and tgt[9] == 0x02207098, 'picker / summon arms moved'
    assert tgt[1:8].count(0x0220714E) == 6, 'the unused phases no longer share a stub'
    assert hw(0x0220714E) == 0x2000 and hw(0x02207150) == 0xBDF8, \
        'the shared unused-phase arm is not movs r0,#0 ; pop'
    for site, nxt in ((0x02207072, 0x78), (0x0220707E, 0x7F), (0x02207094, 0x7E)):
        assert hw(site) == 0x2000 | nxt, f'arm at {site:#x} no longer returns {nxt:#x}'

