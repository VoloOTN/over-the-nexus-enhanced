- id: "resolver.event_arg_is_zero_on_gy_action"
  subsystem: "resolver_protocol"
  confidence: "VERIFIED"
  claim: "*** MEASURED, AND IT KILLED A PLAUSIBLE HYPOTHESIS: the cls2 +04 resolver and +14 target declaration are entered with **r1 == 0x00000000** on the GY-ACTION path. *** The event argument named by resolver.phase_protocol (\"a 2-arg resolver must still preserve r1 = the event\") is NOT a packed event word there -- it is simply zero, which matches the THREE call sites of the resolver invoker 0x0224AEB8 that pass `movs r1,#0` literally (0x0221803E, 0x02228F92, 0x0225BCF8). THE FALSIFIED HYPOTHESIS, recorded so it is not re-derived: the GY-action registry's own post_fn 0x0224C6C0 builds a word `(0x4E << 16) | (r1 & 0xFFFF) | <bit31>` at 0x0224C6D4 and posts it through 0x021D32A0, and 0x4E is the ONLY code among that primitive's four post sites (the others are 0x01 @0x0224B154, 0x4B @0x0224B1BE, 0x1F @0x0224B31C). It is therefore tempting -- and WRONG -- to identify the GY-action path inside a resolver by testing (r1 >> 16) & 0xFF == 0x4E. That word does not travel to the resolver. Building on it regressed a working card: card.grapha_clause1's summon paid its cost and then ran the wrong arm, in-game, because the test failed and sent clause 1 down clause 2's branch. ALSO MEASURED ON THAT PATH (savestates rom_grapha_test.ml2/.ml3/.ml4, otn_enhanced/tools/grapha_diag.py): phase [0x0229AAFC+0x70] == 0x80 on entry, confirming resolver.phase_protocol's entry phase, and the declared-target counter [0x0229AAFC+0x74] == 0. CONSEQUENCE FOR ANY DONOR CARRYING TWO CLAUSES ON ONE cls2 RECORD: r1 == 0 is a usable POSITIVE test for the GY-action path, and it is the safe direction to write the branch in -- if the other path also passes 0 the second clause is merely inert, while the reverse regresses the working one."
  address: 0x0224AEB8
  oracle: "ov3"
  sources: [notes/grapha-findings.md, otn_enhanced/tools/grapha_diag.py]
  proof: |
    # the three invoker call sites that pass a literal zero event
    for site in (0x0221803C, 0x02228F90, 0x0225BCF6):
        assert h.u16(site, 'ov3') == 0x2100, \
            f'0x{site:08X} no longer sets r1 = 0 before the invoker'
        assert h.bl_target(site + 2, 'ov3') == 0x0224AEB8, \
            f'0x{site:08X} no longer calls the resolver invoker'
    # the resolver invocation site itself: blx [record+4]
    assert h.bl_target(0x0224AEEE, 'ov3') == 0x0224A118, 'invoker lost find_event_handler'
    assert h.u16(0x0224AEF6, 'ov3') == 0x6842, 'ldr r2,[r0,#4] moved'
    assert h.u16(0x0224AF00, 'ov3') == 0x4790, 'blx r2 moved'
    # and the 0x4E post that does NOT reach it
    assert h.u16(0x0224C6D4, 'ov3') == 0x204E, 'the 0x4E event code moved'
