    for art in (0x0ED9, 0x0F09):
        assert art not in named, f'{art:#06x} unexpectedly became a named target'
    import struct as _s
    from otn_enhanced.rom import stock
    prop = stock.bin2('card_prop.bin')
    arts = [i for i in range(len(prop) // 8)
            if _s.unpack_from('<H', prop, i * 8)[0] & 0x3FFF in (0x0ED9, 0x0F09, 0x0FA7)]
