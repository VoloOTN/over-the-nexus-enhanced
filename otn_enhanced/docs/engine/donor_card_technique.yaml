  claim: "*** `donor_scan`'s 'VERDICT: CLEAN' DOES NOT CLEAR ITS OWN ADVISORY LINE, AND AN ADVISORY HIT CAN BE A REAL ARCHETYPE GATE. *** donor_scan classifies a bare aligned u16 in the ARM9 data region as `advisory` rather than `binding`, because that region also holds numeric tables -- so the card still prints CLEAN. Worked example, 2026-09-01: Mist Valley Watcher 0x1E87 was the best White Dragon Ninja donor on slot budgets (name floor 16 / desc floor 94) and reported 'VERDICT: CLEAN' plus '1 ARM9 data-region u16 hit -- ambiguous: arm9:0x0209C7D2'. Resolving that address by walking the has_set_code pointer table 0x0209D0D8 shows it is inside SET-CODE 0x37's list: slot 0x0209D1B4 -> thunk 0x02023C10 (`ldr r1,=0x0209C7CC ; ldr r3,=0x02022E15 ; movs r2,#0x0B ; bx r3`), an 11-entry list = the MIST VALLEY archetype (Thunderbird, Shaman, Soldier, WATCHER, Windmaster, Baby Roc, Executor, Falcon, Apex Avian, Thunder Lord, Divine Wind of Mist Valley). Using it would have silently made the new card a 'Mist Valley' monster -- CLAUDE.md donor rule (c). The donor was rejected for Dunames Dark Witch 0x12B2, which has ZERO ARM9 data-region hits. RULE: resolve every advisory hit against the set-code pointer table before accepting a donor; read the hit list, not the verdict line."
  address: 0x0209C7CC
  oracle: "arm9"
  sources: [notes/white-dragon-ninja-findings.md]
  proof: |
    # the pointer-table slot, the thunk's shape, and the list it names
    assert h.u32(0x0209D0D8 + 0x37 * 4, 'arm9') == 0x02023C11, 'set-code 0x37 slot moved'
    w = h.u16(0x02023C10, 'arm9')
    assert w & 0xFF00 == 0x4900, 'the 0x37 thunk does not start `ldr r1,[pc,#imm]`'
    assert ((0x02023C10 + 4) & ~3) + (w & 0xFF) * 4 == 0x02023C18, 'the 0x37 literal slot moved'
    assert h.u32(0x02023C18, 'arm9') == 0x0209C7CC, 'the Mist Valley list base moved'
    assert h.u16(0x02023C14, 'arm9') == 0x220B, 'the 0x37 count is not `movs r2,#0x0B`'
    mv = h.u16_table(0x0209C7CC, 0x0B, 'arm9')
    assert h.is_sorted_unique(mv), 'the Mist Valley list is not sorted'
    assert 0x1E87 in mv, 'Mist Valley Watcher is no longer in the Mist Valley list'
    # the advisory address really lands on that member's key field
    assert 0x0209C7CC <= 0x0209C7D2 < 0x0209C7CC + 0x0B * 2, 'the advisory hit is outside the list'
    assert h.u16(0x0209C7D2, 'arm9') == 0x1E87, 'the advisory hit is not the Watcher entry'
    # and the donor that replaced it is genuinely clean of that structure
    assert 0x12B2 not in mv, 'the chosen donor is in the Mist Valley list'

