  claim: "*** RENAMING A CARD MUST ALSO MOVE IT IN FOUR SORT TABLES, OR IT KEEPS THE DONOR'S PLACE IN THE DECK EDITOR'S A-Z LIST. *** All four are 4306 x u16, one entry per card, keyed by the SAME card_indx entry number: card_sort2_<L>[position] = card index (the A-Z order); card_sort_<L>[card index] = position -- EXACTLY the inverse permutation, verified in all 8 languages; card_kana1_<L>[card] and card_kana2_<L>[card] = the FIRST and SECOND CHARACTER of the name, which drive the A-Z jump bar. *** COLLATION, fitted to stock and then verified: decode cp1252, expand ligatures (ss / oe / ae), lowercase, fold accents, DROP '-' and apostrophe, KEEP spaces. That reproduces e / f / i EXACTLY -- 0 inversions and 0 of 4306 positions differ. Wrong guesses that cost time: punctuation is NOT ignored (a leading double-quote is 0x22, so '\"A\" Cell...' really does sort before '4-Starred...'), and '-' is NOT re-ranked, it is REMOVED. g carries 1 inversion and s carries 2 IN STOCK, on names starting with typographic punctuation that this key does not model -- so the applier INSERTS a renamed card into the existing permutation rather than rebuilding it, which keeps every untouched card on its exact stock position and preserves those anomalies instead of 'correcting' them. *** j / k / r ARE DELIBERATELY NOT RE-SORTED: their collation is kana/hangul-based (1400-1800 inversions under this key) and a wrong order there is a silent regression that cannot be validated. *** MEASUREMENT TRAP: never baseline a chain ROM's inversion count against STOCK. Stock is 0, but every renamed card is an inversion until it is resorted -- rom_all_patches carried 45 before this work and 0 after, and comparing to stock made the fix look like it had ADDED two. Implementation: card_text.sort_key / resort / rebuild_sort, applied from boggart_knight.apply_stats_and_text and card_text.apply_to_rom. In-game confirmed by user 2026-09-08: 'Looks good all the cards are sorted!'"
  sources: [notes/card-text-blob-findings.md, otn_enhanced/data/card_text.py]
  proof: |
    from pathlib import Path
    import struct, unicodedata
    rp = Path('data/over_the_nexus/working/rom.nds')
    if not rp.exists(): raise Skip('no stock rom.nds on disk')
    import ndspy.rom
    from otn_enhanced.rom.pac import parse_format_v1
    from otn_enhanced.data.card_text import sort_key; from otn_enhanced.data.card_text import SORTED_LANGS
    rom = ndspy.rom.NintendoDSRom.fromFile(str(rp))
    def _ip(fn, p=''):
        for f in fn.files: yield p + f
        for x in fn.folders: yield from _ip(x[1], p + x[0] + '/')
    b = bytes(rom.files[rom.filenames.idOf(next(q for q in _ip(rom.filenames)
                                               if q.lower().endswith('bin2.pac')))])
    arc = parse_format_v1(b, 'bin2.pac')
    F = {f.get_clean_name().lower(): f for f in arc.files}
    raw = lambda n: b[F[n].address:F[n].address + F[n].size]
    for L in 'efgisjkr':
        s2 = list(struct.unpack('<4306H', raw('card_sort2_%s.bin' % L)))
        s1 = list(struct.unpack('<4306H', raw('card_sort_%s.bin' % L)))
        assert sorted(s2) == list(range(4306)), '%s: card_sort2 not a permutation' % L
        inv = [0] * 4306
        for pos, c in enumerate(s2): inv[c] = pos
        assert s1 == inv, '%s: card_sort is not inverse(card_sort2)' % L
        ix, nb = raw('card_indx_%s.bin' % L), raw('card_name_%s.bin' % L)
        k1 = list(struct.unpack('<4306H', raw('card_kana1_%s.bin' % L)))
        k2 = list(struct.unpack('<4306H', raw('card_kana2_%s.bin' % L)))
        names = []
        for i in range(4306):
            o = struct.unpack_from('<II', ix, i * 8)[0]
            names.append(nb[o:nb.find(b'\x00', o)])
        if L in ('e', 'i'):   # the two languages whose kana are the raw characters
            for i in range(1, 4306):
                if names[i] and names[i][0] < 0x80:
                    assert k1[i] == names[i][0], '%s: kana1[%d] != name[0]' % (L, i)
                if len(names[i]) > 1 and names[i][1] < 0x80:
                    assert k2[i] == names[i][1], '%s: kana2[%d] != name[1]' % (L, i)
    # and the collation reproduces the stock order exactly for e / f / i
    for L in 'efi':
        ix, nb = raw('card_indx_%s.bin' % L), raw('card_name_%s.bin' % L)
        s2 = list(struct.unpack('<4306H', raw('card_sort2_%s.bin' % L)))
        ks = []
        for c in s2:
            o = struct.unpack_from('<II', ix, c * 8)[0]
            ks.append(sort_key(nb[o:nb.find(b'\x00', o)]))
        bad = [i for i in range(len(ks) - 1) if ks[i] > ks[i + 1]]
        assert not bad, 'stock %s is not sorted under sort_key: %d inversions' % (L, len(bad))
    assert SORTED_LANGS == 'efgis', 'SORTED_LANGS changed -- j/k/r must stay excluded'

