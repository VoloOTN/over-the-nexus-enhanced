- id: "tool.card_prop_race_attr_decode"
  subsystem: "donor_card_technique"
  confidence: "VERIFIED"
  claim: "*** RESOLVED 2026-08-19. The ERA2 card_prop BITFIELD LAYOUT IS CORRECT; the FILES are bad — BOTH cached copies, scratch/bin2/card_prop.bin AND the formerly committed nds_card_prop.bin copy (removed from the repo 2026-11-13; this proof now reads card_prop from the ROM via otn_enhanced.rom.stock). See tool.stale_card_prop_reference, which already established the committed copy is stale (4368 of 34448 bytes, first divergence at record 157 — which is exactly the first Blue-Eyes White Dragon art, 0x0ED9) and that ERA2_LAYOUT reproduces ygoprodeck for 99.96% of name-matched monsters when read from the ROM. WHAT THIS FACT ADDS: the same corruption is present in scratch/bin2 (previously untested), the divergence has a NAME — it is randomiser output, not a bad extract — and its exact shape is now measured. Ran the standing next_experiment (re-extract from bin2.pac in data/over_the_nexus/working/rom.nds and re-decode) and the contradiction VANISHES: the in-ROM table decodes all three Blue-Eyes White Dragon arts (0x0ED9 / 0x0F09 / 0x0FA7) identically as Level 8, attribute 1, race 1, 3000/2500, and all four Dark Magician arts identically. The same three arts read from the old committed copy came back with race 10 / 20 / 12 and attribute 1 / 3 / 0. So the layout in game_constants was never the problem — the FILES are randomiser output (cf. randomiser/otn_randomiser.py). SCOPE OF THE DAMAGE, measured: against the in-ROM table, scratch/bin2 differs in 2521 of 4305 records, and in 2517 of those the ONLY differing fields are race and attribute; the remaining four also move atk (records 2741, 4054) or swap card_type 37 <-> 39, i.e. Synchro vs Synchro Tuner (records 2955, 4065). cid, level and ATK/DEF are otherwise intact everywhere, which is why every cid-keyed and name-keyed result built on these files has been sound — including this session's card.bewd_canonical_cid. *** THE RULES. (1) NEVER read race or attribute from scratch/bin2/card_prop.bin; extract card_prop.bin from the ROM (otn_enhanced.rom.stock.bin2), or cross-check scratch/ygoprodeck_cache.json. (2) cid, level, ATK/DEF and (with the two noted exceptions) card_type were trustworthy in the old committed copy. (3) Read the in-ROM file as an 8-BYTE HEADER followed by 4305 x 8-byte records; the committed reference has NO header, so the same index is off by exactly one between them — an offset-0 read of the in-ROM file silently yields a valid-looking but wrong name<->cid pairing. (4) WRITING level, race and attribute_encoded is unaffected and remains an established shipped path (bulk_card_props.py)."
  sources: [lightpulsar-findings, notes/maiden-with-eyes-of-blue-findings.md]
  proof: |
    import struct as _s
    from otn_enhanced.rom import stock
    prop = stock.bin2('card_prop.bin')
    indx = stock.bin2('card_indx_e.bin')
    name = stock.bin2('card_name_e.bin')
    assert len(prop) % 8 == 0 and len(prop) // 8 == 4306, 'reference card_prop resized'
    def _dec(rec):
        v = int.from_bytes(rec, 'little')
        return dict(cid=v & 0x3FFF, atk=((v >> 14) & 0x1FF) * 10,
                    dfn=((v >> 23) & 0x1FF) * 10, ctype=(v >> 32) & 0x3F,
                    attr=(v >> 38) & 0x7, lvl=(v >> 42) & 0xF, race=(v >> 49) & 0x1F)
    def _nm(i):
        o = _s.unpack_from('<I', indx, i * 8)[0]
        return name[o:name.index(b'\x00', o)].decode('latin1')
    rows = {}
    for i in range(len(prop) // 8):
        rows.setdefault(_dec(prop[i * 8:i * 8 + 8])['cid'], (i, _dec(prop[i * 8:i * 8 + 8])))
    # (a) the in-ROM table is clean: same-name arts AGREE on race/attribute ...
    for arts, label in (((0x0ED9, 0x0F09, 0x0FA7), 'Blue-Eyes White Dragon'),
                        ((0x0EE0, 0x0F0B, 0x0FC9, 0x142D), 'Dark Magician')):
        got = [rows[c][1] for c in arts]
        assert all(_nm(rows[c][0]) == label for c in arts), f'{label} art set drifted'
        assert len({d['race'] for d in got}) == 1, f'{label} arts disagree on race in the ROM'
        assert len({d['attr'] for d in got}) == 1, f'{label} arts disagree on attribute in the ROM'
    # ... and cid/level/ATK/DEF agree too
    for arts in ((0x0ED9, 0x0F09, 0x0FA7), (0x0EE0, 0x0F0B, 0x0FC9, 0x142D)):
        got = [rows[c][1] for c in arts]
        for k in ('atk', 'dfn', 'lvl'):
            assert len({d[k] for d in got}) == 1, f'arts disagree on {k}: it is not safe either'
    assert rows[0x0FA7][1]['lvl'] == 8, 'BEWD level decodes wrong'
    assert rows[0x0FA7][1]['atk'] == 3000 and rows[0x0FA7][1]['dfn'] == 2500, 'BEWD stats wrong'
    assert rows[0x0FC9][1]['lvl'] == 7, 'Dark Magician level decodes wrong'
    assert rows[0x0FC9][1]['atk'] == 2500 and rows[0x0FC9][1]['dfn'] == 2100, 'DM stats wrong'
    # (b) the cid<->name pairing (prop row i <-> indx record i) is correct
    for cid, nm in ((0x0FD6, 'Sangan'), (0x19FE, 'Dandylion'), (0x1CF1, 'Yubel'),
                    (0x1E05, 'Water Spirit'), (0x1A78, 'Black Stego')):
        assert _nm(rows[cid][0]) == nm, f'{cid:#06x} no longer pairs with {nm}'

