  address: 0x0FA7
  oracle: "ov3"
  sources: [notes/maiden-with-eyes-of-blue-findings.md]
  proof: |
    B, CNT = 0x022713C4, 0x56C
    named = {}
    for i in range(CNT):
        o = B + i * 12
        if h.u16(o + 2, 'ov3') == 0x0FA7:
            named[h.u16(o, 'ov3')] = (i, h.u32(o + 4, 'ov3'), h.u32(o + 8, 'ov3'))
    expect = {0x15E0: (209, 0x0223CF45, 0x0802), 0x189A: (350, 0x0223DAA5, 0x0802),
              0x1EAA: (767, 0x0223D075, 0x0002), 0x22A0: (1184, 0x0223D075, 0x0002)}
